  pxc.fillStyle = '#7a2fa8';
  for (let i = -10; i <= 10; i++) { pxc.beginPath(); pxc.moveTo(PXW / 2 + i * 6, 109); pxc.lineTo(PXW / 2 + i * 60, PXH); pxc.lineWidth = 1; pxc.strokeStyle = '#5a2088'; pxc.stroke(); }
  for (let k = 0; k < 7; k++) { const u = ((k + (menuTime * 0.8) % 1) / 7), y = Math.floor(109 + (PXH - 109) * u * u); pxc.fillRect(0, y, PXW, 1); }
  pxc.fillStyle = '#ff8a3c'; pxc.beginPath(); pxc.arc(PXW / 2, 108, 26, Math.PI, 0); pxc.fill();   // a pixel sun setting
  pxc.fillStyle = '#1a0f2e'; for (let k = 0; k < 4; k++) pxc.fillRect(PXW / 2 - 27, 92 + k * 4, 54, 1 + (k > 1 ? 1 : 0));
}
function pxText(str, x, y, size, color, align = 'center', shadow = '#2a1040') {
  pxc.font = `${size}px ${PX_FONT}`; pxc.textAlign = align;
  if (shadow) { pxc.fillStyle = shadow; pxc.fillText(str, x + 1, y + 1); }
  pxc.fillStyle = color; pxc.fillText(str, x, y);
}
function blitPX() {
  sctx.save(); sctx.imageSmoothingEnabled = false; sctx.drawImage(pxCv, 0, 0, W, H); sctx.restore();
  sctx.fillStyle = 'rgba(0,0,0,0.22)'; for (let y = 0; y < H; y += 4) sctx.fillRect(0, y, W, 2);   // CRT scanlines
}
function drawHomePX() {
  withMenuDrawing(() => {
    drawPXBackground();
    // title: each letter cycling through arcade colours, bobbing a pixel or two
    const word = 'DOODLE BROS', cols = ['#ff3a5a', '#ff8a3c', '#ffd23f', '#5fe07a', '#3ac8ff', '#a87aff'];
    pxc.font = `22px ${PX_FONT}`; pxc.textAlign = 'left';
    let x = Math.floor(PXW / 2 - word.length * 22 / 2);
    [...word].forEach((c, i) => {
      const y = 50 + Math.round(Math.sin(menuTime * 4 + i * 0.6) * 2);
      pxc.fillStyle = '#000000'; pxc.fillText(c, x + 2, y + 2);
      pxc.fillStyle = '#ffffff'; pxc.fillText(c, x - 1, y - 1);
      pxc.fillStyle = cols[(i + Math.floor(menuTime * 3)) % cols.length]; pxc.fillText(c, x, y);
      x += 22;
    });
    pxText('STICKMAN BRAWLER', PXW / 2, 66, 6, '#ff5ac8');
    // little pixel fighters in the corners (drawn small onto the low-res canvas)
    const keep = ctx; ctx = pxc;
    for (const [ch, fx, face] of [['COLBY', 46, 1], ['LANCE', 74, 1], ['AIDEN', 246, -1], ['COLTEN', 274, -1]]) if (CHARACTERS[ch]) drawPortrait(ch, fx, 162, 0.42, '#ffffff', menuTime * 1.3 + fx, face);
    ctx = keep;
    if (home.phase === 'title') { if (Math.floor(menuTime * 2.5) % 2 === 0) pxText('PRESS START', PXW / 2, 120, 8, '#ffffff'); }
    else homeItems().forEach((it, k) => {
      const r = homeItemRect(k), on = home.sel === k, y = Math.round((r.y + 34) / 4);
      if (on) { pxc.fillStyle = '#ff5ac8'; pxc.fillRect(Math.round(r.x / 4) + 4, y - 9, Math.round(r.w / 4) - 8, 12); }
      pxText((on && Math.floor(menuTime * 4) % 2 ? '> ' : '  ') + it, PXW / 2, y, 8, on ? '#ffffff' : '#a8a8ff', 'center', on ? '#5a1048' : '#000000');
    });
    pxText('v' + ((window.appInfo && window.appInfo.version) || 'dev'), PXW - 4, PXH - 4, 5, '#5a5a8a', 'right', null);
    blitPX();
  });
}

// ---- OPTIONS in the Combat Gods / Pixel looks (same rows, same places, so the controls work the same) ----
function drawOptionsThemed(th) {
  withMenuDrawing(() => {
    const px = th === 'pixel';
    if (px) { drawPXBackground(); pxText('OPTIONS', 40, 34, 16, '#ffd23f', 'left'); blitPX(); }
    else {
      drawCGBackground();
      cgSlash(110, 44, 520, 96, 'rgba(200,30,30,0.9)', 2);
      sctx.save(); sctx.translate(170, 118); sctx.transform(1, 0, -0.18, 1, 0, 0);
      sctx.font = `76px ${CG_FONT}`; sctx.textAlign = 'left'; sctx.fillStyle = '#000'; sctx.fillText('OPTIONS', 6, 6); sctx.fillStyle = '#ffffff'; sctx.fillText('OPTIONS', 0, 0);
      sctx.restore();
    }
    const font = px ? (s => `${Math.round(s * 0.45)}px ${PX_FONT}`) : (s => `${s}px ${CG_FONT}`);
    const ink = px ? '#ffffff' : '#ffffff', dim = px ? '#a8a8ff' : '#c9bfc4';
    OPT_ROWS.forEach((row, r) => {
      const y = optRowY(r), on = opt.row === r;
      if (on) { if (px) { sctx.fillStyle = 'rgba(255,90,200,0.35)'; sctx.fillRect(150, y - 38, 1000, 58); } else slantRect(150, y - 38, 1000, 58, 20, 'rgba(214,42,34,0.75)'); }
      sctx.font = font(34); sctx.textAlign = 'left'; sctx.fillStyle = on ? ink : dim;
      sctx.fillText(OPT_LABEL[row], 170, y + 4);
      if (['master', 'music', 'sfx'].includes(row)) {
        const s = optSlider(r), v = settings[row];
        if (px) {                                                   // chunky segmented blocks
          const n = 20, bw = s.w / n;
          for (let i = 0; i < n; i++) { sctx.fillStyle = i < Math.round(v * n) ? ['#5fe07a', '#ffd23f', '#ff5ac8'][r] : '#2a2048'; sctx.fillRect(s.x + i * bw + 2, s.y + 6, bw - 4, s.h - 12); }
        } else {
          slantRect(s.x, s.y + 8, s.w, s.h - 16, 10, 'rgba(0,0,0,0.6)');
          slantRect(s.x, s.y + 8, Math.max(12, s.w * v), s.h - 16, 10, on ? '#ffd23f' : '#d62a22');
          sctx.fillStyle = '#ffffff'; sctx.fillRect(s.x + s.w * v - 3, s.y + 2, 6, s.h - 4);
        }
        sctx.font = font(30); sctx.fillStyle = ink; sctx.textAlign = 'left';
        sctx.fillText(Math.round(v * 100) + '%', s.x + s.w + 30, y + 4);
      } else if (row !== 'back') {
        sctx.font = font(34); sctx.textAlign = 'center'; sctx.fillStyle = ink;
        sctx.fillText('<   ' + optValue(row) + '   >', 780, y + 4);
      }
    });
    sctx.font = font(20); sctx.textAlign = 'center'; sctx.fillStyle = dim;
    sctx.fillText('LEFT / RIGHT OR DRAG TO CHANGE  -  SAVED  -  B / ESC = BACK', W / 2, H - 28);
  });
}

// ---------------- RESULTS (after a stock match) ----------------
function resultsUpdate(dt) {
  const devs = menuDevices(dt);
  if (menuTime > 0.6 && (devs.some(d => d.tap.ok || d.tap.start || d.tap.back) || mouse.click)) {
    results = null; backToSelect(); menuSfx('pick');
    if (netplay) netBackToLobby();                   // online: back to the online lobby to pick again
  }
  mouse.click = mouse.right = mouse.moved = false;
}
function drawResults() {
  withMenuDrawing(() => {
    drawMenuBackground();
    const R = results;
    const win = R.winner >= 0 ? R.rows[R.winner] : null;
    slantRect(-20, 30, 720, 70, 26, '#a8261e');
    const teamWin = R.team !== null && R.team !== undefined;
    text(teamWin ? TEAM_COLORS[R.team].name + ' TEAM WINS!' : win ? win.name + ' WINS!' : 'NO CONTEST', 32, 80, 30, '#ffffff');
    if (win) {
      // big spotlight on the winner
      const g = sctx.createRadialGradient(330, 440, 20, 330, 440, 260);
      g.addColorStop(0, 'rgba(255,210,63,0.35)'); g.addColorStop(1, 'rgba(255,210,63,0)');
      sctx.fillStyle = g; sctx.fillRect(60, 160, 540, 520);
      drawPortrait(win.char, 330, 600, 3.0, win.color, menuTime);
      text(charName(win.char), 330, 650, 26, '#ffffff', 'center');
      if (CHAR_INFO[win.char]) text(CHAR_INFO[win.char].title, 330, 676, 9, '#ffd23f', 'center', false);
    }
    // the table of everyone
    const rowH = R.rows.length > 2 ? 118 : 130, boxH = R.rows.length > 2 ? 96 : 100;   // (up to 4 players)
    R.rows.forEach((r, k) => {
      const y = (R.rows.length > 2 ? 170 : 200) + k * rowH, x = 700;
      slantRect(x - 4, y - 4, 520, boxH + 8, 14, '#0e0c0c');
      slantRect(x, y, 512, boxH, 12, r.won ? '#5e4a12' : '#26211f');
      sctx.fillStyle = r.color; sctx.fillRect(x + 12, y + 10, 10, boxH - 20);
      text((r.won ? 'WIN  ' : '     ') + r.name, x + 36, y + 36, 16, '#ffffff', 'left', false);
      text(charName(r.char), x + 36, y + 64, 10, '#ffd23f', 'left', false);
      text('STOCKS LEFT ' + r.stocks, x + 490, y + 36, 10, '#ffffff', 'right', false);
      text('FALLS ' + r.falls, x + 490, y + 64, 10, '#b4b4bb', 'right', false);
    });
    if (menuTime > 0.6 && Math.floor(menuTime * 2) % 2 === 0) text('PRESS START / ENTER / A TO CONTINUE', 960, 680, 10, '#fff3a8', 'center', false);
  });
}

// ---------------- PAUSE (ESC / MENU button during a fight) ----------------
const PAUSE_ITEMS = ['RESUME', 'CHARACTER SELECT', 'CONTROLS', 'CLEAN MODE', 'TURBO'];
function pauseUpdate(devs) {
  for (const d of devs) {
    if (d.tap.up) { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; menuSfx('move'); }
    if (d.tap.down) { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; menuSfx('move'); }
    if (d.tap.back) { paused = false; return; }
    if (d.tap.ok || d.tap.start) { pauseChoose(); return; }
  }
  for (let k = 0; k < PAUSE_ITEMS.length; k++) {
    const r = { x: W / 2 - 200, y: 270 + k * 55 - 30, w: 400, h: 44 };
    if ((mouse.moved || mouse.click) && inRect(mouse, r)) pauseSel = k;
  }
  if (mouse.click) pauseChoose();
  mouse.click = mouse.right = mouse.moved = false;
}
function pauseChoose() {
  const item = PAUSE_ITEMS[pauseSel];
  if (item === 'RESUME') paused = false;
  else if (item === 'CHARACTER SELECT') backToSelect();
  else if (item === 'TURBO') { setTurbo(!turbo); return; }
  else if (item === 'CLEAN MODE') { setCleanMode(!gameOptions.cleanHud); menuSfx('pick'); return; }
  else { paused = false; openControls('pause'); }
  menuSfx('pick');
}
function drawPause() {
  withMenuDrawing(() => {
    sctx.fillStyle = 'rgba(10,8,8,0.72)'; sctx.fillRect(0, 0, W, H);
    slantRect(W / 2 - 260, 150, 520, 70, 26, '#a8261e');
    text('PAUSED', W / 2, 198, 30, '#ffffff', 'center');
    PAUSE_ITEMS.forEach((it, k) => {
      const y = 270 + k * 55, sel = pauseSel === k;
      slantRect(W / 2 - 200, y - 30, 400, 44, 14, sel ? '#ffd23f' : 'rgba(255,255,255,0.08)');
      const label = it === 'TURBO' ? 'TURBO: ' + (turbo ? 'ON (x' + TURBO_SPEED + ' SPEED)' : 'OFF')
                  : it === 'CLEAN MODE' ? 'CLEAN MODE: ' + (gameOptions.cleanHud ? 'ON' : 'OFF') : it;
      text(label, W / 2, y, 14, sel ? '#0e0c0c' : '#ffffff', 'center', !sel);
    });
    text('ESC / MENU BUTTON = RESUME', W / 2, 560, 8, '#8f8f98', 'center', false);
  });
}

// ---------------- Main loop (fixed 120 Hz physics) ----------------
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (scene === 'fight' && hitstop > 0) latchPadTaps();   // (taps during a hit-freeze aren't lost)
  updateMenuMusic(elapsed);                          // menu music: on in menus, fades out for fights
  updateBattleMusic(elapsed);                        // battle music: a random song every fight
  // Menus run at screen rate, outside the fight
  if (scene !== 'fight') {
    menuTime += elapsed;
    if (scene === 'select') { if (!window.sbNetOpen) selectUpdate(elapsed); }   // (not while the ONLINE screens are open)
    else if (scene === 'home') homeUpdate(elapsed);
    else if (scene === 'options') optionsUpdate(elapsed);
    else if (scene === 'controls') controlsUpdate(elapsed);
    else if (scene === 'results') resultsUpdate(elapsed);
    for (const k in pressed) delete pressed[k];
    if (scene === 'select') drawSelect(); else if (scene === 'controls') drawControls();
    else if (scene === 'home') drawHome(); else if (scene === 'options') drawOptions();
    else if (scene === 'results' && results) drawResults();
    drawUpdateToast(elapsed);
    acc = 0;
    requestAnimationFrame(frame);
    return;
  }
  // Pause toggle (ESC or the controller's MENU button)
  const md = menuDevices(elapsed);
  // A controller that isn't driving anyone presses a button -> it takes over a fighter
  for (const d of md) {
    if (netActive()) break;                          // online: nobody takes over a fighter
    if (d.dev.startsWith('pad') && (d.tap.ok || d.tap.back || d.tap.alt || d.tap.start) &&
        !fighters.some(f => f.controller === d.dev)) { claimFighter(d.dev); d.tap.pause = false; }
  }
  if (netActive()) {                                 // online: no pausing (ESC twice = leave the match)
    if (md.some(d => d.tap.pause)) netEscape();
  } else if (md.some(d => d.tap.pause)) {
    paused = !paused; pauseSel = 0;
    for (const f of fighters) { stopKameCharge(f); stopShotCharge(f); }
    for (const k in pressed) delete pressed[k];
    mouse.click = mouse.moved = mouse.right = false;
  } else if (paused) {
    pauseUpdate(md);
    for (const k in pressed) delete pressed[k];
  }
  if (paused || scene !== 'fight') {
    if (scene === 'fight') { render(); drawPause(); }
    acc = 0;
    requestAnimationFrame(frame);
    return;
  }
  mouse.click = mouse.moved = mouse.right = false;
  if (matchOver) {                                   // GAME! - let it play out in slow-mo, then the results screen
    matchOver.t += elapsed;
    if (matchOver.t > 2.4) { showResults(); menuTime = 0; requestAnimationFrame(frame); return; }
  }
  const speed = () => timeScale * (turbo && !netActive() ? TURBO_SPEED : 1) * (slowmo > 0 ? SLOWMO_HIT_SCALE : 1);
  acc += elapsed * speed() * (netActive() ? netPace() : 1);   // turbo = faster; big hits = slow-mo; online = stay in step with the others
  impactFrame = Math.max(0, impactFrame - elapsed * Math.max(timeScale, 0.25));   // lasts longer in slow-mo
  acc = Math.min(acc, STEP * 24);                    // (never try to catch up more than 0.2s at once)
  while (acc >= STEP) {
    // slow-mo and the x-ray count down per game step (as the real time that step takes), so both
    // players' games always agree on them online
    const realStep = STEP / Math.max(0.01, speed());
    if (netActive()) { if (!netTick(realStep)) { acc = Math.min(acc, STEP); break; } }   // online: waits for the other player's inputs
    else {
      if (hitstop > 0) {
        hitstop -= STEP;              // freeze frame on hits (inputs are kept for after)
      } else {
        update(STEP);
        for (const k in pressed) delete pressed[k];
      }
    }
    slowmo = Math.max(0, slowmo - realStep);
    if (xray) { xray.t -= realStep; if (xray.t <= 0) xray = null; }
    acc -= STEP;
  }
  if (netActive()) netAfterFrame();
  render();
  if (netplay) netDrawOverlay();                     // online: "waiting for opponent", ping, desync warning
  drawUpdateToast(elapsed);                          // "update ready" (briefly)
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
