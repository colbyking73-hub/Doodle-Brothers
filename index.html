    const r = snap((6 + 15 * clamp(a.charge / MAX_CHARGE, 0, 1)) *
                   (1 + (a.move.overcharge ? clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1) : 0)));   // overcharge: ball keeps growing
    ctx.fillStyle = sketch ? '#f2d24b' : kiColor(p);
    ctx.beginPath(); ctx.arc(p.x + p.face * 30, p.y - 66, r / 2, 0, Math.PI * 2); ctx.fill();
    if (sketch) { ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2; ctx.stroke(); }
    else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x + p.face * 30, p.y - 66, r / 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (p.shielding && p.look && p.look.auraShield) {
    // Lance doesn't use a bubble: his aura flares up around him. Bigger when the shield is fresh,
    // shrinking as it wears down; a bright edge shows it's protecting him.
    const hp = clamp(p.shieldHP / SHIELD_MAX, 0, 1);
    const sc = 1.05 + 0.55 * hp;
    drawAura(p, kiColor(p), true, sc, 0.6);              // (drawn over him, so a bit see-through)
    ctx.save(); ctx.globalAlpha = 0.45 + 0.3 * hp; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    spikyAuraPath(p.x, p.y - 46, 30 * sc, 52 * sc, 30 * sc, 0); ctx.stroke();       // bright spiky edge = protected
    ctx.restore();
  } else if (p.shielding && sketch) {             // sketch: a dashed pen circle
    const r = 22 + 38 * (p.shieldHP / SHIELD_MAX);
    ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2.5;
    ctx.setLineDash([10, 7]);
    ctx.beginPath(); ctx.arc(p.x + (hash(boilFrame()) - 0.5) * 2, p.y - 40, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  } else if (p.shielding) {
    const r = 22 + 38 * (p.shieldHP / SHIELD_MAX);
    ctx.fillStyle = p.energy;
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = p.energy; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (p.halo > 0 && sketch) {
    ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, 38, 7, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (p.halo > 0) {
    ctx.fillStyle = '#fff3a8';
    ctx.fillRect(snap(p.x - 36), snap(p.y + 3), 72, 6);
    ctx.fillStyle = p.energy;
    ctx.fillRect(snap(p.x - 27), snap(p.y + 9), 54, 3);
  }
}

// Flickering flame-shaped aura around the body
// DBZ-style spiky aura outline: an oval with sharp flame spikes all up the sides and over the top
// (pointing outward and rising), smooth along the bottom. Spikes flicker in length every frame.
function spikyAuraPath(cx, cy, w, h, spike, seed) {
  const n = 34;                                            // points around the oval (half are spike tips)
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = Math.PI / 2 + (i / n) * Math.PI * 2;         // start at the bottom, go all the way round
    const ex = Math.cos(a), ey = Math.sin(a);              // point on the oval (ey < 0 = upper half)
    const bx = cx + ex * w, by = cy + ey * h;
    const upness = clamp(-ey * 0.9 + 0.35, 0, 1);          // spikes grow toward the top, none at the bottom
    const tip = i % 2 === 1;
    let len = 0;
    if (tip && upness > 0) len = spike * upness * (0.65 + 0.45 * Math.abs(Math.sin(time * 26 + i * 1.9 + seed)));
    let dx = ex, dy = ey - 0.9 * upness;                   // tips lean upward like rising flames
    const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const px = tip ? bx + dx * len : cx + ex * w * 0.97, py = tip ? by + dy * len : cy + ey * h * 0.97;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawAura(p, col = kiColor(p), big = false, scale = null, alphaMul = 1) {
  const cx = p.x, cy = p.y - 46, s = scale || (big ? 1.25 : 1);
  ctx.save();
  if (sketch) {
    ctx.strokeStyle = big ? 'rgba(200,150,0,0.75)' : 'rgba(30,60,140,0.65)'; ctx.lineWidth = 2;
    spikyAuraPath(cx, cy, 30 * s, 52 * s, 26 * s, 0); ctx.stroke();
    ctx.restore(); return;
  }
  const w = 30 * s, h = 52 * s;
  // 1) outer spiky flame in the aura's color
  ctx.globalAlpha = (big ? 0.5 : 0.36) * alphaMul;
  ctx.fillStyle = col;
  spikyAuraPath(cx, cy, w, h, 30 * s, 0); ctx.fill();
  // 2) a lighter inner layer of shorter spikes
  ctx.globalAlpha = (big ? 0.42 : 0.3) * alphaMul;
  ctx.fillStyle = '#fff6c2';
  spikyAuraPath(cx, cy + 4 * s, w * 0.78, h * 0.82, 16 * s, 3.1); ctx.fill();
  // 3) soft white glowing core (the bright middle in the reference)
  const g = ctx.createRadialGradient(cx, cy + 4 * s, 2, cx, cy + 4 * s, h * 0.85);
  g.addColorStop(0, 'rgba(255,255,255,' + (0.55 * alphaMul) + ')');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy + 4 * s, w * 0.8, h * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (Math.random() < 0.5) particles.push({ x: cx + (Math.random() - 0.5) * 40, y: p.y - Math.random() * 30, vx: 0, vy: -260,
                                            life: 0.3, max: 0.3, size: 1, color: col, type: 'bit', grav: -200 });
  if (big && Math.random() < 0.06) bolt(cx + (Math.random() - 0.5) * 30, cy, Math.random() * Math.PI * 2, 35, 0.06, '#ffffff');   // crackling sparks
}

function drawGhosts() {
  // Colored after-images, like the motion smears in the animation
  for (const g of ghosts) {
    if (sketch) drawFigure(g.fig, { alpha: (g.life / g.max) * 0.35, tint: '#9a9a9a' });   // pencil ghost lines
    else drawFigure(g.fig, { alpha: (g.life / g.max) * 0.45, tint: g.color || g.fig.color });
  }
}

// Sketch versions of the effects: red-ink blood dots, ink scribbles, pencil smudges
function drawParticlesSketch() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const p of particles) {
    if (p.type === 'beamfx') { drawBeam(p); continue; }   // ultimate Kamehameha
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'bit') {
      ctx.fillStyle = BLOOD.includes(p.color) ? '#b3261e' : '#2a2a2a';
      ctx.globalAlpha = BLOOD.includes(p.color) ? 1 : 0.7;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.4 + p.size * 1.2, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'bolt') {
      ctx.globalAlpha = a > 0.5 ? 1 : a * 2;
      ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
      inkLine(p.pts.map(q => ({ x: q[0], y: q[1] })));
    } else if (p.type === 'streak') {
      ctx.globalAlpha = a * 0.6; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.ax * 0.05, p.y - p.ay * 0.05); ctx.stroke();
    } else if (p.type === 'dust') {
      ctx.globalAlpha = a * 0.6; ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 1.5;
      const r = p.r * (0.6 + (1 - a));
      ctx.beginPath(); ctx.arc(p.x, p.y - r, r, 0, Math.PI * 1.7); ctx.stroke();
    } else if (p.type === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.6, p.r * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'slash') {
      // Ink slash stroke
      const dx = Math.cos(p.ang) * p.len / 2, dy = Math.sin(p.ang) * p.len / 2;
      ctx.globalAlpha = a; ctx.strokeStyle = '#111'; ctx.lineWidth = 2 + 5 * a;
      ctx.beginPath(); ctx.moveTo(p.x - dx, p.y - dy); ctx.lineTo(p.x + dx, p.y + dy); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.type === 'impact') {
      // Comic-style ink starburst
      ctx.globalAlpha = 1; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      for (let i = 0; i < 10; i++) {
        const ang = i / 10 * Math.PI * 2 + hash(i + p.x) * 0.3;
        const r1 = p.r * 0.5, r2 = p.r * (1.2 + hash(i * 3 + p.y) * 0.8);
        ctx.beginPath(); ctx.moveTo(p.x + Math.cos(ang) * r1, p.y + Math.sin(ang) * r1);
        ctx.lineTo(p.x + Math.cos(ang) * r2, p.y + Math.sin(ang) * r2); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  if (sketch) return drawParticlesSketch();
  for (const p of particles) {
    if (p.type === 'beamfx') { drawBeam(p); continue; }   // ultimate Kamehameha
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'bit') {
      ctx.fillStyle = p.color;
      const s = (pixelMode ? PIX : 3) * p.size;
      ctx.fillRect(snap(p.x), snap(p.y), s, s);
    } else if (p.type === 'bolt') {
      // Lightning: thick colored stroke with a white core
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalAlpha = a > 0.5 ? 1 : a * 2;
      for (const [w, c] of [[7, p.color], [3, '#ffffff']]) {
        ctx.lineWidth = w; ctx.strokeStyle = c;
        ctx.beginPath(); ctx.moveTo(p.pts[0][0], p.pts[0][1]);
        for (const q of p.pts) ctx.lineTo(q[0], q[1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (p.type === 'streak') {
      ctx.fillStyle = '#cdb79a';
      ctx.globalAlpha = a * 0.7;
      const n = 4;
      for (let i = 0; i < n; i++) ctx.fillRect(snap(p.x - p.ax * 0.012 * i), snap(p.y - p.ay * 0.012 * i), PX(), PX());
      ctx.globalAlpha = 1;
    } else if (p.type === 'dust') {
      ctx.fillStyle = '#b39a7f';
      ctx.globalAlpha = a * 0.8;
      const s = snap(p.r * (0.5 + a * 0.5)) || PIX;
      ctx.fillRect(snap(p.x), snap(p.y) - s, s, s);
      ctx.globalAlpha = 1;
    } else if (p.type === 'ring') {
      ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = a; ctx.lineWidth = 3;
      ctx.strokeRect(snap(p.x - p.r * 1.6), snap(p.y - p.r * 0.4), snap(p.r * 3.2), snap(p.r * 0.8) || PIX);
      ctx.globalAlpha = 1;
    } else if (p.type === 'slash') {
      // Slash streak: a sharp white blade-line with a red edge, thinning as it fades
      const dx = Math.cos(p.ang) * p.len / 2, dy = Math.sin(p.ang) * p.len / 2;
      const w = 2 + 10 * a;
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = '#d63a2a';
      ctx.beginPath();
      ctx.moveTo(p.x - dx, p.y - dy);
      ctx.lineTo(p.x - Math.sin(p.ang) * w, p.y + Math.cos(p.ang) * w);
      ctx.lineTo(p.x + dx, p.y + dy);
      ctx.lineTo(p.x + Math.sin(p.ang) * w * 0.4, p.y - Math.cos(p.ang) * w * 0.4);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x - dx, p.y - dy);
      ctx.lineTo(p.x - Math.sin(p.ang) * w * 0.55, p.y + Math.cos(p.ang) * w * 0.55);
      ctx.lineTo(p.x + dx, p.y + dy);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'impact' && pixelMode) {
      // Blocky starburst at the hit point (pixel art style)
      ctx.fillStyle = '#ffffff';
      const r = p.r;
      ctx.fillRect(snap(p.x - r), snap(p.y) - 3, snap(r * 2), 6);
      ctx.fillRect(snap(p.x) - 3, snap(p.y - r), 6, snap(r * 2));
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(snap(p.x - r * 0.5), snap(p.y - r * 0.5), snap(r), snap(r));
    } else if (p.type === 'impact') {
      // Anime hit flash: a sharp 8-point white starburst with a bright core, popping out and fading
      const r = p.r, rot = p.rot || 0;
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      for (let k = 0; k < 16; k++) {
        const ang = rot + k / 16 * Math.PI * 2, rr = k % 2 ? r * 0.22 : r * (k % 4 ? 0.7 : 1.15);
        const px = p.x + Math.cos(ang) * rr, py = p.y + Math.sin(ang) * rr;
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3a8'; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'hitline') {
      // Speed line flying off a hit: a thin white needle, thick at the front, tapering behind
      const dx = Math.cos(p.ang), dy = Math.sin(p.ang), w = 3.2 * a + 0.6;
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x + dx * 6, p.y + dy * 6);
      ctx.lineTo(p.x - dy * w, p.y + dx * w);
      ctx.lineTo(p.x - dx * p.len, p.y - dy * p.len);
      ctx.lineTo(p.x + dy * w, p.y - dx * w);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

// Kamehameha beam: glowing column with a white-hot core and a round head
function drawBeam(s) {
  const k = clamp(s.life / s.max, 0, 1), fade = k < 0.2 ? k / 0.2 : 1;
  const w = s.w * (0.8 + Math.sin(time * 60) * 0.1) * fade;
  const x0 = s.x, x1 = s.x + s.dir * s.len;
  ctx.save();
  if (sketch) {
    ctx.strokeStyle = s.owner ? inkOf(s.owner) : '#111'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, s.y - w / 2); ctx.lineTo(x1, s.y - w / 2); ctx.moveTo(x0, s.y + w / 2); ctx.lineTo(x1, s.y + w / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x1, s.y, w * 0.7, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5;
    for (let x = Math.min(x0, x1); x < Math.max(x0, x1); x += 14) { ctx.beginPath(); ctx.moveTo(x, s.y - w / 3); ctx.lineTo(x + 8, s.y + w / 3); ctx.stroke(); }
    ctx.restore(); return;
  }
  for (const [mul, col, al] of [[1.6, s.color, 0.25], [1.0, s.color, 0.85], [0.45, '#ffffff', 1]]) {
    ctx.globalAlpha = al * fade;
    ctx.fillStyle = col;
    ctx.fillRect(Math.min(x0, x1), s.y - (w * mul) / 2, Math.abs(x1 - x0), w * mul);
    ctx.beginPath(); ctx.arc(x1, s.y, (w * mul) * 0.75, 0, Math.PI * 2); ctx.fill();      // beam head
    ctx.beginPath(); ctx.arc(x0, s.y, (w * mul) * 0.55, 0, Math.PI * 2); ctx.fill();      // glow at the hand
  }
  ctx.restore();
}

function drawProjectiles() {
  if (cannon.on && fighters[0].respawnTimer <= 0 && cannon.timer < 0.4 && Math.floor(cannon.timer * 20) % 2) {
    const x = cannon.side < 0 ? 6 : W - 6;
    ctx.fillStyle = '#f0a818';
    for (let k = 0; k < 6; k++) ctx.fillRect(snap(x - cannon.side * k * 3) - (cannon.side < 0 ? 0 : PIX), snap(cannon.y - 15 + k * 3), PIX, snap(30 - k * 6));
  }
  for (const s of projectiles) if (s.kind === 'beam') drawBeam(s); else if (s.kind === 'disc') drawDisc(s);
  if (sketch) {                          // pen-drawn energy balls with a scribbled fill
    ctx.lineCap = 'round';
    for (const s of projectiles) {
      if (s.kind === 'beam' || s.kind === 'disc') continue;
      const ink = s.owner ? inkOf(s.owner) : '#7a4b00';
      ctx.strokeStyle = ink;
      if (s.kind === 'wave') {
        const d = Math.sign(s.vx);
        ctx.lineWidth = 3;
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(s.x - d * k * 10, s.y, s.r + k * 2, -Math.PI / 2, Math.PI / 2, d < 0); ctx.stroke(); }
        continue;
      }
      ctx.fillStyle = PAPER; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = -s.r * 0.6; k <= s.r * 0.6; k += 4) { ctx.moveTo(s.x + k - 3, s.y + s.r * 0.5); ctx.lineTo(s.x + k + 3, s.y - s.r * 0.5); }
      ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;          // motion lines behind it
      ctx.beginPath(); ctx.moveTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03 - 4); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06 - 4);
      ctx.moveTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03 + 4); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06 + 4); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    return;
  }
  for (const s of projectiles) {
    if (s.kind === 'beam' || s.kind === 'disc') continue;
    s.trail.forEach((t, i) => {
      const k = i / s.trail.length;
      ctx.fillStyle = s.color; ctx.globalAlpha = k * 0.5;
      const r = snap(s.r * k) || PIX;
      ctx.fillRect(snap(t.x) - r / 2, snap(t.y) - r / 2, r, r);
    });
    ctx.globalAlpha = 1;
    if (s.kind === 'wave') {
      const d = Math.sign(s.vx);
      ctx.fillStyle = s.color;
      for (let k = 0; k < 5; k++) ctx.fillRect(snap(s.x + d * k * 4), snap(s.y - s.r + k * 5), PIX * 2, snap(s.r * 2 - k * 10) || PIX);
      continue;
    }
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2); ctx.fill();
    if (Math.random() < 0.3) bolt(s.x, s.y, Math.random() * Math.PI * 2, s.r * 2.5, 0.05, s.color);   // crackle
  }
}

// The black & white impact frame: everything goes black, fighters turn white, lightning bursts out.
function drawImpactFrame() {
  // Fill the whole screen first, then draw the fighters/lightning through the camera
  const inv = impactAt && impactAt.invert;
  ctx.fillStyle = sketch ? (inv ? '#111' : PAPER) : (inv ? '#ffffff' : '#000000');
  ctx.fillRect(-60, -60, W + 120, H + 120);
  ctx.save();
  applyCamera(ctx);
  drawImpactFrameWorld();
  ctx.restore();
}

function drawImpactFrameWorld() {
  if (sketch) {
    // Sketch impact frame: blank page (or a solid-ink page when inverted), manga burst lines from the hit
    const inv = impactAt && impactAt.invert;
    ctx.fillStyle = inv ? '#111' : PAPER; ctx.fillRect(-50, -50, W + 100, H + 100);
    if (impactAt) {
      ctx.strokeStyle = inv ? PAPER : '#111'; ctx.lineCap = 'round';
      for (let i = 0; i < 40; i++) {
        const ang = i / 40 * Math.PI * 2;
        const r1 = 60 + hash(i) * 50, r2 = 700;
        ctx.lineWidth = 1 + hash(i * 7) * 4;
        ctx.beginPath(); ctx.moveTo(impactAt.x + Math.cos(ang) * r1, impactAt.y + Math.sin(ang) * r1);
        ctx.lineTo(impactAt.x + Math.cos(ang) * r2, impactAt.y + Math.sin(ang) * r2); ctx.stroke();
      }
    }
    for (const f of fighters) if (f.respawnTimer <= 0) drawFigure(figureOf(f), { tint: inv ? PAPER : '#000000' });
    return;
  }
  // Normal: black screen, white fighters. Inverted: white screen, black fighters (alternates on clash beats).
  const inv = impactAt && impactAt.invert;
  const bg = inv ? '#ffffff' : '#000000', fg = inv ? '#000000' : '#ffffff';
  ctx.fillStyle = bg;
  ctx.fillRect(-50, -50, W + 100, H + 100);
  if (impactAt && impactAt.focus) {
    // Manga focus lines: thin wedges rushing in from the edges toward the impact point
    ctx.fillStyle = inv ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 70; i++) {
      const ang = i / 70 * Math.PI * 2 + Math.random() * 0.05;
      const r1 = 170 + Math.random() * 120, r2 = 1500, w = 0.006 + Math.random() * 0.012;
      ctx.beginPath();
      ctx.moveTo(impactAt.x + Math.cos(ang) * r1, impactAt.y + Math.sin(ang) * r1);
      ctx.lineTo(impactAt.x + Math.cos(ang - w) * r2, impactAt.y + Math.sin(ang - w) * r2);
      ctx.lineTo(impactAt.x + Math.cos(ang + w) * r2, impactAt.y + Math.sin(ang + w) * r2);
      ctx.fill();
    }
  }
  for (const f of fighters) if (f.respawnTimer <= 0) drawFigure(figureOf(f), { tint: fg });
  if (impactAt) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Lightning: in one direction for normal hits, in every direction for clashes
    const n = impactAt.all ? 14 : 9;
    for (let i = 0; i < n; i++) {
      const ang = impactAt.all ? (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.3
                               : impactAt.ang + (i - 4) * 0.35 + (Math.random() - 0.5) * 0.2;
      const len = (impactAt.all ? 160 : 200) + Math.random() * 330;
      ctx.strokeStyle = i % 3 === 0 ? fg : '#ffd23f';
      ctx.lineWidth = 3 + Math.random() * 9;
      ctx.beginPath(); ctx.moveTo(impactAt.x, impactAt.y);
      for (let k = 1; k <= 6; k++) {
        ctx.lineTo(impactAt.x + Math.cos(ang) * len * k / 6 + (Math.random() - 0.5) * 50,
                   impactAt.y - Math.sin(ang) * len * k / 6 + (Math.random() - 0.5) * 50);
      }
      ctx.stroke();
    }
    // Blinding core
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(impactAt.x, impactAt.y, impactAt.all ? 20 : 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(impactAt.x, impactAt.y, impactAt.all ? 11 : 18, 0, Math.PI * 2); ctx.fill();
  }
}

function drawKO() {
  for (const k of koFlashes) {
    const a = k.t / 0.6;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(k.x, k.y);
    ctx.rotate(Math.atan2(cam.y - k.y, cam.x - k.x));     // beam points back toward the middle of the view
    if (sketch) {                                   // ink speed lines
      ctx.strokeStyle = '#111';
      for (let i = 0; i < 7; i++) {
        ctx.lineWidth = 2 + i % 3;
        const y = (i - 3) * 18 * a;
        ctx.beginPath(); ctx.moveTo(20 + i * 10, y); ctx.lineTo(700, y * 2.5); ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, -40 * a, 700, 80 * a);
    ctx.fillStyle = k.color;
    ctx.fillRect(0, -70 * a, 700, 15 * a);
    ctx.fillRect(0, 55 * a, 700, 15 * a);
    ctx.restore();
  }
}

// Turn the low-res frame into palette-limited, dithered pixel art.
function pixelate() {
  const img = ctx.getImageData(0, 0, LW, LH);
  const d = img.data;
  for (let y = 0; y < LH; y++) {
    for (let x = 0; x < LW; x++) {
      const i = (y * LW + x) * 4;
      const t = BAYER[((y & 3) << 2) | (x & 3)] * DITHER;
      const r = clamp(d[i] + t, 0, 255), g = clamp(d[i + 1] + t, 0, 255), b = clamp(d[i + 2] + t, 0, 255);
      const p = LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)];
      d[i] = PR[p]; d[i + 1] = PG[p]; d[i + 2] = PB[p];
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------------- HUD (drawn at full resolution with a pixel font) ----------------
function text(str, x, y, size, color, align = 'left', outline = true) {
  if (sketch) {                               // handwritten in pen
    sctx.font = `${Math.round(size * 1.75)}px "Patrick Hand", cursive`;
    sctx.textAlign = align;
    sctx.fillStyle = sketchColor(color);
    sctx.fillText(str, x, y);
    return;
  }
  sctx.font = `${size}px ${FONT}`;
  sctx.textAlign = align;
  if (outline) { sctx.fillStyle = '#0e0c0c'; sctx.fillText(str, x + 3, y + 3); }
  sctx.fillStyle = color;
  sctx.fillText(str, x, y);
}

// Ultimate overlays: activation banner, cutscene letterbox, "REAPED." and the fade out
function drawUltHUD() {
  if (ultBanner) {
    const k = ultBanner.t / 1.1, slide = Math.min(1, (1 - k) * 6);
    const bandY = H / 2 - 70;
    sctx.save();
    sctx.globalAlpha = Math.min(1, k * 4);
    sctx.fillStyle = sketch ? 'rgba(20,20,20,0.92)' : 'rgba(0,0,0,0.85)';
    sctx.fillRect(0, bandY, W, 120);
    sctx.fillStyle = ultBanner.color; sctx.fillRect(0, bandY, W, 6); sctx.fillRect(0, bandY + 114, W, 6);
    text(ultBanner.title || 'ULTIMATE', W / 2 - 300 + slide * 300, bandY + 52, 30, '#ffd23f', 'center');
    text(ultBanner.name, W / 2 + 300 - slide * 300, bandY + 96, 16, '#ffffff', 'center');
    sctx.restore();
  }
  if (ult && ult.phase === 'cutscene') {
    const ct = ult.t;
    // Letterbox bars slide in
    const bar = 92 * Math.min(1, ct / 0.35);
    sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, bar); sctx.fillRect(0, H - bar, W, bar);
    // "REAPED." fades in
    if (ct > 2.0) {
      sctx.save();
      sctx.globalAlpha = Math.min(1, (ct - 2.0) / 0.4);
      text('REAPED.', W / 2, H - 30, 26, '#d63a2a', 'center');
      sctx.restore();
    }
    // Fade to black at the end, then the fight resumes
    if (ct > CUT_TIME - 0.6) {
      sctx.fillStyle = `rgba(0,0,0,${Math.min(1, (ct - (CUT_TIME - 0.6)) / 0.45)})`;
      sctx.fillRect(0, 0, W, H);
    }
  }
}

function drawHUD() {

    }

    if (f.look && f.look.demonMeter) {                     // Colbalias's DEMON meter: each letter lights up as it fills

      `MOVE ${kn('left')}/${kn('right')}   JUMP ${kn('jump')}   ${kn('down')} DROP THROUGH PLATFORM`,
      `${kn('attack')} PHYSICAL   ${kn('special')} RANGED   +DIRECTION = NEW MOVE   (XBOX: A / B)`,
      `HOLD ${kn('attack')}/${kn('special')} TO CHARGE (SMASH + RANGED)`,
      `${kn('shield')} BLOCK   +DIRECTION = DODGE  (5 AIR DODGES)   (XBOX: RT / LT)`,

    if (a && a.type === 'attack' && a.phase === 'charge') {

      if (a.move.sweetSpot) {

        sctx.fillStyle = 'rgba(214,58,42,0.35)'; sctx.fillRect(sx - 24 + 48 * s1, ty - 29, 48 * (1 - s1), 7);

        if (inSweet) text('NOW!', sx, ty - 36, 9, '#7be08a', 'center');
        else if (over) text('TOO MUCH!', sx, ty - 36, 8, '#d63a2a', 'center');
      } else {

        sctx.fillRect(sx - 24, ty - 27, 48 * c, 3);
      }
      if (a.move.overcharge && a.charge > MAX_CHARGE) {         // overcharge: a second, gold/red bar fills on top + the %
        const o = clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1);

  if (xray && xray.t > 0 && xray.v.respawnTimer <= 0) {            // "RIBS BROKEN!" over the x-rayed fighter
    const k = 1 - xray.t / xray.max, S = toScreen(xray.v.x, xray.v.y - xray.v.h - 30);

  for (const f of fighters) {                           // Colby without his scythe: where it is / pick it up
    if (!f.noScythe || f.respawnTimer > 0) continue;

  }
  if (turbo) text('TURBO x' + TURBO_SPEED, W - 16, 26, 10, Math.floor(performance.now() / 400) % 2 ? '#d63a2a' : '#ff5a3c', 'right');
  for (const p of painTexts) {                          // manga sound words on the Broly slams
    const k = p.t / p.max, C = toScreen(p.x, p.y - (1 - k) * 25);
    const wob = (Math.random() - 0.5) * 6 * k;
    text(p.text, C.x + wob, C.y, Math.round((p.big ? 26 : 18) * (1 + (1 - k) * 0.25)), Math.floor(k * 12) % 2 ? '#ff5a3c' : '#ffffff', 'center');
  }
  if (critText && critText.t > 0) {                     // "CRITICAL!" pops up where they got hit
    const k = critText.t / 1.1;

    const C = toScreen(critText.x, critText.y);
    text('CRITICAL!', C.x + wob, C.y - (1 - k) * 30, 26 + (1 - k) * 8, Math.floor(k * 20) % 2 ? '#ff5a3c' : '#ffd23f', 'center');
  }
  if (clashText && clashText.t > 0) {
    const k = clashText.t / CLASH_TIME;

    const C = toScreen(clashText.x, clashText.y);

  if (showHitboxes) drawHitboxes();

function drawHitboxes() {
  sctx.save();
  applyCamera(sctx);
  sctx.lineWidth = 2 / cam.z;
  for (const f of fighters) {
    if (f.respawnTimer > 0) continue;
    sctx.strokeStyle = isIntangible(f) ? '#a8ecff' : '#ffd23f';
    sctx.strokeRect(f.x - f.w / 2, f.y - f.h, f.w, f.h);
    const a = f.action;
    if (a && a.type === 'attack' && a.move.hitboxes) {
      for (const h of a.move.hitboxes) {
        const live = a.phase === 'active' && (h.from === undefined || (a.t >= h.from && a.t <= h.to));
        sctx.strokeStyle = live ? '#ff0044' : 'rgba(255,0,68,0.3)';
        sctx.beginPath(); sctx.arc(f.x + h.x * f.face, f.y + h.y, h.r, 0, Math.PI * 2); sctx.stroke();
      }
    }
  }
  sctx.strokeStyle = '#ff0044';
  for (const s of projectiles) { sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.stroke(); }
  // Grab range while grabbing
  for (const f of fighters) if (f.action && f.action.type === 'grab') {
    sctx.strokeStyle = '#45b6e8';
    sctx.beginPath(); sctx.arc(f.x + GRAB.reachX * f.face, f.y + GRAB.reachY, GRAB.reachR, 0, Math.PI * 2); sctx.stroke();
  }
  sctx.restore();
}

// Radial speed lines around the ultimate's target (screen space)
function drawSpeedLines() {
  const c = toScreen(ult.target.x, ult.target.y - 50);
  ctx.fillStyle = sketch ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 46; i++) {
    const ang = hash(i * 3.7 + Math.floor(time * 20)) * Math.PI * 2;
    const r1 = 230 + hash(i + Math.floor(time * 20)) * 120, w = 0.008;
    ctx.beginPath();
    ctx.moveTo(c.x + Math.cos(ang) * r1, c.y + Math.sin(ang) * r1);
    ctx.lineTo(c.x + Math.cos(ang - w) * 1600, c.y + Math.sin(ang - w) * 1600);
    ctx.lineTo(c.x + Math.cos(ang + w) * 1600, c.y + Math.sin(ang + w) * 1600);
    ctx.fill();
  }
}

// THE CUTSCENE: Colby walks away; a red line appears across the enemy's waist, the top half slides off
// and falls, the legs buckle, blood pours.
function drawUltCutscene() {
  const U = ult, u = U.user, v = U.target, ct = U.t, dir = U.dir;
  // Colby walking away, scythe resting on his shoulders
  const s = Math.sin(ct * 7), c = Math.cos(ct * 7), walking = ct < 2.6;
  const walk = pose({ lean: 0.06, bob: walking ? Math.abs(s) * 2 : 0,
                      legA: walking ? [s * 0.45, 0.15 + Math.max(0, c) * 0.6] : [0.1, 0.05],
                      legB: walking ? [-s * 0.45, 0.15 + Math.max(0, -c) * 0.6] : [-0.1, 0.05] });
  drawFigure({ x: u.x, y: u.y, vx: dir * 34, vy: 0, face: dir, pose: withCarry(u, walk), squash: 0,
               color: bodyColorOf(u), ink: inkOf(u), look: u.look });

  // The enemy, frozen upright, then cut in two
  const stand = pose({ lean: -0.08, legA: [0.12, 0.05], legB: [-0.12, 0.05], armA: [0.3, -0.1], armB: [-0.3, 0.1] });
  const fig = { x: v.x, y: v.y, vx: 0, vy: 0, face: -dir, pose: stand, squash: 0, color: bodyColorOf(v), ink: inkOf(v), look: v.look };
  const cutY = v.y - 58;
  const sep = clamp((ct - 0.9) / 1.3, 0, 1);                       // how far the top half has slid / fallen
  const upDx = dir * 60 * sep * sep, upDy = Math.min(62, 330 * Math.max(0, sep - 0.22) ** 2), upRot = dir * 1.35 * sep * sep;
  const lowRot = -dir * 1.45 * easeOut(clamp((ct - 1.45) / 0.55, 0, 1));   // legs buckle backward

  // lower half (rotate around the feet, then keep only what's below the cut)
  ctx.save();
  ctx.translate(fig.x, fig.y); ctx.rotate(lowRot); ctx.translate(-fig.x, -fig.y);
  ctx.beginPath(); ctx.rect(fig.x - 300, cutY, 600, 400); ctx.clip();
  drawFigure(fig);
  ctx.restore();
  // upper half (slides along the cut, tips over, falls)
  ctx.save();
  ctx.translate(upDx, upDy);
  ctx.translate(fig.x, cutY); ctx.rotate(upRot); ctx.translate(-fig.x, -cutY);
  ctx.beginPath(); ctx.rect(fig.x - 300, cutY - 400, 600, 400); ctx.clip();
  drawFigure(fig);
  ctx.restore();

  // The cut line: appears glowing red, then the wound shows on both halves as they separate
  const lineK = clamp((ct - 0.5) / 0.25, 0, 1);
  if (lineK > 0) {
    ctx.save();
    ctx.lineCap = 'round';
    if (sep < 0.05) {
      ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = sketch ? 0 : 14;
      ctx.strokeStyle = sketch ? '#b3261e' : '#ff3030'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(fig.x - 24 * lineK, cutY + 1); ctx.lineTo(fig.x + 24 * lineK, cutY - 1); ctx.stroke();
    } else if (gore) {
      ctx.fillStyle = '#7e1c1c';
      ctx.beginPath(); ctx.ellipse(fig.x, cutY, 7, 3, lowRot, 0, Math.PI * 2); ctx.fill();               // stump
      ctx.translate(upDx, upDy); ctx.translate(fig.x, cutY); ctx.rotate(upRot);
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2); ctx.fill();                         // severed top
    }
    ctx.restore();
  }
}

function render() {
  // Pixel mode: draw the world small, then blow it up with chunky pixels.
  // Smooth mode: draw straight onto the full-size screen.
  ctx = pixelMode ? loCtx : sctx;
  ctx.setTransform(pixelMode ? 1 / PIX : 1, 0, 0, pixelMode ? 1 / PIX : 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (shake > 0) ctx.translate(snap((Math.random() - 0.5) * shake), snap((Math.random() - 0.5) * shake));
  sketchStroke = 0;
  if (impactFrame > 0) {
    drawImpactFrame();
  } else {
    // Background is drawn straight to the screen; everything in the world goes through the camera
    if (sketch) drawPaper(); else drawBackground();
    if (!sketch) {
      // ATMOSPHERIC HAZE: knock the backdrop back (darker, flatter, less contrast) so the fighters pop off
      // it - like the soft, muted backgrounds behind the figures in an animated stick fight
      ctx.fillStyle = stageDef.hell ? 'rgba(26,4,3,0.36)' : 'rgba(34,29,27,0.42)';
      ctx.fillRect(-60, -60, W + 120, H + 120);
    }
    if (ult) {
      // Ultimate: the world drops into darkness (blood-red for the cutscene) so the fighters pop
      ctx.fillStyle = ult.phase === 'cutscene' ? (sketch ? 'rgba(120,0,0,0.18)' : 'rgba(40,0,0,0.62)')
                                               : (sketch ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.55)');
      ctx.fillRect(-60, -60, W + 120, H + 120);
      if (ult.phase !== 'cutscene') drawSpeedLines();
    }
    ctx.save();
    applyCamera(ctx);
    if (sketch) drawStageSketch(); else drawStage();
    drawCracks();
    drawRopes();
    if (ult && ult.statue) drawGuanyin(ult);            // Colbalias's hundred-armed statue (behind everyone)
    if (fighters.some(f => f.action && f.action.type === 'timeStop')) {   // the world takes on a stopped-time tint
      const vb = viewBounds(); ctx.fillStyle = 'rgba(70,40,140,0.16)'; ctx.fillRect(vb.l - 60, vb.t - 60, vb.r - vb.l + 120, vb.b - vb.t + 120);
    }
    drawGhosts();
    if (ult && ult.phase === 'cutscene') drawUltCutscene();
    else {
      // Draw back-to-front (a thrown fighter swung behind the thrower goes behind him)
      const order = fighters.filter(f => f.respawnTimer <= 0).sort((a, b) => (a.drawZ || 0) - (b.drawZ || 0));
      for (const f of order) drawFighter(f);
      for (const f of order) drawSmear(f);              // attack smears on top of the bodies
      if (ult && ult.statue) drawGuanyinFront(ult);    // the statue's palms flying in + the Zero Hand beam
    }
    drawProjectiles();
    drawKiMarks();                                    // Lance's purple ki mark over whoever he's marked
    drawThrownScythes();
    drawAuraWaves();                                  // Lance's Tenma Kiai blast
    drawParticles();
    if (xray && xray.t > 0) drawXrayWorld();          // Mortal Kombat x-ray on a big hit
    drawKO();
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (pixelMode) {
    pixelate();
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(lo, 0, 0, LW * PIX, LH * PIX);
  }
  if (impactFrame <= 0) drawHUD();
}

// ---- Menu input from every device: keyboard (+ mouse) and each controller ----
const menuPadPrev = [];

  const out = [];
  const K = bindings.keys;
  const kx = (held(...K.right, 'ArrowRight') ? 1 : 0) - (held(...K.left, 'ArrowLeft') ? 1 : 0);
  const ky = (held(...K.down, 'ArrowDown') ? 1 : 0) - (held(...K.up, 'ArrowUp') ? 1 : 0);
  if (Object.keys(pressed).length) kbUsed = true;
  out.push({ dev: 'keyboard', nav: { x: kx, y: ky }, okHeld: held(...K.attack, 'Enter'), tap: {
    up: tapped(...K.up, 'ArrowUp'), down: tapped(...K.down, 'ArrowDown'), left: tapped(...K.left, 'ArrowLeft'), right: tapped(...K.right, 'ArrowRight'),
    ok: tapped(...K.attack, 'Enter'), back: tapped(...K.special, 'Backspace'), start: tapped('Enter'), alt: tapped('Tab'),
    esc: tapped('Escape'), leave: tapped('Delete'), pause: tapped('Escape') } });
  const pads = getPads();
  for (let i = 0; i < pads.length; i++) {
    const gp = pads[i];
    if (!gp || !gp.connected) { menuPadPrev[i] = null; continue; }
    const B = gp.buttons.map(b => !!b && (b.pressed || b.value > 0.5));
    const prev = menuPadPrev[i] || { B: [], sx: 0, sy: 0 };
    const t = n => B[n] && !prev.B[n];
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.hypot(ax, ay) < 0.22) ax = ay = 0;                       // dead zone
    const nx = (B[15] ? 1 : 0) - (B[14] ? 1 : 0) || ax, ny = (B[13] ? 1 : 0) - (B[12] ? 1 : 0) || ay;
    const sx = ax > 0.6 ? 1 : ax < -0.6 ? -1 : 0, sy = ay > 0.6 ? 1 : ay < -0.6 ? -1 : 0;
    out.push({ dev: 'pad' + i, nav: { x: nx, y: ny }, okHeld: !!B[0], tap: {
      up: t(12) || (sy === -1 && prev.sy !== -1), down: t(13) || (sy === 1 && prev.sy !== 1),
      left: t(14) || (sx === -1 && prev.sx !== -1), right: t(15) || (sx === 1 && prev.sx !== 1),
      ok: t(0), back: t(1), start: t(9), alt: t(3), turbo: t(2), esc: false, leave: t(8), pause: t(9) } });
    menuPadPrev[i] = { B, sx, sy };

    if (dir && dir === r.dir) { r.t += dt; if (r.t > 0.38) { r.t -= 0.09; d.tap[dir] = true; } } else { r.dir = dir; r.t = 0; }
  }
  return out;
}

// ---- Mouse: moves the keyboard player's cursor; left click = pick, right click = back ----
const mouse = { x: 0, y: 0, click: false, right: false, moved: false };
function canvasPoint(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
canvas.addEventListener('mousemove', e => { const p = canvasPoint(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
canvas.addEventListener('mousedown', e => { const p = canvasPoint(e); mouse.x = p.x; mouse.y = p.y; if (e.button === 2) mouse.right = true; else { mouse.click = true; mouse.down = true; } });

addEventListener('pointerdown', unlockAudio);

// ---------------- CHARACTER SELECT ----------------
// 8 roster slots (fill these in as new characters are made). null = "coming soon".
const ROSTER = ['COLBY', 'LANCE', 'STICKMAN', 'AIDEN', 'COLBALIAS', null, null, null];
const CHAR_INFO = {
  COLBALIAS: { title: 'THE FINAL BOSS', a: '#5a0000', b: '#0a0000' },
  AIDEN:  { title: 'THE HEEL',     a: '#b8410f', b: '#1c0b05' },
  COLBY:    { title: 'THE REAPER',   a: '#7e1c1c', b: '#1a0b0b' },
  LANCE:    { title: 'LAST STAND',   a: '#1f5fa8', b: '#0b1626' },
  STICKMAN: { title: 'THE ORIGINAL', a: '#52525c', b: '#141418' },
};
const CPU_LEVELS = ['AI EASY', 'AI NORMAL', 'AI HARD', 'AI MASTER'];
// WATCH MODE: CPU vs CPU. Nobody joins as a player - any controller / the keyboard / the mouse just
// drives a HOST cursor that picks both CPUs' fighters and levels. Turned on in GAME OPTIONS.
let watchMode = false;
const host = { name: 'HOST', host: true, cur: { x: 640, y: 250 }, carry: 0, char: null };
function setWatchMode(on) {
  watchMode = on;
  if (on) {
    players.forEach((q, i) => { q.cpu = true; q.dev = null; q.level = 'AI MASTER'; q.carry = i; });
    host.carry = players.findIndex(q => !q.char);
    selMsg = { text: 'WATCH MODE: PICK BOTH CPU FIGHTERS + LEVELS, THEN START', t: 2.5 };
  } else {
    players[0].cpu = false; players[0].dev = 'keyboard'; players[0].carry = 0; kbActed = false;
    selMsg = { text: 'WATCH MODE OFF - P1 IS BACK (PRESS A ON A CONTROLLER TO TAKE IT)', t: 2.5 };
  }
  menuSfx('pick');
}
const SEL_COLORS = [{ main: '#f0a818', dark: '#6b3f06' }, { main: '#45b6e8', dark: '#123e5c' }];
const players = [
  { name: 'P1', dev: 'keyboard', cpu: false, char: null, level: 'AI NORMAL', cur: { x: 330, y: 260 }, carry: 0 },
  { name: 'P2', dev: null,       cpu: true,  char: null, level: 'AI NORMAL', cur: { x: 950, y: 260 }, carry: 1 },
];
let selMsg = null;                    // little popup message ("COMING SOON", "CONTROLLER 1 JOINED")
function rosterRect(i) {
  const cols = 4, w = 236, h = 150, gap = 14, top = 104;
  const x0 = (W - (cols * w + (cols - 1) * gap)) / 2;
  return { x: x0 + (i % cols) * (w + gap), y: top + Math.floor(i / cols) * (h + gap), w, h };
}
const cardRect = i => ({ x: W / 2 - 330 + i * 360, y: 462, w: 300, h: 240 });
const toggleRect = c => ({ x: c.x + c.w - 96, y: c.y + 14, w: 84, h: 28 });
const levelRect = c => ({ x: c.x + 14, y: c.y + c.h - 78, w: 150, h: 26 });
const devRect = c => ({ x: c.x + 14, y: c.y + 52, w: 190, h: 18 });
const CONTROLS_BTN = { x: W - 262, y: 24, w: 238, h: 40 };
const TURBO_BTN = { x: W - 262 - 200, y: 24, w: 186, h: 40 };
const READY_RECT = { x: 0, y: 396, w: W, h: 58 };
// GAME OPTIONS panel (bottom-left of the select screen)
const GO_PANEL = { x: 22, y: 466, w: 268, h: 240 };
const GO_LEFT = { x: GO_PANEL.x + 132, y: GO_PANEL.y + 48, w: 34, h: 32 };
const GO_RIGHT = { x: GO_PANEL.x + 222, y: GO_PANEL.y + 48, w: 34, h: 32 };
const GO_CLEAN = { x: GO_PANEL.x + 12, y: GO_PANEL.y + 88, w: 244, h: 30 };
const GO_TURBO = { x: GO_PANEL.x + 12, y: GO_PANEL.y + 123, w: 244, h: 30 };
const GO_WATCH = { x: GO_PANEL.x + 12, y: GO_PANEL.y + 158, w: 244, h: 30 };
const GO_STAGE = { x: GO_PANEL.x + 12, y: GO_PANEL.y + 193, w: 244, h: 30 };   // click = next stage
function changeStocks(d) {               // 0 = FREE PLAY, then 1..99 (wraps around)
  gameOptions.stocks = (gameOptions.stocks + d + 100) % 100;
  saveOptions(); menuSfx('move');
}
const allReady = () => players.every(p => p.char);
const devLabel = p => p.cpu ? 'COMPUTER' : p.dev === 'keyboard' ? 'KEYBOARD + MOUSE' : 'CONTROLLER ' + (+p.dev.slice(3) + 1);

function joinDevice(dev) {
  // A controller takes the keyboard's slot if the keyboard/mouse hasn't actually picked anything yet
  // (so a solo controller player is always P1), otherwise the first CPU slot
  let slot = null;
  if (dev.startsWith('pad')) {
    const kb = players.find(p => !p.cpu && p.dev === 'keyboard');
    if (kb && !kbActed) slot = kb;
  }
  slot = slot || players.find(p => p.cpu);
  if (!slot) return;
  const i = players.indexOf(slot);
  slot.cpu = false; slot.dev = dev; slot.carry = i;
  slot.cur = { x: cardRect(i).x + 150, y: 300 };
  for (const p of players) if (p !== slot && p.carry === i) p.carry = players.indexOf(p);   // nobody else holds this token now
  selMsg = { text: devLabel(slot) + ' JOINED AS ' + slot.name, t: 1.6 };
  menuSfx('pick');
}
function makeCpu(q) {
  const i = players.indexOf(q);
  q.cpu = true; q.dev = null; q.carry = i;
  menuSfx('back');
}
function selectClick(p) {
  const pt = p.cur, me = players.indexOf(p);
  if (inRect(pt, CONTROLS_BTN)) return openControls('select');
  if (inRect(pt, TURBO_BTN) || inRect(pt, GO_TURBO)) return setTurbo(!turbo);
  // Game options
  if (inRect(pt, GO_LEFT)) return changeStocks(-1);
  if (inRect(pt, GO_RIGHT)) return changeStocks(1);
  if (inRect(pt, GO_CLEAN)) { setCleanMode(!gameOptions.cleanHud); menuSfx('pick'); return; }
  if (inRect(pt, GO_WATCH)) return setWatchMode(!watchMode);
  if (inRect(pt, GO_STAGE)) { gameOptions.stage = ((gameOptions.stage || 0) + 1) % STAGE_LIST.length; saveOptions(); menuSfx('pick'); return; }
  if (inRect(pt, GO_PANEL)) return;
  if (allReady() && inRect(pt, READY_RECT)) return startMatch();
  // Player cards: HMN/CPU switch, CPU level, or pick a token back up
  for (let i = 0; i < players.length; i++) {
    const c = cardRect(i), q = players[i];
    if (inRect(pt, toggleRect(c))) {
      if (watchMode) selMsg = { text: 'WATCH MODE IS ON - TURN IT OFF IN GAME OPTIONS TO PLAY', t: 2.2 };
      else if (!q.cpu) {
        const dev = q.dev;
        makeCpu(q);
        // A controller player switching their own slot to CPU wants to fight that CPU:
        // hand the controller over to the keyboard player's slot instead of dropping it
        if (p === q && dev.startsWith('pad')) {
          const kb = players.find(o => !o.cpu && o.dev === 'keyboard');
          if (kb) { kb.dev = dev; selMsg = { text: devLabel(kb) + ' NOW CONTROLS ' + kb.name, t: 2.2 }; }
        }
      }
      else selMsg = { text: 'PRESS A ON A CONTROLLER (OR J) TO JOIN AS ' + q.name, t: 2 };
      return;
    }
    if (!q.cpu && inRect(pt, devRect(c))) {      // click the device name to switch it (keyboard <-> controllers)
      const pads = getPads().map((g, k) => g && g.connected ? 'pad' + k : null).filter(Boolean);
      const options = ['keyboard', ...pads].filter(dv => dv === q.dev || !players.some(o => o !== q && !o.cpu && o.dev === dv));
      q.dev = options[(options.indexOf(q.dev) + 1) % options.length];
      selMsg = { text: q.name + ' NOW USES ' + devLabel(q), t: 1.8 }; menuSfx('move');
      return;
    }
    if (q.cpu && inRect(pt, levelRect(c))) {
      q.level = CPU_LEVELS[(CPU_LEVELS.indexOf(q.level) + 1) % CPU_LEVELS.length]; menuSfx('move'); return;
    }
    if (inRect(pt, c)) {                     // click your own card or a CPU's card = pick its token back up
      if (q === p || q.cpu) { q.char = null; p.carry = i; menuSfx('back'); }

    }
  }

    if (!ROSTER[i]) { selMsg = { text: 'COMING SOON', t: 1.2 }; menuSfx('back'); return; }
    let t = players[p.carry];
    if (p.host) {                                // watch mode host only ever places CPU tokens

    } else if (!t || (t !== p && !t.cpu)) { p.carry = me; t = p; }
    t.char = ROSTER[i];

    return;
  }
}
function selectBack(p) {
  if (p.host) { if (p.carry >= 0) { p.carry = -1; menuSfx('back'); } return; }
  const me = players.indexOf(p);
  if (p.carry !== me) { p.carry = me; menuSfx('back'); return; }     // put the CPU token down
  if (p.char) { p.char = null; menuSfx('back'); }
}
function selectUpdate(dt) {
  if (selMsg) { selMsg.t -= dt; if (selMsg.t <= 0) selMsg = null; }
  const devs = menuDevices(dt);
  if (tapped('KeyT')) setTurbo(!turbo);
  for (const d of devs) {
    if (d.tap.alt) return openControls('select');
    if (d.tap.turbo) setTurbo(!turbo);
    if (d.tap.start && allReady()) return startMatch();
    if (watchMode) {                               // WATCH MODE: every device drives the one HOST cursor
      host.cur.x = clamp(host.cur.x + d.nav.x * 900 * dt, 8, W - 8);
      host.cur.y = clamp(host.cur.y + d.nav.y * 900 * dt, 8, H - 8);

      if (d.tap.back || d.tap.esc) selectBack(host);

    const held = d.okHeld || (d.dev === 'keyboard' && mouse.down);
    const arrow = inRect(p.cur, GO_LEFT) ? -1 : inRect(p.cur, GO_RIGHT) ? 1 : 0;
    if (held && arrow) { p.repT = (p.repT || 0) + dt; if (p.repT > 0.4) { p.repT -= 0.05; changeStocks(arrow); } }
    else p.repT = 0;

  }
  if (watchMode && !devs.some(d => d.rep)) host.repT = 0;
  // Mouse drives the keyboard player's cursor (or P1's) - or the host cursor in watch mode
  const mp = watchMode ? host : players.find(q => !q.cpu && q.dev === 'keyboard') || (!players[0].cpu ? players[0] : null);
  if (mp) {
    if (mouse.moved) { mp.cur.x = mouse.x; mp.cur.y = mouse.y; mouseUsed = true; }
    if (mouse.click) { mp.cur.x = mouse.x; mp.cur.y = mouse.y; if (mp.dev === 'keyboard') kbActed = true; selectClick(mp); }
    if (mouse.right) selectBack(mp);
  } else if (mouse.click) joinDevice('keyboard');
  mouse.moved = mouse.click = mouse.right = false;
  // a token can only be carried by one cursor
  for (const p of players) if (!p.cpu && players[p.carry] && !players[p.carry].cpu && p.carry !== players.indexOf(p)) p.carry = players.indexOf(p);
}

// ---------------- GAME OPTIONS (the panel on the character select) ----------------
//   stocks: lives per player, 1-99 (0 = FREE PLAY: unlimited, like before)
//   cleanHud: hide all the demo/debug text (controls list, demo labels) for real matches
const gameOptions = (() => {
  const d = { stocks: 3, cleanHud: false, stage: 0 };       // stage = index into STAGE_LIST
  try { const s = JSON.parse(localStorage.getItem('stickman-brawl-options') || 'null'); if (s) return { ...d, ...s }; } catch (e) {}
  return d;
})();
function saveOptions() { try { localStorage.setItem('stickman-brawl-options', JSON.stringify(gameOptions)); } catch (e) {} }
// CLEAN MODE: no demo/debug text on screen, debug keys disabled, and any debug effect still running is switched off
function setCleanMode(on) {
  gameOptions.cleanHud = on;
  if (on) {
    cannon.on = false; showHitboxes = false; showControls = false;
    if (demo) endDemo();
    if (timeScale < 1) timeScale = 1;
  } else showControls = true;
  saveOptions();
}
const stockLabel = () => gameOptions.stocks > 0 ? gameOptions.stocks + (gameOptions.stocks === 1 ? ' STOCK' : ' STOCKS') : 'FREE PLAY';

// ---------------- STOCK MATCH: who's left, GAME!, results ----------------
let matchOver = null;           // { winner, t } once only one fighter has lives left
let results = null;             // what the results screen shows
function checkMatchEnd() {
  const left = fighters.filter(f => !f.out && !f.minion);
  if (left.length <= 1 && !matchOver) {
    matchOver = { winner: left[0] || null, t: 0 };
    startSlowmo(1.6);
    shake = Math.max(shake, 18);
    menuSfx('go');
  }
}
function showResults() {
  results = {
    winner: matchOver.winner ? fighters.indexOf(matchOver.winner) : -1,
    rows: fighters.slice(0, REAL_FIGHTERS).map((f, i) => ({ name: f.name, char: f.char, color: f.color, stocks: Math.max(0, f.stocks), falls: f.kos, i })),
  };
  matchOver = null; scene = 'results'; menuSfx('go');
}

function startMatch() {
  removeAllMinions();
  applyStage(gameOptions.stage || 0);
  players.forEach((pl, i) => {
    const f = fighters[i];
    setCharacter(f, pl.char);
    f.controller = pl.cpu ? 'dummy' : pl.dev;
    f.name = pl.cpu ? (players.every(q => q.cpu) ? 'CPU ' + (i + 1) : 'CPU') : pl.name;
    f.kos = 0; f.ult = 0; f.disp = null;
    f.stocks = gameOptions.stocks > 0 ? gameOptions.stocks : Infinity;   // lives
    f.cpuLevel = pl.cpu ? pl.level : null;                                // each CPU plays at its own level
    f.timeMeter = 0; f.tsCD = 0;
    f.demon = 0; f.cloneCD = 0; f.cshot = 0;
    f.out = false;
    resetFighter(f, false);
  });
  matchOver = null;
  const cpu = players.find(p => p.cpu);
  if (cpu) dummyMode = DUMMY_MODES.indexOf(cpu.level);
  projectiles.length = 0; particles.length = 0; ghosts.length = 0; stains.length = 0; cracks.length = 0; painTexts.length = 0; scythes.length = 0; auraWaves.length = 0; ropeFx.length = 0;
  ult = null; demo = null; timeScale = 1; hitstop = 0; impactFrame = 0; critText = null; clashText = null; xray = null; slowmo = 0;
  paused = false; scene = 'fight';
  for (const p of padPrev) if (p) p.prev = {};
  menuSfx('go');
}
// Mid-fight: give an unused controller a fighter. Takes over the keyboard fighter if nobody has
// pressed a key for a couple of seconds, otherwise turns the CPU into a controller player.
let hudToast = null;
function claimFighter(dev) {
  if (watchMode) return;                             // watching CPUs: controllers don't jump in
  const idleKb = fighters.find(f => f.controller === 'keyboard' && performance.now() - lastKeyTime > 2000);
  const f = idleKb || fighters.find(f => f.controller === 'dummy');
  if (!f) return;
  const i = fighters.indexOf(f);
  f.controller = dev;
  players[i].cpu = false; players[i].dev = dev;
  f.name = players[i].name;
  const k = +dev.slice(3);
  if (padPrev[k]) padPrev[k].prev = {};
  hudToast = { text: 'CONTROLLER ' + (k + 1) + ' NOW CONTROLS ' + f.name + ' (' + f.char + ')', t: 2.5 };
  menuSfx('pick');
}
function backToSelect() {
  scene = 'select'; paused = false;
  removeAllMinions();
  for (const f of fighters) { stopKameCharge(f); stopShotCharge(f); }
  players.forEach((p, i) => { p.carry = i; p.cur = { x: cardRect(i).x + 150, y: 300 }; });
}

// ---- Drawing helpers for menus ----
function drawPortrait(charName, x, y, scale, slotColor, t = menuTime, face = 1) {
  const c = CHARACTERS[charName], look = c.look || {};
  const br = Math.sin(t * 2.2);
  const base = look.idle || pose({ armA: [0.35, -0.6], armB: [-0.25, -0.4] });
  const pz = { ...base, bob: (base.bob || 0) + br * 1.5, lean: (base.lean || 0) + br * 0.02 };
  if (base.sc) pz.sc = { ...base.sc, pitch: base.sc.pitch + br * 0.04 };
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  drawFigure({ x: 0, y: 0, vx: 0, vy: 0, face, pose: pz, squash: 0, color: look.body || slotColor, ink: '#1b1b1b', look, transformed: false });
  ctx.restore();
}
function slantRect(x, y, w, h, slant, fill) {
  sctx.fillStyle = fill;
  sctx.beginPath(); sctx.moveTo(x + slant, y); sctx.lineTo(x + w, y); sctx.lineTo(x + w - slant, y + h); sctx.lineTo(x, y + h); sctx.closePath(); sctx.fill();
}
function drawToken(x, y, label, color) {
  sctx.fillStyle = '#0e0c0c'; sctx.beginPath(); sctx.arc(x + 3, y + 3, 21, 0, Math.PI * 2); sctx.fill();
  sctx.fillStyle = color; sctx.beginPath(); sctx.arc(x, y, 21, 0, Math.PI * 2); sctx.fill();
  sctx.fillStyle = 'rgba(255,255,255,0.35)'; sctx.beginPath(); sctx.arc(x - 6, y - 7, 8, 0, Math.PI * 2); sctx.fill();
  sctx.strokeStyle = '#ffffff'; sctx.lineWidth = 3; sctx.beginPath(); sctx.arc(x, y, 21, 0, Math.PI * 2); sctx.stroke();
  text(label, x, y + 5, label.length > 2 ? 9 : 11, '#ffffff', 'center');
}
function drawCursor(p, i) {
  const { x, y } = p.cur, col = p.host ? '#ffffff' : SEL_COLORS[i].main;
  // carried token hangs off the pointer (in watch mode the CPU coins are numbered and colored per slot)
  const carried = players[p.carry];
  if (carried && (carried !== p || !p.char)) {
    const label = carried.cpu ? (watchMode ? 'C' + (p.carry + 1) : 'CPU') : carried.name;
    drawToken(x + 20, y + 26, label, carried.cpu && !watchMode ? '#8f8f98' : SEL_COLORS[p.carry].main);
  }
  sctx.save(); sctx.translate(x, y);
  sctx.fillStyle = '#0e0c0c';
  sctx.beginPath(); sctx.moveTo(-2, -3); sctx.lineTo(24, 18); sctx.lineTo(12, 20); sctx.lineTo(18, 34); sctx.lineTo(11, 37); sctx.lineTo(5, 23); sctx.lineTo(-3, 30); sctx.closePath(); sctx.fill();
  sctx.fillStyle = col;
  sctx.beginPath(); sctx.moveTo(0, 0); sctx.lineTo(20, 17); sctx.lineTo(10, 18); sctx.lineTo(16, 31); sctx.lineTo(12, 33); sctx.lineTo(6, 20); sctx.lineTo(0, 26); sctx.closePath(); sctx.fill();
  sctx.restore();
  text(p.name, x - 6, y - 8, 9, col, 'right');
}
function drawMenuBackground(accent) {
  sctx.fillStyle = '#120d0d'; sctx.fillRect(0, 0, W, H);
  // big diagonal stripes drifting slowly (Smash-style)
  sctx.save();
  for (let k = -4; k < 16; k++) {
    const off = ((menuTime * 30) % 160) + k * 160;
    sctx.fillStyle = k % 2 ? 'rgba(168,38,30,0.10)' : 'rgba(240,168,24,0.05)';
    sctx.beginPath(); sctx.moveTo(off, 0); sctx.lineTo(off + 80, 0); sctx.lineTo(off - 220, H); sctx.lineTo(off - 300, H); sctx.closePath(); sctx.fill();
  }
  const g = sctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 800);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.65)');
  sctx.fillStyle = g; sctx.fillRect(0, 0, W, H);
  sctx.restore();
}
function withMenuDrawing(fn) {
  const keep = [pixelMode, sketch, ctx];
  pixelMode = false; sketch = false; ctx = sctx;
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalAlpha = 1;
  try { fn(); } finally { [pixelMode, sketch, ctx] = keep; }
}

const ctl = { row: 0, col: 0, listen: null };
const CTL_ROWS = [...ACTIONS, 'tapJump', 'cStick', 'reset', 'back'];
const ctlRowY = r => 162 + r * 35;
const C_STICK_MODES = ['attack', 'special', 'off'];
const C_STICK_LABEL = { attack: 'PHYSICAL MOVES', special: 'RANGED MOVES', off: 'OFF' };
const ctlCellRect = (r, c) => ({ x: c === 0 ? 470 : 840, y: ctlRowY(r) - 24, w: 340, h: 31 });
function openControls(from) { controlsFrom = from; scene = 'controls'; ctl.row = 0; ctl.col = 0; ctl.listen = null; menuSfx('move'); }
function closeControls() { saveBindings(); scene = controlsFrom === 'pause' ? 'fight' : 'select'; if (controlsFrom === 'pause') paused = true; menuSfx('back'); }
function ctlActivate() {
  const row = CTL_ROWS[ctl.row];
  if (row === 'tapJump') { bindings.tapJump = !bindings.tapJump; saveBindings(); menuSfx('pick'); }
  else if (row === 'cStick') {
    bindings.cStick = C_STICK_MODES[(C_STICK_MODES.indexOf(bindings.cStick) + 1) % C_STICK_MODES.length];
    saveBindings(); menuSfx('pick');
  }
  else if (row === 'reset') { bindings = JSON.parse(JSON.stringify(DEFAULT_BINDINGS)); saveBindings(); menuSfx('pick'); }
  else if (row === 'back') closeControls();
  else { ctl.listen = { action: row, col: ctl.col, t: 6, armed: false }; menuSfx('move'); }
}
// Keyboard remap: grab the very next key pressed
addEventListener('keydown', e => {
  if (scene !== 'controls' || !ctl.listen || ctl.listen.col !== 0) return;
  e.preventDefault(); e.stopPropagation();      // this key is only for the remap - it doesn't also click the menu
  if (e.code !== 'Escape') { bindings.keys[ctl.listen.action] = [e.code]; saveBindings(); menuSfx('pick'); }
  ctl.listen = null;
  for (const k in pressed) delete pressed[k];
}, true);
function controlsUpdate(dt) {
  const devs = menuDevices(dt);
  if (ctl.listen) {
    ctl.listen.t -= dt;
    if (ctl.listen.col === 1) {
      // Controller remap: grab the next button pressed on any controller
      if (ctl.listen.armed) {
        const pads = getPads();
        for (let i = 0; i < pads.length; i++) {
          const gp = pads[i]; if (!gp || !gp.connected) continue;
          const n = gp.buttons.findIndex((b, k) => b && (b.pressed || b.value > 0.5) && !((ctl.listen.held || [])[i] || [])[k]);
          if (n >= 0) { bindings.pad[ctl.listen.action] = [n]; saveBindings(); menuSfx('pick'); ctl.listen = null; return; }
        }
      } else {   // remember what's already held so the button you pressed to start doesn't count
        ctl.listen.held = getPads().map(gp => gp ? gp.buttons.map(b => !!b && (b.pressed || b.value > 0.5)) : []);
        ctl.listen.armed = true;
      }
      // release a held button and it no longer blocks
      if (ctl.listen) ctl.listen.held = (ctl.listen.held || []).map((arr, i) => { const gp = getPads()[i]; return gp ? arr.map((h, k) => h && !!gp.buttons[k] && gp.buttons[k].pressed) : []; });
    }
    if (ctl.listen && (ctl.listen.t <= 0 || tapped('Escape'))) ctl.listen = null;
    mouse.click = mouse.right = mouse.moved = false;
    return;
  }
  for (const d of devs) {
    if (d.tap.up) { ctl.row = (ctl.row + CTL_ROWS.length - 1) % CTL_ROWS.length; menuSfx('move'); }
    if (d.tap.down) { ctl.row = (ctl.row + 1) % CTL_ROWS.length; menuSfx('move'); }
    if (d.tap.left || d.tap.right) { ctl.col = 1 - ctl.col; menuSfx('move'); }
    if (d.tap.ok) { ctlActivate(); return; }
    if (d.tap.back || d.tap.esc || d.tap.alt || d.tap.pause) { closeControls(); return; }
  }
  // mouse
  if (mouse.moved || mouse.click) {
    for (let r = 0; r < CTL_ROWS.length; r++) {
      if (r < ACTIONS.length) { for (let c = 0; c < 2; c++) if (inRect(mouse, ctlCellRect(r, c))) { ctl.row = r; ctl.col = c; } }
      else if (inRect(mouse, { x: 470, y: ctlRowY(r) - 24, w: 710, h: 31 })) ctl.row = r;
    }
    if (mouse.click) ctlActivate();
  }
  if (mouse.right) closeControls();
  mouse.click = mouse.right = mouse.moved = false;
}
function drawControls() {
  withMenuDrawing(() => {
    drawMenuBackground();
    slantRect(-20, 16, 470, 56, 26, '#a8261e');
    text('CONTROLS', 28, 55, 22, '#ffffff');
    text('SAVED AUTOMATICALLY  -  ESC / B = BACK', W - 30, 52, 9, '#ffd23f', 'right');
    text('KEYBOARD', 640, 112, 12, '#ffd23f', 'center');
    text('XBOX CONTROLLER', 1010, 112, 12, '#45b6e8', 'center');
    const pads = getPads().filter(g => g && g.connected).length;
    text(pads ? pads + ' CONTROLLER' + (pads > 1 ? 'S' : '') + ' CONNECTED' : 'NO CONTROLLER DETECTED - PLUG ONE IN AND PRESS A BUTTON', 1010, 128, 7, pads ? '#a8ecff' : '#806b5a', 'center', false);
    CTL_ROWS.forEach((row, r) => {
      const y = ctlRowY(r), sel = ctl.row === r;
      if (r < ACTIONS.length) {
        text(ACTION_LABEL[row], 60, y, 11, sel ? '#ffffff' : '#b4b4bb', 'left', false);
        for (let c = 0; c < 2; c++) {
          const cr = ctlCellRect(r, c), on = sel && ctl.col === c;
          const listening = ctl.listen && ctl.listen.action === row && ctl.listen.col === c;
          sctx.fillStyle = listening ? '#d63a2a' : on ? '#ffd23f' : 'rgba(255,255,255,0.06)';
          sctx.fillRect(cr.x, cr.y, cr.w, cr.h);
          const label = listening ? (c === 0 ? 'PRESS A KEY...  (ESC CANCELS)' : 'PRESS A BUTTON...')
            : c === 0 ? bindings.keys[row].map(keyName).join(' / ')
            : bindings.pad[row].map(padBtnName).join(' / ') + (['left', 'right', 'up', 'down'].includes(row) ? ' + L-STICK' : '');
          text(label, cr.x + cr.w / 2, cr.y + 20, 9, on && !listening ? '#0e0c0c' : '#ffffff', 'center', false);
        }
      } else {
        const label = row === 'tapJump' ? 'TAP JUMP (STICK UP JUMPS):  ' + (bindings.tapJump ? 'ON' : 'OFF')
                    : row === 'cStick' ? 'RIGHT STICK (C-STICK) FLICK:  ' + C_STICK_LABEL[bindings.cStick]
                    : row === 'reset' ? 'RESET TO DEFAULTS' : 'BACK';
        sctx.fillStyle = sel ? '#ffd23f' : 'rgba(255,255,255,0.06)';
        sctx.fillRect(470, y - 24, 710, 31);
        text(label, 825, y - 4, 10, sel ? '#0e0c0c' : '#ffffff', 'center', false);
      }
    });
    text('UP/DOWN TO CHOOSE, LEFT/RIGHT FOR KEYBOARD OR CONTROLLER, A / J / CLICK TO CHANGE IT', W / 2, H - 18, 8, '#8f8f98', 'center', false);
  });
}

// ---------------- RESULTS (after a stock match) ----------------
function resultsUpdate(dt) {
  const devs = menuDevices(dt);
  if (menuTime > 0.6 && (devs.some(d => d.tap.ok || d.tap.start || d.tap.back) || mouse.click)) {
    results = null; backToSelect(); menuSfx('pick');
    if (netplay) netBackToLobby();                   // online: back to the online lobby to pick again
  }
  mouse.click = mouse.right = mouse.moved = false;
}
function drawResults() {
  withMenuDrawing(() => {
    drawMenuBackground();
    const R = results;
    const win = R.winner >= 0 ? R.rows[R.winner] : null;
    slantRect(-20, 30, 720, 70, 26, '#a8261e');
    text(win ? win.name + ' WINS!' : 'NO CONTEST', 32, 80, 30, '#ffffff');
    if (win) {
      // big spotlight on the winner
      const g = sctx.createRadialGradient(330, 440, 20, 330, 440, 260);
      g.addColorStop(0, 'rgba(255,210,63,0.35)'); g.addColorStop(1, 'rgba(255,210,63,0)');
      sctx.fillStyle = g; sctx.fillRect(60, 160, 540, 520);
      drawPortrait(win.char, 330, 600, 3.0, win.color, menuTime);
      text(win.char, 330, 650, 26, '#ffffff', 'center');
      if (CHAR_INFO[win.char]) text(CHAR_INFO[win.char].title, 330, 676, 9, '#ffd23f', 'center', false);
    }
    // the table of everyone
    R.rows.forEach((r, k) => {
      const y = 200 + k * 130, x = 700;
      slantRect(x - 4, y - 4, 520, 108, 14, '#0e0c0c');
      slantRect(x, y, 512, 100, 12, k === R.winner ? '#5e4a12' : '#26211f');
      sctx.fillStyle = r.color; sctx.fillRect(x + 12, y + 10, 10, 80);
      text((k === R.winner ? '1ST  ' : '2ND  ') + r.name, x + 36, y + 36, 16, '#ffffff', 'left', false);
      text(r.char, x + 36, y + 64, 10, '#ffd23f', 'left', false);
      text('STOCKS LEFT ' + r.stocks, x + 490, y + 36, 10, '#ffffff', 'right', false);
      text('FALLS ' + r.falls, x + 490, y + 64, 10, '#b4b4bb', 'right', false);
    });
    if (menuTime > 0.6 && Math.floor(menuTime * 2) % 2 === 0) text('PRESS START / ENTER / A TO CONTINUE', 960, 680, 10, '#fff3a8', 'center', false);
  });
}

// ---------------- PAUSE (ESC / MENU button during a fight) ----------------
const PAUSE_ITEMS = ['RESUME', 'CHARACTER SELECT', 'CONTROLS', 'CLEAN MODE', 'TURBO'];
function pauseUpdate(devs) {
  for (const d of devs) {
    if (d.tap.up) { pauseSel = (pauseSel + PAUSE_ITEMS.length - 1) % PAUSE_ITEMS.length; menuSfx('move'); }
    if (d.tap.down) { pauseSel = (pauseSel + 1) % PAUSE_ITEMS.length; menuSfx('move'); }
    if (d.tap.back) { paused = false; return; }
    if (d.tap.ok || d.tap.start) { pauseChoose(); return; }
  }
  for (let k = 0; k < PAUSE_ITEMS.length; k++) {
    const r = { x: W / 2 - 200, y: 270 + k * 55 - 30, w: 400, h: 44 };
    if ((mouse.moved || mouse.click) && inRect(mouse, r)) pauseSel = k;
  }
  if (mouse.click) pauseChoose();
  mouse.click = mouse.right = mouse.moved = false;
}
function pauseChoose() {
  const item = PAUSE_ITEMS[pauseSel];
  if (item === 'RESUME') paused = false;
  else if (item === 'CHARACTER SELECT') backToSelect();
  else if (item === 'TURBO') { setTurbo(!turbo); return; }
  else if (item === 'CLEAN MODE') { setCleanMode(!gameOptions.cleanHud); menuSfx('pick'); return; }
  else { paused = false; openControls('pause'); }
  menuSfx('pick');
}
function drawPause() {
  withMenuDrawing(() => {
    sctx.fillStyle = 'rgba(10,8,8,0.72)'; sctx.fillRect(0, 0, W, H);
    slantRect(W / 2 - 260, 150, 520, 70, 26, '#a8261e');
    text('PAUSED', W / 2, 198, 30, '#ffffff', 'center');
    PAUSE_ITEMS.forEach((it, k) => {
      const y = 270 + k * 55, sel = pauseSel === k;
      slantRect(W / 2 - 200, y - 30, 400, 44, 14, sel ? '#ffd23f' : 'rgba(255,255,255,0.08)');
      const label = it === 'TURBO' ? 'TURBO: ' + (turbo ? 'ON (x' + TURBO_SPEED + ' SPEED)' : 'OFF')
                  : it === 'CLEAN MODE' ? 'CLEAN MODE: ' + (gameOptions.cleanHud ? 'ON' : 'OFF') : it;
      text(label, W / 2, y, 14, sel ? '#0e0c0c' : '#ffffff', 'center', !sel);
    });
    text('ESC / MENU BUTTON = RESUME', W / 2, 560, 8, '#8f8f98', 'center', false);
  });
}

// ---------------- Main loop (fixed 120 Hz physics) ----------------
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000);
  last = now;
  // Menus run at screen rate, outside the fight
  if (scene !== 'fight') {
    menuTime += elapsed;
    if (scene === 'select') { if (!window.sbNetOpen) selectUpdate(elapsed); }   // (not while the ONLINE screens are open)
    else if (scene === 'controls') controlsUpdate(elapsed);
    else if (scene === 'results') resultsUpdate(elapsed);
    for (const k in pressed) delete pressed[k];
    if (scene === 'select') drawSelect(); else if (scene === 'controls') drawControls();
    else if (scene === 'results' && results) drawResults();
    acc = 0;
    requestAnimationFrame(frame);
    return;
  }
  // Pause toggle (ESC or the controller's MENU button)
  const md = menuDevices(elapsed);
  // A controller that isn't driving anyone presses a button -> it takes over a fighter
  for (const d of md) {
    if (netActive()) break;                          // online: nobody takes over a fighter
    if (d.dev.startsWith('pad') && (d.tap.ok || d.tap.back || d.tap.alt || d.tap.start) &&
        !fighters.some(f => f.controller === d.dev)) { claimFighter(d.dev); d.tap.pause = false; }
  }
  if (netActive()) {                                 // online: no pausing (ESC twice = leave the match)
    if (md.some(d => d.tap.pause)) netEscape();
  } else if (md.some(d => d.tap.pause)) {
    paused = !paused; pauseSel = 0;
    for (const f of fighters) { stopKameCharge(f); stopShotCharge(f); }
    for (const k in pressed) delete pressed[k];
    mouse.click = mouse.moved = mouse.right = false;
  } else if (paused) {
    pauseUpdate(md);
    for (const k in pressed) delete pressed[k];
  }
  if (paused || scene !== 'fight') {
    if (scene === 'fight') { render(); drawPause(); }
    acc = 0;
    requestAnimationFrame(frame);
    return;
  }
  mouse.click = mouse.moved = mouse.right = false;
  if (matchOver) {                                   // GAME! - let it play out in slow-mo, then the results screen
    matchOver.t += elapsed;
    if (matchOver.t > 2.4) { showResults(); menuTime = 0; requestAnimationFrame(frame); return; }
  }
  const speed = () => timeScale * (turbo && !netActive() ? TURBO_SPEED : 1) * (slowmo > 0 ? SLOWMO_HIT_SCALE : 1);
  acc += elapsed * speed();                          // turbo = faster; big hits = slow-mo
  impactFrame = Math.max(0, impactFrame - elapsed * Math.max(timeScale, 0.25));   // lasts longer in slow-mo
  acc = Math.min(acc, STEP * 24);                    // (never try to catch up more than 0.2s at once)
  while (acc >= STEP) {
    // slow-mo and the x-ray count down per game step (as the real time that step takes), so both
    // players' games always agree on them online
    const realStep = STEP / Math.max(0.01, speed());
    if (netActive()) { if (!netTick(realStep)) { acc = Math.min(acc, STEP); break; } }   // online: waits for the other player's inputs
    else {
      if (hitstop > 0) {
        hitstop -= STEP;              // freeze frame on hits (inputs are kept for after)
      } else {
        update(STEP);
        for (const k in pressed) delete pressed[k];
      }
    }
    slowmo = Math.max(0, slowmo - realStep);
    if (xray) { xray.t -= realStep; if (xray.t <= 0) xray = null; }
    acc -= STEP;
  }
  if (netActive()) netAfterFrame();
  render();
  if (netplay) netDrawOverlay();                     // online: "waiting for opponent", ping, desync warning
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
