        x += side * len / 4 + (r(k * 11 + s) - 0.5) * 6; y = c.y + 1 + r(k * 7 + s) * 9 * (s / 4) * c.size;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = sketch ? '#222' : '#1a1716';                   // crater dent
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 2, 16 * c.size, 4 * c.size, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function doThrow(f, v, kind) {
  if (kind === 'down' && CHARACTERS[f.char].downThrow === 'broly') kind = 'broly';   // Lance's down throw
  const own = CHARACTERS[f.char].throwKinds;                                          // Aiden's own throws
  if (own && own[kind]) kind = own[kind];
  const A = THROW_ANIM[kind];
  f.action = { type: 'throw', t: 0, dur: A.dur, rel: A.rel, kind, victim: v, face0: f.face, released: false };
  v.action = { type: 'thrown', t: 0, holder: f, kind };
}

// Where the victim's feet are during the throw, relative to the thrower's feet
// (x = forward from where the thrower faced at the start, y = up/down, z = depth for 2.5D draw order)
function throwPath(kind, k) {
  if (kind === 'giantSwing') {                    // round and round at waist height, passing in front of and behind him
    const th = giantSwingAngle(k);
    return [52 * Math.cos(th), -16 + 6 * Math.sin(th * 2), Math.sin(th)];
  }
  if (kind === 'quadPress') {                     // hoisted straight up overhead and held at arm's length...
    if (k < 0.6) { const u = easeOut(k / 0.6); return [lerp(40, 4, u), lerp(0, -92, u), 0]; }
    return [4 + Math.sin(k * 60) * 2, -92 - (k - 0.6) * 20, 0];      // ...shaking with effort
  }
  if (kind === 'forward') {
    if (k < 0.45) { const u = k / 0.45; return [lerp(40, 20, u), lerp(0, -8, u), 0]; }
    const u = easeOut((k - 0.45) / 0.55); return [lerp(20, 74, u), lerp(-8, -50, u), 0];
  }
  if (kind === 'back') {
    const th = Math.PI * easeOut(k);
    return [40 * Math.cos(th), -22 * Math.sin(th) - 10 * k, -Math.sin(th)];   // passes BEHIND him (z < 0)
  }
  if (kind === 'up') {
    const th = (Math.PI / 2) * easeOut(k);
    return [36 * Math.cos(th), -110 * Math.sin(th), 0];
  }
  // down: lift, then slam
  if (k < 0.55) { const u = easeOut(k / 0.55); return [lerp(40, 26, u), lerp(0, -72, u), 0]; }
  const u = (k - 0.55) / 0.45; return [lerp(26, 56, u), lerp(-72, 0, u * u), 0];
}

function stepThrow(f, a, dt) {
  if (a.kind === 'broly') return stepBrolyThrow(f, a, dt);
  if (a.kind === 'elbowDrop') return stepElbowDrop(f, a, dt);
  if (a.kind === 'piledriver') return stepPiledriver(f, a, dt);
  if (a.kind === 'rko') return stepRKO(f, a, dt);
  f.vx = approach(f.vx, 0, FRICTION * dt);
  if (a.released) return;
  const v = a.victim;
  const k = clamp(a.t / a.rel, 0, 1);
  const [px, py, pz] = throwPath(a.kind, k);
  v.x = f.x + px * a.face0; v.y = f.y + py; v.vx = 0; v.vy = 0;
  v.drawZ = pz;
  if (a.kind === 'back' && k >= 0.5) f.face = -a.face0;      // turns with the swing
  v.face = Math.sign(f.x - v.x) || -a.face0;                  // victim keeps facing the thrower
  if (a.kind === 'giantSwing') {                              // spinning round: he turns with them, they fly out flat
    const th = giantSwingAngle(k);
    f.face = Math.cos(th) >= 0 ? a.face0 : -a.face0;
    a.vspin = -Math.sign(Math.cos(th) || 1) * a.face0 * Math.PI / 2;
    if (Math.floor(th / Math.PI) !== Math.floor(giantSwingAngle(clamp((a.t - dt) / a.rel, 0, 1)) / Math.PI)) sfx.whoosh(true);
    if (Math.random() < dt * 50) ghosts.push({ fig: figureOf(v), life: 0.14, max: 0.14, color: '#ffffff' });
  }
  if (a.t >= a.rel) {
    a.released = true;
    v.drawZ = 0;
    v.action = null;
    const own = CHARACTERS[f.char].throwStats || {};
    knock(v, own[a.kind] || THROWS[a.kind], a.face0, f.revenge > 0 ? powerOf(f) : 1, v.x, v.y - 50);   // (Revenge powers up throws too)      // angles are relative to the starting facing
    if (f.look && f.look.fireHits) { burst(v.x, v.y - 50, FIRE, 18, Math.PI / 2, 1.2, 450, { grav: -250 }); if (f.revenge > 0) consumeRevenge(f, v.x, v.y - 50); }
    if (v.action && v.action.type === 'hitstun' && !v.action.crit) v.action.dur += THROW_HITSTUN_BONUS;   // extra time to follow up
    if (a.kind === 'down') {
      shake = Math.max(shake, 14); dust(v.x, f.y, 18, 2.2); ring(v.x, f.y);
      sfx.slam();
      hitstop = Math.max(hitstop, 0.1);
    }
    if (a.kind === 'up') ring(v.x, v.y - 30);
    if (a.kind === 'back' || a.kind === 'forward') dust(f.x, f.y, 8, 1.4);
  }
}

function stepThrown(f, a, dt) {
  const h = a.holder;
  if (!h.action || h.action.type !== 'throw' || h.action.victim !== f || h.action.released) { f.action = null; f.drawZ = 0; }
}

// =====================================================================
//  FLY DASH (Lance): double-tap a direction to rocket toward the opponent.
//  Homes in if they're roughly that way. Contact = strong rush punch. Miss = he tumbles (punishable).
// =====================================================================
const FLY_DASH = { speed: 1500, dur: 0.288, recover: 0.5, cooldown: 0.4 };   // dur 0.32 -> 0.288 = 10% less distance
const RUSH_HIT = { dmg: 9, base: 430, growth: 6.5, angle: 38 };
function startFlyDash(f, dir) {
  const o = fighters.find(t => t !== f && t.respawnTimer <= 0);
  let vx = dir, vy = 0;
  if (o && Math.sign(o.x - f.x) === dir && Math.abs(o.x - f.x) < 750) {   // home in on them
    const dx = o.x - f.x, dy = (o.y - 45) - (f.y - 45);
    vy = clamp(dy / Math.abs(dx || 1), -0.7, 0.7);                          // up to ~35 degrees up/down
    const len = Math.hypot(1, vy); vx = dir / len; vy = vy / len;
  }
  f.face = dir;
  f.action = { type: 'flydash', t: 0, dur: FLY_DASH.dur, vx: vx * FLY_DASH.speed, vy: vy * FLY_DASH.speed, ghostT: 0 };
  if (!f.ground) f.flyUsed = true;
  f.flyCD = FLY_DASH.cooldown;
  f.ground = false; f.y -= 1;
  burst(f.x, f.y - 45, [kiColor(f), '#ffffff'], 14, dir > 0 ? Math.PI : 0, 0.5, 500, { grav: 0 });
  sfx.whoosh(true); sfx.vanish();
}
function stepFlyDash(f, a, dt) {
  f.vx = a.vx; f.vy = a.vy;
  a.ghostT -= dt;
  if (a.ghostT <= 0) { a.ghostT = 0.025; ghosts.push({ fig: figureOf(f), life: 0.2, max: 0.2, color: kiColor(f) }); }
  // Rush punch on contact
  const hx = f.x + f.face * 30, hy = f.y - 50;
  for (const t of fighters) {
    if (t === f || t.respawnTimer > 0) continue;
    if (!circleHitsFighter(hx, hy, 34, t)) continue;
    if (applyHit(t, RUSH_HIT, f.face, powerOf(f), hx, hy, { fighter: f })) {
      if (f.action === a) {                              // (unless he got perfect-blocked)
        f.action = { type: 'land', t: 0, dur: 0.16 };
        f.vx = -f.face * 150; f.vy = -200;
      }
      return;
    }
  }
  if (a.t >= a.dur) {                                    // MISSED: tumbles out of it, wide open
    f.action = { type: 'flyRecover', t: 0, dur: FLY_DASH.recover };
    f.vx = a.vx * 0.35; f.vy = a.vy * 0.2;
  }
}

// =====================================================================
//  PERFECT BLOCK + COUNTER
//  Block within PARRY_WINDOW seconds of a hit landing: no shield damage, the attacker staggers,
//  and you instantly fire your counter attack. Projectiles get reflected back instead.
// =====================================================================
function perfectBlock(def, src, hx, hy) {
  def.parryFlash = 0.6;
  if (!playPerfectShield()) sfx.parry();      // your Smash perfect shield sound (synth fallback if it isn't loaded)
  def.shieldHP = SHIELD_MAX;
  hitstop = Math.max(hitstop, 0.22);
  shake = Math.max(shake, 10);
  burst(hx, hy, ['#ffd23f', '#fff3a8', '#ffffff'], 34, 0, Math.PI, 700, { grav: 200 });
  for (let i = 0; i < 6; i++) bolt(hx, hy, i / 6 * Math.PI * 2 + Math.random() * 0.4, 60 + Math.random() * 50, 0.18, '#ffd23f');
  particles.push({ x: hx, y: hy, vx: 0, vy: 0, life: 0.2, max: 0.2, r: 30, type: 'impact' });
  ring(def.x, def.y - 40);

  if (src.shot) {                                  // reflect the projectile back, faster and stronger
    if (def.look && def.look.auraShield) kiaiBlast(def);   // Lance roars and his aura blows it back
    const s = src.shot;
    s.owner = def; s.color = def.energy;
    s.vx = -s.vx * 1.3; s.vy = -s.vy * 0.5;
    s.mult *= 1.3; s.life = 1.2; s.hit = new Set();
    s.reflected = true;
    return;
  }
  const atk = src.fighter;
  if (!atk) return;
  // Attacker staggers back, wide open
  const away = Math.sign(atk.x - def.x) || atk.face * -1;
  atk.action = { type: 'parried', t: 0, dur: PARRY_STUN };
  atk.vx = away * 260;
  atk.comboTimer = 0;
  // Defender counters immediately
  const m = def.moveset.counter;
  if (m) {
    def.shielding = false;
    def.face = away;
    def.action = { type: 'attack', key: 'counter', move: m, btn: 'atk', phase: 'startup', t: 0,
                   charge: 0, mult: 1, hit: new Set(), air: !def.ground, started: time, noClash: true };
  }
}

// =====================================================================
//  CLASH
//  Both fighters swing with the same button at almost the same moment: they lock up, trade
//  blows face to face, then both spring backward and land at neutral together.
// =====================================================================
let clashText = null;
function startClash(a, b, keyA, keyB) {
  // A SHADOW CLONE never gets a clash: whoever clashed with it just blows it away with one mighty hit,
  // and it bursts into smoke. (Two clones clashing: both go.)
  if (a.minion || b.minion) {
    if (a.minion && b.minion) { smashClone(b, a); smashClone(a, b); }
    else if (a.minion) smashClone(b, a); else smashClone(a, b);
    return;
  }
  const mid = (a.x + b.x) / 2;
  const side = Math.sign(a.x - b.x) || -1;           // which side of the middle `a` is on
  for (const [f, other, key, s] of [[a, b, keyA, side], [b, a, keyB, -side]]) {
    f.face = -s;                                      // face each other
    f.action = { type: 'clash', t: 0, dur: CLASH_TIME, key, other, anchorX: mid + s * 34, anchorY: f.y,
                 homeX: mid + s * 34, homeY: f.y, side: s,              // (where they come back to at the end)
                 leader: f === a, beat: -1, parity: f === a ? 0 : 1 };
    f.vx = 0; f.vy = 0;
    f.comboTimer = 0; f.atkBuf = f.spcBuf = f.jumpBuf = f.dodgeBuf = 0;
  }
  clashText = { x: mid, y: Math.min(a.y, b.y) - 120, t: CLASH_TIME };
  sfx.clash(true); sfx.vanish(1.3);                     // DBZ zip as they lock up
  hitstop = Math.max(hitstop, 0.2);
  shake = Math.max(shake, 14);
  // Big impact frame as they lock up
  impactFrame = 0.14;
  impactAt = { x: mid, y: Math.min(a.y, b.y) - 55, ang: 0, all: true, focus: true };
  burst(mid, Math.min(a.y, b.y) - 50, ['#ffffff', '#ffd23f'], 30, 0, Math.PI, 800, { grav: 100 });
}

// Both fighters vanish (after-images + a streak) and reappear together at a new spot: somewhere else on the
// stage, on the floor or up in the air, swapping sides now and then. home = back to where it started.
function clashTeleport(f, a, home) {
  const o = a.other, oa = o.action;
  if (!oa || oa.type !== 'clash') return;
  const from = { x: (f.x + o.x) / 2, y: Math.min(f.y, o.y) - 50 };
  for (const g of [f, o]) ghosts.push({ fig: figureOf(g), life: 0.22, max: 0.22, color: '#ffffff' });
  let cx, cy, flip = false;
  if (home) { cx = null; }
  else {
    // The map split into zones: left / middle / right x four heights (sky / high / low air / floor). Every jump
    // goes to a DIFFERENT column and makes a BIG height change (at least two levels: floor -> high, sky -> low...),
    // so they're always flying up and down across the screen, faster than you can follow.
    const last = a.zone || oa.zone || [1, 3];             // the clash starts roughly middle, floor
    const opts = [];                                      // (bigger height changes are much more likely)
    for (let col = 0; col < 3; col++) for (let row = 0; row < 4; row++) {
      const d = Math.abs(row - last[1]);
      if (col !== last[0] && d >= 1) for (let k = 0; k < d * d; k++) opts.push([col, row]);
    }
    const z = opts[Math.floor(Math.random() * opts.length)];
    a.zone = oa.zone = z;
    const colX = [0.15, 0.5, 0.85][z[0]], rowY = [-440, -310, -170, 0][z[1]];
    cx = STAGE.x + STAGE.w * colX + (Math.random() - 0.5) * 90;
    cy = STAGE.y + rowY + (z[1] < 3 ? (Math.random() - 0.5) * 40 : 0);
    flip = Math.random() < 0.4;                          // sometimes they come out on the other sides
  }
  for (const [g, ga] of [[f, a], [o, oa]]) {
    if (home) { ga.anchorX = ga.homeX; ga.anchorY = ga.homeY; ga.cur = ga.side; }
    else {
      ga.cur = (ga.cur !== undefined ? ga.cur : ga.side) * (flip ? -1 : 1);
      ga.anchorX = cx + ga.cur * 34; ga.anchorY = cy;
    }
    g.x = ga.anchorX; g.y = ga.anchorY; g.face = -ga.cur;
  }
  const to = { x: (f.x + o.x) / 2, y: Math.min(f.y, o.y) - 50 };
  // the streak they leave crossing the map + a pop at each end
  const n = 10;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    particles.push({ x: lerp(from.x, to.x, u), y: lerp(from.y, to.y, u), vx: 0, vy: 0, life: 0.12 + u * 0.06, max: 0.18,
                     size: 3, color: i % 2 ? '#ffffff' : '#ffd23f', type: 'bit', grav: 0 });
  }
  burst(from.x, from.y, ['#ffffff'], 8, 0, Math.PI, 300, { grav: 0 });
  if (home) particles.push({ x: to.x, y: to.y, vx: 0, vy: 0, life: 0.1, max: 0.1, r: 22, type: 'impact' });
  // arrival: a SHOCKWAVE where they slam back into view (and a smaller one where they left) + speed lines
  // pointing back along the path
  ring(to.x, to.y);
  auraWaves.push({ x: to.x, y: to.y, t: 0, dur: 0.3, max: 170, color: '#ffd23f' });
  auraWaves.push({ x: to.x, y: to.y, t: -0.04, dur: 0.3, max: 115, color: '#ffffff' });
  auraWaves.push({ x: from.x, y: from.y, t: 0, dur: 0.2, max: 80, color: '#ffffff' });
  if (to.y > STAGE.y - 120) dust(to.x, STAGE.y, 12, 1.8);     // landing on the floor kicks up a ring of dust
  shake = Math.max(shake, 12);
  const ang = Math.atan2(from.y - to.y, from.x - to.x);
  for (let i = 0; i < 7; i++) {
    const sp = (Math.random() - 0.5) * 0.5, d = 30 + Math.random() * 50;
    particles.push({ x: to.x + Math.cos(ang + sp) * d, y: to.y + Math.sin(ang + sp) * d,
                     vx: Math.cos(ang + sp) * 900, vy: Math.sin(ang + sp) * 900, life: 0.1, max: 0.1,
                     size: 2, color: '#ffffff', type: 'bit', grav: 0 });
  }
  sfx.vanish(1.4);                                       // the Z vanish zip, loud enough to cut through the clash hits
}
function stepClash(f, a, dt) {
  // Hold position face to face (in the air too)
  f.x = lerp(f.x, a.anchorX, 0.35);
  f.y = a.anchorY;
  f.vx = 0; f.vy = 0;
  // The leader runs the show: MINI CLASH at this spot (a burst of blows), then ZIP to the next spot (DBZ),
  // and the last stop lands them back exactly where the clash started
  const oa = a.other.action;
  if (a.leader && oa && oa.type === 'clash') {
    const stop = Math.floor(a.t / CLASH_STOP);
    if (stop !== a.stop && stop < CLASH_STOPS) {
      a.stop = stop; a.blowsDone = 0;
      if (stop > 0) clashTeleport(f, a, stop === CLASH_STOPS - 1);
    }
    const within = a.t - a.stop * CLASH_STOP;
    const blowIdx = within >= CLASH_FIRST ? Math.floor((within - CLASH_FIRST) / CLASH_BLOW) : -1;
    if (a.stop < CLASH_STOPS && blowIdx >= a.blowsDone && blowIdx < CLASH_BLOWS && !(a.stop === 0 && blowIdx === 0)) {
      a.blowsDone = blowIdx + 1;
      a.blowN = oa.blowN = (a.blowN || 0) + 1;                // flips who's swinging (poses alternate)
      const first = blowIdx === 0, n = a.blowN;
      // the blows meet in the middle: sparks + lightning + a little shake
      const mx = (f.x + a.other.x) / 2, my = f.y - 55 + (n % 2 ? -18 : 12);
      burst(mx, my, ['#ffffff', '#ffd23f', '#fff3a8'], first ? 14 : 8, 0, Math.PI, 600, { grav: 200 });
      bolt(mx, my, Math.random() * Math.PI * 2, 50 + Math.random() * 40, 0.1);
      bolt(mx, my, Math.random() * Math.PI * 2, 40 + Math.random() * 30, 0.1, '#ffffff');
      particles.push({ x: mx, y: my, vx: 0, vy: 0, life: 0.07, max: 0.07, r: first ? 18 : 12, type: 'impact' });
      shake = Math.max(shake, first ? 10 : 6);
      sfx.clash(false);
      // every exchanged blow chips BOTH fighters a little (a clash is worth something, ~4.5% each in total)
      for (const g of [f, a.other]) {
        g.damage += CLASH_CHIP; g.hitFlash = 0.05;
        if (!g.transformed) g.ult = Math.min(ULT_MAX, (g.ult || 0) + CLASH_CHIP);
      }
      // the first blow at each spot gets an impact frame + a tiny freeze; the rest are quick follow-ups
      if (first) {
        impactFrame = 0.05;
        impactAt = { x: mx, y: my, ang: n * 1.3, all: true, invert: a.stop % 2 === 1, focus: a.stop % 2 === 0 };
        hitstop = Math.max(hitstop, 0.04);
      } else hitstop = Math.max(hitstop, 0.015);
    }
  }
  if (a.t >= a.dur) {
    // Spring back: both reset to neutral at the same time (from where the clash started)
    if (a.anchorX !== a.homeX || a.anchorY !== a.homeY) { a.anchorX = a.homeX; a.anchorY = a.homeY; f.x = a.homeX; f.y = a.homeY; }
    const away = Math.sign(f.x - a.other.x) || -f.face;
    f.action = null;
    f.vx = away * 680; f.vy = -720;
    f.ground = false; f.y -= 2;
    f.invuln = 0.25;
    f.airJumps = AIR_JUMPS; f.airDodges = AIR_DODGES; f.upSpecialUsed = false; f.flyUsed = false;
    dust(f.x, f.y, 10, 1.5);
    if (a.leader) {
      const mx = (f.x + a.other.x) / 2;
      ring(mx, f.y - 40); shake = Math.max(shake, 16);
      sfx.clash(true);
      // Final big impact frame as they break apart
      impactFrame = 0.12;
      impactAt = { x: mx, y: f.y - 55, ang: 0, all: true, focus: true, invert: true };
      hitstop = Math.max(hitstop, 0.12);
      burst(mx, f.y - 55, ['#ffffff', '#ffd23f', '#fff3a8'], 40, 0, Math.PI, 900, { grav: 150 });
    }
  }
}

// =====================================================================
//  ULTIMATE
//  Meter: +damage you take, +1% every 2 seconds, kept when you die. At 100%, press I.
//  Activation lunge -> if it connects: teleporting FLURRY -> FINAL slash -> (Colby) CUTSCENE -> launch.
// =====================================================================
const ULT_MAX = 100, ULT_PASSIVE = 0.5;   // passive: 0.5 per second = 1% every 2 seconds
const ULT_GAIN = 1;                         // meter gained per 1% of damage taken (lower = ultimates come less often)
const FLURRY_TIME = 2.3, FINAL_TIME = 0.8, CUT_TIME = 3.4;
let ult = null;          // the running ultimate sequence (the rest of the game pauses while it plays)
let ultBanner = null;    // big "ULTIMATE" banner when one is activated

function startUltimate(f) {
  if (f.noScythe) returnScythe(f);                 // the scythe flies back to his hand for the ultimate
  // Power depends on how much meter is left: right after transforming = 100%, nearly drained = 50%
  f.ultPower = 0.5 + 0.5 * clamp((f.ult || 0) / ULT_MAX, 0, 1);
  f.ult = 0; f.ultBuf = 0; f.atkBuf = f.spcBuf = f.grabBuf = 0;
  f.shielding = false;
  const def = CHARACTERS[f.char].ult || {};
  f.action = def.beamUlt ? { type: 'ultBeam', t: 0, phase: 'charge' }      // Lance: charge + full-screen Kamehameha
                         : { type: 'ultStart', t: 0, dur: 0.8 };
  ultBanner = { t: 1.1, name: (CHARACTERS[f.char].ult || {}).name || 'ULTIMATE', color: f.color, who: f };
  hitstop = Math.max(hitstop, 0.4);                // dramatic freeze as it starts
  impactFrame = 0.12; impactAt = { x: f.x, y: f.y - 50, ang: 0, all: true, focus: true, invert: true };
  shake = Math.max(shake, 10);
  sfx.parry(); sfx.clash(true);
  if (def.statue) playBuffer(neteroVoiceBuf, 1.0);   // Colbalias: "99 hands" as he activates it
}

function stepUltStart(f, a, dt) {
  // COLBALIAS: no lunge - he clasps his hands and the statue rises; it locks onto the nearest enemy on screen
  // (Z-vanishing at exactly the right moment dodges it)
  if (CHARACTERS[f.char].ult.statue) {
    f.vx = approach(f.vx, 0, FRICTION * dt); if (!f.ground) f.vy = Math.min(f.vy, 0);
    if (a.t >= 0.25 && !a.summoned) {
      a.summoned = true;
      const v = nearestFoe(f);
      if (v && !isIntangible(v) && v.halo <= 0 && Math.abs(v.x - f.x) < 1100) { f.face = Math.sign(v.x - f.x) || f.face; startUltSequence(f, v); }
    }
    return;
  }
  // brief pose, then a fast lunge; anyone it touches gets pulled into the ultimate
  if (a.t >= 0.12 && !a.lunged) { a.lunged = true; f.vx = f.face * 1500; sfx.whoosh(true); }
  f.vx = approach(f.vx, 0, FRICTION * 0.55 * dt);
  if (!a.lunged || a.t > 0.42) return;
  if (Math.abs(f.vx) > 400 && Math.random() < 0.5) ghosts.push({ fig: figureOf(f), life: 0.2, max: 0.2, color: f.energy });
  const hx = f.x + f.face * 40, hy = f.y - 50;
  for (const t of fighters) {
    if (t === f || allies(f, t) || t.respawnTimer > 0 || t.halo > 0 || isIntangible(t)) continue;
    if (circleHitsFighter(hx, hy, 46, t)) { startUltSequence(f, t); return; }
  }
}

function startUltSequence(u, v) {
  const U = CHARACTERS[u.char].ult;
  ult = { def: U, user: u, target: v, phase: 'flurry', t: 0, strikeT: 0, n: 0, dir: u.face, power: u.ultPower || 1,
          baseX: v.x, baseY: v.y, userPose: U.finalWind, jolt: 0, slashed: false, events: new Set() };
  u.action = { type: 'ultSeq' };
  v.action = { type: 'ultVictim' };
  v.shielding = false; v.vx = v.vy = 0; u.vx = u.vy = 0;
  hitstop = Math.max(hitstop, 0.12);
  sfx.hit(0.9);
}

// One lightning-fast strike in the flurry: teleport to a new angle, hit, leave an after-image behind
function ultStrike(U) {
  const u = U.user, v = U.target, n = U.n++;
  const spots = [[-75, 0], [75, 0], [-65, -55], [70, -45], [-15, -125], [85, -10], [-85, -25], [55, -85], [0, -120], [-70, -60]];
  const [dx, dy] = spots[n % spots.length];
  ghosts.push({ fig: figureOf(u), life: 0.28, max: 0.28, color: '#ffffff' });       // after-image where he was
  u.x = v.x + dx; u.y = v.y + dy;
  u.face = Math.sign(v.x - u.x) || -U.dir;
  const kick = n % 3 === 1 || n % 7 === 5;                                           // mix scythe slashes with high kicks
  const set = kick ? U.def.kicks : U.def.slashes;
  U.userPose = set[n % set.length];
  // The hit
  const hx = v.x + (Math.random() - 0.5) * 16, hy = v.y - 40 - Math.random() * 40;
  if (kick) {
    particles.push({ x: hx, y: hy, vx: 0, vy: 0, life: 0.1, max: 0.1, r: 18, type: 'impact' });
    burst(hx, hy, SWEAT, 6, Math.atan2(-(hy - u.y + 50), hx - u.x), 0.6, 450);
  } else {
    slashLine(hx, hy, Math.random() * Math.PI, 150 + Math.random() * 80, 0.16);
    if (gore) burst(hx, hy, BLOOD, 10, Math.random() * Math.PI * 2, 1.2, 420, { stain: true });
  }
  burst(hx, hy, ['#ffffff', '#ffd23f'], 6, 0, Math.PI, 600, { grav: 0 });
  // LEGION OF HELL (Colbalias): two of his shadow clones strike from other angles at the same moment
  if (U.def.clones) {
    for (let c = 1; c <= 2; c++) {
      const [cx, cy] = spots[(n + c * 3) % spots.length];
      const g = figureOf(u);
      g.x = v.x + cx; g.y = v.y + cy; g.face = Math.sign(v.x - g.x) || 1;
      const cs = (c + n) % 2 ? U.def.kicks : U.def.slashes;
      g.pose = { ...cs[(n + c) % cs.length] };
      ghosts.push({ fig: g, life: 0.3, max: 0.3, color: '#160404' });
    }
    burst(hx, hy, HELLFIRE, 8, 0, Math.PI, 500, { grav: -200 });
  }
  v.damage += U.def.perHit * U.power;
  if (!v.transformed) v.ult = Math.min(ULT_MAX, (v.ult || 0) + U.def.perHit);
  v.hitFlash = 0.06; U.jolt = 0.08;
  shake = Math.max(shake, 7);
  hitstop = Math.max(hitstop, 0.025);
  sfx.hit(kick ? 0.4 : 0.6);
}

// A long glowing slash streak (particle)
function slashLine(x, y, ang, len, life) {
  particles.push({ x, y, vx: 0, vy: 0, ang, len, life, max: life, type: 'slash' });
}

function updateUlt(dt) {
  const U = ult, u = U.user, v = U.target;
  U.t += dt;
  if (U.def.wrestle) return updateWrestleUlt(U, dt);         // Aiden: Max Malicious Moonsault
  if (U.def.statue) return updateStatueUlt(U, dt);           // Colbalias: 100-Type Guanyin Bodhisattva
  U.jolt = Math.max(0, U.jolt - dt);
  v.vx = v.vy = 0; v.x = U.baseX; v.y = U.baseY;
  u.vx = u.vy = 0;
  u.anim += dt; v.anim += dt;
  u.hitFlash = Math.max(0, u.hitFlash - dt); v.hitFlash = Math.max(0, v.hitFlash - dt);
  const once = k => !U.events.has(k) && U.events.add(k);
  syncKame(u); syncKame(v);
  const windTime = U.def.windTime || 0.3;                     // how long the final wind-up / charge lasts

  if (U.phase === 'flurry') {
    U.strikeT -= dt;
    if (U.strikeT <= 0 && U.t < FLURRY_TIME) {
      U.strikeT = lerp(0.16, 0.065, U.t / FLURRY_TIME);       // speeds up as it goes
      ultStrike(U);
    }
    if (U.t >= FLURRY_TIME) {                                 // set up the final slash
      U.phase = 'final'; U.t = 0;
      ghosts.push({ fig: figureOf(u), life: 0.3, max: 0.3, color: '#ffffff' });
      u.x = v.x - U.dir * (U.def.finalBeam ? 150 : 100); u.y = v.y; u.face = U.dir;   // beam: charge up from range
      U.userPose = U.def.finalWind;
    }
  } else if (U.phase === 'final') {
    if (!U.slashed && Math.random() < dt * 40) {              // energy gathering before the last cut
      const ang = Math.random() * Math.PI * 2;
      particles.push({ x: u.x + Math.cos(ang) * 70, y: u.y - 50 + Math.sin(ang) * 70, vx: -Math.cos(ang) * 350, vy: -Math.sin(ang) * 350,
                       life: 0.2, max: 0.2, size: 1, color: kiColor(u), type: 'bit', grav: 0 });
      if (Math.random() < 0.3) bolt(u.x, u.y - 50, Math.random() * Math.PI * 2, 50, 0.08, kiColor(u));
      if (U.def.windTime) shake = Math.max(shake, 2 + 4 * (U.t / windTime));   // long charge: the screen trembles more and more
    }
    if (!U.slashed && U.t >= windTime) {
      U.slashed = true;
      const x0 = u.x;
      u.x = U.def.finalBeam ? v.x - U.dir * 150               // beam finisher: fire from range
          : v.x + U.dir * (U.def.cutscene ? 115 : 30);         // flash THROUGH them (Colby) / pop up into them (others)
      for (let k = 0; k < 8; k++) {                            // after-images along the dash
        const g = figureOf(u); g.x = lerp(x0, u.x, k / 8);
        ghosts.push({ fig: g, life: 0.35, max: 0.35, color: '#ffffff' });
      }
      U.userPose = U.def.finalStrike;
      if (U.def.cutscene) slashLine(v.x, v.y - 58, -0.06, 520, 0.5);   // the big cut, right through the waist
      else if (U.def.finalBeam) {                                        // point-blank full-power Kamehameha
        particles.push({ type: 'beamfx', x: u.x + U.dir * 30, y: u.y - 62, dir: U.dir, len: 900, w: 70,
                         life: 0.7, max: 0.7, vx: 0, vy: 0, color: kiColor(u) });
        sfx.beam(1);
      }
      else if (U.def.hellPillar) {                                      // a PILLAR OF HELLFIRE erupts through them
        for (let k = 0; k < 8; k++) hellBurst(v.x + (Math.random() - 0.5) * 30, v.y - k * 40, 18, 500 + k * 60);
        for (let k = 0; k < 6; k++) bolt(v.x, v.y - 40 - k * 50, Math.PI / 2 + (Math.random() - 0.5), 70, 0.2, k % 2 ? '#ff1a1a' : '#ffffff');
        slashLine(v.x, v.y - 60, Math.PI / 2, 420, 0.45);
        ring(v.x, v.y); ring(v.x, v.y - 60);
        painTexts.push({ x: v.x, y: v.y - 170, t: 0.9, max: 0.9, text: 'LEGION OF HELL!', big: true });
      }
      else slashLine(v.x, v.y - 60, Math.PI / 2, 260, 0.35);
      impactFrame = 0.2; impactAt = { x: v.x, y: v.y - 58, ang: 0, all: true, focus: true, invert: true };
      hitstop = Math.max(hitstop, 0.3);
      shake = 20;
      if (gore) burst(v.x, v.y - 58, BLOOD, 40, 0, Math.PI, 700, { stain: true });
      sfx.clash(true); sfx.hit(1);
    }
    if (U.t >= windTime + 0.5) {
      if (U.def.cutscene) {                                   // into the cutscene
        U.phase = 'cutscene'; U.t = 0;
        U.walkX0 = u.x; u.face = U.dir;
        particles.length = 0; ghosts.length = 0;
      } else endUlt(U);
    }
  } else if (U.phase === 'cutscene') {
    // Colby walks away slowly
    u.x = U.walkX0 + U.dir * 34 * Math.min(U.t, 2.6);
    if (U.t < 2.6 && Math.floor(U.t * 3.5) !== Math.floor((U.t - dt) * 3.5)) sfx.step();
    const cutY = v.y - 58;
    if (U.t >= 0.5 && once('shing')) sfx.shing();
    if (U.t >= 0.9 && once('split')) { sfx.slam(); sfx.hit(0.7); }
    // Blood pouring from the cut while the halves come apart
    if (gore && U.t > 0.9 && U.t < 2.4 && Math.random() < dt * 60) {
      burst(v.x + (Math.random() - 0.5) * 16, cutY + 6, BLOOD, 2, Math.PI / 2 + (Math.random() - 0.5) * 0.8, 0.3, 380, { stain: true });
    }
    if (U.t >= CUT_TIME) endUlt(U);
  }
}

function endUlt(U) {
  const u = U.user, v = U.target;
  v.action = null;
  v.x = U.baseX; v.y = U.baseY;
  u.action = { type: 'land', t: 0, dur: 0.3 };
  ult = null;
  knock(v, { ...U.def.final, ultFinal: true }, U.dir, U.power, v.x, v.y - 55);  // ~30% total with decent knockback - not an instant KO
}

// ---------------- LANCE'S ULTIMATE: FINAL KAMEHAMEHA ----------------
// No grab, no combo: he stops wherever he is (ground or air), charges for a moment (can't be
// interrupted), then fires a giant beam straight ahead in the direction he's facing, across the whole stage.
function stepUltBeam(f, a, dt) {
  const U = CHARACTERS[f.char].ult;
  f.vx *= Math.exp(-dt * 10); f.vy = 0;                      // hovers in place
  if (a.phase === 'charge') {
    if (Math.random() < dt * 45) {                           // ki rushing into his hand
      const ang = Math.random() * Math.PI * 2, d = 80;
      particles.push({ x: f.x + f.face * 30 + Math.cos(ang) * d, y: f.y - 62 + Math.sin(ang) * d,
                       vx: -Math.cos(ang) * d * 5, vy: -Math.sin(ang) * d * 5, life: 0.2, max: 0.2, size: 1,
                       color: Math.random() < 0.4 ? '#ffffff' : kiColor(f), type: 'bit', grav: 0 });
    }
    if (Math.random() < dt * 12) bolt(f.x, f.y - 50, Math.random() * Math.PI * 2, 60, 0.08, kiColor(f));
    shake = Math.max(shake, 2 + 5 * (a.t / U.windTime));    // the screen trembles more and more
    if (a.t >= U.windTime) { a.phase = 'fire'; a.t = 0; spawnUltBeam(f); }
  } else if (a.phase === 'fire' && a.t >= U.beamTime) {
    f.action = { type: 'land', t: 0, dur: 0.3 };
  }
}
function spawnUltBeam(f) {
  const U = CHARACTERS[f.char].ult;
  projectiles.push({
    owner: f, kind: 'beam', ult: true, x: f.x + f.face * 30, y: f.y - 62, dir: f.face, len: 0, grow: 7000,
    maxLen: 2600, w: 84, life: U.beamTime, max: U.beamTime, tickT: 0, mult: f.ultPower || 1, color: kiColor(f),
    hit: new Set(), trail: [],
    tick:  { dmg: 2.0, base: 110, growth: 0, angle: 15, noStop: true },
    final: { dmg: 12, base: 520, growth: 6, angle: 35, ultFinal: true, lanceKO: true },   // ~28% total; KOs (see updateBeam)
  });
  impactFrame = 0.15; impactAt = { x: f.x + f.face * 40, y: f.y - 62, ang: 0, all: true, focus: true, invert: true };
  hitstop = Math.max(hitstop, 0.15);
  shake = 22;
  sfx.beam(1); sfx.clash(true);
}

// ---------------- TRANSFORM ----------------
// Full meter + I = transform (anywhere: ground or air). While transformed you hit 20% harder, move and
// attack 10% faster, glow with an aura, and the meter slowly drains. Press I again while transformed =
// your ultimate, using up whatever meter is left (right away = full-power finisher, late = weaker).
// Meter runs out = you power back down.
const TRANSFORM = { power: 1.2, speed: 1.1, drain: ULT_MAX / 14 };   // drain: full meter lasts ~14 seconds
function powerOf(f) {
  if (!f) return 1;
  if (f.minion) return ninjaLaw(f.owner).power * (f.owner && f.owner.transformed ? CLONE_RAGE.power : 1);   // clones: Inverse Ninja Law (+ rage)
  return (f.transformed ? TRANSFORM.power : 1) * (f.kaioken ? KAIOKEN.dealt : 1) *   // both stack
         (f.revenge > 0 ? 1 + f.revenge : 1);                                         // Aiden's stored REVENGE power
}
function auraColor(f) { return (f.look && f.look.transformAura) || f.energy; }
function startTransform(f) {
  f.transformed = true; f.ultBuf = 0;
  f.baseStats = f.stats;
  f.stats = { ...f.stats, runSpeed: f.stats.runSpeed * TRANSFORM.speed, airSpeed: f.stats.airSpeed * TRANSFORM.speed };
  ultBanner = { t: 1.0, title: 'TRANSFORM', name: (CHARACTERS[f.char].transformName || 'POWER UP'), color: f.color, who: f };
  hitstop = Math.max(hitstop, 0.25);
  impactFrame = 0.08; impactAt = { x: f.x, y: f.y - 50, ang: 0, all: true, focus: true };
  shake = Math.max(shake, 12);
  ring(f.x, f.y - 45);
  burst(f.x, f.y - 45, [auraColor(f), '#ffffff'], 46, 0, Math.PI, 800, { grav: 0 });
  for (let k = 0; k < 4; k++) bolt(f.x, f.y - 50, Math.random() * Math.PI * 2, 70, 0.12, auraColor(f));
  sfx.parry(); sfx.beam(0.6);
}
function endTransform(f) {
  if (!f.transformed) return;
  f.transformed = false;
  if (f.baseStats) f.stats = f.baseStats;
  f.baseStats = null;
}

function breakShield(f) {
  f.shielding = false;
  f.shieldHP = 0;
  f.vy = -1100;
  f.ground = false;
  f.y -= 2;
  f.action = { type: 'dizzy', t: 0, dur: SHIELD_BREAK_STUN };
  burst(f.x, f.y - 40, ['#a8ecff', '#ffffff', '#b4b4bb'], 40, Math.PI / 2, Math.PI, 600, { grav: 900 });
  shake = 12;
}

// ---------------- Projectiles ----------------
function spawnShot(f, s, mult) {
  projectiles.push({
    owner: f, x: f.x + s.x * f.face, y: f.y + s.y, vx: s.vx * f.face, vy: s.vy,
    r: s.r, dmg: s.dmg, base: s.base, growth: s.growth, angle: s.angle, mult: mult * powerOf(f),
    life: s.life, kind: s.kind || 'orb', color: kiColor(f), hit: new Set(), pierce: !!s.pierce, trail: [],
    grav: s.grav || 0,                       // some shots (like Bomb Drop) fall
    noStop: !!s.noStop,                      // tiny rapid-fire hits don't freeze the game
  });
}
// A character's energy color (Lance's ki is light blue no matter which player slot he's in)
function kiColor(f) { return (f.look && f.look.ki) || f.energy; }

// KAMEHAMEHA BEAM: anchored to the shooter's hand, stretches out fast, hits every 0.1s, last hit launches
function spawnBeam(f, mult, c, over = 0) {
  const big = 1 + over;                      // overcharged: up to twice as long and twice as thick
  if (over > 0) {
    impactFrame = Math.max(impactFrame, 0.06 + 0.08 * over);
    impactAt = { x: f.x + f.face * 40, y: f.y - 62, ang: 0, all: true, focus: true };
    shake = Math.max(shake, 14 + 10 * over); sfx.clash(true);
  }
  projectiles.push({
    owner: f, kind: 'beam', x: f.x + f.face * 30, y: f.y - 62, dir: f.face, len: 0, grow: 3400 * big,
    maxLen: (640 + 160 * c) * big, w: (18 + 28 * c) * big, life: 0.5, max: 0.5,
    tickT: 0, mult: mult * powerOf(f), color: over >= 1 ? '#ffffff' : kiColor(f), over, hit: new Set(), trail: [],
    tick:  { dmg: 1.9, base: 85, growth: 0, angle: 20, noStop: true },
    final: { dmg: 5, base: 350, growth: 5, angle: 33 },
  });
  shake = Math.max(shake, 6 + 8 * c);
  sfx.beam(0.5 + 0.5 * c);
}
function updateBeam(s, dt) {
  const o = s.owner;
  if (!o || o.respawnTimer > 0 || !o.action || (o.action.type !== 'attack' && o.action.type !== 'ultBeam')) return true;   // stops if he gets hit
  s.x = o.x + s.dir * 30; s.y = o.y - 62;
  s.len = Math.min(s.maxLen, s.len + (s.grow || 3400) * dt);
  s.life -= dt; s.tickT -= dt;
  if (Math.random() < dt * 30) burst(s.x + s.dir * s.len, s.y, [s.color, '#ffffff'], 2, s.dir > 0 ? 0 : Math.PI, 0.8, 300, { grav: 0 });
  if (s.tickT <= 0) {
    s.tickT = 0.1;
    const last = s.life <= 0.1;
    const x0 = Math.min(s.x, s.x + s.dir * s.len), x1 = Math.max(s.x, s.x + s.dir * s.len);
    for (const t of fighters) {
      if (t === o || allies(o, t) || t.respawnTimer > 0) continue;
      if (t.x + t.w / 2 < x0 || t.x - t.w / 2 > x1) continue;
      if (t.y < s.y - s.w / 2 || t.y - hurtH(t) > s.y + s.w / 2) continue;   // (crouching can duck a thin beam)
      // LANCE'S ULT: a guaranteed KO if they had any damage when it caught them (or always, in Kaioken)
      if (s.final.lanceKO && !(s.startDmg || (s.startDmg = new Map())).has(t)) s.startDmg.set(t, t.damage);
      let h = last ? s.final : s.tick;
      if (last && s.final.lanceKO && (s.startDmg.get(t) > 0 || o.kaioken)) h = { ...s.final, koAt: 0.001 };
      if (applyHit(t, h, s.dir, s.mult, t.x - s.dir * 10, s.y)) markKi(o, t);   // Lance's ki marks them
    }
  }
  return s.life <= 0;
}

const cannon = { on: false, timer: 1.2, side: 1, y: 400 };
function updateCannons(dt) {
  const target = fighters[0];
  if (!cannon.on || target.respawnTimer > 0) return;
  cannon.timer -= dt;
  if (cannon.timer <= 0) {
    const vb = viewBounds();
    const sx = cannon.side < 0 ? vb.l - 10 : vb.r + 10, sy = cannon.y;
    const tx = target.x, ty = target.y - target.h / 2;
    const d = Math.hypot(tx - sx, ty - sy) || 1, speed = 760;
    projectiles.push({ owner: null, x: sx, y: sy, vx: (tx - sx) / d * speed, vy: (ty - sy) / d * speed,
      r: 13, dmg: 7, base: 300, growth: 5, angle: 35, mult: 1, life: 4, kind: 'orb', color: '#f0a818',
      hit: new Set(), pierce: false, trail: [] });
    cannon.timer = 0.75 + Math.random() * 0.7;
    cannon.side = Math.random() < 0.5 ? -1 : 1;
    cannon.y = 140 + Math.random() * 400;
  }
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const s = projectiles[i];
    if (s.kind === 'beam') { if (updateBeam(s, dt)) projectiles.splice(i, 1); continue; }
    if (s.kind === 'disc') { if (updateDisc(s, dt)) projectiles.splice(i, 1); continue; }   // Lance's Destructo Disc
    if (s.grav) s.vy += s.grav * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 6) s.trail.shift();
    let dead = s.life <= 0 || s.x < -150 || s.x > W + 150 || s.y < -150 || s.y > H + 150;
    // Hit the solid stage
    if (s.kind !== 'wave' && s.x > STAGE.x && s.x < STAGE.x + STAGE.w && s.y > STAGE.y && s.y < STAGE.y + STAGE.h) {
      burst(s.x, s.y, [s.color, '#ffffff'], 8, Math.PI / 2, 1, 300);
      dead = true;
    }
    if (!dead) {
      for (const t of fighters) {
        if (t === s.owner || allies(s.owner, t) || s.hit.has(t) || t.respawnTimer > 0) continue;
        if (circleHitsFighter(s.x, s.y, s.r, t)) {
          const dirSign = Math.sign(s.vx) || (s.owner ? s.owner.face : 1);
          if (applyHit(t, s, dirSign, s.mult, s.x, s.y, { shot: s })) {
            if (s.reflected) { s.reflected = false; break; }      // perfect-blocked: it's flying back now
            s.hit.add(t);
            if (!s.pierce) { dead = true; break; }
          }
        }
      }
    }
    if (dead) projectiles.splice(i, 1);
  }
  // Projectile clash: two shots from different fighters meet and cancel out
  for (let i = projectiles.length - 1; i >= 0; i--) {
    for (let j = i - 1; j >= 0; j--) {
      const a = projectiles[i], b = projectiles[j];
      if (!a || !b || a.owner === b.owner || !a.owner || !b.owner) continue;
      if (a.phase === 'hold' || b.phase === 'hold') continue;          // (a disc still forming in his hand)
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        burst(mx, my, [a.color, b.color, '#ffffff'], 20, 0, Math.PI, 500, { grav: 150 });
        bolt(mx, my, Math.random() * Math.PI * 2, 50, 0.12);
        particles.push({ x: mx, y: my, vx: 0, vy: 0, life: 0.1, max: 0.1, r: 18, type: 'impact' });
        shake = Math.max(shake, 4);
        projectiles.splice(i, 1); projectiles.splice(j, 1);
        break;
      }
    }
  }
}

// ---------------- Dodges ----------------
function fatigued(f, base, free = DODGE_FREE) {
  const level = Math.min(FATIGUE_MAX, Math.max(0, f.dodgeCount - free));
  const slow = 1 + FATIGUE_SLOWER * level;
  const d = { ...base, level };
  d.dur = base.dur * slow;
  d.iStart = base.iStart * slow;
  d.iEnd = d.iStart + (base.iEnd - base.iStart) * (1 - FATIGUE_LESS_SAFE * level);
  if (base.speed) d.speed = base.speed / slow * (1 - FATIGUE_SHORTER * level);
  if (base.decay) d.decay = base.decay / slow;
  if (base.floatTime) d.floatTime = base.floatTime * slow;
  return d;
}

function startDodge(f, dir, down, up) {
  f.dodgeBuf = 0; f.jumpBuf = 0; f.flip = 0; f.squat = 0;

  f.dodgeRecover = DODGE_RECOVER;

    f.action = { type: 'air', t: 0, ...fatigued(f, AIR_DODGE, AIR_DODGE_MAX), dx, dy, ghostT: 0 };
    if (dx || dy) { f.vx = dx * f.action.speed; f.vy = dy * f.action.speed; }

// ---------------- Attacks ----------------
// Bare-handed Colby's shared string: which hit comes next ('k' = kick button, 'p' = punch button)
function nextChainKey(f, kind) {
  const step = f.comboTimer > 0 && f.chainStep >= 1 && f.chainStep < CHAIN_LEN ? f.chainStep : 0;
  if (step === CHAIN_LEN - 1) return kind + 'Finish';            // 7th hit = the finisher for that button
  return kind + (step + 1);

function chooseMove(f, inp, btn) {

      if (inp.up) return 'upGround';
      if (inp.down) return 'downGround';
      if (inp.dir) { f.face = inp.dir; return 'sideGround'; }
      // Bare-handed Colby (Hwoarang style): punches and kicks share ONE chain - J continues it with the
      // next kick, K continues it with the next punch (e.g. punch, kick, punch)
      if (f.noScythe && CHARACTERS[f.char].bareMoves) return nextChainKey(f, 'k');   // bare-handed 7-hit string
      // Keep pressing J: if the last combo kick just finished, continue the chain instead of restarting
      if (f.comboTimer > 0 && f.comboKey && f.comboBtn === 'atk') return f.comboKey;
      return 'jab';
    }
    if (inp.up) return 'uair';
    if (inp.down) return 'dair';
    if (inp.dir && inp.dir === -f.face) return 'bair';
    if (inp.dir) return 'fair';
    return 'nair';
  }
  if (inp.up) return 'upRanged';                 // up + K is always the recovery move, ground or air
  // In the air, K has its own set of moves (if the character has them). You don't turn around in
  // the air, so holding away from where you face gives the BACK version.
  if (!f.ground) {
    const m = f.moveset;
    if (inp.down && m.dairR) return 'dairR';
    if (inp.dir && inp.dir === -f.face && m.bairR) return 'bairR';
    if (inp.dir && m.fairR) return 'fairR';
    if (!inp.dir && m.nairR) return 'nairR';
  }
  if (inp.down) return 'downRanged';
  if (inp.dir) { f.face = inp.dir; return 'sideRanged'; }

  if (f.noScythe && CHARACTERS[f.char].bareMoves) {
    return nextChainKey(f, 'p');
  }
  // Keep pressing K: continue a ranged/weapon combo if one just finished
  if (f.comboTimer > 0 && f.comboKey && f.comboBtn === 'spc') return f.comboKey;
  return 'neutralRanged';
}

function startAttack(f, inp, btn) {
  if (f.squat > 0) { f.squat = 0; f.ground = true; }    // attack out of the jump crouch = ground move
  // C-stick: use the flick's direction instead of the left stick's
  let fromC = false;
  if (f.cFlick && f.cFlick.btn === btn) {
    inp = { ...inp, dir: f.cFlick.dir, up: f.cFlick.up, down: f.cFlick.down };
    f.cFlick = null; fromC = true;
  }
  // Colby WITHOUT his scythe (he threw it): K near it = pick it up. Otherwise no scythe moves -
  // except up-K still gives him a recovery, and scythe J moves become bare-handed basics.
  // Its thrown scythe is still HOVERING: side K (or K) calls it back to his hand
  if (f.noScythe && btn === 'spc' && !inp.up && !inp.down && recallScythe(f)) { f.spcBuf = 0; return; }
  if (f.noScythe && btn === 'spc' && !inp.dir && !inp.up && !inp.down) {   // neutral K right next to it = pick it up
    const s = scythes.find(q => q.owner === f && q.state !== 'fly');
    if (s && Math.hypot(s.x - f.x, s.y - (f.y - 20)) < SCYTHE_THROW.pickup) { pickupScythe(f, s); return; }
  }

  // speed. (With a full D-E-M-O-N meter, down K is Hellwave instead, which is a normal move.)
  if (key === 'downRanged' && f.look && f.look.demonMeter && !f.minion && (f.demon || 0) < 100) {
    f.spcBuf = 0;

    return;
  }
  let move = f.moveset[key];
  if (f.noScythe) {                                   // no scythe: punches replace the scythe moves
    const bare = CHARACTERS[f.char].bareMoves;
    if (bare && bare[key]) move = bare[key];
    else if (moveUsesScythe(move)) move = STICKMAN_MOVES[key] || STICKMAN_MOVES.sideGround;
  }
  f.atkBuf = 0; f.spcBuf = 0; f.jumpBuf = 0; f.flip = 0; f.comboTimer = 0;
  f.action = { type: 'attack', key, move, btn, phase: 'startup', t: 0,
               charge: 0, mult: 1, hit: new Set(), air: !f.ground, started: time, cStick: fromC && f.ground,
               startupMul: fromC ? C_STICK.speed : 1 };              // C-stick moves come out faster
  if (btn === 'atk' && f.look && f.look.trackDash) startTrackDash(f, f.action);
}

// ---------------- THROWN SCYTHE (Colby's side K) ----------------
// Flies spinning across the stage, hits once (decent damage), then drops and sticks wherever it lands.
// Colby is bare-handed until he picks it up (K while standing near it). If it falls off the stage it
// comes back to him after a moment. KO, ultimate or a new match also give it back.
// After its flight it HOVERS, spinning in place for hoverTime (a spacing tool: it chips anyone who touches it).
// While it hovers, side K (or K) RECALLS it - it flies back to his hand like a boomerang, hitting on the way.
// If he lets it run out, it drops and sticks, and he fights bare-handed until he picks it up.

  hit: { dmg: 14, base: 430, growth: 6, angle: 40 },
  hoverTime: 1.4, hoverSpin: 30, hoverEvery: 0.4, hoverHit: { dmg: 3, base: 160, growth: 1.2, angle: 70 },
  recallSpeed: 1500, recallHit: { dmg: 6, base: 300, growth: 4, angle: 35 } };

  f.noScythe = false;

}

}

function updateScythes(dt) {

    const s = scythes[i];
    s.t += dt;
    if (s.owner.respawnTimer > 0 || !s.owner.noScythe) { scythes.splice(i, 1); continue; }
    if (s.state === 'fly') {
      s.x += s.vx * dt; s.y += s.vy * dt; s.ang += s.dir * SCYTHE_THROW.spin * dt;
      if (Math.random() < dt * 40) particles.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.08, max: 0.08, size: 1, color: '#cfd8e6', type: 'bit', grav: 0 });
      for (const t of fighters) {
        if (t === s.owner || t.respawnTimer > 0 || s.hit.has(t)) continue;
        if (!circleHitsFighter(s.x, s.y, SCYTHE_THROW.r, t)) continue;
        if (allies(s.owner, t)) continue;
        s.hit.add(t);
        if (applyHit(t, { ...SCYTHE_THROW.hit }, s.dir, powerOf(s.owner), s.x, s.y, {})) {

          startScytheHover(s);

        }

      s.ang += s.dir * SCYTHE_THROW.hoverSpin * dt;
      if (Math.random() < dt * 30) particles.push({ x: s.x + (Math.random() - 0.5) * 60, y: s.y + (Math.random() - 0.5) * 60, vx: 0, vy: 0,
                                                    life: 0.1, max: 0.1, size: 1, color: '#cfd8e6', type: 'bit', grav: 0 });
      for (const t of fighters) {
        if (t === s.owner || allies(s.owner, t) || t.respawnTimer > 0) continue;
        if ((s.chip.get(t) || 0) > 0 || !circleHitsFighter(s.x, s.y, SCYTHE_THROW.r + 8, t)) continue;
        s.chip.set(t, SCYTHE_THROW.hoverEvery);
        applyHit(t, { ...SCYTHE_THROW.hoverHit }, Math.sign(t.x - s.x) || s.dir, powerOf(s.owner), s.x, s.y, {});
      }
      for (const [t, c] of s.chip) s.chip.set(t, c - dt);
      s.hoverT -= dt;
      if (s.hoverT <= 0) { s.state = 'fall'; s.vx = 0; s.vy = -120; }              // ran out: drops to the floor
    } else if (s.state === 'recall') {
      // BOOMERANG: homes straight back to his hand, hitting anyone in the way (once each)
      const o = s.owner, tx = o.x + o.face * 18, ty = o.y - 64;
      const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy) || 1;
      const sp = SCYTHE_THROW.recallSpeed;
      s.x += dx / d * sp * dt; s.y += dy / d * sp * dt; s.ang -= s.dir * SCYTHE_THROW.spin * 1.2 * dt;
      if (Math.random() < dt * 40) particles.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.1, max: 0.1, size: 1, color: '#ffffff', type: 'bit', grav: 0 });
      for (const t of fighters) {
        if (t === o || allies(o, t) || t.respawnTimer > 0 || s.recallHit.has(t)) continue;
        if (!circleHitsFighter(s.x, s.y, SCYTHE_THROW.r, t)) continue;
        s.recallHit.add(t);
        applyHit(t, { ...SCYTHE_THROW.recallHit }, Math.sign(dx) || -s.dir, powerOf(o), s.x, s.y, {});
      }
      if (d < 40 || s.t > 2) {                                                     // caught it!
        returnScythe(o);
        burst(tx, ty, ['#ffffff', '#cfd8e6'], 12, 0, Math.PI, 300, { grav: 0 });
        sfx.shing ? sfx.shing() : sfx.block();
        continue;
      }
    } else if (s.state === 'fall') {
      const py = s.y;

      s.x += s.vx * dt; s.y += s.vy * dt; s.ang += s.dir * SCYTHE_THROW.spin * 0.5 * dt;

        if (py <= surf.y && s.y >= surf.y && s.x > surf.x && s.x < surf.x + surf.w) {
          s.y = surf.y; s.state = 'stuck'; s.vx = s.vy = 0;
          dust(s.x, s.y, 8, 1.2); sfx.block();

      if (s.y > STAGE.y + 450 || s.x < BLAST.left || s.x > BLAST.right) {
        // Fell off the stage: after a moment it drops back down from the sky ONTO the stage (near the
        // edge it went off) - he still has to go get it.
        s.lostT += dt;
        if (s.lostT > 1.2) {
          s.x = clamp(s.x, STAGE.x + 90, STAGE.x + STAGE.w - 90);
          s.y = STAGE.y - 520; s.vx = 0; s.vy = 0; s.lostT = 0; s.t = 0;
          hudToast = { text: 'SCYTHE DROPPED BACK ONTO THE STAGE', t: 1.8 };
        }
      }
    }
  }
}
function drawThrownScythes() {
  for (const s of scythes) {
    ctx.save();
    ctx.translate(snap(s.x), snap(s.y - (s.state === 'stuck' ? 6 : 0)));
    ctx.rotate(s.state === 'stuck' ? (s.dir > 0 ? -0.12 : Math.PI + 0.12) : s.ang);
    ctx.lineCap = 'round';
    // shaft
    ctx.strokeStyle = sketch ? '#222' : '#0e0c0c'; ctx.lineWidth = pixelMode ? 9 : 8;     // dark outline
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(38, 0); ctx.stroke();
    ctx.strokeStyle = sketch ? PAPER : '#8a6a4e'; ctx.lineWidth = pixelMode ? 5 : 4;      // wooden shaft
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(38, 0); ctx.stroke();
    // blade: a big curved crescent off the end
    ctx.fillStyle = sketch ? PAPER : '#d6dbe3';
    ctx.beginPath(); ctx.moveTo(36, -3); ctx.quadraticCurveTo(10, -38, -26, -30); ctx.quadraticCurveTo(6, -24, 38, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = sketch ? '#222' : '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    // hovering: a whirling white disc around the blade so you can see its reach - and it flickers just
    // before it drops (last chance to call it back)
    if (s.state === 'hover' && !sketch) {
      const warn = s.hoverT < 0.35 && Math.floor(time * 20) % 2;
      ctx.save(); ctx.globalAlpha = warn ? 0.1 : 0.22; ctx.fillStyle = '#e8eef7';
      ctx.beginPath(); ctx.arc(s.x, s.y, SCYTHE_THROW.r + 10, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = warn ? 0.3 : 0.7; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, SCYTHE_THROW.r + 10, s.ang, s.ang + Math.PI * 1.3); ctx.stroke();
      ctx.restore();

  }
}

// TRACKING DASH (Lance): a short burst toward the nearest opponent in front of him during the
// attack's startup, so his punches close small gaps. Only tracks someone fairly close and in front.
const TRACK = { range: 130, height: 110, keep: 34, max: 40 };   // max = longest glide (px)
function startTrackDash(f, a) {
  let best = null, bestD = Infinity;
  for (const t of fighters) {
    if (t === f || t.respawnTimer > 0) continue;
    const dx = t.x - f.x, dy = Math.abs((t.y - t.h / 2) - (f.y - f.h / 2));
    if (Math.abs(dx) > TRACK.range || dy > TRACK.height) continue;
    if (a.key !== 'bair' && Math.sign(dx) !== f.face && Math.abs(dx) > 10) continue;   // only forward (bair tracks backward)
    if (a.key === 'bair' && Math.sign(dx) !== -f.face) continue;
    if (Math.abs(dx) < bestD) { bestD = Math.abs(dx); best = t; }
  }
  if (!best) return;
  const dist = Math.min(TRACK.max, bestD - TRACK.keep);   // stop just short so the hit lands
  if (dist <= 2) return;
  const dur = Math.max(0.04, a.move.startup);
  a.track = { dir: Math.sign(best.x - f.x), v: dist / dur };
}

function beginActive(f, a) {
  a.phase = 'active';
  a.t = 0;
  if (a.track) { f.vx *= 0.1; a.track = null; }      // tracking dash ends when the hit comes out
  const m = a.move;
  if (m.lunge && f.ground) f.vx = f.face * m.lunge * Math.sqrt(a.mult);
  if (a.powered) {                                   // charged power jab: explodes forward
    f.vx = f.face * m.chargedHit.lunge;
    burst(f.x + f.face * 30, f.y - 66, ['#ff8a3c', '#ffd23f', '#ffffff'], 20, f.face > 0 ? 0 : Math.PI, 0.5, 700, { grav: 0 });
    shake = Math.max(shake, 8); sfx.whoosh(true);
  }
  if (m.hop && f.ground) { f.vy = -m.hop; f.ground = false; f.y -= 2; a.air = true; }
  if (m.lift && f.ground) { f.y -= m.lift; f.vy = 0; f.ground = false; a.air = true; }   // pops just off the floor
  if (m.airDash && !f.ground) { f.vx = f.face * m.airDash; f.vy = Math.min(f.vy, 0) * 0.3 - 60; }    // air dash kick: burst forward
  sfx.whoosh(!!(m.sweep || m.spinScythe || a.mult > 1.3));           // swing sound
  if (m.fire) m.fire(f, a.mult, a.cfrac ?? (a.mult - 1) / CHARGE_BONUS, a);
}

// ---------------- Actions in progress (attacks, dodges, hitstun...) ----------------
function stepAction(f, inp, dt) {
  const a = f.action;
  a.t += dt * (a.type !== 'attack' ? 1
              : f.minion ? (f.owner && f.owner.transformed ? CLONE_RAGE.attackSpeed : 1)   // raging clones attack 30% faster
              : f.transformed ? TRANSFORM.speed : 1);                                       // transformed: attacks play 10% faster

  if (a.type === 'clash') return stepClash(f, a, dt);
  if (a.type === 'timeStop') return stepTimeStop(f, a, dt);
  if (a.type === 'ultBeam') return stepUltBeam(f, a, dt);
  if (a.type === 'ultStart') stepUltStart(f, a, dt);
  if (a.type === 'flydash') return stepFlyDash(f, a, dt);
  if (a.type === 'flyRecover') { f.vx *= Math.exp(-dt * 3); }

  if (a.type === 'holding') return stepHolding(f, a, inp, dt);

    // Moves with their own custom logic (Alolan Whip, Cross Chop...) - return true = it handled this frame
    if (m.step && m.step(f, a, dt, inp)) return;

    // Combo chains: press the same button again during the move to flow into the next one
    if (m.combo && (a.phase === 'end' || (a.phase === 'active' && a.t > m.active * 0.5))) {
      const buf = a.btn === 'atk' ? f.atkBuf : f.spcBuf;

        f.action = { type: 'attack', key: m.combo, move: f.moveset[m.combo], btn: a.btn, phase: 'startup', t: 0,

    if (m.rapid && a.phase === 'active') {

    }

    // Scythe swings leave a trail of after-images (the swing "smear")
    if (a.phase === 'active' && (m.sweep || m.spinScythe)) {
      a.ghostT = (a.ghostT || 0) - dt;
      if (a.ghostT <= 0) { a.ghostT = 0.018; ghosts.push({ fig: figureOf(f), life: 0.16, max: 0.16, color: '#b4b4bb' }); }
    }

    if (m.timeStop && a.phase === 'active') stepTimeStopAura(f, a, m);   // Colby's time-stop aura growing out
    // Scythe throw wind-up: the blade rings out (the telegraph - you can hear and see it coming)
    if (m.throwScythe && a.phase === 'startup' && !a.rang && a.t > 0.12) { a.rang = true; sfx.shing(); }
    // Traveling moves (Shuriken Kick): fly forward at a set speed, holding altitude, while active
    if (m.travel && a.phase === 'active') {
      f.vx = f.face * (a.travel || m.travel);
      if (m.rushTrail) {                                   // anime rush: after-images + streaking speed lines behind him
        a.ghostT = (a.ghostT || 0) - dt;
        if (a.ghostT <= 0) { a.ghostT = 0.02; ghosts.push({ fig: figureOf(f), life: 0.22, max: 0.22, color: '#ff8a3c' }); }
        if (Math.random() < dt * 60) particles.push({ x: f.x - f.face * (30 + Math.random() * 40), y: f.y - 20 - Math.random() * 80,
          vx: -f.face * 1600, vy: 0, life: 0.12, max: 0.12, size: 2, color: Math.random() < 0.5 ? '#ffffff' : '#ffd23f', type: 'bit', grav: 0 });
        if (f.ground && Math.random() < dt * 40) dust(f.x - f.face * 10, f.y, 2, 1);
      }
      if (m.hover) f.vy = 0;
    }
    // Ground rush skids to a stop at the edge instead of flying off - during the rush AND the slide after it
    if (m.ledgeStop && (a.phase === 'active' || a.phase === 'end') && f.ground && !f.onPlatform) {
      const edge = f.face > 0 ? STAGE.x + STAGE.w - 14 : STAGE.x + 14;
      if ((f.face > 0 && f.x + f.vx * dt > edge) || (f.face < 0 && f.x + f.vx * dt < edge)) {
        f.x = edge; f.vx = 0; a.travel = 0.0001;
        if (!a.skid) { a.skid = true; burst(f.x, f.y, ['#ffd23f', '#ffffff'], 14, f.face > 0 ? Math.PI : 0, 0.6, 400); dust(f.x, f.y, 10, 1.6); }
      }
    }
    // Air Kamehameha: he floats in place while charging and firing, only sinking very slowly
    if (m.airHover && !f.ground && a.phase !== 'end') {
      f.vy = Math.min(f.vy, 30);
      f.vx *= Math.exp(-dt * 6);
    }

    // Tracking dash: glide toward the target during startup (with a faint after-image)
    if (a.track && a.phase === 'startup') {
      f.vx = a.track.dir * a.track.v;
      a.ghostT = (a.ghostT || 0) - dt;
      if (a.ghostT <= 0) { a.ghostT = 0.03; ghosts.push({ fig: figureOf(f), life: 0.12, max: 0.12, color: kiColor(f) }); }
    }

    // held = the button, or (for a ground C-stick move) the right stick still pushed
    const btnHeld = (a.btn === 'atk' ? inp.atkHeld : inp.spcHeld) || (a.cStick && inp.cHeld);
    // C-STICK COMBO CANCEL: once an attack has HIT someone, a C-stick flick cuts its recovery short
    // and goes straight into the next move (ground or air) - for quick combos
    if (a.phase === 'end' && a.hit.size > 0 && f.cFlick && a.t >= 0.03) {
      const btn = f.cFlick.btn;
      f.action = null; f.atkBuf = f.spcBuf = 0;
      startAttack(f, inp, btn);
      return;
    }
    if (a.phase === 'startup' && a.t >= m.startup * (a.startupMul || 1)) {
      a.t = 0;
      if (m.charge && btnHeld) a.phase = 'charge';
      else beginActive(f, a);
    } else if (a.phase === 'charge') {
      a.charge += dt;
      if (Math.random() < dt * 14) {   // crackling lightning while charging
        bolt(f.x + (Math.random() - 0.5) * 40, f.y - 10 - Math.random() * 70, Math.random() * Math.PI * 2,
             20 + 40 * (a.charge / MAX_CHARGE), 0.08, Math.random() < 0.5 ? '#ffffff' : f.energy);
      }
      if (Math.random() < dt * 40) {   // charge sparkles pulled toward the fighter
        const ang = Math.random() * Math.PI * 2, d = 50;
        particles.push({ x: f.x + Math.cos(ang) * d, y: f.y - 42 + Math.sin(ang) * d,
          vx: -Math.cos(ang) * d * 5, vy: -Math.sin(ang) * d * 5, life: 0.2, max: 0.2, size: 1,
          color: a.charge >= MAX_CHARGE * 0.95 ? '#ffffff' : f.energy, type: 'bit', grav: 0 });
      }
      // SWEET SPOT moves (Colby's Annihilator): a glint + ring the moment the charge enters the sweet spot,
      // and smoke once it's past it (overcharged = longer recovery)
      if (m.sweetSpot) {
        const cf = a.charge / MAX_CHARGE;
        if (!a.sweetCue && cf >= m.sweetSpot[0]) { a.sweetCue = true; sfx.shing(); ring(f.x + f.face * 30, f.y - 66); }
        if (cf > m.sweetSpot[1] && Math.random() < dt * 30) burst(f.x, f.y - 60, ['#56493f', '#806b5a'], 1, -Math.PI / 2, 0.8, 120, { grav: -120 });
      }
      // OVERCHARGE (Lance's Kamehameha): keep holding past full to build up to 200% - double power and size
      if (m.overcharge && a.charge > MAX_CHARGE) {
        const o = clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1);
        shake = Math.max(shake, 2 + 6 * o);
        if (Math.random() < dt * (20 + 40 * o)) bolt(f.x + (Math.random() - 0.5) * 70, f.y - Math.random() * 100, Math.random() * Math.PI * 2,
                                                     50 + 70 * o, 0.07, Math.random() < 0.5 ? '#ffffff' : '#ffd23f');
        if (o >= 1 && !a.overFull) { a.overFull = true; ring(f.x + f.face * 30, f.y - 66); sfx.parry(); }
      }
      const limit = m.overcharge ? MAX_CHARGE + OVERCHARGE_TIME : MAX_CHARGE;
      if (!btnHeld || a.charge >= limit) {
        a.cfrac = clamp((a.charge - 0.06) / (MAX_CHARGE - 0.06), 0, 1);
        a.over = m.overcharge ? clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1) : 0;
        a.mult = (1 + CHARGE_BONUS * a.cfrac) * (1 + a.over);      // 200% = twice a full charge
        // FALCON-STYLE: hold the first jab long enough and it turns into a huge lunging power hit
        if (m.chargedHit && a.charge >= m.chargedHit.min) a.powered = true;
        // Sweet spot release: faster flight + extra power. Overcharged: same flight, but stuck afterwards.
        if (m.sweetSpot) {
          const cf = clamp(a.charge / MAX_CHARGE, 0, 1);
          a.travel = m.travel + (m.travelCharge || 0) * cf;
          if (cf >= m.sweetSpot[0] && cf <= m.sweetSpot[1]) {
            a.mult *= 1.15; a.travel *= 1.1;
            painTexts.push({ x: f.x, y: f.y - 120, t: 0.6, max: 0.6, text: 'SWEET SPOT!', big: false });
            impactFrame = Math.max(impactFrame, 0.05); impactAt = { x: f.x + f.face * 30, y: f.y - 66, ang: 0, all: false, focus: true };
          } else if (cf > m.sweetSpot[1]) {
            a.extraLag = m.overLag;
            painTexts.push({ x: f.x, y: f.y - 120, t: 0.6, max: 0.6, text: 'OVERCHARGED!', big: false });
          }
        }
        beginActive(f, a);
      }
    } else if (a.phase === 'active' && a.t >= m.active) {
      a.phase = 'end'; a.t = 0;
      if (m.travel && !m.ledgeStop) f.vx *= 0.2;          // traveling moves brake hard when they end (no sliding off the stage)
    } else if (a.phase === 'end' && a.t >= m.endlag + (m.whiffLag && a.hit.size === 0 ? m.whiffLag : 0) + (a.extraLag || 0)) {   // whiffed / overcharged = stuck longer
      f.action = null;
      // Combo grace window: the next press within COMBO_GRACE seconds still continues the chain
      if (!a.powered) {                       // (a charged power jab ends the string - no combo after it)
        if (m.combo) { f.comboKey = m.combo; f.comboBtn = a.btn; f.comboTimer = COMBO_GRACE; }
        // Mixed punch/kick chain (bare-handed Colby): remember which step of the chain we're on
        f.chainStep = m.chain || 0;
        if (m.chain && m.chain < CHAIN_LEN) f.comboTimer = COMBO_GRACE;
      }
    }
    return;
  }

  if (a.type === 'spot') {
    f.vx = approach(f.vx, 0, FRICTION * 2 * dt);
  } else if (a.type === 'roll') {
    f.vx = a.dx * (a.t < a.dur * 0.75 ? a.speed : a.speed * 0.15);
  } else if (a.type === 'air') {
    if (a.dx || a.dy) { const k = Math.exp(-dt * a.decay); f.vx *= k; f.vy *= k; }
    else f.vx *= Math.exp(-dt * 10);
  } else if (a.type === 'hitstun' && a.crit) {
    // CRIT: flies straight out at full speed with a fiery trail, no slowing down
    if (Math.random() < dt * 60) burst(f.x, f.y - 40, ['#ffd23f', '#ff5a3c', '#ffffff'], 2, f.vx > 0 ? Math.PI : 0, 0.4, 200, { grav: 0 });
    if (Math.random() < dt * 30) ghosts.push({ fig: figureOf(f), life: 0.15, max: 0.15, color: '#ffd23f' });
  } else if (a.type === 'hitstun') {
    f.vx *= Math.exp(-dt * LAUNCH_DECAY);
    if (f.vy < 0) f.vy *= Math.exp(-dt * LAUNCH_DECAY * 0.6);
    // Trail of sweat/blood while flying fast
    if (Math.hypot(f.vx, f.vy) > 900 && Math.random() < dt * 30) {
      burst(f.x, f.y - 40, gore ? BLOOD : SWEAT, 1, 0, Math.PI, 80, { stain: gore });
    }
  } else if (a.type === 'dizzy') {
    f.vx = approach(f.vx, 0, FRICTION * dt);
    if (Math.random() < dt * 6) burst(f.x, f.y - f.h - 10, ['#ffd23f'], 1, Math.PI / 2, 0.6, 80, { grav: -50 });
  } else if (a.type === 'land') {
    f.vx = approach(f.vx, 0, FRICTION * dt);
  } else if (a.type === 'parried') {
    f.vx = approach(f.vx, 0, FRICTION * 0.6 * dt);
    if (Math.random() < dt * 8) burst(f.x, f.y - f.h - 6, ['#ffd23f'], 1, Math.PI / 2, 0.8, 90, { grav: -40 });
  }

  if (isIntangible(f) && a.type !== 'air') {          // (air vanishes don't leave a trail - you're just gone)
    a.ghostT -= dt;
    if (a.ghostT <= 0) {
      a.ghostT = 0.025;
      ghosts.push({ fig: figureOf(f), life: 0.22, max: 0.22, color: a.level > 0 ? '#52525c' : f.color });
    }
  }

  if (a.t >= a.dur) {
    if (a.type === 'roll') f.face = -a.dx;
    if (a.type === 'spot' || a.type === 'roll') f.dodgeCool = DODGE_COOLDOWN;
    f.action = null;
    if (a.type === 'air') { burst(f.x, f.y - 45, [f.energy, '#ffffff'], 10, 0, Math.PI, 300, { grav: 0 }); ring(f.x, f.y - 45); }   // reappear
  }
}

// ---------------- Free movement (not attacking/dodging) ----------------
function freeControl(f, inp, dt) {
  const dir = inp.dir;

  // DOUBLE-TAP a direction:
  //   on the ground -> RUN (Naruto run) that way. Lance: double-tap AGAIN while running = Fly Dash.
  //   in the air    -> Fly Dash (characters who can fly)
  if (inp.flyTap) {
    const canFly = f.look && f.look.flyDash && (f.flyCD || 0) <= 0 && (f.ground || !f.flyUsed);
    if (f.ground && !(f.running && f.runDir === inp.flyTap && canFly)) {
      if (!f.running || f.runDir !== inp.flyTap) {
        f.running = true; f.runDir = inp.flyTap; f.face = inp.flyTap;
        f.vx = inp.flyTap * Math.max(Math.abs(f.vx), f.stats.runSpeed * RUN_MULT * 0.8);   // burst into the run
        dust(f.x - inp.flyTap * 14, f.y, 9, 1.4);
        sfx.whoosh(false);
      }
    } else if (canFly) {
      f.running = false;
      startFlyDash(f, inp.flyTap);
      return;
    }
  }
  // Let go of the direction (for longer than a quick re-tap) or turn around = stop running
  if (f.running && inp.dir !== f.runDir) {
    f.runOff = (f.runOff || 0) + dt;
    if (inp.dir === -f.runDir || f.runOff > 0.15) f.running = false;
  } else f.runOff = 0;

  // I: full meter = TRANSFORM. Already transformed = ULTIMATE (spends what's left of the meter).
  if (f.ultBuf > 0) {
    if (f.transformed && f.ult > 0) { startUltimate(f); return; }
    if (!f.transformed && f.ult >= ULT_MAX) startTransform(f);
  }

  // 0) Grab (ground only - also works straight out of your shield)
  if (f.grabBuf > 0 && f.ground) {
    if (f.look && f.look.spd && stickCircled(f)) { f.grabBuf = 0; trySPD(f); return; }   // Aiden: 360 + grab = SPINNING PILEDRIVER
    startGrab(f); return;
  }

  // 1) Attacks
  if ((f.atkBuf > 0 || f.spcBuf > 0) && !(f.ground && inp.blockHeld && f.squat <= 0)) {
    startAttack(f, inp, f.atkBuf > 0 ? 'atk' : 'spc');
    return;
  }

  // 2) Block + direction = dodge, block alone = shield
  const fresh = f.dodgeBuf > 0 || (inp.blockHeld && f.dirBuf > 0);
  if (f.ground && f.squat <= 0) {
    if ((inp.blockHeld || f.dodgeBuf > 0) && (dir || inp.down) && fresh && f.dodgeCool <= 0) {
      startDodge(f, dir, inp.down, inp.up);
      return;
    }
    if (inp.blockHeld && f.jumpBuf <= 0 && f.shieldHP > 0 && f.slide <= 0) {
      f.shieldAge = f.prevShield ? f.shieldAge + dt : 0;     // how long the shield has been up (for perfect blocks)
      f.shielding = true;
      f.shieldHP -= SHIELD_DRAIN * dt;
      f.vx = approach(f.vx, 0, FRICTION * dt);
      if (f.shieldHP <= 0) breakShield(f);
      return;
    }
  } else if (!f.ground && fresh && canAirDodge(f)) {
    startDodge(f, dir, inp.down, inp.up);
    return;
  }

  // 3) Move
  if (dir && f.squat <= 0 && f.ground) f.face = dir;   // you don't turn around in the air (so back airs work)
  const maxSpeed = f.ground ? f.stats.runSpeed * (f.running ? RUN_MULT : 1) : f.stats.airSpeed;
  if (f.running && f.ground && Math.random() < dt * 14) dust(f.x - f.face * 10, f.y, 2, 0.6);   // kicking up dust
  // CROUCH: hold down on the ground (not while running). You can still turn around, but not walk.
  f.crouching = f.ground && inp.down && f.squat <= 0 && !f.running;
  if (f.crouching && dir) f.face = dir;
  if (dir && f.slide <= 0 && !f.crouching) {
    if (f.ground && f.vx * dir < f.stats.runSpeed * 0.5) {
      f.vx = dir * f.stats.runSpeed * DASH_START;
      dust(f.x - dir * 12, f.y, 5, 0.8);
    }
    f.vx = approach(f.vx, dir * maxSpeed, (f.ground ? GROUND_ACCEL : AIR_ACCEL) * dt);
  } else {
    const fr = f.ground ? FRICTION * (f.slide > 0 ? WAVEDASH_FRICTION : 1) : AIR_DRAG;
    f.vx = approach(f.vx, 0, fr * dt);
  }

  // 4) Jump (short crouch first, then up)
  if (f.squat > 0) {
    f.squat -= dt;
    if (f.squat <= 0) {
      f.vy = -f.stats.jumpVel * JUMP_SCALE; f.ground = false; f.canCutJump = true; f.squash = -0.25;
      dust(f.x, f.y, 8);
      if (!inp.jumpHeld) { f.vy *= 0.5; f.canCutJump = false; }   // short hop
    }
  } else if (f.jumpBuf > 0) {
    if (f.ground) {
      f.jumpBuf = 0;
      f.squat = JUMP_SQUAT;
      f.squash = 0.15;
    } else if (f.airJumps > 0) {
      f.jumpBuf = 0;
      f.airJumps--;
      f.vy = -f.stats.doubleJumpVel * JUMP_SCALE;
      f.canCutJump = true;
      f.flip = 0.001;
      if (dir) f.vx = dir * f.stats.airSpeed;
      ring(f.x, f.y);
    }
  }

  // 5) Drop through a platform
  if (inp.downTap && f.ground && f.onPlatform && f.squat <= 0) {
    f.dropTimer = 0.22;
    f.ground = false;
    f.y += 2;
  }
}

// ---------------- One fighter, one physics step ----------------
function updateFighter(f, inp, dt) {
  if (f.respawnTimer > 0) {
    f.respawnTimer -= dt;
    if (f.respawnTimer <= 0) resetFighter(f, true);
    return;
  }

  f.jumpBuf  = inp.jumpTap  ? BUFFER : Math.max(0, f.jumpBuf - dt);
  f.dodgeBuf = inp.blockTap ? BUFFER : Math.max(0, f.dodgeBuf - dt);
  f.dirBuf   = inp.dirTap   ? BUFFER : Math.max(0, f.dirBuf - dt);
  // C-stick flick: remember its direction until the attack actually comes out (it may be buffered)
  if (inp.cFlick) f.cFlick = { ...inp.cFlick, t: C_STICK.buffer };
  else if (inp.atkTap || inp.spcTap) f.cFlick = null;           // a normal button press wins
  else if (f.cFlick && (f.cFlick.t -= dt) <= 0) f.cFlick = null;
  f.atkBuf   = inp.atkTap   ? BUFFER : Math.max(0, f.atkBuf - dt);
  f.spcBuf   = inp.spcTap   ? BUFFER : Math.max(0, f.spcBuf - dt);
  f.grabBuf  = inp.grabTap  ? BUFFER : Math.max(0, (f.grabBuf || 0) - dt);
  if (f.look && f.look.spd) noteStickCircle(f, inp);
  f.ultBuf   = inp.ultTap   ? BUFFER : Math.max(0, (f.ultBuf || 0) - dt);
  f.flyCD = Math.max(0, (f.flyCD || 0) - dt);
  if (f.kiMark) { f.kiMark.time -= dt; kiMarkTarget(f); }         // Lance's ki mark wears off
  if (f.kaioken) f.damage += KAIOKEN.drain * dt;                  // Kaioken strain: 1% per second
  f.tsCD = Math.max(0, (f.tsCD || 0) - dt);
  syncKame(f);
  const inUlt = f.action && ['ultStart', 'ultSeq', 'ultBeam'].includes(f.action.type);
  if (f.transformed) {                                            // transformed: the meter slowly drains
    if (!inUlt) {
      f.ult = Math.max(0, (f.ult || 0) - TRANSFORM.drain * dt);
      if (f.ult <= 0) endTransform(f);
    }
  } else f.ult = Math.min(ULT_MAX, (f.ult || 0) + ULT_PASSIVE * dt);   // +1% every 2 seconds

  f.anim += dt;
  f.cloneCD = Math.max(0, (f.cloneCD || 0) - dt);
  if (f.look && f.look.smoke && f.respawnTimer <= 0 && Math.random() < dt * 5) {   // cigarette smoke drifting up
    particles.push({ x: f.x + f.face * 22, y: f.y - 100 * (f.look.scale || 1), vx: (Math.random() - 0.5) * 20 - f.vx * 0.1, vy: -40 - Math.random() * 30,
                     life: 0.9, max: 0.9, size: 2, color: Math.random() < 0.5 ? '#9a9aa2' : '#c8c8cf', type: 'bit', grav: -30 });
  }
  if (f.revenge > 0) {                                            // REVENGE stored: he smoulders with fire until he uses it
    f.revengeT -= dt;
    if (f.revengeT <= 0) f.revenge = 0;
    if (Math.random() < dt * 30) burst(f.x + (Math.random() - 0.5) * 30, f.y - Math.random() * 80, ['#ff5a1a', '#ffb02e'], 1, Math.PI / 2, 0.5, 120, { grav: -260 });
  }
  f.invuln = Math.max(0, f.invuln - dt);
  f.squash = approach(f.squash, 0, dt * 6);
  f.dropTimer = Math.max(0, f.dropTimer - dt);
  f.dodgeCool = Math.max(0, f.dodgeCool - dt);
  f.comboTimer = Math.max(0, (f.comboTimer || 0) - dt);
  f.slide = Math.max(0, f.slide - dt);
  f.dodgedFlash = Math.max(0, f.dodgedFlash - dt);
  f.blockedFlash = Math.max(0, f.blockedFlash - dt);
  f.hitFlash = Math.max(0, f.hitFlash - dt);
  f.parryFlash = Math.max(0, f.parryFlash - dt);
  if (f.flip > 0) { f.flip += dt / FLIP_TIME; if (f.flip >= 1) f.flip = 0; }
  f.runPhase += dt * (10 + Math.abs(f.vx) / 45);

  const dodging = f.action && ['spot', 'roll', 'air'].includes(f.action.type);
  // Blue dodge dots only refill while you're on the ground (so you can't vanish forever in the air)
  if (!dodging && f.dodgeCount > 0 && (f.ground || f.halo > 0)) {
    f.dodgeRecover -= dt;
    if (f.dodgeRecover <= 0) { f.dodgeCount--; f.dodgeRecover = DODGE_RECOVER; }
  }
  if (!f.shielding) f.shieldHP = Math.min(SHIELD_MAX, f.shieldHP + SHIELD_REGEN * dt);

  // After-image trail when moving fast (the colored "smear" from the animation)
  const spd = Math.hypot(f.vx, f.vy);
  f.trailT -= dt;
  if (spd > 750 && f.trailT <= 0 && !(f.action && ['spot', 'roll', 'air'].includes(f.action.type))) {
    f.trailT = 0.03;
    ghosts.push({ fig: figureOf(f), life: 0.2, max: 0.2, color: bodyColorOf(f) });
  }
  if (spd > 700 && Math.random() < dt * 30) {
    particles.push({ x: f.x + (Math.random() - 0.5) * 30, y: f.y - 20 - Math.random() * 60,
      vx: -f.vx * 0.15, vy: -f.vy * 0.15, ax: f.vx, ay: f.vy, life: 0.18, max: 0.18, type: 'streak' });
  }

  // Respawn platform
  if (f.halo > 0) {
    f.halo -= dt;
    if (inp.dir || f.jumpBuf || f.dodgeBuf || inp.down || f.atkBuf || f.spcBuf || f.halo <= 0) f.halo = 0;
    else { f.vx = f.vy = 0; f.ground = true; return; }
  }

  f.prevShield = f.shielding;
  f.shielding = false;
  if (f.action) stepAction(f, inp, dt);
  else freeControl(f, inp, dt);
  if (f.action && f.action.type !== 'land') f.running = false;     // attacking, dodging, getting hit... ends the run
  if (f.action || !f.ground) f.crouching = false;                  // (crouching only while standing free on the ground)

  // Short hop: let go of jump early to jump lower.
  if (!inp.jumpHeld && f.canCutJump && f.vy < 0) { f.vy *= 0.5; f.canCutJump = false; }
  if (f.vy >= 0) f.canCutJump = false;

  // Gravity
  const a = f.action;
  const floating = a && ((a.type === 'air' && a.t < a.floatTime) || a.type === 'clash' || a.type === 'grabbed' || a.type === 'thrown' || a.type === 'whipped' ||

  if (f.x < BLAST.left || f.x > BLAST.right || f.y > BLAST.bottom || f.y < BLAST.top) {

    koFlashes.push({ x: kx, y: ky, t: 0.6, color: f.color });
    burst(kx, ky, [f.color, '#ffffff', '#ffd23f'], 40, Math.atan2(-(cam.y - ky), cam.x - kx), 0.5, 900, { grav: 200 });
    f.respawnTimer = 1.0;

    if (isFinite(f.stocks)) {

      if (f.stocks <= 0) { f.out = true; f.respawnTimer = Infinity; checkMatchEnd(); }
    }

    f.kaioken = false;                                  // ...and Kaioken

function emptyInput() {

// =====================================================================
//  AI OPPONENT

//  input object the keyboard does. It re-thinks every `think` seconds

const AI_LEVELS = {

  NORMAL: { think: 0.2,  defend: 0.4,  aggro: 0.75, combo: 0.7,  mash: 5 },
  HARD:   { think: 0.09, defend: 0.75, aggro: 0.92, combo: 0.97, mash: 8 },
  MASTER: { think: 0.05, defend: 0.9,  aggro: 0.96, combo: 1,    mash: 11 },   // top level: reacts almost instantly

    tapJump: false, tapAtk: false, tapSpc: false, tapBlock: false, tapDown: false,
    jumpHold: 0, hold: 0, holdBtn: null });

      !act.comboRolled) {

      ai.dir = 0; ai.up = ai.down = false;

  // Grabbed: mash to break free

  if (ga && ga.type === 'grabbed' && Math.random() < L.mash * STEP) ai.tapAtk = true;
  // Holding someone: pummel a bit, then pick a throw
  if (ga && ga.type === 'holding') {

    ai.dir = 0; ai.up = ai.down = false;
