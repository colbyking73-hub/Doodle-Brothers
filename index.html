    else if (rr < 0.75) { ai.down = true; ai.tapSpc = true; }            // grim sweep
    else if (f.face === toward) ai.tapSpc = true;                        // reaper arc
    else { ai.dir = toward; ai.tapSpc = true; }
    return;
  }

  // 3) CLOSE RANGE on the ground
  if (f.ground && adx < 75 && Math.abs(dy) < 50) {
    if (stuck || (o.damage > 80 && r < 0.4)) {                           // charged side smash to KO
      ai.dir = toward; ai.tapAtk = true; ai.holdBtn = 'atk';
      ai.hold = stuck ? 0.1 + Math.random() * 0.3 : 0.3 + Math.random() * 0.5;
    } else if (r < 0.35 && f.face === toward) ai.tapAtk = true;          // jab
    else if (r < 0.6) { ai.dir = toward; ai.tapAtk = true; }             // side smash
    else if (r < 0.8) { ai.down = true; ai.tapAtk = true; }              // down smash (hits both sides)
    else { ai.up = true; ai.tapAtk = true; }                             // up smash
    return;
  }
  if (stuck && f.ground && adx < 250) { ai.dir = toward; return; }       // rush in

  // Opponent right above us: up smash
  if (f.ground && adx < 60 && dy < -50 && dy > -160) { ai.up = true; ai.tapAtk = true; return; }

  // 4) AERIALS when close in the air
  if (!f.ground && adx < 90 && Math.abs(dy) < 100) {
    if (dy < -45) ai.up = true;          // up air
    else if (dy > 45) ai.down = true;    // down air (spike!)
    else ai.dir = toward;                // forward air, or back air if facing away
    // Mix in air K moves (never with up - up + K is the recovery move)
    if (!ai.up && f.moveset.nairR && Math.random() < 0.45) ai.tapSpc = true;
    else ai.tapAtk = true;
    return;
  }
  // Air K from a bit further out: scythe reach / energy shots
  if (!f.ground && adx < (scythe ? 140 : 380) && Math.abs(dy) < 140 && f.moveset.fairR && Math.random() < 0.3) {
    if (dy > 60) ai.down = true; else ai.dir = toward;
    ai.tapSpc = true;
    return;
  }

  // RUN: from far away, double-tap toward them; close in = running attack
  if (f.running && f.moveset.dashAttack && adx < 135 && Math.abs(dy) < 40 && f.face === toward && Math.random() < 0.5) {
    ai.dir = toward; ai.tapAtk = true;
    return;
  }
  if (f.ground && !f.running && adx > 320 && Math.abs(dy) < 60 && Math.random() < 0.3 * L.aggro) {
    ai.flyTap = toward; ai.dir = toward;
    return;
  }
  if (f.running) { ai.dir = toward; if (f.face !== toward) ai.dir = toward; }

  // FLY DASH (Lance): rocket in from mid range for aggressive plays
  if (f.look && f.look.flyDash && adx > 200 && adx < 650 && Math.abs(dy) < 220 && (f.ground || !f.flyUsed) &&
      (f.flyCD || 0) <= 0 && Math.random() < 0.2 * L.aggro) {
    ai.flyTap = toward;
    return;
  }

  // 5) MID RANGE: shoot sometimes
  if (!scythe && adx > 220 && adx < 750 && Math.abs(dy) < 120 && r < 0.3 * L.aggro) {
    if (Math.random() < 0.5) {                                                          // side ranged
      ai.dir = toward; ai.tapSpc = true;
      if (f.moveset.sideRanged.rapid) { ai.holdBtn = 'spc'; ai.hold = 0.4 + Math.random() * 0.8; }   // hold the ki storm
    }
    else if (f.face === toward) { ai.tapSpc = true; ai.holdBtn = 'spc'; ai.hold = Math.random() * 0.7; } // energy ball
    else ai.dir = toward;
    return;
  }

  // Opponent below us while we're on a platform: drop down
  if (f.ground && f.onPlatform && dy > 60 && adx < 220) { ai.down = true; ai.tapDown = true; return; }

  // 6) APPROACH
  if (Math.random() < L.aggro) ai.dir = toward;
  if (f.ground && (dy < -70 || Math.random() < 0.12)) {                  // jump up to platforms / hop in
    ai.tapJump = true; ai.jumpHold = dy < -70 ? 0.3 : 0;
  } else if (!f.ground && dy < -90 && f.vy > 0 && f.airJumps > 0) {
    ai.tapJump = true; ai.jumpHold = 0.3;
  }
}

// Every frame: get back to the stage if knocked off, and don't run off the edge.
function aiSafety(f, ai) {
  const a = f.action;
  if (a && (a.type === 'hitstun' || a.type === 'dizzy')) return;
  const offLeft = f.x < STAGE.x, offRight = f.x > STAGE.x + STAGE.w;
  if (!f.ground && (offLeft || offRight || f.y > STAGE.y + 5)) {
    ai.block = false; ai.down = false; ai.hold = 0; ai.tapAtk = false;
    // Under the stage: get out to the side first, then head back to the middle
    ai.dir = (f.y > STAGE.y + 5 && !offLeft && !offRight) ? (f.x < W / 2 ? -1 : 1) : Math.sign(W / 2 - f.x);
    if (f.y > STAGE.y - 40 && f.vy > -100) {
      if (f.airJumps > 0) { ai.tapJump = true; ai.jumpHold = 0.3; }                      // double jump
      else if (!f.upSpecialUsed && !a) { ai.up = true; ai.tapSpc = true; }               // rocket jump
      else if (canAirDodge(f) && !a && f.y < STAGE.y + 120) { ai.tapBlock = true; ai.up = true; } // air dodge up
    }
    return;
  }
  if (f.ground && !f.onPlatform &&
      ((ai.dir < 0 && f.x < STAGE.x + 40) || (ai.dir > 0 && f.x > STAGE.x + STAGE.w - 40))) ai.dir = 0;
}

// =====================================================================
//  DEMOS: press 1 (clash) or 2 (perfect block + counter) to watch them in slow motion.
//  The game "presses the buttons" for both fighters at exactly the right moment.
// =====================================================================
const SLOWMO = 0.3;          // slow-motion speed (M toggles it any time)
const DEMO_LENGTH = 2.6;     // seconds of game time each demo runs
let timeScale = 1;
let demo = null;
function startDemo(kind) {
  const [p, c] = fighters;
  for (const f of fighters) { resetFighter(f, false); f.disp = null; }
  projectiles.length = 0; ghosts.length = 0; clashText = null;
  p.x = W / 2 - (kind === 'clash' ? 70 : kind === 'ult' ? 60 : 35); c.x = W / 2 + (kind === 'clash' ? 70 : kind === 'ult' ? 60 : 35);
  p.face = 1; c.face = -1;
  if (kind === 'ult') { p.ult = ULT_MAX; c.damage = 60; }      // P1 gets a full meter for the demo
  demo = { kind, t: 0, fired: new Set() };
  if (kind === 'broly') {                                        // P1 plays Lance for this one (switched back after)
    demo.restoreChar = p.char;
    if (p.char !== 'LANCE') setCharacter(p, 'LANCE');
    c.damage = 40;
  }
  timeScale = kind === 'ult' ? 1 : kind === 'broly' ? 0.5 : SLOWMO;   // the ultimate is already cinematic - normal speed
}
function endDemo() {
  if (demo && demo.restoreChar && fighters[0].char !== demo.restoreChar) { setCharacter(fighters[0], demo.restoreChar); resetFighter(fighters[0], false); }
  demo = null; timeScale = 1;
}
function demoInput(f) {
  const inp = emptyInput();
  const i = fighters.indexOf(f), other = fighters[1 - i];
  const toward = Math.sign(other.x - f.x) || 1;
  const once = (key) => { if (demo.fired.has(key)) return false; demo.fired.add(key); return true; };
  if (demo.kind === 'clash') {
    // Both swing their side attack on the exact same frame
    if (demo.t >= 0.4 && once('atk' + i)) { inp.dir = toward; inp.atkTap = inp.atkHeld = true; }
  } else if (demo.kind === 'ult') {
    if (i === 0 && demo.t >= 0.3 && once('transform')) inp.ultTap = true;   // P1 transforms...
    if (i === 0 && demo.t >= 0.9 && once('ult')) inp.ultTap = true;         // ...then fires the ultimate
  } else if (demo.kind === 'broly') {
    // Lance grabs, then holds down = Broly Slam
    if (i === 0 && demo.t >= 0.25 && once('grab')) inp.grabTap = true;
    if (i === 0 && demo.t >= 0.5) inp.down = true;
  } else {
    // CPU (fighter 2) throws a side attack; P1 raises the shield just before it lands
    const swing = 0.4, startup = fighters[1].moveset.sideGround.startup;
    if (i === 1 && demo.t >= swing && once('swing')) { inp.dir = toward; inp.atkTap = inp.atkHeld = true; }
    if (i === 0 && demo.t >= swing + startup - 0.05 && demo.t < swing + 0.9) {
      inp.blockHeld = true;
      if (once('block')) inp.blockTap = true;
    }
  }
  return inp;
}

function cycleCharacter(f) {
  const i = CHAR_NAMES.indexOf(f.char);
  setCharacter(f, CHAR_NAMES[(i + 1) % CHAR_NAMES.length]);
  resetFighter(f, false);
}

// ---------------- Main update ----------------
function update(dt) {
  time += dt;

  // Effects
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.type === 'bit') {
      const oldY = p.y;
      p.vy += p.grav * dt; p.vx *= 0.995;
      p.x += p.vx * dt; p.y += p.vy * dt;
      // Blood drops that land stain the floor
      if (p.stain && p.vy > 0) {
        const surf = [STAGE, ...PLATFORMS].find(s => oldY <= s.y && p.y >= s.y && p.x > s.x && p.x < s.x + s.w);
        if (surf) {
          stains.push({ x: p.x, y: surf.y, color: p.color, life: 5 + Math.random() * 3, w: p.size });
          if (stains.length > 400) stains.shift();
          p.life = 0;
        }
      }
    } else {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy += 300 * dt;
      if (p.type === 'ring') p.r += 220 * dt;
      if (p.type === 'impact') p.r += (pixelMode ? 300 : 170) * dt;
      if (p.type === 'hitline') { p.vy -= 300 * dt; p.vx *= 1.04; }   // speed lines fly dead straight (no gravity / drag)
      if (p.type === 'slash' || p.type === 'beamfx') { p.vx = 0; p.vy = 0; }      // slash streaks / ult beam stay put
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = stains.length - 1; i >= 0; i--) { stains[i].life -= dt; if (stains[i].life <= 0) stains.splice(i, 1); }
  for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].life -= dt; if (ghosts[i].life <= 0) ghosts.splice(i, 1); }
  for (let i = koFlashes.length - 1; i >= 0; i--) { koFlashes[i].t -= dt; if (koFlashes[i].t <= 0) koFlashes.splice(i, 1); }
  shake = Math.max(0, shake - dt * 30);

  if (clashText) { clashText.t -= dt; if (clashText.t <= 0) clashText = null; }
  if (critText) { critText.t -= dt; if (critText.t <= 0) critText = null; }
  for (let i = cracks.length - 1; i >= 0; i--) { cracks[i].life -= dt; if (cracks[i].life <= 0) cracks.splice(i, 1); }
  for (let i = painTexts.length - 1; i >= 0; i--) { painTexts[i].t -= dt; if (painTexts[i].t <= 0) painTexts.splice(i, 1); }
  if (ultBanner) { ultBanner.t -= dt; if (ultBanner.t <= 0) ultBanner = null; }

  // While an ultimate is playing, it runs the show: everything else is paused
  if (ult) {
    updateUlt(dt);
    for (const f of fighters) tickPose(f, dt);
    updateCamera(dt);
    return;
  }

  // Demo / debug toggles - all switched OFF in CLEAN MODE (real matches: nothing on the keyboard can
  // spawn cannons, swap characters, reset the fight etc. by accident)
  if (!gameOptions.cleanHud && !netActive()) {             // (never online: they'd only happen on one side)
    if (tapped('KeyT')) { cannon.on = !cannon.on; cannon.timer = 1.0; }
    if (tapped('KeyB')) { dummyMode = (dummyMode + 1) % DUMMY_MODES.length; for (const f of fighters) f.cpuLevel = null; }   // B = debug override for every CPU
    if (tapped('KeyH')) showHitboxes = !showHitboxes;
    if (tapped('Digit1')) startDemo('clash');
    if (tapped('Digit2')) startDemo('parry');
    if (tapped('Digit3')) startDemo('ult');
    if (tapped('Digit4')) startDemo('broly');
    if (tapped('KeyM')) timeScale = timeScale < 1 ? 1 : SLOWMO;
    if (tapped('KeyV')) cycleCharacter(fighters[0]);
    if (tapped('KeyN')) cycleCharacter(fighters[1]);
    if (tapped('KeyG')) gore = !gore;
    if (tapped('KeyP')) setArtStyle(ART_STYLES[(ART_STYLES.indexOf(artStyle) + 1) % ART_STYLES.length]);
    if (tapped('KeyR')) { for (const f of fighters) { resetFighter(f, false); f.ult = 0; } projectiles.length = 0; stains.length = 0; ult = null; }
  }
  if (tapped('KeyO')) soundOn = !soundOn;                 // sound on/off always works
  if (demo) {
    demo.t += dt;
    if (demo.t >= (demo.kind === 'broly' ? 2.6 : DEMO_LENGTH)) endDemo();
  }
  // C cycles the on-screen text: controls list -> just a small hint -> CLEAN MODE (nothing) -> controls list
  if (tapped('KeyC') && !netActive()) {
    if (gameOptions.cleanHud) { gameOptions.cleanHud = false; showControls = true; }
    else if (showControls) showControls = false;
    else setCleanMode(true);
    saveOptions();
  }

  updateCannons(dt);

  for (const f of fighters.slice()) {
    const inp = demo && !f.minion ? demoInput(f) : inputFor(f);
    updateFighter(f, inp, dt);
    tickPose(f, dt);
    updateSmear(f, dt);                                    // white attack smears
  }
  updateMinions(dt);                                       // Colbalias's clones: time out / fall apart

  // Fighters gently push each other apart
  for (let i = 0; i < fighters.length; i++) for (let j = i + 1; j < fighters.length; j++) {
    const a = fighters[i], b = fighters[j];
    if (a.respawnTimer > 0 || b.respawnTimer > 0) continue;
    if (allies(a, b)) continue;                              // Colbalias and his clones walk straight through each other
    // Dodging (Z vanish, roll, spot dodge) phases straight THROUGH the other fighter - no body block
    const phasing = f => f.action && ['air', 'roll', 'spot', 'flydash', 'grab', 'holding', 'grabbed', 'throw', 'thrown'].includes(f.action.type);
    if (phasing(a) || phasing(b)) continue;
    const dx = b.x - a.x;
    if (Math.abs(dx) < 24 && Math.abs(a.y - b.y) < 40) {
      const push = (24 - Math.abs(dx)) * 0.25 * (dx >= 0 ? 1 : -1);
      a.x -= push; b.x += push;
    }
  }

  // Melee hitboxes
  for (const f of fighters) {
    const a = f.action;
    if (!a || a.type !== 'attack' || a.phase !== 'active' || !a.move.hitboxes || f.respawnTimer > 0) continue;
    const boxes = a.powered && a.move.chargedHit ? a.move.chargedHit.hitboxes : a.move.hitboxes;   // power jab = its own big hitbox
    hitLoop:
    for (const h of boxes) {
      const hx = f.x + h.x * f.face, hy = f.y + h.y;
      for (const t of fighters) {
        // Multi-hit moves: each hitbox can have its own time window and "group" (each group hits once)
        if (h.from !== undefined && (a.t < h.from || a.t > h.to)) continue;
        const key = fighters.indexOf(t) + ':' + (h.group || 0);
        if (t === f || a.hit.has(key) || allies(f, t) || t.dead || t.poofT > 0) continue;   // (Colbalias and his clones never hit each other)
        if (!circleHitsFighter(hx, hy, h.r, t)) continue;
        // CLASH: they swung the same button at (almost) the same moment
        const ta = t.action;
        if (ta && ta.type === 'attack' && ta.btn === a.btn && ta.phase !== 'end' && !a.noClash && !ta.noClash && !a.move.armor && !ta.move.armor &&
            Math.abs((ta.started ?? -9) - (a.started ?? 9)) <= CLASH_WINDOW) {
          startClash(f, t, a.key, ta.key);
          break hitLoop;
        }
        const d0 = t.damage;
        // DEMON METER full (Colbalias): his strong (chargeable) attacks hit 25% harder
        const demonBoost = f.look && f.look.demonMeter && (f.demon || 0) >= 100 && a.move.charge ? DEMON_METER.boost : 1;
        // GROUND CRITICAL (Colby's Cyclone Uppercut, Luigi style): started on the ground, they're on the ground
        // right next to him, and it's the very first instant -> one huge critical punch instead
        const GC = a.move.groundCrit;
        const crit = GC && a.groundStart && a.t <= GC.window && t.ground && Math.abs(t.x - f.x) <= GC.range && !t.shielding;
        if (applyHit(t, crit ? { ...GC.hit } : h, f.face, a.mult * powerOf(f) * demonBoost, hx, hy, { fighter: f })) {
          a.hit.add(key);
          if (crit) {
            for (const hb of boxes) a.hit.add(fighters.indexOf(t) + ':' + (hb.group || 0));   // that's the whole move for them
            painTexts.push({ x: t.x, y: t.y - 140, t: 0.9, max: 0.9, text: 'CRITICAL!', big: true });
            impactFrame = Math.max(impactFrame, 0.14); impactAt = { x: hx, y: hy, ang: Math.PI / 2, all: true, focus: true, invert: true };
            hitstop = Math.max(hitstop, 0.26); shake = Math.max(shake, 24); camPunch = 1; startSlowmo(0.4);
            burst(t.x, t.y - 60, ['#ffffff', '#ffd23f', '#ff8a3c'], 30, Math.PI / 2, 0.5, 800, { grav: -200 });
            ring(t.x, t.y - 60);
            if (sfx.shing) sfx.shing(); sfx.clash(true);                                    // DING
          }
          if (f.look && f.look.demonMeter && t.damage > d0) gainDemon(f);    // landing hits fills D-E-M-O-N
          if (demonBoost > 1) hellBurst(hx, hy, 20, 550);
          // Colby's TIME meter fills up as he lands hits
          if (f.look && f.look.timeStop && t.damage > d0) f.timeMeter = Math.min(100, (f.timeMeter || 0) + TIME_STOP.gain);
          // a clean hit (not blocked/dodged): some moves drop the game into slow motion when they land
          const clean = t.action && t.action.type === 'hitstun' && t.action.t === 0;
          if (a.move.slowmoHit && clean) startSlowmo(a.move.slowmoHit);
          if (a.move.hitstunBonus && clean && !t.action.crit) t.action.dur += a.move.hitstunBonus;   // stays stunned longer = combo time
          // LOCKED IN (Colby's 7-hit string): they're held right in front of him, stunned until the next hit
          if (a.move.chainLock && clean && !t.action.crit && !a.powered) {
            t.action.dur = Math.max(t.action.dur, 0.5); t.action.locked = true;
            t.vx = 0; if (t.ground) t.vy = 0; else t.vy = Math.min(t.vy, 0) * 0.2;
            t.x = f.x + f.face * 50;
          }
          // ELECTRIC: blue-white lightning cracks off every hit
          if (a.move.electric) {
            for (let k = 0; k < 4; k++) bolt(hx, hy, Math.random() * Math.PI * 2, 45 + Math.random() * 45, 0.12, k % 2 ? '#ffffff' : '#7fd8ff');
            burst(hx, hy, ['#7fd8ff', '#ffffff', '#3aa0ff'], 10, 0, Math.PI, 520, { grav: 0 });
          }
          // FOUR-ARM CLAMP (Aiden): the lower arms grab hold and yank them in close, stunned a bit
          // longer - sets up the next hit of his combo
          const pin = h.pullIn ?? a.move.pullIn;
          if (pin && clean && !t.action.crit) {
            t.x = f.x + f.face * pin; t.vx *= 0.15;
            if (t.ground) t.vy = Math.max(t.vy, -250);
            t.action.dur += h.holdStun ?? a.move.holdStun ?? 0;
            burst(hx, hy, ['#ffffff', '#ffd23f'], 6, 0, Math.PI, 260, { grav: 0 });
          }
          // FIRE: hits burst into flames (Aiden)
          if (f.look && f.look.fireHits && t.damage > d0) {
            burst(hx, hy, FIRE, 8 + Math.round(h.dmg), Math.PI / 2, 1.4, 380, { grav: -300 });
          }
          // REVENGE: his powered-up hit lands - the stored power is used up in a huge burst of fire
          if (f.revenge > 0 && t.damage > d0 && !a.move.noRevenge) consumeRevenge(f, hx, hy);
          // HEAVY HITTER (Aiden): every clean hit freezes a beat longer and rocks the screen
          if (f.look && f.look.heavyHits && clean && h.dmg >= 4) {
            hitstop = Math.max(hitstop, Math.min(0.24, 0.07 + h.dmg * 0.007));
            shake = Math.max(shake, Math.min(24, 6 + h.dmg * 0.9));
            if (h.dmg >= 9) dust(t.x, t.y, 8, 1.6);
          }
          if (a.move.onHit) a.move.onHit(f, t, a, h, clean);
          if (a.move.impactOnHit && clean) {                   // impact frame when it connects
            impactFrame = Math.max(impactFrame, 0.09);
            impactAt = { x: hx, y: hy, ang: Math.PI / 2, all: false, focus: true, invert: true };
            hitstop = Math.max(hitstop, 0.12); shake = Math.max(shake, 14);
            dust(t.x, t.y, 12, 2);
          }
        }
        if (f.action !== a) break hitLoop;          // got perfect-blocked: this attack is over
      }
    }
  }

  updateProjectiles(dt);
  updateScythes(dt);
  updateAuraWaves(dt);
  updateRopes(dt);
  updateCamera(dt);
}

// =====================================================================
//  DRAWING (world is drawn on the low-res canvas, in normal 1280x720 units)
// =====================================================================
let time = 0;
const snap = v => pixelMode ? Math.round(v / PIX) * PIX : v;
const PX = () => pixelMode ? PIX : 2;              // size of one "dot" for small effects

// Fixed random shapes so the background doesn't flicker
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const ruinsFar  = Array.from({ length: 70 }, (_, i) => ({ x: i * 20, h: 20 + rnd() * 50, spire: rnd() < 0.15 }));
const ruinsNear = Array.from({ length: 40 }, (_, i) => ({ x: i * 34, h: 10 + rnd() * 40, spire: rnd() < 0.2 }));
const smoke = Array.from({ length: 9 }, () => ({ x: rnd() * W, y: 40 + rnd() * 260, w: 200 + rnd() * 350, s: 6 + rnd() * 14 }));
const ash = Array.from({ length: 60 }, () => ({ x: rnd() * W, y: rnd() * H, s: 15 + rnd() * 30, d: rnd() * 6 }));

// =====================================================================
//  SKETCHBOOK STYLE helpers
// =====================================================================
const PAPER = '#f3efe4';
let sketchStroke = 0;                                   // counts strokes each frame so each one wobbles consistently
const boilFrame = () => Math.floor(time * 8);           // lines re-wobble 8 times a second, like a flipbook
const hash = s => { const v = Math.sin(s) * 43758.5453; return v - Math.floor(v); };
// Nudge a point a little, the same way every time within one boil frame (hand-drawn wobble)
function J(p, amt = 1.6) {
  if (!sketch) return p;
  const s = (sketchStroke++) * 12.9898 + boilFrame() * 78.233;
  return { x: p.x + (hash(s) - 0.5) * 2 * amt, y: p.y + (hash(s * 1.7 + 3.1) - 0.5) * 2 * amt };
}
// A pen stroke through some points: a main line plus a thin, slightly offset second pass
function inkLine(pts) {
  const lw = ctx.lineWidth;
  const P = pts.map(p => J(p));
  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
  for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
  ctx.stroke();
  ctx.save();
  ctx.lineWidth = Math.max(1, lw * 0.22);
  ctx.globalAlpha *= 0.6;

function drawStageSketch() {

function ruins(list, base, color, scale) {

// =====================================================================

function drawHellStage() {

    const inset = 30 * 0.95, y0 = s.y + s.h - 4;

  ctx.fillStyle = `rgba(255,${90 + 60 * pulse | 0},20,1)`; ctx.fillRect(s.x, s.y, s.w, 3);

function drawStage() {

// ---------- Poses ----------
// Angles can wrap around (e.g. a full spin ends at 2*PI = same as 0). With wrap=true we take the short way.
function lerpAng(x, y, k, wrap) {
  if (!wrap) return lerp(x, y, k);

  return x + d * k;
}
const Z_AXIS = [0, 0, 1];
function lerpSc(a, b, k, wrap) {
  const na = a.n || Z_AXIS, nb = b.n || Z_AXIS;
  return { gx: lerp(a.gx, b.gx, k), gy: lerp(a.gy, b.gy, k),
           pitch: lerpAng(a.pitch, b.pitch, k, wrap), yaw: lerpAng(a.yaw, b.yaw, k, wrap),
           n: [lerp(na[0], nb[0], k), lerp(na[1], nb[1], k), lerp(na[2], nb[2], k)],
           hb: lerp(handB(a), handB(b), k),

}
// Where the back hand grips, measured along the shaft from the front hand (+ = toward the blade)
function handB(sc) {

}
function lerpPose(a, b, k, wrap = false) {

  const out = { lean: lerp(a.lean, b.lean, k), bob: lerp(a.bob, b.bob, k), spin: lerpAng(a.spin || 0, b.spin || 0, k, wrap),
           legA: L(a.legA, b.legA), legB: L(a.legB, b.legB), armA: L(a.armA, b.armA), armB: L(a.armB, b.armB) };
  if (a.sc && b.sc) out.sc = lerpSc(a.sc, b.sc, k, wrap);
  else if (a.sc || b.sc) out.sc = b.sc || a.sc;
  // Four-armed fighters: the lower pair of arms (poses without them get a default that follows the upper arms)
  if (a.armC || b.armC) out.armC = L(a.armC || lowerArm(a.armA), b.armC || lowerArm(b.armA));
  if (a.armD || b.armD) out.armD = L(a.armD || lowerArm(a.armB), b.armD || lowerArm(b.armB));

}
// Default pose for a lower arm: roughly follows the upper arm on the same side, a bit more tucked in

// Characters with a weapon always hold it: poses that don't say otherwise use their "carry" grip.
// Grip target on the opponent's chest, in the grabber's own coordinates (x = forward)
function gripOn(p, v, dx = 0) {
  return [(v.x - p.x) * p.face + dx, (v.y - p.y) - 58];
}

function withCarry(p, ps) {
  if (!p.look || ps.sc) return ps;
  // Grappling needs both hands: the weapon gets slung across the back instead
  if (ps.grip && p.look.stow) return { ...ps, sc: p.look.stow };
  return p.look.carry ? { ...ps, sc: p.look.carry } : ps;

function movementPose(p) {

  let ps;
  if (p.ground || p.halo > 0) {
    if (p.crouching) {                   // ducked down low: knees deep, body folded forward, guard up
      const br = Math.sin(p.anim * 3) * 0.03;
      ps = pose({ bob: -26, lean: 0.55 + br, legA: [1.25, 2.3], legB: [0.55, 2.0], armA: [1.0, -1.9], armB: [0.6, -1.9] });
    }
    else if (p.squat > 0) ps = pose({ bob: -8, legA: [0.6, 1.2], legB: [0.3, 0.9], lean: 0.2 });
    else if (p.slide > 0) ps = pose({ lean: -0.1, bob: -6, legA: [0.9, 0.9], legB: [-0.7, 0.2], armA: [1.4, -0.4], armB: [-1.2, 0.4] });
    else if (speed > 40 && p.running) {
      // NARUTO RUN: body pitched way forward, head down, arms swept straight back, legs churning
      const s = Math.sin(p.runPhase), c = Math.cos(p.runPhase);
      ps = { lean: 0.95, spin: 0, bob: -4 + Math.abs(s) * 3,
        legA: [s * 1.15, 0.35 + Math.max(0, c) * 1.5], legB: [-s * 1.15, 0.35 + Math.max(0, -c) * 1.5],
        armA: [-2.25 + s * 0.06, 0.12], armB: [-2.4 - s * 0.06, 0.1] };
      if (p.look && p.look.stow) return { ...ps, sc: p.look.stow };     // Colby slings the scythe on his back to run
      return ps;
    } else if (speed > 40) {
      const s = Math.sin(p.runPhase), c = Math.cos(p.runPhase);
      ps = { lean: 0.3 * Math.min(1, speed / RUN_SPEED), spin: 0, bob: Math.abs(s) * 3,
        legA: [s * 0.85, 0.25 + Math.max(0, c) * 1.1], legB: [-s * 0.85, 0.25 + Math.max(0, -c) * 1.1],
        armA: [-s * 0.9, -1.1], armB: [s * 0.9, -1.1] };
    } else if (p.look && p.look.idle) {
      // Character's own fighting stance: slow, heavy breathing
      const br = Math.sin(p.anim * 2.2);
      const st = p.look.idle;
      ps = { ...st, bob: st.bob + br * 1.5, lean: st.lean + br * 0.02 };
      if (st.sc) ps.sc = { ...st.sc, pitch: st.sc.pitch + br * 0.04, gy: st.sc.gy + br * 1 };
    } else {

    ps = pose({ lean: 0.05, spin: flipSpin, legA: [0.9, 1.6], legB: [-0.1, 0.9], armA: [2.6, -0.3], armB: [-2.3, 0.3] });
  } else {
    const w = Math.sin(p.anim * 10) * 0.15;
    ps = pose({ lean: -0.05, spin: flipSpin, legA: [0.35, 0.5], legB: [-0.3, 0.2], armA: [1.8 + w, -0.4], armB: [-1.6 - w, 0.4] });
  }
  return withCarry(p, ps);
}

// The pose a fighter is AIMING for right now (the drawn pose eases toward this - see tickPose).
function getPose(p) { return withCarry(p, basePose(p)); }

function basePose(p) {
  const a = p.action;
  if (a && a.type === 'attack') {
    const m = a.move;
    if (a.poseOverride) return { ...a.poseOverride };       // moves that animate themselves (Alolan Whip, Cross Chop)
    if (a.phase === 'startup' || a.phase === 'charge') {
      const w = { ...m.wind };
      if (a.phase === 'charge') w.lean += Math.sin(p.anim * 70) * 0.05;   // shaking with power
      return w;
    }
    if (a.phase === 'active') {
      if (m.flip) {                                // somersault: the whole body (and weapon) turns full circles
        // (with a strike2, the flip finishes by strike2At and the last part is the strike2 pose, upright)
        const t = clamp(a.t / (m.strike2 ? m.strike2At : m.active), 0, 1);
        const base = m.strike2 && a.t >= m.strike2At ? m.strike2 : m.strike;
        const s = { ...base, spin: p.face * Math.PI * 2 * (m.flipTurns || 1) * t, raw: true };
        if (s.sc) s.sc = { ...s.sc, raw: true };
        if (m.scissor && Math.floor(a.t / m.scissor) % 2) { s.legA = m.strike.legB; s.legB = m.strike.legA; }   // legs scissor
        return s;
      }
      if (m.mirrorSpin) {                          // spinning like a shuriken: the body whips round (front/back flips fast)
        return { ...m.strike, mirror: Math.floor(a.t / m.mirrorSpin) % 2 === 1, spin: 0, raw: true };
      }
      if (m.spinScythe) {                          // whirling scythe around his body
        const s = { ...m.strike };
        s.sc = { ...m.strike.sc, yaw: -a.t * (m.spinSpeed || 28), raw: true };
        if (m.turn) s.turn = true;                 // body turns with it (blade after-images come from stepAction)
        return s;
      }
      if (m.sweep) {                               // weapon swings follow a real arc from wind-up to finish
        const t = clamp(a.t / (m.active * 0.9), 0, 1);
        const s = lerpPose(m.wind, m.strike, m.linear ? t : easeOut(t));   // spins turn at a steady speed
        if (s.sc) s.sc.raw = true;
        if (m.turn) s.turn = true;
        return s;
      }
      if (m.rapid) {                                  // rapid-fire: arm jitters with each blast
        const s = { ...m.strike };
        s.armA = [m.strike.armA[0] + Math.sin(p.anim * 70) * 0.12, m.strike.armA[1]];
        return s;
      }
      if (m.strike3 && a.t >= m.strike3At) return { ...m.strike3 };
      return { ...(m.strike2 && a.t >= m.strike2At ? m.strike2 : m.strike) };
    }
    return lerpPose(m.strike3 || m.strike2 || m.strike, movementPose(p), easeOut(clamp(a.t / m.endlag, 0, 1)) * 0.9, true);
  }
  // FLY DASH: Superman pose - body tipped forward, fist leading, legs trailing
  if (a && a.type === 'flydash') {
    const tilt = Math.atan2(a.vy, Math.abs(a.vx));                     // tip up/down with the flight angle
    return pose({ spin: p.face * (1.25 + tilt), lean: 0, legA: [0.05, 0.1], legB: [-0.1, 0.3], armA: [2.75, 0] });
  }
  if (a && a.type === 'flyRecover') {     // tumbling, off balance
    const w = Math.sin(p.anim * 16) * 0.3;
    return pose({ lean: -0.5 + w, legA: [0.8, 1.2], legB: [-0.4, 0.6], armA: [-2.2 + w, 0.4], spin: p.face * -0.3 });
  }
  // ULTIMATE poses
  if (a && a.type === 'timeStop') return { ...a.pose, raw: true };   // frozen mid-motion
  if (a && a.type === 'ultBeam') {                     // hand cupped at the hip while charging, thrust out when firing
    const m = p.moveset.neutralRanged;
    const ps = { ...(a.phase === 'charge' ? m.wind : m.strike) };
    if (a.phase === 'charge') ps.lean += Math.sin(p.anim * 70) * 0.05;   // shaking with power
    return ps;
  }
  if (a && a.type === 'ultStart') {
    const def = CHARACTERS[p.char].ult;
    return { ...(a.t < 0.12 ? def.finalWind : def.finalStrike) };
  }
  if (a && a.type === 'ultSeq' && ult) return { ...ult.userPose, raw: true };
  if (a && a.type === 'ultVictim' && ult && ult.victimPose) return { ...ult.victimPose, raw: true };   // (wrestling ultimate)
  if (a && a.type === 'whipped') {                    // flung across into the ropes, limp
    const w = Math.sin(p.anim * 20) * 0.2;
    return { ...pose({ lean: -0.5, legA: [0.6 + w, 0.6], legB: [-0.5, 0.4], armA: [-2.4 + w, 0.3], armB: [2.3, -0.3], spin: a.spin || 0 }), raw: true };
  }
  if (a && a.type === 'ultVictim' && ult) {
    // getting battered: jerks with every hit
    const j = ult.jolt > 0 ? (Math.random() - 0.5) * 0.6 : 0;
    const w = Math.sin(p.anim * 35) * 0.25;
    return { ...pose({ lean: -0.4 + j, bob: -2, legA: [-0.4 + w, 0.5], legB: [0.5, 0.9], armA: [-2.2 + w + j, 0.3], armB: [2.3 - w, -0.3],
                       spin: j * 0.5 }), raw: true };
  }
  if (a && a.type === 'clash' && a.key === 'grab') {
    // Grab clash: hands locked together, shoving back and forth (alternating who's winning)
    const beat = Math.floor(a.t / CLASH_BEAT) + a.parity;
    const push = beat % 2 ? 1 : -1;
    return pose({ lean: 0.35 + push * 0.15, bob: -8, legA: [0.85, 0.8], legB: [-0.75, 0.15],
                  grip: [(a.other.x - p.x) * p.face * 0.5 + push * 4, -66] });
  }
  if (a && a.type === 'clash') {
    // Trading blows: each fighter flips between wind-up and strike of the move they clashed with,
    // offset by one beat from the other fighter, so the hits alternate back and forth.
    const m = p.moveset[a.key] || p.moveset.jab;
    const beat = (a.blowN || 0) + a.parity;                     // flips on every exchanged blow
    const s = { ...(beat % 2 ? m.wind : (m.strike2 || m.strike)) };
    s.bob = (s.bob || 0) - 3;
    if (s.sc) s.sc = { ...s.sc, raw: false };
    return s;
  }
  if (a && a.type === 'grab') {      // lunging grab: both hands shoot out to the grab point
    const reach = a.t >= GRAB.startup && a.t <= GRAB.startup + GRAB.active;
    const whiff = a.t > GRAB.startup + GRAB.active;
    return pose({ lean: reach ? 0.45 : whiff ? 0.3 : 0.15, bob: -6, legA: [0.75, 0.7], legB: [-0.55, 0.2],
                  grip: reach ? [GRAB.reachX + 8, GRAB.reachY] : whiff ? [34, -46] : [18, -60] });
  }
  if (a && a.type === 'holding') {   // both hands clamped on their chest; pummel = knee to the gut
    const pm = (a.pummel || 0) > 0;
    if (p.look && p.look.fourArms)                 // four arms: the upper pair holds them, a lower fist pounds the gut
      return pose({ lean: 0.15, bob: -6, legA: [0.65, 0.5], legB: [-0.5, 0.2], grip: gripOn(p, a.victim),
                    lowFree: true, armC: pm ? [1.6, 0] : [0.6, -1.6], armD: [0.9, -1.5] });
    return pose({ lean: 0.15, bob: -4, legA: pm ? [1.35, 1.9] : [0.6, 0.5], legB: [-0.5, 0.2],
                  grip: gripOn(p, a.victim, pm ? -6 : 0) });
  }
  if (a && a.type === 'grabbed') {   // struggling, pushing against the grabber's arms
    const w = Math.sin(p.anim * 25) * (a.shake > 0 ? 0.35 : 0.12);
    return pose({ lean: -0.35 + w, bob: -2, legA: [0.3 + w, 0.4], legB: [-0.3, 0.3], armA: [1.2 + w, -0.6], armB: [-1.2 - w, 0.5] });
  }
  if (a && a.type === 'throw' && a.kind === 'broly') {
    // one arm locked on their ankles, swinging them over his head; leans into each slam
    if (!a.released) {
      const th = a.theta ?? BROLY.front;
      return { ...pose({ lean: BROLY.lean, bob: BROLY.bob, legA: [0.85, 0.8], legB: [-0.8, 0.15],
                         grip: brolyGeom(p, 1, th).grip }), raw: true };
    }
    return pose({ lean: 0.4, bob: -14, legA: [0.95, 1.1], legB: [-0.8, 0.3], armA: [0.6, 0] });   // follow-through
  }
  if (a && a.type === 'throw' && ['elbowDrop', 'piledriver', 'rko'].includes(a.kind)) return { ...(a.pose || pose({})) };
  if (a && a.type === 'throw' && a.kind === 'giantSwing') {
    if (a.released) return pose({ lean: -0.2, bob: -6, legA: [0.6, 0.5], legB: [-0.6, 0.3], armA: [-1.7, 0], armB: [-1.5, -0.2], armC: [-1.4, 0.1], armD: [-1.2, 0] });
    return { ...pose({ lean: -0.35, bob: -10, legA: [0.7, 0.6], legB: [-0.6, 0.4], grip: gripOn(p, a.victim, 0) }), raw: true };   // leaning back, spinning
  }
  if (a && a.type === 'throw' && a.kind === 'quadPress') {
    if (a.released) return pose({ lean: -0.2, legA: [0.3, 0.2], legB: [-0.3, 0.2], armA: [3.0, 0], armB: [2.8, 0], armC: [2.6, 0.2], armD: [2.4, 0.2] });
    return pose({ lean: -0.12, bob: -10 + Math.min(1, a.t / a.rel) * 6, legA: [0.6, 0.6], legB: [-0.6, 0.5], grip: gripOn(p, a.victim) });
  }
  if (a && a.type === 'throw') {
    const k = clamp(a.t / a.rel, 0, 1);
    const g = a.released ? null : gripOn(p, a.victim);
    if (a.kind === 'forward') {
      if (!a.released) return k < 0.45
        ? pose({ lean: -0.25, bob: -8, legA: [0.5, 0.6], legB: [-0.7, 0.3], grip: g })          // pull them in
        : pose({ lean: 0.55, bob: -6, legA: [0.9, 0.7], legB: [-0.8, 0.1], grip: g });          // heave
      return pose({ lean: 0.5, bob: -6, legA: [0.9, 0.7], legB: [-0.8, 0.1], armA: [1.9, 0], armB: [1.7, -0.2] });
    }
    if (a.kind === 'back') {
      if (!a.released) return pose({ lean: -0.3, bob: -6, legA: [0.45, 0.4], legB: [-0.6, 0.3], grip: g });
      return pose({ lean: -0.15, bob: -4, legA: [0.5, 0.4], legB: [-0.5, 0.2], armA: [1.7, 0], armB: [1.4, -0.3] });
    }
    if (a.kind === 'up') {
      if (!a.released) return pose({ lean: -0.15 - 0.15 * k, bob: -8 + 8 * k, legA: [0.4, 0.4], legB: [-0.4, 0.3], grip: g });
      return pose({ lean: -0.2, legA: [0.3, 0.2], legB: [-0.3, 0.2], armA: [3.0, 0], armB: [2.8, 0] });
    }
    // down
    if (!a.released) return k < 0.55
      ? pose({ lean: -0.25, bob: -2, legA: [0.4, 0.3], legB: [-0.5, 0.2], grip: g })              // lift
      : pose({ lean: 0.7, bob: -14, legA: [0.9, 1.3], legB: [-0.7, 0.6], grip: g });             // slam
    return pose({ lean: 0.65, bob: -14, legA: [0.9, 1.3], legB: [-0.7, 0.6], armA: [0.5, 0], armB: [0.3, 0] });
  }
  if (a && a.type === 'thrown' && a.holder.action && a.holder.action.kind === 'broly') {
    // hanging upside down by the ankles, legs together, arms flailing
    const w = Math.sin(p.anim * 22) * 0.35;
    return { ...pose({ lean: 0, bob: 0, legA: [0.08, 0.05], legB: [-0.08, 0.05], armA: [2.6 + w, 0.4], armB: [-2.5 - w, -0.4],
                       spin: a.holder.action.vspin || 0 }), raw: true };
  }
  if (a && a.type === 'thrown' && a.holder.action && a.holder.action.vspin !== undefined) {
    // Aiden's throws: swung round flat (giant swing) / hoisted, slammed and lying flat (elbow drop)
    const w = Math.sin(p.anim * 20) * 0.25;
    return { ...pose({ lean: 0, legA: [0.2 + w, 0.2], legB: [-0.2, 0.2], armA: [2.6 + w, 0.3], armB: [-2.5 - w, -0.3],
                       spin: a.holder.action.vspin }), mirror: !!a.holder.action.vmirror, raw: true,
             turnX: a.holder.action.turn !== undefined ? a.holder.action.turn : 1 };   // (turn: corkscrewing round with him - piledriver)
  }
  if (a && a.type === 'thrown') {    // limp and tumbling through the throw
    const ha = a.holder.action;
    const k = ha && ha.rel ? clamp(ha.t / ha.rel, 0, 1) : 1;
    const spin = a.kind === 'forward' ? -0.9 * k : a.kind === 'back' ? 2.3 * k
               : a.kind === 'up' ? -1.3 * k : (k < 0.55 ? -0.4 * k : -1.55);
    const w = Math.sin(p.anim * 20) * 0.2;
    return { ...pose({ lean: -0.3, legA: [0.5 + w, 0.9], legB: [-0.4, 0.6], armA: [2.2 - w, 0.3], armB: [-2.0, -0.3], spin }),
             raw: true };
  }
  if (a && a.type === 'parried') {   // staggering back, arms flung open
    const w = Math.sin(p.anim * 14) * 0.15;
    return pose({ lean: -0.55 + w, bob: -2, legA: [0.5, 0.4], legB: [-0.45, 0.2], armA: [-2.4, 0.3], armB: [2.5, -0.3] });
  }
  if (a && a.type === 'land') return pose({ bob: -10, lean: 0.3, legA: [0.75, 1.5], legB: [0.55, 1.3] });
  if (a && a.type === 'spot') return pose({ lean: 0.35, bob: -10, legA: [0.75, 1.5], legB: [0.55, 1.3], armA: [0.9, -1.9], armB: [0.5, -1.9] });
  if (a && a.type === 'roll') {
    const prog = Math.min(1, a.t / (a.dur * 0.8));
    return pose({ lean: 0.6, bob: -14, spin: a.dx * prog * Math.PI * 2, legA: [1.6, 2.5], legB: [1.3, 2.3], armA: [1.2, -1.6], armB: [0.8, -1.6] });
  }
  if (a && a.type === 'air') return pose({ lean: 0.3, bob: -4, legA: [1.1, 2.0], legB: [0.6, 1.6], armA: [0.9, -2.0], armB: [0.4, -2.0] });
  if (p.shielding) return pose({ lean: 0.2, bob: -5, legA: [0.5, 0.9], legB: [-0.3, 0.5], armA: [1.6, -1.9], armB: [1.2, -2.0] });
  if (a && a.type === 'dizzy') {
    const w = Math.sin(p.anim * 6) * 0.25;
    return pose({ lean: w * 1.5, bob: -3, legA: [0.25, 0.3], legB: [-0.25, 0.2], armA: [0.3 + w, 0.2], armB: [-0.3 + w, -0.2] });
  }
  if (a && a.type === 'hitstun') {
    const w = Math.sin(p.anim * 30) * 0.3;
    return pose({ lean: -0.4, legA: [-0.5 + w, 0.4], legB: [0.4, 0.8], armA: [-2.3 + w, 0.3], armB: [2.4 - w, -0.3] });
  }
  return movementPose(p);
}

// Smooth animation: the drawn pose glides toward the target pose instead of snapping (no more "paper cut-out").
const POSE_SMOOTH = 26, POSE_SMOOTH_ATTACK = 45;
function tickPose(f, dt) {
  const target = getPose(f);
  if (!f.disp || target.raw) { f.disp = target; return; }   // raw poses (being thrown) are already smooth
  const fast = f.action && ['attack', 'clash', 'grab', 'holding', 'throw', 'ultStart'].includes(f.action.type);
  f.disp = lerpPose(f.disp, target, 1 - Math.exp(-dt * (fast ? POSE_SMOOTH_ATTACK : POSE_SMOOTH)), true);
  if (target.sc && target.sc.raw) f.disp.sc = target.sc;   // fast weapon arcs are already smooth
  f.disp.turn = target.turn;
  f.disp.grip = target.grip;                                // hands stay locked on whoever is being held
  f.disp.lowFree = target.lowFree;                          // (four arms: lower pair not on the grip)
  if (f.disp.sc && target.sc) f.disp.sc.hands = target.sc.hands;   // which hands hold the weapon switches instantly
}

function figureOf(p) {
  return { x: p.x, y: p.y, vx: p.vx, vy: p.vy, face: p.face, pose: p.disp || getPose(p), squash: p.squash,
           color: bodyColorOf(p), ink: inkOf(p), look: p.look, transformed: !!p.transformed, noScythe: !!p.noScythe };
}

// Characters can have their own body color (Colby is red). If both players pick the same character,
// the second one is drawn darker so you can tell them apart.
function bodyColorOf(p) {
  const b = p.look && p.look.body;
  if (!b) return p.color;
  const twin = fighters.some(o => o !== p && o.look && o.look.body === b) && fighters.indexOf(p) > 0;
  if (!twin) return b;
  const n = parseInt(b.slice(1), 16), lum = ((n >> 16) + ((n >> 8) & 255) + (n & 255)) / 3;
  return lum < 60 ? shade(b, 2.4) : shade(b, 0.55);          // a black body goes charcoal grey for the twin instead
}

// ---------- 2.5D scythe ----------
// sc = { gx, gy: front-hand grip (from the shoulder, x = forward), pitch: shaft angle up/down
//        (0 = forward, 1.57 = up, 3.14 = back), yaw: turn around the body (0 = in the screen plane,
//        + = toward the camera, - = into the screen), n: the plane the swing happens in (blade leads
//        the swing), hands: 2 = two-handed, 'B' = back hand only }
const CAM_TILT = 0.45;
function scytheGeom(shoulder, sc, f) {
  const cp = Math.cos(sc.pitch);
  const d = [cp * Math.cos(sc.yaw), -Math.sin(sc.pitch), cp * Math.sin(sc.yaw)];
  const n = sc.n || Z_AXIS;
  let b = [n[1] * d[2] - n[2] * d[1], n[2] * d[0] - n[0] * d[2], n[0] * d[1] - n[1] * d[0]];   // n x d
  let bl = Math.hypot(b[0], b[1], b[2]);
  if (bl < 0.05) { b = [0, -1, 0]; bl = 1; }
  b = [b[0] / bl, b[1] / bl, b[2] / bl];
  const g = { x: shoulder.x + sc.gx * f, y: shoulder.y + sc.gy };
  // Camera looks down slightly, so things toward us sit a bit lower on screen (flat swings become ellipses)
  const pd = [d[0], d[1] + d[2] * CAM_TILT, d[2]], pb = [b[0], b[1] + b[2] * CAM_TILT, b[2]];
  const at = s => ({ x: g.x + pd[0] * s * f, y: g.y + pd[1] * s, z: d[2] * s });
  return { g, d: pd, b: pb, at, f, depth: d[2] * 72 + b[2] * 30, hands: sc.hands, hb: handB(sc) };
}

function drawScythe3D(S, tint) {
  const { d, b, at, f } = S;
  const behind = S.depth < -8;
  const butt = at(-34), top = at(72);
  ctx.lineCap = 'round';
  ctx.strokeStyle = tint || (sketch ? '#1b1b1b' : behind ? '#1a1716' : '#26211f');
  ctx.lineWidth = sketch ? 4 : 5;
  if (sketch) inkLine([butt, top]);
  else { ctx.beginPath(); ctx.moveTo(butt.x, butt.y); ctx.lineTo(top.x, top.y); ctx.stroke(); }
  // Blade: curls back from the top of the shaft, foreshortened by how it's turned toward/away from us
  const BL = 1.3;   // blade size (big reaper blade, like the sketch)
  const bx = b[0] * f * BL, by = b[1] * BL, dx = d[0] * f, dy = d[1];
  const tip = { x: top.x + bx * 60 - dx * 30, y: top.y + by * 60 - dy * 30 };
  const c1 = { x: top.x + bx * 40 + dx * 14, y: top.y + by * 40 + dy * 14 };
  const c2 = { x: top.x + bx * 26 + dx * 1, y: top.y + by * 26 + dy * 1 };
  // Sketch: dark graphite-shaded blade with an ink outline and a white highlight, like the drawing
  ctx.fillStyle = tint || (sketch ? (behind ? '#6a6a6a' : '#3a3a3a') : behind ? '#6e6e78' : '#b4b4bb');
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);
  ctx.quadraticCurveTo(c1.x, c1.y, tip.x, tip.y);
  ctx.quadraticCurveTo(c2.x, c2.y, top.x - dx * 8, top.y - dy * 8);
  ctx.fill();
  if (sketch && !tint) { ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke(); }
  if (!tint && !behind) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.quadraticCurveTo(c1.x, c1.y, tip.x, tip.y); ctx.stroke();
  }
}

// Two-bone arm reaching for a point (elbow bends downward, like holding a weapon)
function ikArm(root, target, l1 = 16, l2 = 15) {
  let dx = target.x - root.x, dy = target.y - root.y;
  let dist = Math.hypot(dx, dy) || 0.001;
  const reach = Math.min(Math.max(dist, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.01);
  const base = Math.atan2(dy, dx);
  const alpha = Math.acos(clamp((l1 * l1 + reach * reach - l2 * l2) / (2 * l1 * reach), -1, 1));
  const e1 = { x: root.x + Math.cos(base + alpha) * l1, y: root.y + Math.sin(base + alpha) * l1 };
  const e2 = { x: root.x + Math.cos(base - alpha) * l1, y: root.y + Math.sin(base - alpha) * l1 };
  const elbow = e1.y > e2.y ? e1 : e2;
  const hand = { x: root.x + dx / dist * reach, y: root.y + dy / dist * reach };
  if (sketch) return inkLine([root, elbow, hand]);
  ctx.beginPath(); ctx.moveTo(root.x, root.y); ctx.lineTo(elbow.x, elbow.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();
}

function drawFigure(fig, opts = {}) {
  let f = fig.face, pz = fig.pose;
  if (pz.mirror) f = -f;                              // mid-spin: drawn facing the other way for this frame
  // CORKSCREW SPIN (turnX = cos of the turn angle, -1..1): the body narrows as it turns side-on and
  // flips to face the other way past 90 degrees - a smooth spin round a vertical axis
  const turnX = pz.turnX !== undefined ? pz.turnX : 1;
  if (turnX < 0) f = -f;
  const sq = fig.squash;
  // Spinning moves: when the scythe swings round behind him, his body turns too (we flip which way
  // he's drawn facing, and mirror the scythe angle so it stays pointing the same way in the world)
  if (pz.turn && pz.sc && Math.cos(pz.sc.yaw) < 0) {
    f = -f;
    const n = pz.sc.n || Z_AXIS;
    pz = { ...pz, sc: { ...pz.sc, yaw: Math.PI - pz.sc.yaw, n: [-n[0], -n[1], -n[2]] } };   // blade keeps leading
  }
  const look = fig.look || {};
  ctx.save();
  ctx.globalAlpha = opts.alpha ?? 1;
  ctx.translate(snap(fig.x), snap(fig.y));
  if (look.scale) ctx.scale(look.scale, look.scale);         // (Aiden is a bigger guy)
  if (turnX !== 1) ctx.scale(Math.max(0.22, Math.abs(turnX)), 1);   // corkscrew spin: squeezed side-on
  ctx.scale(1 + sq * 0.5, 1 - sq * 0.5);

  const hipY = -(LEG_UP + LEG_LOW - 1) - pz.bob * LEG_SCALE;
  if (pz.spin) { ctx.translate(0, hipY); ctx.rotate(pz.spin); ctx.translate(0, -hipY); }

  const hip = { x: 0, y: hipY };
  const shoulder = { x: Math.sin(pz.lean) * TORSO * f, y: hip.y - Math.cos(pz.lean) * TORSO };
  const head = { x: shoulder.x + Math.sin(pz.lean) * NECK * f, y: shoulder.y - NECK };
  const main = opts.tint || (sketch ? fig.ink : fig.color);
  const back = opts.tint || (sketch ? main : shade(fig.color, 0.62));   // far-side limbs a bit darker, for depth
  const S = look.scythe3d && pz.sc && !fig.noScythe ? scytheGeom(shoulder, pz.sc, f) : null;   // (no scythe after throwing it)
  const LW = (sketch ? 7 : 9) + (opts.outline || 0);  // sketch: marker-pen thickness (+ fatter for the dark OUTLINE pass)
  const ink = sketch ? main : null;                   // sketch: hair is outlined in the fighter's pen

  // Solid, thick, flat-colored figure (Combat Gods style), no outline
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = LW;
  ctx.strokeStyle = back;
  if (look.muscle) ctx.lineWidth = LW + 2;                   // thick legs
  limb(hip, pz.legB, LEG_UP, LEG_LOW, f);
  ctx.lineWidth = LW;
  // SAIYAN TAIL (Lance): a furry brown tail out of the small of his back, curling up at the end and
  // swaying as he moves. Super Saiyan: it turns GOLD and glows.
  if (look.tail) {
    const ssj = fig.transformed && !!look.tailSsj;              // (only Lance's tail goes gold)
    const sway = Math.sin(time * 3.2 + fig.x * 0.01) * 0.35 + clamp(-(fig.vx || 0) * 0.0008, -0.4, 0.4) * f;
    const lift = clamp(-(fig.vy || 0) * 0.006, -8, 10);
    const base = { x: hip.x - f * 4, y: hip.y - 6 };
    const pts = [];
    const bez = (p0, p1, p2, p3, n) => { for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u;
      pts.push({ x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
                 y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y }); } };
    if (look.tailSpade) {                                      // demon tail: droops, then whips up at the end
      const tip = { x: base.x - f * (44 + sway * 12), y: base.y - 2 - lift + sway * 6 };
      bez(base, { x: base.x - f * 16, y: base.y + 22 }, { x: base.x - f * (40 + sway * 8), y: base.y + 26 - lift * 0.5 }, tip, 12);
      pts.push({ x: tip.x - f * 4, y: tip.y - 9 });
    } else {
      // SAIYAN TAIL (Goku/Vegeta style): same thickness all the way, swings down and back from the small of
      // his back in a smooth S, then rolls up into a round curl at the end
      const P = { x: base.x - f * (30 + sway * 6), y: base.y + 14 - lift * 0.4 + sway * 3 };
      bez(base, { x: base.x - f * 6, y: base.y + 20 }, { x: P.x + f * 4, y: P.y + 16 }, P, 10);
      const r = 8.5 + sway * 1.2, C = { x: P.x - f * r, y: P.y };        // curls up and away from his body
      for (let i = 1; i <= 14; i++) {
        const ang = (i / 14) * Math.PI * 1.55;                           // ~280 degrees of a loop
        pts.push({ x: C.x + f * Math.cos(ang) * r * (1 - i * 0.012), y: C.y - Math.sin(ang) * r * (1 - i * 0.012) });
      }
    }
    const col = opts.tint || (sketch ? (ssj ? '#e0a400' : main) : ssj ? look.tailSsj || '#ffd23f' : look.tail);
    const stroke = (w, list = pts) => { ctx.lineWidth = w; ctx.beginPath(); list.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); };
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (ssj && !opts.tint && !sketch) {                        // golden glow around it, flickering
      ctx.strokeStyle = `rgba(255,220,80,${0.25 + 0.15 * Math.sin(time * 20)})`; stroke(13);
      ctx.strokeStyle = 'rgba(255,240,160,0.4)'; stroke(9);
    }
    if (look.tailSpade) {
      ctx.strokeStyle = col;
      for (let i = 1; i < pts.length; i++) {                   // demon tail tapers toward the tip
        ctx.lineWidth = 7 - i * 0.35;
        ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
      }
    } else {
      // FURRY (not shiny): a matte base, then little tufts of fur sticking out all along both sides,
      // slanted back toward his body like brushed fur, in a few shades of brown (gold in Super Saiyan)
      const baseHex = ssj ? '#c98a00' : (col.startsWith('#') ? col : '#6b4423');
      if (!opts.tint && !sketch) { ctx.strokeStyle = shade(baseHex, 0.72); stroke(7); }   // dark under-fur edge
      ctx.strokeStyle = col; stroke(5);
      if (!opts.tint && !sketch) {
        const shades = [shade(baseHex, 1.22), col, shade(baseHex, 0.82)];
        ctx.lineWidth = 1.5;
        for (let i = 1; i < pts.length; i++) {
          const p0 = pts[i - 1], p1 = pts[i];
          const dx = p1.x - p0.x, dy = p1.y - p0.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
          for (let k = 0; k < 3; k++) {
            const side = k === 1 ? 1 : -1, mid = k === 2 ? 0.5 : 0;            // tufts on both edges (+ one more on the outer edge)
            const len = 3.4 + ((i * 7 + k * 3) % 5) * 0.55;                       // uneven fur lengths (fixed per spot, so it doesn't flicker)
            const bx = lerp(p0.x, p1.x, 1 - mid) + nx * side * 2.2, by = lerp(p0.y, p1.y, 1 - mid) + ny * side * 2.2;
            ctx.strokeStyle = shades[(i + k) % 3];
            ctx.beginPath(); ctx.moveTo(bx, by);
            ctx.lineTo(bx + nx * side * len - ux * len * 0.9, by + ny * side * len - uy * len * 0.9);
            ctx.stroke();
          }
        }
      }
    }
    if (look.tailSpade) {                                      // the arrowhead spade on the end of a demon tail
      const e = pts[pts.length - 1], p0 = pts[pts.length - 2];
      const ang = Math.atan2(e.y - p0.y, e.x - p0.x), ca = Math.cos(ang), sa = Math.sin(ang);
      const P = (fw, sd) => ({ x: e.x + ca * fw - sa * sd, y: e.y + sa * fw + ca * sd });
      const pts2 = [P(13, 0), P(1, 7), P(3, 0), P(1, -7)];
      ctx.fillStyle = opts.tint || (sketch ? main : look.tailSpadeColor || col);
      ctx.beginPath(); pts2.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
    }
    ctx.lineWidth = LW;
  }
  // Grappling: both hands reach for a point (the opponent's chest) - pz.grip = [forward, up] from the feet
  const grip = pz.grip ? { x: pz.grip[0] * f, y: pz.grip[1] } : null;
  // FOUR ARMS (Machamp style): a second pair of arms comes out of the ribs, just under the shoulders
  const four = !!look.fourArms;
  const lowSh = four ? { x: lerp(shoulder.x, hip.x, 0.42), y: lerp(shoulder.y, hip.y, 0.42) } : null;
  const AL = look.muscle ? 19 : 16, AL2 = look.muscle ? 17 : 15;   // (big guys have longer arms)
  const armC = four ? (pz.armC || lowerArm(pz.armA)) : null, armD = four ? (pz.armD || lowerArm(pz.armB)) : null;
  const lowGrip = four && grip && !pz.lowFree;               // grappling: all four hands clamp on
  const MUS = look.muscle && !sketch;
  const ARM_W = look.muscle ? LW + 3 : LW;                   // big muscular arms
  const EDGE = MUS && !opts.tint ? shade(fig.color, 0.5) : null;   // dark edge on arms in front of the body
  ctx.lineWidth = ARM_W;
  // Far arm: grips the opponent, or holds the lower part of the shaft (two hands) / the whole scythe (one hand)
  if (look.oneArm) { /* only one arm (Future Gohan) - nothing on the far side */ }
  else if (grip) ikArm(shoulder, { x: grip.x - f * 3, y: grip.y + 7 });
  else if (S && (S.hands === 2 || S.hands === 'B')) ikArm(shoulder, S.at(S.hb));
  else if (MUS) muscleLimb(shoulder, pz.armB, AL, AL2, f, ARM_W, back, null);
  else limb(shoulder, pz.armB, 16, 15, f);
  if (four) {                                                 // far LOWER arm
    ctx.strokeStyle = back; ctx.lineWidth = ARM_W;
    if (lowGrip) ikArm(lowSh, { x: grip.x - f * 4, y: grip.y + 28 }, 15, 14);
    else if (MUS) muscleLimb(lowSh, armD, AL - 1, AL2 - 1, f, ARM_W - 1, back, null);
    else limb(lowSh, armD, 15, 14, f);
  }
  ctx.lineWidth = LW;

  if (S && S.depth < -8) drawScythe3D(S, opts.tint);     // scythe is behind his body

  // Long hair: thick, straight strands swept back off the head, hanging down past his neck to the
  // shoulder blades. Drawn behind the body. It trails behind him when he moves.
  if (look.longHair) {
    const sway = clamp(-(fig.vx || 0) * 0.014, -14, 14);
    const lift = clamp(-(fig.vy || 0) * 0.008, -8, 10);
    const strands = [ // [root angle offset, tip back, tip down, width] - thick, straight, down to the shoulder blades
      [0.15, 14, 46, 0.5], [0.55, 21, 40, 0.46], [0.95, 26, 32, 0.4], [0.35, 8, 50, 0.44]];
    strands.forEach(([ao, tb, td, w], i) => {
      ctx.fillStyle = sketch ? PAPER : opts.tint || (i === 3 ? look.longHair : shade(look.longHair, 0.82));
      const a = -Math.PI / 2 - f * ao;                    // around the back of the head
      const tip = { x: head.x - f * tb + sway * (0.6 + i * 0.15), y: head.y + td - lift * (0.5 + i * 0.2) };
      ctx.beginPath();
      ctx.moveTo(head.x + Math.cos(a - w) * 11, head.y + Math.sin(a - w) * 11);
      ctx.quadraticCurveTo(head.x - f * (tb * 0.6) + sway * 0.4, head.y + td * 0.3, tip.x, tip.y);
      ctx.lineTo(head.x - f * 3, head.y + 14);
      ctx.lineTo(head.x + Math.cos(a + w) * 11, head.y + Math.sin(a + w) * 11);
      ctx.fill();
      if (ink) { ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke(); }   // inked outline
    });
  }

  ctx.lineWidth = LW;
  ctx.strokeStyle = main;
  if (look.muscle) {
    // MUSCULAR: a big V-shaped torso (broad chest and shoulders, narrow waist) instead of a single line
    const ux = (shoulder.x - hip.x) / TORSO, uy = (shoulder.y - hip.y) / TORSO;       // up the spine
    const px = -uy, py = ux;                                                           // across the body
    ctx.fillStyle = main;
    ctx.beginPath();
    ctx.moveTo(hip.x + px * 8, hip.y + py * 8);
    ctx.lineTo(shoulder.x + px * 20 + ux * 4, shoulder.y + py * 20 + uy * 4);
    ctx.quadraticCurveTo(shoulder.x + ux * 12, shoulder.y + uy * 12, shoulder.x - px * 20 + ux * 4, shoulder.y - py * 20 + uy * 4);   // traps up to the neck
    ctx.lineTo(hip.x - px * 8, hip.y - py * 8);
    ctx.closePath(); ctx.fill();
    if (sketch) { ctx.lineWidth = 2.5; ctx.stroke(); ctx.lineWidth = LW; }
    else if (!opts.tint) {                                     // pecs + abs lines (shading)
      ctx.strokeStyle = look.detail || shade(fig.color, 0.6); ctx.lineWidth = 2; ctx.stroke();      // torso outline
      ctx.strokeStyle = look.detail || shade(fig.color, 0.72); ctx.lineWidth = 2;
      const cx = shoulder.x - ux * 9, cy = shoulder.y - uy * 9;
      ctx.beginPath(); ctx.moveTo(cx - px * 11, cy - py * 11); ctx.quadraticCurveTo(cx + ux * -6, cy + uy * -6, cx, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + px * 11, cy + py * 11); ctx.quadraticCurveTo(cx + ux * -6, cy + uy * -6, cx, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(hip.x + ux * 6, hip.y + uy * 6); ctx.stroke();       // abs line
      for (const k of [0.35, 0.6]) {
        const ax = lerp(cx, hip.x, k), ay = lerp(cy, hip.y, k);
        ctx.beginPath(); ctx.moveTo(ax - px * 5, ay - py * 5); ctx.lineTo(ax + px * 5, ay + py * 5); ctx.stroke();
      }
      ctx.strokeStyle = main; ctx.lineWidth = LW;
    }
    ctx.lineWidth = LW + 2;
    limb(hip, pz.legA, LEG_UP, LEG_LOW, f);
    ctx.lineWidth = LW;
  } else {
    line(hip, shoulder);
    limb(hip, pz.legA, LEG_UP, LEG_LOW, f);
  }
  // FLAME BELT (Incineroar): a ring of flickering fire around his waist
  if (look.flameBelt) {
    const fl = sketch ? ['#e0a400'] : opts.tint ? [opts.tint] : ['#ff5a1a', '#ffb02e', '#ffe066'];
    for (let k = -2; k <= 2; k++) {
      const bx = hip.x + k * 4.5, by = hip.y - 2, hgt = 4 + 4 * hash(Math.floor(time * 18) + k * 7);
      ctx.fillStyle = fl[(k + 2) % fl.length];
      ctx.beginPath(); ctx.moveTo(bx - 4, by + 3); ctx.lineTo(bx, by - hgt); ctx.lineTo(bx + 4, by + 3); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = opts.tint || (sketch ? main : '#1a1a1a');
    ctx.fillRect(hip.x - 10, hip.y - 2, 20, 5);                // the belt itself
  }

  // Round head
  ctx.fillStyle = main;
  ctx.beginPath(); ctx.arc(head.x, head.y, 12 + (opts.outline || 0) / 2, 0, Math.PI * 2); ctx.fill();
  // Spiky swept-back hair (Hwoarang style)
  if (look.hair) {
    ctx.fillStyle = opts.tint || look.hair;
    for (let k = 0; k < 4; k++) {
      const a = -Math.PI / 2 - f * (0.1 + k * 0.45);
      const tip = a - f * 0.35;
      const len = 26 - k * 2;
      ctx.beginPath();
      ctx.moveTo(head.x + Math.cos(a - 0.4) * 10, head.y + Math.sin(a - 0.4) * 10);
      ctx.lineTo(head.x + Math.cos(tip) * len, head.y + Math.sin(tip) * len);
      ctx.lineTo(head.x + Math.cos(a + 0.4) * 10, head.y + Math.sin(a + 0.4) * 10);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(head.x - f * 2, head.y - 3, 11, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
  }
  if (look.longHair) {
    // Crown: hair swept straight back over the top of the head (no bangs - it's pulled back)
    ctx.fillStyle = sketch ? PAPER : opts.tint || look.longHair;
    // Covers from just in front of the top of the head, over the top, round to the back of the neck
    const mir = a => f > 0 ? a : Math.PI - a;
    ctx.beginPath();
    ctx.arc(head.x - f * 1, head.y - 1, 13, mir(-0.95), mir(2.75), f > 0);
    ctx.lineTo(head.x - f * 3, head.y + 2);
    ctx.fill();
    if (ink) {                                 // outline + a couple of pen strokes for strands
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(head.x + f * 4, head.y - 11); ctx.quadraticCurveTo(head.x - f * 6, head.y - 10, head.x - f * 11, head.y + 2); ctx.stroke();
    }
  }
  if (look.horns) {
    // DEMON HORNS (like the reference sculpt): a pair of tall RED horns rising off either side of the top
    // of his head. Each one grows out of a gnarled, ridged knot of horn at the base, throws off a small
    // curled prong low down, bows outward, then sweeps up tall with the tip curving back inward.
    // (s = which side: +1 = the side he faces / in front, -1 = the far side, drawn darker behind)
    const spine = [[7, -9, 5.2], [11, -17, 4.8], [13, -27, 4.0], [12, -37, 3.0], [8.5, -46, 1.8], [4.5, -53, 0]];   // [x, y, half-width]
    const hornCols = s => s > 0 ? { body: '#c62a22', dark: '#7d1712', lite: '#ff6b5c' } : { body: '#8d1c16', dark: '#561009', lite: '#c44a3c' };
    const drawHorn = s => {
      const C = hornCols(s), P = ([x, y]) => ({ x: head.x + s * f * x, y: head.y + y });
      const fill = col => { ctx.fillStyle = opts.tint || (sketch ? main : col); };
      // the main horn: outline built from the spine, offset to each side by its width
      const L = [], R = [];
      spine.forEach(([x, y, w], i) => {
        const nx = spine[Math.min(i + 1, spine.length - 1)], pv = spine[Math.max(i - 1, 0)];
        let dx = nx[0] - pv[0], dy = nx[1] - pv[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        L.push(P([x - dy * w, y + dx * w])); R.push(P([x + dy * w, y - dx * w]));
      });
      fill(C.body);
      ctx.beginPath(); L.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i].x, R[i].y); ctx.closePath(); ctx.fill();
      // little ridge spikes along the outer edge
      fill(C.body);
      for (const [i, len] of [[1, 5], [2, 4]]) {
        const [x, y, w] = spine[i];
        const a = P([x + w * 0.6, y + 2]), b = P([x + w + len, y - 2]), c = P([x + w * 0.6, y - 4]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.closePath(); ctx.fill();
      }
      // the small curled prong low on the outside
      ctx.beginPath(); const q0 = P([10, -10]), q1 = P([19, -12]), q2 = P([21, -22]), q3 = P([15, -15]);
      ctx.moveTo(q0.x, q0.y); ctx.quadraticCurveTo(q1.x, q1.y, q2.x, q2.y); ctx.quadraticCurveTo(q3.x, q3.y, P([9, -14]).x, P([9, -14]).y); ctx.closePath(); ctx.fill();
      // gnarled knot of horn at the base
      fill(C.dark);
      for (const [x, y, r] of [[6, -9, 4.5], [10, -11, 4], [8, -14, 3.5], [12, -9, 3]]) { const p = P([x, y]); ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); }
      if (!opts.tint && !sketch) {
        ctx.fillStyle = C.body;
