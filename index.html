}

const FIG_OUTLINE = 4.5, FIG_OUTLINE_COLOR = '#0b0808';   // fighter outline: extra thickness / colour

// ---------------- ATTACK SMEARS ----------------
// Like the white crescent smears in an animated fight: while an attack is coming out, whichever hand or
// foot is whipping through the air fastest leaves a short, tapered white arc behind it.
const SMEAR = { minSpeed: 650, life: 0.085, width: 15 };
// Where a fighter's hands and feet are in the world right now (same maths as drawFigure)
function figureTips(p) {
  const pz = p.disp; if (!pz) return null;
  let f = p.face; if (pz.mirror) f = -f;
  const sc = (p.look && p.look.scale) || 1;
  const hipY = -(LEG_UP + LEG_LOW - 1) - pz.bob * LEG_SCALE;
  const sh = { x: Math.sin(pz.lean) * TORSO * f, y: hipY - Math.cos(pz.lean) * TORSO };
  const end = (r, [th, bend], l1, l2) => {
    const mx = r.x + Math.sin(th) * l1 * f, my = r.y + Math.cos(th) * l1, a2 = th - bend;
    return { x: mx + Math.sin(a2) * l2 * f, y: my + Math.cos(a2) * l2 };
  };
  const pts = { hA: end(sh, pz.armA, 16, 15), hB: end(sh, pz.armB, 16, 15),
                fA: end({ x: 0, y: hipY }, pz.legA, LEG_UP, LEG_LOW), fB: end({ x: 0, y: hipY }, pz.legB, LEG_UP, LEG_LOW) };
  const c = Math.cos(pz.spin || 0), s = Math.sin(pz.spin || 0);
  for (const k in pts) {
    let { x, y } = pts[k];
    if (pz.spin) { const dy = y - hipY; [x, y] = [x * c - dy * s, hipY + x * s + dy * c]; }
    pts[k] = { x: p.x + x * sc, y: p.y + y * sc };
  }
  return pts;
}
function updateSmear(p, dt) {
  const tr = p.smear || (p.smear = { pts: [], prev: null });
  for (const q of tr.pts) q.age += dt;
  while (tr.pts.length && tr.pts[0].age > SMEAR.life) tr.pts.shift();
  const a = p.action;
  const swinging = a && a.type === 'attack' && (a.phase === 'active' || (a.phase === 'end' && a.t < 0.04)) && !a.move.rapid && !a.move.beam;
  const tips = p.respawnTimer <= 0 ? figureTips(p) : null;
  if (swinging && tips && tr.prev && dt > 0) {
    let best = null, bv = 0;
    for (const k in tips) {                                 // the fastest-moving hand/foot (relative to his body)
      const v = Math.hypot(tips[k].x - tr.prev[k].x - p.vx * dt, tips[k].y - tr.prev[k].y - p.vy * dt) / dt;
      if (v > bv) { bv = v; best = k; }
    }
    if (best && bv > SMEAR.minSpeed) {
      if (tr.key !== best && tr.pts.length) tr.pts.length = 0;   // a different limb: start a new smear
      tr.key = best;
      tr.pts.push({ x: tips[best].x, y: tips[best].y, age: 0 });
      if (tr.pts.length > 12) tr.pts.shift();
    }
  }
  tr.prev = tips;
}
function drawSmear(p) {
  const tr = p.smear;
  if (!tr || tr.pts.length < 3 || sketch) return;
  const P = tr.pts, n = P.length;
  // a crescent ribbon: thin at the oldest end, full width at the newest, fading out as it ages
  const L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = SMEAR.width * (i / (n - 1)) * (1 - P[i].age / SMEAR.life);
    L.push({ x: P[i].x - dy * w, y: P[i].y + dx * w }); R.push({ x: P[i].x + dy * w * 0.25, y: P[i].y - dx * w * 0.25 });
  }
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(L[0].x, L[0].y);
  for (const q of L) ctx.lineTo(q.x, q.y);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i].x, R[i].y);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawFighter(p) {
  const a = p.action;
  const tired = a && a.level > 0;
  const intangible = isIntangible(p) && p.invuln <= 0 && !(a && ['clash', 'thrown', 'ultSeq', 'ultVictim', 'ultBeam'].includes(a.type));   // not dodging
  const blink = p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0;
  const charging = a && a.type === 'attack' && a.phase === 'charge';
  const chargeFlash = charging && Math.floor(p.anim * 16) % 2 === 0;

  let tint = null;
  if (p.hitFlash > 0) tint = '#ffffff';                                  // flash white when hit
  else if (intangible) tint = tired ? '#6e6e78' : '#cdb79a';
  else if (a && a.type === 'timeStop') tint = a.hell ? '#5a1414' : '#9d8fd6';   // frozen in time: lavender-grey (Hellwave: scorched blood-red)
  else if (chargeFlash) tint = p.energy;
  // Sketch: hit = red pen, dodging = pencil grey, charging = yellow highlighter
  if (sketch && tint) tint = p.hitFlash > 0 ? '#c0392b' : intangible ? (tired ? '#b0b0b0' : '#8c8c8c') : '#e0a400';

  if (p.dodgeCount > DODGE_FREE && Math.random() < 0.15) burst(p.x, p.y - p.h, SWEAT, 1, Math.PI / 2, 0.8, 150);

  // Z vanish: almost invisible while air-dodging, with a faint flicker as you zip across
  const vanished = intangible && a && a.type === 'air';
  const alpha = blink ? 0.45 : vanished ? (Math.floor(p.anim * 40) % 3 === 0 ? 0.28 : 0.06) : intangible ? 0.75 : 1;
  // Ki AURA: flickers around ki fighters while charging, firing ki or flying
  const powered = p.look && p.look.aura && a && (a.type === 'flydash' || charging || a.type === 'ultBeam' ||
    (a.type === 'attack' && (a.move.rapid || a.move.beam) && a.phase !== 'end') ||
    (ult && ult.user === p && ult.phase === 'final'));                      // ultimate charge-up
  if (p.transformed) drawAura(p, auraColor(p), true);                       // TRANSFORMED: big, constant aura (everyone)
  else if (powered) drawAura(p);
  else if (p.look && p.look.bossAura) {                                     // the final boss always smoulders
    // HELLFIRE SHOT stored (not being charged right now): his aura tells you. Partly charged = it burns a
    // bit bigger and brighter. FULLY charged = it swells up and THROBS like a heartbeat, flashing white-hot
    // at the edge and crackling with red lightning.
    const stored = !(a && a.charging) ? (p.cshot || 0) : 0;
    const base = (p.demon || 0) >= 100 ? 0.75 : 0.4;
    if (stored >= 1) {
      const beat = Math.pow(0.5 + 0.5 * Math.sin(time * 9), 2), sc = 1.12 + 0.16 * beat;
      drawAura(p, beat > 0.5 ? '#ff2a2a' : '#ff5a2a', true, sc, 0.85 + 0.15 * beat);
      if (!sketch) {
        ctx.save(); ctx.globalAlpha = 0.25 + 0.6 * beat; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
        spikyAuraPath(p.x, p.y - 46, 30 * sc, 52 * sc, 30 * sc, 0); ctx.stroke(); ctx.restore();
      }
      if (Math.random() < 0.12) bolt(p.x + (Math.random() - 0.5) * 40, p.y - 50 - Math.random() * 30, Math.random() * Math.PI * 2, 40, 0.07, Math.random() < 0.5 ? '#ff2a2a' : '#ffffff');
    } else drawAura(p, p.look.bossAura, false, 1.0 + 0.15 * stored, base + 0.35 * stored);
  }
  if (p.kaioken) for (let k = 0; k < Math.min(2, p.kaioken); k++) drawAura(p, KAIOKEN.color, !p.transformed && k === 0);   // (x2 / x3: a bigger, double aura)                // KAIOKEN: red aura (on top of Super Saiyan's gold)
  if (p.minion) {
    // SHADOW CLONE: a pitch-black silhouette with burning red eyes. Its eyes FLASH WHITE during the wind-up
    // of every attack - the tell that a hit is coming.
    const windup = a && a.type === 'attack' && a.phase === 'startup';
    const fadeIn = clamp((CLONE.life - p.life) / 0.15, 0, 1), fadeOut = clamp(p.life / 0.6, 0, 1);
    if (!sketch && !pixelMode) drawFigure(figureOf(p), { alpha: alpha * 0.8 * Math.min(fadeIn, fadeOut), tint: '#5a0a0a', outline: FIG_OUTLINE });   // dark red rim
    drawFigure(figureOf(p), { alpha: alpha * 0.92 * Math.min(fadeIn, fadeOut), tint: tint || (sketch ? '#333333' : '#140404'),
      eye: windup ? (Math.floor(p.anim * 30) % 2 ? '#ffffff' : '#ffb0b0') : '#ff2020' });
    if (windup && !sketch) {                                 // + a little glint over its head
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(snap(p.x - 2), snap(p.y - p.h - 22), 4, 10); ctx.fillRect(snap(p.x - 2), snap(p.y - p.h - 9), 4, 4);
    }
  } else {
    // OUTLINE: a dark, slightly fatter silhouette behind the fighter so they always read clearly against
    // the background and each other (the thick-bodied, high-contrast look of an animated stick fight)
    if (!sketch && !pixelMode && !vanished) drawFigure(figureOf(p), { alpha: alpha * 0.95, tint: FIG_OUTLINE_COLOR, outline: FIG_OUTLINE });
    drawFigure(figureOf(p), { alpha, tint: vanished ? (sketch ? '#8c8c8c' : p.energy) : tint,
      eye: charging || (a && a.type === 'attack' && a.mult > 1.3) ? '#fff3a8' : null });
  }

  // Frozen in time: a clock face around them with its hand ticking down how long is left
  if (a && a.type === 'timeStop') {
    const cx = p.x, cy = p.y - 48, R = 62, left = 1 - a.t / a.dur;
    ctx.save();
    ctx.strokeStyle = a.hell ? DEMON_METER.color : TIME_STOP.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    for (let k = 0; k < 12; k++) {
      const an = k / 12 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * (R - 7), cy + Math.sin(an) * (R - 7)); ctx.lineTo(cx + Math.cos(an) * R, cy + Math.sin(an) * R); ctx.stroke();
    }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
    const ha = -Math.PI / 2 + (1 - left) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ha) * (R - 12), cy + Math.sin(ha) * (R - 12)); ctx.stroke();
    ctx.restore();
  }
  // Scythe throw telegraph: a bright glint flashing on the raised blade
  if (a && a.type === 'attack' && a.move.throwScythe && a.phase === 'startup' && a.t > 0.12) {
    const gx = p.x - p.face * 14, gy = p.y - 128, s = 10 + Math.sin(p.anim * 40) * 4;
    ctx.save(); ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(gx, gy - s * 1.6); ctx.lineTo(gx + 3, gy - 3); ctx.lineTo(gx + s * 1.6, gy); ctx.lineTo(gx + 3, gy + 3);
    ctx.lineTo(gx, gy + s * 1.6); ctx.lineTo(gx - 3, gy + 3); ctx.lineTo(gx - s * 1.6, gy); ctx.lineTo(gx - 3, gy - 3); ctx.closePath(); ctx.fill();
    ctx.restore();

  // Colbalias's HELLFIRE SHOT: the orb between his palms - only while he's actively charging it
  // (once it's stored, the orb is hidden and his aura shows it instead)
  if ((p.cshot || 0) > 0 && !p.minion && a && a.charging) {
    const c = p.cshot, full = c >= 1, chg = a && a.charging;
    const hx = p.x + p.face * (chg ? 28 : 22), hy = p.y - (chg ? 64 : 60);
    const r = snap(4 + 11 * c + (full ? Math.sin(time * 14) * 1.5 : 0));
    ctx.save();
    ctx.fillStyle = sketch ? 'rgba(192,57,43,0.25)' : `rgba(255,30,30,${0.25 + 0.15 * Math.sin(time * 10)})`;
    ctx.beginPath(); ctx.arc(hx, hy, r * 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = sketch ? '#c0392b' : '#ff2a2a'; ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd6d0'; ctx.beginPath(); ctx.arc(hx, hy, r * 0.45, 0, Math.PI * 2); ctx.fill();
    if (full && Math.floor(time * 8) % 2) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, hy, r + 4, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  if (a && a.type === 'attack' && a.btn === 'spc' && (a.phase === 'charge' || a.phase === 'startup') && !(p.look && p.look.scythe3d) && !a.move.chargeShot) {
    const r = snap((6 + 15 * clamp(a.charge / MAX_CHARGE, 0, 1)) *
                   (1 + (a.move.overcharge ? clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1) : 0)));   // overcharge: ball keeps growing
    ctx.fillStyle = sketch ? '#f2d24b' : kiColor(p);
    ctx.beginPath(); ctx.arc(p.x + p.face * 30, p.y - 66, r / 2, 0, Math.PI * 2); ctx.fill();
    if (sketch) { ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2; ctx.stroke(); }
    else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x + p.face * 30, p.y - 66, r / 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (p.shielding && p.look && p.look.auraShield) {
    // Lance doesn't use a bubble: his aura flares up around him. Bigger when the shield is fresh,
    // shrinking as it wears down; a bright edge shows it's protecting him.
    const hp = clamp(p.shieldHP / SHIELD_MAX, 0, 1);
    const sc = 1.05 + 0.55 * hp;
    drawAura(p, kiColor(p), true, sc, 0.6);              // (drawn over him, so a bit see-through)
    ctx.save(); ctx.globalAlpha = 0.45 + 0.3 * hp; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    spikyAuraPath(p.x, p.y - 46, 30 * sc, 52 * sc, 30 * sc, 0); ctx.stroke();       // bright spiky edge = protected
    ctx.restore();
  } else if (p.shielding && sketch) {             // sketch: a dashed pen circle
    const r = 22 + 38 * (p.shieldHP / SHIELD_MAX);
    ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2.5;
    ctx.setLineDash([10, 7]);
    ctx.beginPath(); ctx.arc(p.x + (hash(boilFrame()) - 0.5) * 2, p.y - 40, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  } else if (p.shielding) {
    const r = 22 + 38 * (p.shieldHP / SHIELD_MAX);
    ctx.fillStyle = p.energy;
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = p.energy; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y - 40, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (p.halo > 0 && sketch) {
    ctx.strokeStyle = inkOf(p); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, 38, 7, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (p.halo > 0) {
    ctx.fillStyle = '#fff3a8';
    ctx.fillRect(snap(p.x - 36), snap(p.y + 3), 72, 6);
    ctx.fillStyle = p.energy;
    ctx.fillRect(snap(p.x - 27), snap(p.y + 9), 54, 3);
  }
}

// Flickering flame-shaped aura around the body
// DBZ-style spiky aura outline: an oval with sharp flame spikes all up the sides and over the top
// (pointing outward and rising), smooth along the bottom. Spikes flicker in length every frame.
function spikyAuraPath(cx, cy, w, h, spike, seed) {
  const n = 34;                                            // points around the oval (half are spike tips)
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = Math.PI / 2 + (i / n) * Math.PI * 2;         // start at the bottom, go all the way round
    const ex = Math.cos(a), ey = Math.sin(a);              // point on the oval (ey < 0 = upper half)
    const bx = cx + ex * w, by = cy + ey * h;
    const upness = clamp(-ey * 0.9 + 0.35, 0, 1);          // spikes grow toward the top, none at the bottom
    const tip = i % 2 === 1;
    let len = 0;
    if (tip && upness > 0) len = spike * upness * (0.65 + 0.45 * Math.abs(Math.sin(time * 26 + i * 1.9 + seed)));
    let dx = ex, dy = ey - 0.9 * upness;                   // tips lean upward like rising flames
    const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const px = tip ? bx + dx * len : cx + ex * w * 0.97, py = tip ? by + dy * len : cy + ey * h * 0.97;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawAura(p, col = kiColor(p), big = false, scale = null, alphaMul = 1) {
  const cx = p.x, cy = p.y - 46, s = scale || (big ? 1.25 : 1);
  ctx.save();
  if (sketch) {
    ctx.strokeStyle = big ? 'rgba(200,150,0,0.75)' : 'rgba(30,60,140,0.65)'; ctx.lineWidth = 2;
    spikyAuraPath(cx, cy, 30 * s, 52 * s, 26 * s, 0); ctx.stroke();
    ctx.restore(); return;
  }
  const w = 30 * s, h = 52 * s;
  // 1) outer spiky flame in the aura's color
  ctx.globalAlpha = (big ? 0.5 : 0.36) * alphaMul;
  ctx.fillStyle = col;
  spikyAuraPath(cx, cy, w, h, 30 * s, 0); ctx.fill();
  // 2) a lighter inner layer of shorter spikes
  ctx.globalAlpha = (big ? 0.42 : 0.3) * alphaMul;
  ctx.fillStyle = '#fff6c2';
  spikyAuraPath(cx, cy + 4 * s, w * 0.78, h * 0.82, 16 * s, 3.1); ctx.fill();
  // 3) soft white glowing core (the bright middle in the reference)
  const g = ctx.createRadialGradient(cx, cy + 4 * s, 2, cx, cy + 4 * s, h * 0.85);
  g.addColorStop(0, 'rgba(255,255,255,' + (0.55 * alphaMul) + ')');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy + 4 * s, w * 0.8, h * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (Math.random() < 0.5) particles.push({ x: cx + (Math.random() - 0.5) * 40, y: p.y - Math.random() * 30, vx: 0, vy: -260,
                                            life: 0.3, max: 0.3, size: 1, color: col, type: 'bit', grav: -200 });
  if (big && Math.random() < 0.06) bolt(cx + (Math.random() - 0.5) * 30, cy, Math.random() * Math.PI * 2, 35, 0.06, '#ffffff');   // crackling sparks
}

function drawGhosts() {
  // Colored after-images, like the motion smears in the animation. Each one is a whole figure to draw, so only the
  // newest 30 are drawn (PERFORMANCE quality: every other one, newest 14)
  const low = lowQuality(), max = low ? 14 : 30;
  for (let i = Math.max(0, ghosts.length - max * (low ? 2 : 1)); i < ghosts.length; i += low ? 2 : 1) {
    const g = ghosts[i];
    if (sketch) drawFigure(g.fig, { alpha: (g.life / g.max) * 0.35, tint: '#9a9a9a' });   // pencil ghost lines
    else drawFigure(g.fig, { alpha: (g.life / g.max) * 0.45, tint: g.color || g.fig.color });
  }
}

// Sketch versions of the effects: red-ink blood dots, ink scribbles, pencil smudges
function drawParticlesSketch() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const p of particles) {
    if (p.type === 'beamfx') { drawBeam(p); continue; }   // ultimate Kamehameha
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'bit') {
      ctx.fillStyle = BLOOD.includes(p.color) ? '#b3261e' : '#2a2a2a';
      ctx.globalAlpha = BLOOD.includes(p.color) ? 1 : 0.7;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.4 + p.size * 1.2, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'bolt') {
      ctx.globalAlpha = a > 0.5 ? 1 : a * 2;
      ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
      inkLine(p.pts.map(q => ({ x: q[0], y: q[1] })));
    } else if (p.type === 'streak') {
      ctx.globalAlpha = a * 0.6; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.ax * 0.05, p.y - p.ay * 0.05); ctx.stroke();
    } else if (p.type === 'dust') {
      ctx.globalAlpha = a * 0.6; ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 1.5;
      const r = p.r * (0.6 + (1 - a));
      ctx.beginPath(); ctx.arc(p.x, p.y - r, r, 0, Math.PI * 1.7); ctx.stroke();
    } else if (p.type === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.6, p.r * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'slash') {
      // Ink slash stroke
      const dx = Math.cos(p.ang) * p.len / 2, dy = Math.sin(p.ang) * p.len / 2;
      ctx.globalAlpha = a; ctx.strokeStyle = '#111'; ctx.lineWidth = 2 + 5 * a;
      ctx.beginPath(); ctx.moveTo(p.x - dx, p.y - dy); ctx.lineTo(p.x + dx, p.y + dy); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.type === 'impact') {
      // Comic-style ink starburst
      ctx.globalAlpha = 1; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      for (let i = 0; i < 10; i++) {
        const ang = i / 10 * Math.PI * 2 + hash(i + p.x) * 0.3;
        const r1 = p.r * 0.5, r2 = p.r * (1.2 + hash(i * 3 + p.y) * 0.8);
        ctx.beginPath(); ctx.moveTo(p.x + Math.cos(ang) * r1, p.y + Math.sin(ang) * r1);
        ctx.lineTo(p.x + Math.cos(ang) * r2, p.y + Math.sin(ang) * r2); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  if (sketch) return drawParticlesSketch();
  const thin = lowQuality() && particles.length > 200;   // PERFORMANCE quality: lots of sparks = draw every other one
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.type === 'beamfx') { drawBeam(p); continue; }   // ultimate Kamehameha
    if (thin && (i & 1) && p.type === 'bit') continue;
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'bit') {
      ctx.fillStyle = p.color;
      const s = (pixelMode ? PIX : 3) * p.size;
      ctx.fillRect(snap(p.x), snap(p.y), s, s);
    } else if (p.type === 'bolt') {
      // Lightning: thick colored stroke with a white core
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.globalAlpha = a > 0.5 ? 1 : a * 2;
      for (const [w, c] of [[7, p.color], [3, '#ffffff']]) {
        ctx.lineWidth = w; ctx.strokeStyle = c;
        ctx.beginPath(); ctx.moveTo(p.pts[0][0], p.pts[0][1]);
        for (const q of p.pts) ctx.lineTo(q[0], q[1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (p.type === 'streak') {
      ctx.fillStyle = '#cdb79a';
      ctx.globalAlpha = a * 0.7;
      const n = 4;
      for (let i = 0; i < n; i++) ctx.fillRect(snap(p.x - p.ax * 0.012 * i), snap(p.y - p.ay * 0.012 * i), PX(), PX());
      ctx.globalAlpha = 1;
    } else if (p.type === 'dust') {
      ctx.fillStyle = '#b39a7f';
      ctx.globalAlpha = a * 0.8;
      const s = snap(p.r * (0.5 + a * 0.5)) || PIX;
      ctx.fillRect(snap(p.x), snap(p.y) - s, s, s);
      ctx.globalAlpha = 1;
    } else if (p.type === 'ring') {
      ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = a; ctx.lineWidth = 3;
      ctx.strokeRect(snap(p.x - p.r * 1.6), snap(p.y - p.r * 0.4), snap(p.r * 3.2), snap(p.r * 0.8) || PIX);
      ctx.globalAlpha = 1;
    } else if (p.type === 'slash') {
      // Slash streak: a sharp white blade-line with a red edge, thinning as it fades
      const dx = Math.cos(p.ang) * p.len / 2, dy = Math.sin(p.ang) * p.len / 2;
      const w = 2 + 10 * a;
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = '#d63a2a';
      ctx.beginPath();
      ctx.moveTo(p.x - dx, p.y - dy);
      ctx.lineTo(p.x - Math.sin(p.ang) * w, p.y + Math.cos(p.ang) * w);
      ctx.lineTo(p.x + dx, p.y + dy);
      ctx.lineTo(p.x + Math.sin(p.ang) * w * 0.4, p.y - Math.cos(p.ang) * w * 0.4);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x - dx, p.y - dy);
      ctx.lineTo(p.x - Math.sin(p.ang) * w * 0.55, p.y + Math.cos(p.ang) * w * 0.55);
      ctx.lineTo(p.x + dx, p.y + dy);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'impact' && pixelMode) {
      // Blocky starburst at the hit point (pixel art style)
      ctx.fillStyle = '#ffffff';
      const r = p.r;
      ctx.fillRect(snap(p.x - r), snap(p.y) - 3, snap(r * 2), 6);
      ctx.fillRect(snap(p.x) - 3, snap(p.y - r), 6, snap(r * 2));
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(snap(p.x - r * 0.5), snap(p.y - r * 0.5), snap(r), snap(r));
    } else if (p.type === 'impact') {
      // Anime hit flash: a sharp 8-point white starburst with a bright core, popping out and fading
      const r = p.r, rot = p.rot || 0;
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      for (let k = 0; k < 16; k++) {
        const ang = rot + k / 16 * Math.PI * 2, rr = k % 2 ? r * 0.22 : r * (k % 4 ? 0.7 : 1.15);
        const px = p.x + Math.cos(ang) * rr, py = p.y + Math.sin(ang) * rr;
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3a8'; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'hitline') {
      // Speed line flying off a hit: a thin white needle, thick at the front, tapering behind
      const dx = Math.cos(p.ang), dy = Math.sin(p.ang), w = 3.2 * a + 0.6;
      ctx.globalAlpha = Math.min(1, a * 1.5);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(p.x + dx * 6, p.y + dy * 6);
      ctx.lineTo(p.x - dy * w, p.y + dx * w);
      ctx.lineTo(p.x - dx * p.len, p.y - dy * p.len);
      ctx.lineTo(p.x + dy * w, p.y - dx * w);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

// Kamehameha beam: glowing column with a white-hot core and a round head
// LANCE'S ULTIMATE as a proper KAMEHAMEHA: a blazing sphere at his hand, a beam with a white-hot core and
// rippling blue edges, swirling energy rings racing down it, and a big bulb of energy at its head
function drawKameBeam(s) {
  const k = clamp(s.life / s.max, 0, 1), fade = k < 0.2 ? k / 0.2 : 1;
  const w = s.w * (0.92 + Math.sin(time * 50) * 0.06) * fade;
  const x0 = s.x, x1 = s.x + s.dir * s.len, d = s.dir;
  const edge = (side, mul) => {                                  // a wavy edge along the beam
    const pts = [];
    for (let x = 0; x <= s.len; x += 24) {
      const ripple = 1 + 0.09 * Math.sin(x * 0.045 - time * 40) + 0.05 * Math.sin(x * 0.11 + time * 23);
      pts.push([x0 + d * x, s.y + side * (w * mul / 2) * ripple]);
    }
    return pts;
  };
  const body = (mul, col, al) => {
    ctx.globalAlpha = al * fade; ctx.fillStyle = col;
    const top = edge(-1, mul), bot = edge(1, mul).reverse();
    ctx.beginPath(); [...top, ...bot].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x1, s.y, w * mul * 0.62, 0, Math.PI * 2); ctx.fill();          // the bulb at its head
    ctx.beginPath(); ctx.arc(x0, s.y, w * mul * 0.7, 0, Math.PI * 2); ctx.fill();           // the sphere at his hand
  };
  ctx.save();
  body(1.9, s.color, 0.18);                                     // wide glow
  body(1.35, s.color, 0.4);
  body(1.0, '#6cc8ff', 0.9);                                    // the beam
  body(0.55, '#dff5ff', 1);
  body(0.28, '#ffffff', 1);                                     // white-hot core
  // swirling energy rings racing down the beam
  ctx.globalAlpha = 0.7 * fade; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  for (let x = (time * 1400) % 150; x < s.len - 40; x += 150) {
    ctx.beginPath(); ctx.ellipse(x0 + d * x, s.y, 9, w * 0.62, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // crackle round the head
  if (Math.random() < 0.6) { ctx.globalAlpha = fade; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    const a0 = Math.random() * Math.PI * 2; ctx.beginPath(); ctx.arc(x1, s.y, w * 0.8 + Math.random() * 20, a0, a0 + 1.2); ctx.stroke(); }
  ctx.restore();
}
// the Kamehameha ball growing in his cupped hand while he charges the ultimate
function drawKameCharge() {
  for (const f of fighters) {
    const a = f.action;
    if (!a || a.type !== 'ultBeam' || a.phase !== 'charge' || f.respawnTimer > 0) continue;
    const U = CHARACTERS[f.char].ult, c = clamp(a.t / U.windTime, 0, 1);
    const x = f.x - f.face * 14, y = f.y - 48, r = 6 + 30 * c + Math.sin(time * 40) * 2;   // cupped back at his hip ("KA-ME-HA-ME...")
    ctx.save();
    for (const [mul, col, al] of [[2.2, kiColor(f), 0.18], [1.5, kiColor(f), 0.45], [1, '#9be7ff', 0.95], [0.55, '#ffffff', 1]]) {
      ctx.globalAlpha = al; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r * mul, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { const a0 = time * 12 + i * 2.1; ctx.beginPath(); ctx.arc(x, y, r * 1.3, a0, a0 + 0.9); ctx.stroke(); }
    ctx.restore();
  }
}
function drawBeam(s) {
  if (s.ult && !sketch) return drawKameBeam(s);
  const k = clamp(s.life / s.max, 0, 1), fade = k < 0.2 ? k / 0.2 : 1;
  const w = s.w * (0.8 + Math.sin(time * 60) * 0.1) * fade;
  const x0 = s.x, x1 = s.x + s.dir * s.len;
  ctx.save();
  if (sketch) {
    ctx.strokeStyle = s.owner ? inkOf(s.owner) : '#111'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, s.y - w / 2); ctx.lineTo(x1, s.y - w / 2); ctx.moveTo(x0, s.y + w / 2); ctx.lineTo(x1, s.y + w / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x1, s.y, w * 0.7, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5;
    for (let x = Math.min(x0, x1); x < Math.max(x0, x1); x += 14) { ctx.beginPath(); ctx.moveTo(x, s.y - w / 3); ctx.lineTo(x + 8, s.y + w / 3); ctx.stroke(); }
    ctx.restore(); return;
  }
  for (const [mul, col, al] of [[1.6, s.color, 0.25], [1.0, s.color, 0.85], [0.45, '#ffffff', 1]]) {
    ctx.globalAlpha = al * fade;
    ctx.fillStyle = col;
    ctx.fillRect(Math.min(x0, x1), s.y - (w * mul) / 2, Math.abs(x1 - x0), w * mul);
    ctx.beginPath(); ctx.arc(x1, s.y, (w * mul) * 0.75, 0, Math.PI * 2); ctx.fill();      // beam head
    ctx.beginPath(); ctx.arc(x0, s.y, (w * mul) * 0.55, 0, Math.PI * 2); ctx.fill();      // glow at the hand
  }
  ctx.restore();
}

function drawProjectiles() {
  if (cannon.on && fighters[0].respawnTimer <= 0 && cannon.timer < 0.4 && Math.floor(cannon.timer * 20) % 2) {
    const x = cannon.side < 0 ? 6 : W - 6;
    ctx.fillStyle = '#f0a818';
    for (let k = 0; k < 6; k++) ctx.fillRect(snap(x - cannon.side * k * 3) - (cannon.side < 0 ? 0 : PIX), snap(cannon.y - 15 + k * 3), PIX, snap(30 - k * 6));
  }
  if (!sketch) drawKameCharge();                                // Lance's ultimate: the ki ball growing in his hand
  for (const s of projectiles) if (s.kind === 'beam') drawBeam(s); else if (s.kind === 'disc') drawDisc(s);
  if (sketch) {                          // pen-drawn energy balls with a scribbled fill
    ctx.lineCap = 'round';
    for (const s of projectiles) {
      if (s.kind === 'beam' || s.kind === 'disc') continue;
      const ink = s.owner ? inkOf(s.owner) : '#7a4b00';
      ctx.strokeStyle = ink;
      if (s.kind === 'wave') {
        const d = Math.sign(s.vx);
        ctx.lineWidth = 3;
        for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(s.x - d * k * 10, s.y, s.r + k * 2, -Math.PI / 2, Math.PI / 2, d < 0); ctx.stroke(); }
        continue;
      }
      ctx.fillStyle = PAPER; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let k = -s.r * 0.6; k <= s.r * 0.6; k += 4) { ctx.moveTo(s.x + k - 3, s.y + s.r * 0.5); ctx.lineTo(s.x + k + 3, s.y - s.r * 0.5); }
      ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;          // motion lines behind it
      ctx.beginPath(); ctx.moveTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03 - 4); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06 - 4);
      ctx.moveTo(s.x - s.vx * 0.03, s.y - s.vy * 0.03 + 4); ctx.lineTo(s.x - s.vx * 0.06, s.y - s.vy * 0.06 + 4); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    return;
  }
  for (const s of projectiles) {
    if (s.kind === 'beam' || s.kind === 'disc') continue;
    if (s.electric) { drawThunderBolt(s); continue; }
    s.trail.forEach((t, i) => {
      const k = i / s.trail.length;
      ctx.fillStyle = s.color; ctx.globalAlpha = k * 0.5;
      const r = snap(s.r * k) || PIX;
      ctx.fillRect(snap(t.x) - r / 2, snap(t.y) - r / 2, r, r);
    });
    ctx.globalAlpha = 1;
    if (s.kind === 'wave') {
      const d = Math.sign(s.vx);
      ctx.fillStyle = s.color;
      for (let k = 0; k < 5; k++) ctx.fillRect(snap(s.x + d * k * 4), snap(s.y - s.r + k * 5), PIX * 2, snap(s.r * 2 - k * 10) || PIX);
      continue;
    }
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2); ctx.fill();
    if (Math.random() < 0.3) bolt(s.x, s.y, Math.random() * Math.PI * 2, s.r * 2.5, 0.05, s.color);   // crackle
  }
}

// Colby's THUNDER BOLT: a glowing ball of lightning dragging a jagged, crackling tail (like PK Thunder's)
function drawThunderBolt(s) {
  const T = s.trail, n = T.length;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (n > 1) {
    for (const [w, col, a] of [[12, s.color, 0.35], [5, s.color, 0.85], [2, '#ffffff', 1]]) {   // glow, body, white-hot core
      ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath();
      T.forEach((p, i) => {
        const k = i / (n - 1), j = (1 - k) * 7;                  // (more jagged toward the end of the tail)
        const x = p.x + (Math.random() - 0.5) * j, y = p.y + (Math.random() - 0.5) * j;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.lineTo(s.x, s.y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 0.35; ctx.fillStyle = s.color;               // the ball
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.55, 0, Math.PI * 2); ctx.fill();
  if (Math.random() < 0.5) bolt(s.x, s.y, Math.random() * Math.PI * 2, s.r * 3, 0.05, Math.random() < 0.5 ? '#ffffff' : s.color);
}
// The black & white impact frame: everything goes black, fighters turn white, lightning bursts out.
function drawImpactFrame() {
  // Fill the whole screen first, then draw the fighters/lightning through the camera
  const inv = impactAt && impactAt.invert, fire = impactAt && impactAt.fire && !sketch;
  ctx.fillStyle = sketch ? (inv ? '#111' : PAPER) : fire ? (inv ? '#ff7a1a' : '#1c0300') : (inv ? '#ffffff' : '#000000');
  ctx.fillRect(-60, -60, W + 120, H + 120);
  ctx.save();
  applyCamera(ctx);
  drawImpactFrameWorld();
  ctx.restore();
}

function drawImpactFrameWorld() {
  if (sketch) {
    // Sketch impact frame: blank page (or a solid-ink page when inverted), manga burst lines from the hit
    const inv = impactAt && impactAt.invert;
    ctx.fillStyle = inv ? '#111' : PAPER; ctx.fillRect(-50, -50, W + 100, H + 100);
    if (impactAt) {
      ctx.strokeStyle = inv ? PAPER : '#111'; ctx.lineCap = 'round';
      for (let i = 0; i < 40; i++) {
        const ang = i / 40 * Math.PI * 2;
        const r1 = 60 + hash(i) * 50, r2 = 700;
        ctx.lineWidth = 1 + hash(i * 7) * 4;
        ctx.beginPath(); ctx.moveTo(impactAt.x + Math.cos(ang) * r1, impactAt.y + Math.sin(ang) * r1);
        ctx.lineTo(impactAt.x + Math.cos(ang) * r2, impactAt.y + Math.sin(ang) * r2); ctx.stroke();
      }
    }
    for (const f of (ult && ult.scene ? [ult.target, ult.user] : fighters)) if (f.respawnTimer <= 0) drawFigure(figureOf(f), { tint: inv ? PAPER : '#000000' });
    return;
  }
  // Normal: black screen, white fighters. Inverted: white screen, black fighters (alternates on clash beats).
  // FIRE (Aiden): a scorched dark-red screen, blazing orange silhouettes and flames instead of lightning.
  const inv = impactAt && impactAt.invert, fire = impactAt && impactAt.fire;
  const bg = fire ? (inv ? '#ff7a1a' : '#1c0300') : inv ? '#ffffff' : '#000000';
  const fg = fire ? (inv ? '#1c0300' : '#ffb02e') : inv ? '#000000' : '#ffffff';
  const spark = fire ? ['#ff3d0a', '#ffd23f', '#ff7a1a'] : null;
  ctx.fillStyle = bg;
  ctx.fillRect(-50, -50, W + 100, H + 100);
  if (impactAt && impactAt.focus) {
    // Manga focus lines: thin wedges rushing in from the edges toward the impact point
    ctx.fillStyle = fire ? (inv ? 'rgba(28,3,0,0.8)' : 'rgba(255,110,20,0.7)') : inv ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 70; i++) {
      const ang = i / 70 * Math.PI * 2 + Math.random() * 0.05;
      const r1 = 170 + Math.random() * 120, r2 = 1500, w = 0.006 + Math.random() * 0.012;
      ctx.beginPath();
      ctx.moveTo(impactAt.x + Math.cos(ang) * r1, impactAt.y + Math.sin(ang) * r1);
      ctx.lineTo(impactAt.x + Math.cos(ang - w) * r2, impactAt.y + Math.sin(ang - w) * r2);
      ctx.lineTo(impactAt.x + Math.cos(ang + w) * r2, impactAt.y + Math.sin(ang + w) * r2);
      ctx.fill();
    }
  }
  for (const f of (ult && ult.scene ? [ult.target, ult.user] : fighters)) if (f.respawnTimer <= 0) drawFigure(figureOf(f), { tint: fg });
  if (impactAt) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Lightning: in one direction for normal hits, in every direction for clashes
    const n = impactAt.all ? 14 : 9;
    for (let i = 0; i < n; i++) {
      const ang = impactAt.all ? (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.3
                               : impactAt.ang + (i - 4) * 0.35 + (Math.random() - 0.5) * 0.2;
      const len = (impactAt.all ? 160 : 200) + Math.random() * 330;
      ctx.strokeStyle = spark ? spark[i % 3] : i % 3 === 0 ? fg : '#ffd23f';
      ctx.lineWidth = (fire ? 6 : 3) + Math.random() * 9;              // (fire: thicker, like licking flames)
      ctx.beginPath(); ctx.moveTo(impactAt.x, impactAt.y);
      for (let k = 1; k <= 6; k++) {
        ctx.lineTo(impactAt.x + Math.cos(ang) * len * k / 6 + (Math.random() - 0.5) * 50,
                   impactAt.y - Math.sin(ang) * len * k / 6 + (Math.random() - 0.5) * 50);
      }
      ctx.stroke();
    }
    // Blinding core
    ctx.fillStyle = fire ? '#ff7a1a' : '#ffd23f';
    ctx.beginPath(); ctx.arc(impactAt.x, impactAt.y, (impactAt.all ? 20 : 30) * (fire ? 1.4 : 1), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fire ? '#ffe066' : fg;
    ctx.beginPath(); ctx.arc(impactAt.x, impactAt.y, impactAt.all ? 11 : 18, 0, Math.PI * 2); ctx.fill();
  }
}

function drawKO() {
  for (const k of koFlashes) {
    const a = k.t / 0.6;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(k.x, k.y);
    ctx.rotate(Math.atan2(cam.y - k.y, cam.x - k.x));     // beam points back toward the middle of the view
    if (sketch) {                                   // ink speed lines
      ctx.strokeStyle = '#111';
      for (let i = 0; i < 7; i++) {
        ctx.lineWidth = 2 + i % 3;
        const y = (i - 3) * 18 * a;
        ctx.beginPath(); ctx.moveTo(20 + i * 10, y); ctx.lineTo(700, y * 2.5); ctx.stroke();
      }
      ctx.restore();
      continue;
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, -40 * a, 700, 80 * a);
    ctx.fillStyle = k.color;
    ctx.fillRect(0, -70 * a, 700, 15 * a);
    ctx.fillRect(0, 55 * a, 700, 15 * a);
    ctx.restore();
  }
}

// Turn the low-res frame into palette-limited, dithered pixel art.
function pixelate() {
  const img = ctx.getImageData(0, 0, LW, LH);
  const d = img.data;
  for (let y = 0; y < LH; y++) {
    for (let x = 0; x < LW; x++) {
      const i = (y * LW + x) * 4;
      const t = BAYER[((y & 3) << 2) | (x & 3)] * DITHER;
      const r = clamp(d[i] + t, 0, 255), g = clamp(d[i + 1] + t, 0, 255), b = clamp(d[i + 2] + t, 0, 255);
      const p = LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)];
      d[i] = PR[p]; d[i + 1] = PG[p]; d[i + 2] = PB[p];
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------------- HUD (drawn at full resolution with a pixel font) ----------------
function text(str, x, y, size, color, align = 'left', outline = true) {
  if (sketch) {                               // handwritten in pen
    sctx.font = `${Math.round(size * 1.75)}px "Patrick Hand", cursive`;
    sctx.textAlign = align;
    sctx.fillStyle = sketchColor(color);
    sctx.fillText(str, x, y);
    return;
  }
  sctx.font = `${size}px ${FONT}`;
  sctx.textAlign = align;
  if (outline) { sctx.fillStyle = '#0e0c0c'; sctx.fillText(str, x + 3, y + 3); }
  sctx.fillStyle = color;
  sctx.fillText(str, x, y);
}

// Ultimate overlays: activation banner, cutscene letterbox, "REAPED." and the fade out
function drawUltHUD() {
  if (ultBanner) {
    const k = ultBanner.t / 1.1, slide = Math.min(1, (1 - k) * 6);
    const bandY = H / 2 - 70;
    sctx.save();
    sctx.globalAlpha = Math.min(1, k * 4);
    sctx.fillStyle = sketch ? 'rgba(20,20,20,0.92)' : 'rgba(0,0,0,0.85)';
    sctx.fillRect(0, bandY, W, 120);
    sctx.fillStyle = ultBanner.color; sctx.fillRect(0, bandY, W, 6); sctx.fillRect(0, bandY + 114, W, 6);
    text(ultBanner.title || 'ULTIMATE', W / 2 - 300 + slide * 300, bandY + 52, 30, '#ffd23f', 'center');
    text(ultBanner.name, W / 2 + 300 - slide * 300, bandY + 96, 16, '#ffffff', 'center');
    sctx.restore();
  }
  if (ult && ult.phase === 'cutscene') {
    const ct = ult.t;
    // Letterbox bars slide in
    const bar = 92 * Math.min(1, ct / 0.35);
    sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, bar); sctx.fillRect(0, H - bar, W, bar);
    // "REAPED." fades in
    if (ct > 2.0) {
      sctx.save();
      sctx.globalAlpha = Math.min(1, (ct - 2.0) / 0.4);
      text('REAPED.', W / 2, H - 30, 26, '#d63a2a', 'center');
      sctx.restore();
    }
    // Fade to black at the end, then the fight resumes
    if (ct > CUT_TIME - 0.6) {
      sctx.fillStyle = `rgba(0,0,0,${Math.min(1, (ct - (CUT_TIME - 0.6)) / 0.45)})`;
      sctx.fillRect(0, 0, W, H);
    }
  }
}

const hudCardX = i => W / 2 - (REAL_FIGHTERS * 250 - 40) / 2 + i * 250;   // left edge of player i's damage card
function drawHUD() {
  if (ult && ult.phase === 'cutscene') { drawUltHUD(); return; }   // cinematic: hide the HUD
  if (ult && ult.def.deck && ult.t >= DT_.warp * 0.5) {             // the pirate ship: letterbox, the play-by-play, the white flashes
    const U = ult;
    if (U.scene) {
      const bar = 64;
      sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, bar); sctx.fillRect(0, H - bar, W, bar);
      if (U.caption) {
        const big = /SNAP|NUCLEAR/.test(U.caption);
        text(U.caption, W / 2, H - 22, big ? 22 : 14, big ? '#ffd23f' : '#ffffff', 'center');
      }
    }
    if (U.white > 0) { sctx.fillStyle = `rgba(255,255,255,${clamp(U.white, 0, 1)})`; sctx.fillRect(0, 0, W, H); }
    if (ultBanner) drawUltHUD();
    return;
  }
  if (ult && ult.def.rush && ult.phase === 'talk') {                // Lance's line: cinematic bars + the line as a subtitle
    const k = Math.min(1, ult.t / 0.25), bar = 70 * k;
    sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, bar); sctx.fillRect(0, H - bar, W, bar);
    const words = ult.t < RUSH.talk * 0.55 ? 'OK THEN...' : 'OK THEN... GUESS IT\'S MY TURN.';
    if (ult.t > 0.3) text(words, W / 2, H - 28, 14, '#ffd23f', 'center');
    return;
  }
  // Damage cards (just the two players - not Colbalias's clones)
  fighters.slice(0, REAL_FIGHTERS).forEach((f, i) => {
    const x = hudCardX(i), y = H - 96;   // (2-4 cards, centered)
    if (sketch) {
      // Sticky note, slightly crooked, with a pen-colored stripe
      sctx.save();
      sctx.translate(x + 105, y + 39); sctx.rotate(i ? 0.025 : -0.02); sctx.translate(-(x + 105), -(y + 39));
      sctx.fillStyle = 'rgba(0,0,0,0.12)'; sctx.fillRect(x + 4, y + 5, 210, 78);
      sctx.fillStyle = '#fff1a3'; sctx.fillRect(x, y, 210, 78);
      sctx.fillStyle = inkOf(f); sctx.fillRect(x + 6, y + 8, 4, 62);
      sctx.restore();
    } else {
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(x, y, 210, 78);
      sctx.fillStyle = '#26211f'; sctx.fillRect(x + 3, y + 3, 204, 72);
      if (matchTeams && f.team !== undefined) { sctx.fillStyle = TEAM_COLORS[f.team].main; sctx.fillRect(x, y - 5, 210, 5); }   // team stripe
      sctx.fillStyle = f.color;   sctx.fillRect(x + 3, y + 3, 12, 72);
    }
    const tag = f.name + ' ' + charName(f.char);
    text(tag, x + 26, y + 24, tag.length > 16 ? 6 : tag.length > 12 ? 8 : 10, '#ffffff', 'left', false);
    text('KO ' + f.kos, x + 196, y + 24, 9, '#8f8f98', 'right', false);
    const devTag = f.controller === 'keyboard' ? 'KEYBOARD' : f.controller && f.controller.startsWith('pad') ? (padIsGC(+f.controller.slice(3)) ? 'GC PAD ' : 'PAD ') + (+f.controller.slice(3) + 1) : 'CPU';
    if (!gameOptions.cleanHud) text(devTag, x + 196, y + 40, 7, '#806b5a', 'right', false);       // which device controls this fighter
    if (f.look && f.look.timeStop) {                      // Colby's TIME meter (lengthens his Time Stop)
      const tm = clamp((f.timeMeter || 0) / 100, 0, 1);
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(x + 110, y + 30, 90, 6);
      sctx.fillStyle = (f.tsCD || 0) > 0 ? '#56493f' : TIME_STOP.color; sctx.fillRect(x + 111, y + 31, 88 * tm, 4);
      text('TIME', x + 106, y + 37, 6, TIME_STOP.color, 'right', false);
    }
    if (f.look && f.look.hype) {                          // Aiden's HYPE meter (fill it by taunting; it drains)
      const hk = hypeK(f), full = hk >= 1, flash = full && Math.floor(performance.now() / 200) % 2, glow = (f.hypePulse || 0) > 0;
      if (glow) { sctx.fillStyle = 'rgba(255,138,26,0.45)'; sctx.fillRect(x + 106, y + 26, 98, 14); }   // glows while it fills
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(x + 110, y + 30, 90, 6);
      sctx.fillStyle = flash || (glow && Math.floor(performance.now() / 70) % 2) ? '#ffffff' : HYPE.color; sctx.fillRect(x + 111, y + 31, 88 * hk, 4);
      text('HYPE', x + 106, y + 37, 6, HYPE.color, 'right', false);
    }
    if (f.kaioken) text(f.kaioken > 1 ? 'KAIOKEN x' + f.kaioken : 'KAIOKEN', x + 196, y + 54, 8, Math.floor(performance.now() / 250) % 2 ? KAIOKEN.color : '#ff8a3c', 'right', false);
    if (f.look && f.look.demonMeter) {                     // Colbalias's DEMON meter: each letter lights up as it fills
      const lit = Math.floor((f.demon || 0) / 20), full = (f.demon || 0) >= 100;
      const flash = full && Math.floor(performance.now() / 180) % 2;
      DEMON_METER.letters.split('').forEach((ch, k) => {
        text(ch, x + 122 + k * 15, y + 40, 9, k < lit ? (flash ? '#ffffff' : DEMON_METER.color) : '#3a2a2a', 'center', false);
      });
    }
    const heat = Math.min(1, f.damage / 150);
    const col = heat < 0.33 ? '#ffffff' : heat < 0.66 ? '#f0a818' : heat < 0.9 ? '#d63a2a' : '#7e1c1c';
    const jitter = f.hitFlash > 0 ? (Math.random() - 0.5) * 8 : 0;
    if (f.out && canRevive(f)) {                        // went out with a full meter: they can come back
      const blink = Math.floor(performance.now() / 250) % 2;
      text('OUT', x + 26, y + 64, 26, '#56493f');
      text('ULT = REVIVE', x + 100, y + 66, 9, blink ? '#ffd23f' : '#ffffff', 'left', false);
    }
    else if (f.out) text('OUT', x + 26, y + 64, 26, '#56493f');
    else text(Math.floor(f.damage) + '%', x + 26 + jitter, y + 64 + jitter, 26, f.respawnTimer > 0 ? '#56493f' : col);
    // STOCKS: little head icons for each life left (or "x N" when there are lots)
    if (isFinite(f.stocks)) {
      const n = Math.max(0, f.stocks);
      if (n <= 5) for (let s = 0; s < n; s++) {
        sctx.fillStyle = '#0e0c0c'; sctx.beginPath(); sctx.arc(x + 196 - s * 15, y + 60, 6, 0, Math.PI * 2); sctx.fill();
        sctx.fillStyle = f.color; sctx.beginPath(); sctx.arc(x + 196 - s * 15, y + 60, 5, 0, Math.PI * 2); sctx.fill();
      } else {
        sctx.fillStyle = f.color; sctx.beginPath(); sctx.arc(x + 150, y + 60, 5, 0, Math.PI * 2); sctx.fill();
        text('x' + n, x + 160, y + 65, 10, '#ffffff', 'left', false);
      }
    }
    // Ultimate meter under the card
    const um = clamp((f.ult || 0) / ULT_MAX, 0, 1), full = um >= 1;
    const flash = full && Math.floor(performance.now() / 120) % 2 === 0;
    sctx.fillStyle = sketch ? 'rgba(0,0,0,0.25)' : '#0e0c0c'; sctx.fillRect(x, y + 80, 210, 10);
    if (f.transformed) {                                   // transformed: golden bar draining, I = ultimate
      const blink = Math.floor(performance.now() / 200) % 2 === 0;
      sctx.fillStyle = blink ? '#ffd23f' : '#fff3a8';
      sctx.fillRect(x + 2, y + 82, 206 * um, 6);
      text('TRANSFORMED  [I] ULTIMATE ' + Math.round(50 + 50 * um) + '%', x + 105, y - 8, 9, '#ffd23f', 'center');
    } else {
      sctx.fillStyle = full ? (flash ? '#ffffff' : '#ffd23f') : (sketch ? inkOf(f) : f.energy);
      sctx.fillRect(x + 2, y + 82, 206 * um, 6);
      if (full && !f.out) text('TRANSFORM READY  [I]', x + 105, y - 8, 9, flash ? '#ffffff' : '#ffd23f', 'center');
    }
  });

  // Controls (all of this disappears with the CLEAN SCREEN option / C)
  if (gameOptions.cleanHud || !SHOW_FIGHT_TEXT) { /* clean screen: no demo/debug text at all */ }
  else if (showControls) {
    const kn = a => keyName(bindings.keys[a][0]);       // shows YOUR current key bindings
    const lines = [
      `MOVE ${kn('left')}/${kn('right')}   JUMP ${kn('jump')}   ${kn('down')} DROP THROUGH PLATFORM`,
      `${kn('attack')} PHYSICAL   ${kn('special')} RANGED   +DIRECTION = NEW MOVE   (XBOX: A / B)`,
      `HOLD ${kn('attack')}/${kn('special')} TO CHARGE (SMASH + RANGED)`,
      `${kn('shield')} BLOCK   +DIRECTION = DODGE  (5 AIR DODGES)   (XBOX: RT / LT)`,
      `${kn('grab')} GRAB (BEATS SHIELDS)  THEN DIRECTION = THROW   (XBOX: RB)    ESC / MENU = PAUSE`,
      `T CANNONS:${cannon.on ? 'ON' : 'OFF'}  B CPU:${DUMMY_MODES[dummyMode]}  H HITBOXES`,
      `G BLOOD:${gore ? 'ON' : 'OFF'}  P STYLE:${artStyle}  R RESET  C HIDE`,
      `V P1 CHARACTER:${fighters[0].char}   N CPU CHARACTER:${fighters[1].char}`,
      `1 CLASH DEMO   2 PERFECT BLOCK DEMO   M SLOW-MO:${timeScale < 1 ? 'ON' : 'OFF'}   O SOUND:${soundOn ? 'ON' : 'OFF'}`,
      `${kn('ult')} TRANSFORM (BAR FULL), ${kn('ult')} AGAIN WHILE TRANSFORMED = ULTIMATE (XBOX: LB)   3 ULTIMATE DEMO   4 BROLY SLAM DEMO`,
    ];
    const top = sketch ? 92 : 26;               // sketch: start below the spiral binding, inside the margin
    lines.forEach((l, i) => text(l, sketch ? 92 : 16, top + i * (sketch ? 24 : 18), 9, '#b4b4bb'));
  } else {
    text('C CONTROLS', sketch ? 92 : 16, sketch ? 92 : 26, 9, '#8f8f98');
  }

  for (const f of fighters) {
    if (f.respawnTimer > 0 || f.minion) continue;
    // Where this fighter is on screen (the camera moves and zooms)
    const S = toScreen(f.x, f.y), sx = Math.round(S.x), sy = Math.round(S.y), fh = f.h * cam.z;
    // Name tag
    const tx = sx, ty = Math.round(sy - fh - 26);
    text(f.name, tx, ty, 9, sketch ? inkOf(f) : f.color, 'center');
    sctx.fillStyle = sketch ? inkOf(f) : f.color;
    sctx.fillRect(tx - 6, ty + 6, 12, 3); sctx.fillRect(tx - 3, ty + 9, 6, 3);

    // Off-screen marker
    if (sx < 0 || sx > W || sy - fh < 0 || sy > H) {
      const mx = clamp(sx, 24, W - 24), my = clamp(sy - fh / 2, 24, H - 24);
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(mx - 15, my - 15, 30, 30);
      sctx.fillStyle = f.color;   sctx.fillRect(mx - 12, my - 12, 24, 24);
      text(f.name[0], mx, my + 5, 9, '#ffffff', 'center', false);
    }

    if (f.dodgeCount > 0 || !f.ground) {             // always shown in the air: your Z vanishes left
      const dots = f.ground ? DODGE_FREE : AIR_DODGE_MAX;   // 4 dodges on the ground, 5 Z vanishes in the air
      for (let i = 0; i < dots; i++) {
        sctx.fillStyle = i < dots - f.dodgeCount ? '#a8ecff' : '#56493f';
        sctx.fillRect(sx - (dots * 9 - 3) / 2 + i * 9, sy + 16, 6, 6);   // centered row of dots
      }
      if (f.dodgeCount > DODGE_FREE && SHOW_FIGHT_TEXT) text('TIRED x' + Math.min(FATIGUE_MAX, f.dodgeCount - DODGE_FREE), sx, sy + 40, 8, '#c27a12', 'center');
    }
    if (f.shieldHP < SHIELD_MAX) {
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(sx - 27, sy + 4, 54, 9);
      sctx.fillStyle = f.shieldHP < 30 ? '#d63a2a' : '#cdb79a';
      sctx.fillRect(sx - 24, sy + 7, 48 * Math.max(0, f.shieldHP) / SHIELD_MAX, 3);
    }
    const a = f.action;
    if (a && a.type === 'attack' && a.phase === 'charge') {
      const c = clamp(a.charge / MAX_CHARGE, 0, 1);
      sctx.fillStyle = '#0e0c0c'; sctx.fillRect(sx - 27, ty - 30, 54, 9);
      if (a.move.sweetSpot) {
        // SWEET SPOT bar: green zone = release here for max power with no penalty, red = overcharged
        const [s0, s1] = a.move.sweetSpot;
        sctx.fillStyle = 'rgba(123,224,138,0.35)'; sctx.fillRect(sx - 24 + 48 * s0, ty - 29, 48 * (s1 - s0), 7);
        sctx.fillStyle = 'rgba(214,58,42,0.35)'; sctx.fillRect(sx - 24 + 48 * s1, ty - 29, 48 * (1 - s1), 7);
        const inSweet = c >= s0 && c <= s1, over = c > s1;
        sctx.fillStyle = inSweet ? (Math.floor(performance.now() / 60) % 2 ? '#7be08a' : '#ffffff') : over ? '#d63a2a' : f.energy;
        sctx.fillRect(sx - 24, ty - 27, 48 * c, 3);
        if (inSweet && SHOW_FIGHT_TEXT) text('NOW!', sx, ty - 36, 9, '#7be08a', 'center');
        else if (over && SHOW_FIGHT_TEXT) text('TOO MUCH!', sx, ty - 36, 8, '#d63a2a', 'center');
      } else {
        sctx.fillStyle = c >= 0.98 ? '#ffffff' : f.energy;
        sctx.fillRect(sx - 24, ty - 27, 48 * c, 3);
      }
      if (a.move.overcharge && a.charge > MAX_CHARGE) {         // overcharge: a second, gold/red bar fills on top + the %
        const o = clamp((a.charge - MAX_CHARGE) / OVERCHARGE_TIME, 0, 1);
        const blink = Math.floor(performance.now() / 80) % 2 === 0;
        sctx.fillStyle = o >= 1 ? (blink ? '#ffffff' : '#d63a2a') : '#ffd23f';
        sctx.fillRect(sx - 24, ty - 27, 48 * o, 3);
        if (SHOW_FIGHT_TEXT) text(Math.round(100 + 100 * o) + '%', sx, ty - 36, 9, o >= 1 ? '#ff5a3c' : '#ffd23f', 'center');
      }
    }
    const pop = (t, label, color) => {
      if (t > 0 && SHOW_FIGHT_TEXT) text(label, sx, Math.round(sy - fh - 46 - (0.35 - t) * 40), 11, color, 'center');
    };
    pop(f.dodgedFlash, 'DODGED!', '#a8ecff');
    pop(f.blockedFlash, 'BLOCKED!', '#cdb79a');
    if (f.parryFlash > 0 && SHOW_FIGHT_TEXT) {
      const k = f.parryFlash / 0.6;
      text('PERFECT!', sx, Math.round(sy - fh - 50 - (1 - k) * 30), 13 + k * 3, '#ffd23f', 'center');
    }
    if (a && a.type === 'parried' && SHOW_FIGHT_TEXT) { const q = toScreen(f.x - f.face * 26, f.y - f.h - 4); text('?!', q.x, q.y, 12, '#ffd23f', 'center'); }
    if (a && a.type === 'dizzy' && SHOW_FIGHT_TEXT) text('SHIELD BREAK!', sx, Math.round(sy - fh - 46), 10, '#ffd23f', 'center');
    if (a && a.type === 'grabbed' && SHOW_FIGHT_TEXT) text('MASH!', sx, Math.round(sy - fh - 46 + (a.shake > 0 ? -3 : 0)), 10, '#ffffff', 'center');
  }

  if (SHOW_FIGHT_TEXT && (fighters.some(f => f.respawnTimer > 0.5 && !f.out) || (matchOver && matchOver.t < 0.5))) text('KO!', W / 2, H / 2 - 60, 48, '#ffffff', 'center');
  drawUltHUD();
  // STOCK MATCH: "GAME!" when only one fighter is left
  if (matchOver) {
    const k = Math.min(1, matchOver.t * 3);
    text('GAME!', W / 2, H / 2 - 20, Math.round(40 + 40 * k), Math.floor(matchOver.t * 10) % 2 ? '#ffd23f' : '#ffffff', 'center');
  }
  if (demo && !ult && !gameOptions.cleanHud && SHOW_FIGHT_TEXT) text(demo.kind === 'clash' ? 'DEMO: CLASH  (slow motion)' : demo.kind === 'ult' ? 'DEMO: ULTIMATE' :
                         demo.kind === 'broly' ? 'DEMO: LANCE DOWN THROW - BROLY SLAM  (half speed)' : 'DEMO: PERFECT BLOCK + COUNTER  (slow motion)',
                 W / 2, 150, 12, '#ffffff', 'center');
  if (hudToast) {
    hudToast.t -= 1 / 60;
    if (hudToast.t <= 0) hudToast = null;
    else if (SHOW_FIGHT_TEXT) text(hudToast.text, W / 2, 110, 11, '#a8ecff', 'center');
  }
  if (xray && xray.t > 0 && xray.v.respawnTimer <= 0) {            // "RIBS BROKEN!" over the x-rayed fighter
    const k = 1 - xray.t / xray.max, S = toScreen(xray.v.x, xray.v.y - xray.v.h - 30);
    const wob = (Math.random() - 0.5) * 6 * (1 - k);
    text('X-RAY', S.x, S.y - 30, 9, '#a8ecff', 'center');
    text(BONE_LABEL[xray.bone] || 'BONE BROKEN!', S.x + wob, S.y, Math.round(18 + 6 * Math.min(1, k * 4)),
         Math.floor(performance.now() / 90) % 2 ? '#ff2e24' : '#ffffff', 'center');
  }
  for (const f of fighters) {                           // Colby without his scythe: where it is / pick it up
    if (!f.noScythe || f.respawnTimer > 0 || !SHOW_FIGHT_TEXT) continue;
    const s = scythes.find(q => q.owner === f);
    const near = s && s.state !== 'fly' && Math.hypot(s.x - f.x, s.y - (f.y - 20)) < SCYTHE_THROW.pickup;
    const S = toScreen(f.x, f.y - f.h - 50);
    const isPad = f.controller && f.controller.startsWith('pad'), gc = isPad && padIsGC(+f.controller.slice(3)), B = f.binds || bindings;
    const btn = isPad ? padBtnName((gc ? B.gcPad : B.pad).special[0], gc) : keyName(B.keys.special[0]);
    if (near) text(btn + ': PICK UP SCYTHE', S.x, S.y, 9, Math.floor(performance.now() / 200) % 2 ? '#ffffff' : '#ffd23f', 'center');
    else text('NO SCYTHE', S.x, S.y, 7, '#8f8f98', 'center', false);
  }
  if (turbo && SHOW_FIGHT_TEXT) text('TURBO x' + TURBO_SPEED, W - 16, 26, 10, Math.floor(performance.now() / 400) % 2 ? '#d63a2a' : '#ff5a3c', 'right');
  for (const p of painTexts) {                          // manga sound words on the Broly slams
    if (!p.ult && !SHOW_FIGHT_TEXT && !KEEP_TEXTS.has(p.text)) continue;   // (only the ultimates', clashes' and criticals' words show)
    const k = p.t / p.max, C = toScreen(p.x, p.y - (1 - k) * 25);
    const wob = (Math.random() - 0.5) * 6 * k;
    text(p.text, C.x + wob, C.y, Math.round((p.big ? 26 : 18) * (1 + (1 - k) * 0.25)), Math.floor(k * 12) % 2 ? '#ff5a3c' : '#ffffff', 'center');
  }
  if (critText && critText.t > 0) {                     // "CRITICAL!" pops up where they got hit
    const k = critText.t / 1.1;
    const wob = (Math.random() - 0.5) * 8 * k;
    const C = toScreen(critText.x, critText.y);
    text('CRITICAL!', C.x + wob, C.y - (1 - k) * 30, 26 + (1 - k) * 8, Math.floor(k * 20) % 2 ? '#ff5a3c' : '#ffd23f', 'center');
  }
  drawClashBars();
  if (clashText && clashText.t > 0) {
    const k = clashText.t / CLASH_TIME;
    const wob = (Math.random() - 0.5) * 6 * k;
    const C = toScreen(clashText.x, clashText.y);
    text('CLASH!', C.x + wob, C.y - (1 - k) * 20, 22 + (1 - k) * 6, '#ffd23f', 'center');
  }

  if (showHitboxes) drawHitboxes();
}

// The two POWER BARS over the clashing fighters' heads
function drawClashBars() {
  for (const f of fighters) {
    const a = f.action;
    if (!a || a.type !== 'clash' || !a.leader || !a.duel || f.respawnTimer > 0) continue;
    const D = a.duel;
    D.p.forEach((g, i) => {
      const locked = D.lock[i] !== null, v = locked ? D.lock[i] : clashBarVal(D, i);
      const fl = D.flash, won = fl && fl.w === i, lost = fl && fl.w === 1 - i;
      // the power bar, sideways, just above their damage card at the bottom of the screen (it never goes off screen)
      const ci = fighters.indexOf(g.minion ? g.owner : g);
      if (ci >= 0 && ci < REAL_FIGHTERS) {
        const cx = hudCardX(ci), cy = H - 96 - 46, cw = 210, ch = 20;
        sctx.fillStyle = '#0e0c0c'; sctx.fillRect(cx - 3, cy - 3, cw + 6, ch + 6);
        sctx.fillStyle = '#2a2530'; sctx.fillRect(cx, cy, cw, ch);
        sctx.fillStyle = 'rgba(255,210,63,0.35)'; sctx.fillRect(cx + cw * 0.88, cy, cw * 0.12, ch);    // the top: worth the risk
        sctx.fillStyle = won ? '#ffffff' : lost ? '#6e6e78' : (g.color || '#ffd23f');
        sctx.fillRect(cx, cy, cw * v / 100, ch);
        if (locked) { sctx.fillStyle = '#ffffff'; sctx.fillRect(cx + cw * v / 100 - 2, cy - 5, 4, ch + 10); }
        text(won ? 'CLASH WON!' : 'CLASH', cx, cy - 8, 9, won ? '#ffd23f' : '#ffffff', 'left');
      }
    });

// Radial speed lines around the ultimate's target (screen space)
function drawSpeedLines() {
  const c = toScreen(ult.target.x, ult.target.y - 50);
  ctx.fillStyle = sketch ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 46; i++) {
    const ang = hash(i * 3.7 + Math.floor(time * 20)) * Math.PI * 2;
    const r1 = 230 + hash(i + Math.floor(time * 20)) * 120, w = 0.008;
    ctx.beginPath();
    ctx.moveTo(c.x + Math.cos(ang) * r1, c.y + Math.sin(ang) * r1);
    ctx.lineTo(c.x + Math.cos(ang - w) * 1600, c.y + Math.sin(ang - w) * 1600);
    ctx.lineTo(c.x + Math.cos(ang + w) * 1600, c.y + Math.sin(ang + w) * 1600);
    ctx.fill();
  }
}

// THE CUTSCENE: Colby walks away; a red line appears across the enemy's waist, the top half slides off
// and falls, the legs buckle, blood pours.
function drawUltCutscene() {
  const U = ult, u = U.user, v = U.target, ct = U.t, dir = U.dir;
  // Colby walking away, scythe resting on his shoulders
  const s = Math.sin(ct * 7), c = Math.cos(ct * 7), walking = ct < 2.6;
  const walk = pose({ lean: 0.06, bob: walking ? Math.abs(s) * 2 : 0,
                      legA: walking ? [s * 0.45, 0.15 + Math.max(0, c) * 0.6] : [0.1, 0.05],
                      legB: walking ? [-s * 0.45, 0.15 + Math.max(0, -c) * 0.6] : [-0.1, 0.05] });
  drawFigure({ x: u.x, y: u.y, vx: dir * 34, vy: 0, face: dir, pose: withCarry(u, walk), squash: 0,
               color: bodyColorOf(u), ink: inkOf(u), look: u.look });

  // The enemy, frozen upright, then cut in two
  const stand = pose({ lean: -0.08, legA: [0.12, 0.05], legB: [-0.12, 0.05], armA: [0.3, -0.1], armB: [-0.3, 0.1] });
  const fig = { x: v.x, y: v.y, vx: 0, vy: 0, face: -dir, pose: stand, squash: 0, color: bodyColorOf(v), ink: inkOf(v), look: v.look };
  const cutY = v.y - 58;
  const sep = clamp((ct - 0.9) / 1.3, 0, 1);                       // how far the top half has slid / fallen
  const upDx = dir * 60 * sep * sep, upDy = Math.min(62, 330 * Math.max(0, sep - 0.22) ** 2), upRot = dir * 1.35 * sep * sep;
  const lowRot = -dir * 1.45 * easeOut(clamp((ct - 1.45) / 0.55, 0, 1));   // legs buckle backward

  // lower half (rotate around the feet, then keep only what's below the cut)
  ctx.save();
  ctx.translate(fig.x, fig.y); ctx.rotate(lowRot); ctx.translate(-fig.x, -fig.y);
  ctx.beginPath(); ctx.rect(fig.x - 300, cutY, 600, 400); ctx.clip();
  drawFigure(fig);
  ctx.restore();
  // upper half (slides along the cut, tips over, falls)
  ctx.save();
  ctx.translate(upDx, upDy);
  ctx.translate(fig.x, cutY); ctx.rotate(upRot); ctx.translate(-fig.x, -cutY);
  ctx.beginPath(); ctx.rect(fig.x - 300, cutY - 400, 600, 400); ctx.clip();
  drawFigure(fig);
  ctx.restore();

  // The cut line: appears glowing red, then the wound shows on both halves as they separate
  const lineK = clamp((ct - 0.5) / 0.25, 0, 1);
  if (lineK > 0) {
    ctx.save();
    ctx.lineCap = 'round';
    if (sep < 0.05) {
      ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = sketch ? 0 : 14;
      ctx.strokeStyle = sketch ? '#b3261e' : '#ff3030'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(fig.x - 24 * lineK, cutY + 1); ctx.lineTo(fig.x + 24 * lineK, cutY - 1); ctx.stroke();
    } else if (gore) {
      ctx.fillStyle = '#7e1c1c';
      ctx.beginPath(); ctx.ellipse(fig.x, cutY, 7, 3, lowRot, 0, Math.PI * 2); ctx.fill();               // stump
      ctx.translate(upDx, upDy); ctx.translate(fig.x, cutY); ctx.rotate(upRot);
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, Math.PI * 2); ctx.fill();                         // severed top
    }
    ctx.restore();
  }
}

function render() {
  // Pixel mode: draw the world small, then blow it up with chunky pixels.
  // Smooth mode: draw straight onto the full-size screen.
  ctx = pixelMode ? loCtx : sctx;
  ctx.setTransform(pixelMode ? 1 / PIX : RS, 0, 0, pixelMode ? 1 / PIX : RS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (shake > 0) ctx.translate(snap((Math.random() - 0.5) * shake), snap((Math.random() - 0.5) * shake));
  sketchStroke = 0;
  if (impactFrame > 0) {
    drawImpactFrame();
  } else if (ult && ult.scene) {
    drawDeckScene(ult);                               // Captain Heel's grab ultimate: on board the pirate ship
  } else {
    // Background is drawn straight to the screen; everything in the world goes through the camera
    if (sketch) drawPaper(); else drawBackground();
    if (!sketch) {
      // ATMOSPHERIC HAZE: knock the backdrop back (darker, flatter, less contrast) so the fighters pop off
      // it - like the soft, muted backgrounds behind the figures in an animated stick fight
      ctx.fillStyle = stageDef.hell ? 'rgba(26,4,3,0.36)' : 'rgba(34,29,27,0.42)';
      ctx.fillRect(-60, -60, W + 120, H + 120);
    }
    if (ult) {
      // Ultimate: the world drops into darkness (blood-red for the cutscene) so the fighters pop
      ctx.fillStyle = ult.phase === 'cutscene' ? (sketch ? 'rgba(120,0,0,0.18)' : 'rgba(40,0,0,0.62)')
                                               : (sketch ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.55)');
      ctx.fillRect(-60, -60, W + 120, H + 120);
      if (ult.phase !== 'cutscene') drawSpeedLines();
    }
    ctx.save();
    applyCamera(ctx);
    if (sketch) drawStageSketch(); else drawStage();
    drawCracks();
    drawRopes();
    drawShipUlts();                                     // Aiden's pirate ship (behind everyone)
    if (ult && ult.statue) drawGuanyin(ult);            // Colbalias's hundred-armed statue (behind everyone)
    if (fighters.some(f => f.action && f.action.type === 'timeStop')) {   // the world takes on a stopped-time tint
      const vb = viewBounds(); ctx.fillStyle = 'rgba(70,40,140,0.16)'; ctx.fillRect(vb.l - 60, vb.t - 60, vb.r - vb.l + 120, vb.b - vb.t + 120);
    }
    drawGhosts();
    if (ult && ult.phase === 'cutscene') drawUltCutscene();
    else {
      // Draw back-to-front (a thrown fighter swung behind the thrower goes behind him)
      const order = fighters.filter(f => f.respawnTimer <= 0).sort((a, b) => (a.drawZ || 0) - (b.drawZ || 0));
      for (const f of order) drawFighter(f);
      for (const f of order) drawSmear(f);              // attack smears on top of the bodies
      drawCage();                                       // Aiden's steel cage (the bars in front)
      drawShipUlts(true);                               // Aiden's pirate ship crashing down on them
      if (ult && ult.statue) drawGuanyinFront(ult);    // the statue's palms flying in + the Zero Hand beam
    }
    drawProjectiles();
    drawKiMarks();                                    // Lance's purple ki mark over whoever he's marked
    drawBleed();                                      // bleed stacks from Colby's scythe
    drawGazeMarks();                                  // Colbalias's red eye over whoever he's looked at
    drawThrownScythes();
    drawAuraWaves();                                  // Lance's Tenma Kiai blast
    drawParticles();
    if (xray && xray.t > 0) drawXrayWorld();          // Mortal Kombat x-ray on a big hit
    drawKO();
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.setTransform(RS, 0, 0, RS, 0, 0);            // (the screen is drawn on in game units, scaled to the real size)
  if (pixelMode) {
    pixelate();
    sctx.imageSmoothingEnabled = false;
    sctx.drawImage(lo, 0, 0, LW * PIX, LH * PIX);
  }

}

    up: tapped(...K.up, 'ArrowUp'), down: tapped(...K.down, 'ArrowDown'), left: tapped(...K.left, 'ArrowLeft'), right: tapped(...K.right, 'ArrowRight'),
    ok: tapped(...K.attack, 'Enter'), back: tapped(...K.special, 'Backspace'), start: tapped('Enter'), alt: tapped('Tab'),
    esc: tapped('Escape'), leave: tapped('Delete'), pause: tapped('Escape') } });

    const B = gp.buttons.map(b => !!b && (b.pressed || b.value > 0.5));
    const prev = menuPadPrev[i] || { B: [], sx: 0, sy: 0 };

      ok: t(0), back: t(1), start: t(9), alt: t(3), turbo: t(2), esc: false, leave: t(8), pause: t(9) } });

}

    rows: fighters.slice(0, REAL_FIGHTERS).map((f, i) => ({ name: f.name, char: f.char, color: f.color, stocks: Math.max(0, f.stocks), falls: f.kos, i,
                                                            won: team !== null && team !== undefined ? f.team === team : f === matchOver.winner })),

function startMatch() {
  for (const f of fighterPool) endShipSong(f);    // (a pirate-ship song still playing from the last match)
  removeAllMinions();
  cage = null;
  applyStage(gameOptions.stage || 0);
  // the fighters for this match: one per switched-on player slot (2-4)
  fighters.length = 0;
  players.forEach((pl, i) => { if (!pl.off) fighters.push(fighterPool[i]); });
  REAL_FIGHTERS = fighters.length;
  matchTeams = !!gameOptions.teams;
  const cpus = activePlayers().filter(q => q.cpu).length;
  players.forEach((pl, i) => {
    if (pl.off) return;
    const f = fighterPool[i];
    setCharacter(f, pl.char);
    f.controller = pl.cpu ? 'dummy' : pl.dev;
    f.name = pl.cpu ? (cpus > 1 ? 'CPU ' + (i + 1) : 'CPU') : pl.name;
    f.team = matchTeams ? pl.team : undefined;
    f.color = matchTeams ? TEAM_COLORS[pl.team].main : FIGHTER_INIT[i].color;   // TEAMS: the team's colour
    f.binds = profileOf(pl.profile);                                              // this player's CONTROLS PRESET
    f.kos = 0; f.ult = 0; f.disp = null;
    f.stocks = gameOptions.stocks > 0 ? gameOptions.stocks : Infinity;   // lives

    f.timeMeter = 0; f.tsCD = 0;

// The top row picks WHICH PRESET you're editing: switch (left/right or the arrows), NEW, RENAME, DELETE.
const ctl = { row: 0, col: 0, listen: null, profile: 'DEFAULT', padSet: 'pad', gcCal: null };
try { const s = localStorage.getItem('stickman-brawl-ctlprofile'); if (s && profiles[s]) ctl.profile = s; } catch (e) {}
const CTL_ROWS = ['preset', ...ACTIONS, 'tapJump', 'cStick', 'gcSetup', 'reset', 'back'];
const ctlRowY = r => 150 + r * 28;
const ctlGC = () => ctl.padSet === 'gcPad';            // is the controller column showing the GAMECUBE buttons?
const padHeaderRect = { x: 840, y: 86, w: 340, h: 26 };
// GAMECUBE SETUP: press each button when it asks - teaches the game any GameCube adapter's layout (saved per adapter)
const GC_CAL_STEPS = [['A', 'A'], ['B', 'B'], ['X', 'X'], ['Y', 'Y'], ['Z', 'Z'], ['L', 'L (ALL THE WAY IN)'], ['R', 'R (ALL THE WAY IN)'],
  ['START', 'START'], ['DU', 'D-PAD UP'], ['DD', 'D-PAD DOWN'], ['DL', 'D-PAD LEFT'], ['DR', 'D-PAD RIGHT'],
  ['CX', 'PUSH THE C-STICK RIGHT'], ['CY', 'PUSH THE C-STICK DOWN']];
function startGcSetup() {
  ctl.gcCal = { step: 0, pad: -1, rest: [], prev: [], wait: false, map: { btn: {}, lx: 0, ly: 1, cx: [2, 1], cy: [3, 1] } };
  rawPads().forEach((gp, i) => { if (gp) { ctl.gcCal.rest[i] = [...gp.axes]; ctl.gcCal.prev[i] = gp.buttons.map(btnDown); } });
  menuSfx('pick');
}
function gcSetupNext(C, gp) {
  C.step++; C.wait = true; menuSfx('move');
  if (C.step >= GC_CAL_STEPS.length) {
    if (gp) { gcMaps[gp.id] = C.map; saveGcMaps(); }
    ctl.gcCal = null; ctl.padSet = 'gcPad'; menuSfx('go');
  }
}
function gcSetupUpdate() {
  const C = ctl.gcCal, pads = rawPads(), [key] = GC_CAL_STEPS[C.step];
  if (tapped('Escape') || mouse.right) { ctl.gcCal = null; menuSfx('back'); return; }
  if (tapped('Space', 'Enter') || mouse.click) { gcSetupNext(C, pads[C.pad]); return; }        // skip this one (keeps the usual button)
  for (let i = 0; i < pads.length; i++) {
    const gp = pads[i];
    if (!gp || !gp.connected || (C.pad >= 0 && i !== C.pad)) continue;
    const rest = C.rest[i] || (C.rest[i] = [...gp.axes]), prev = C.prev[i] || [], B = gp.buttons.map(btnDown);
    C.prev[i] = B;
    if (C.wait) {                                          // let go of the last one first
      const calm = !B.some(Boolean) && gp.axes.every((v, k) => Math.abs(v - (rest[k] || 0)) < 0.35);
      if (calm) C.wait = false;
      continue;
    }
    let got = null;
    if (key === 'CX' || key === 'CY') {                    // the C-stick: whichever stick axis moved (not the left stick)
      for (let k = 2; k < gp.axes.length; k++) {
        const d = gp.axes[k] - (rest[k] || 0);
        if (Math.abs(rest[k] || 0) <= 1.05 && Math.abs(d) > 0.6) { got = [k, Math.sign(d)]; break; }
      }
      if (got) C.map[key === 'CX' ? 'cx' : 'cy'] = got;
    } else {
      const n = B.findIndex((on, k) => on && !prev[k]);    // a button...
      if (n >= 0) got = n;

// --- drawing helpers: wobbly hand-drawn lines that "boil" (re-drawn slightly differently ~8 times a second) ---
const boil = () => Math.floor(menuTime * 8);

function drawNotebook() {

function drawDoodleTitle(cx, y, size) {

// ---- OPTIONS: master / music / sound effects volume, and the art style (all saved) ----
const opt = { row: 0, drag: null };

const OPT_LABEL = { master: 'MASTER VOLUME', music: 'MUSIC', sfx: 'SOUND EFFECTS', art: 'ART STYLE', display: 'DISPLAY', quality: 'QUALITY', padType: 'CONTROLLERS', back: 'BACK' };
const optRowY = r => 186 + r * 62;

const cyclePadType = d => { settings.padType = PAD_TYPES[(PAD_TYPES.indexOf(settings.padType) + d + PAD_TYPES.length) % PAD_TYPES.length]; saveSettings(); menuSfx('pick'); };

const optValue = row => row === 'art' ? artStyle : row === 'quality' ? settings.quality : row === 'padType' ? settings.padType : displayMode();

const DISPLAY_MODES = () => window.appInfo && window.appInfo.setDisplayMode ? ['WINDOWED', 'BORDERLESS', 'FULLSCREEN'] : ['WINDOWED', 'FULLSCREEN'];

}

  if (window.appInfo && window.appInfo.setDisplayMode) window.appInfo.setDisplayMode(next.toLowerCase());
  else if (next === 'FULLSCREEN') { try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  else if (document.fullscreenElement) { try { document.exitFullscreen().catch(() => {}); } catch (e) {} }

}
const optSlider = r => ({ x: 560, y: optRowY(r) - 26, w: 440, h: 36 });
function setVolume(key, v) {
  const old = settings[key];

  if (settings[key] !== old) { saveSettings(); if (key !== 'music' && (!opt.lastBlip || menuTime - opt.lastBlip > 0.12)) { opt.lastBlip = menuTime; menuSfx('pick'); } }
}
function optionsUpdate(dt) {
  const devs = menuDevices(dt);

    if (d.tap.up) { opt.row = (opt.row + OPT_ROWS.length - 1) % OPT_ROWS.length; menuSfx('move'); }
    if (d.tap.down) { opt.row = (opt.row + 1) % OPT_ROWS.length; menuSfx('move'); }
    const row = OPT_ROWS[opt.row], lr = d.tap.left ? -1 : d.tap.right ? 1 : 0;
    if (lr) {
      if (row === 'display') cycleDisplay(lr);
      else if (row === 'quality') cycleQuality(lr);
      else if (row === 'padType') cyclePadType(lr);
      else if (row === 'art') { setArtStyle(ART_STYLES[(ART_STYLES.indexOf(artStyle) + lr + ART_STYLES.length) % ART_STYLES.length]); menuSfx('pick'); }
      else if (row !== 'back') setVolume(row, settings[row] + lr * 0.05);
    }
    if (d.tap.ok || d.tap.start) {
      if (row === 'back') { goHome(); return; }
      if (row === 'art') { setArtStyle(ART_STYLES[(ART_STYLES.indexOf(artStyle) + 1) % ART_STYLES.length]); menuSfx('pick'); }
      if (row === 'display') cycleDisplay(1);
      if (row === 'quality') cycleQuality(1);

  if (mouse.click) {
    const row = OPT_ROWS[opt.row];

    else if (row === 'display') cycleDisplay(mouse.x < 780 ? -1 : 1);
    else if (row === 'quality') cycleQuality(mouse.x < 780 ? -1 : 1);
    else if (row === 'padType') cyclePadType(mouse.x < 780 ? -1 : 1);
    else if (row === 'art') { const lr = mouse.x < 780 ? -1 : 1; setArtStyle(ART_STYLES[(ART_STYLES.indexOf(artStyle) + lr + ART_STYLES.length) % ART_STYLES.length]); menuSfx('pick'); }
    else if (row === 'back') { goHome(); mouse.click = false; return; }
  }

function drawCGBackground() {
