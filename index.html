<style>
  html, body { margin: 0; height: 100%; background: #0e0c0c; overflow: hidden; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
// =====================================================================
//  DOODLE BROTHERS
//  Move A/D, jump W/Space, down S. J = physical attack, K = ranged attack
//  (+ direction = different move, hold = charge). Shift/L = block
//  (+ direction = dodge). Full list is on screen (C hides it).
// =====================================================================

// ONLINE PLAY needs both players' games to run the EXACT same fight, so while the fight simulation runs
// online, Math.random comes from a shared seeded generator (simRng). Drawing, sounds and menus always
// use the real one (realRandom).
const realRandom = Math.random;
let simRng = null;
Math.random = () => simRng ? simRng() : realRandom();

const W = 1280, H = 720;
const PIX = 3;                                  // size of one "pixel" in screen pixels
const LW = Math.ceil(W / PIX), LH = Math.ceil(H / PIX);

const canvas = document.getElementById('game');
const sctx = canvas.getContext('2d');            // full-size screen (HUD + text go here)
const lo = document.createElement('canvas');     // low-res canvas (the game world goes here in pixel mode)
lo.width = LW; lo.height = LH;
const loCtx = lo.getContext('2d', { willReadFrequently: true });
let ctx = loCtx;                                 // whichever canvas the world is being drawn on

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
  canvas.style.marginTop = (innerHeight - H * s) / 2 + 'px';
  canvas.style.marginLeft = 'auto';
}
addEventListener('resize', fit);
fit();

const FONT = '"Press Start 2P", monospace';

// ---------------- Palette: dusty "Combat Gods" wasteland ----------------
const PALETTE = [
  '0e0c0c','1a1716','26211f','332c29','433a35','56493f','6b5a4c','806b5a','978069','b39a7f','cdb79a', // earth
  '2a2a30','3b3b44','52525c','6e6e78','8f8f98','b4b4bb',                                             // stone/smoke
  '3d0c0c','5e1414','7e1c1c','a8261e','d63a2a',                                                       // crimson/blood
  '8a4f0e','c27a12','f0a818','ffd23f','fff3a8',                                                       // gold/lightning
  '1f6fb5','45b6e8','a8ecff','ffffff','000000'];                                                      // fx
const PR = PALETTE.map(h => parseInt(h.slice(0, 2), 16));
const PG = PALETTE.map(h => parseInt(h.slice(2, 4), 16));
const PB = PALETTE.map(h => parseInt(h.slice(4, 6), 16));
// Lookup table: any color (5 bits per channel) -> nearest palette color
const LUT = new Uint8Array(32768);
for (let k = 0; k < 32768; k++) {
  const r = ((k >> 10) & 31) * 8 + 4, g = ((k >> 5) & 31) * 8 + 4, b = (k & 31) * 8 + 4;
  let best = 0, bd = Infinity;
  for (let i = 0; i < PALETTE.length; i++) {
    const dr = r - PR[i], dg = g - PG[i], db = b - PB[i];
    const d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
    if (d < bd) { bd = d; best = i; }
  }
  LUT[k] = best;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.5);
const DITHER = 22;
// Art styles - P cycles through them: chunky pixel art, smooth Combat Gods animation, notebook sketch
const ART_STYLES = ['PIXEL', 'COMBAT GODS', 'SKETCHBOOK'];
let artStyle = 'COMBAT GODS';   // smooth by default (like the Combat Gods animations) - P switches to pixel / sketchbook
let pixelMode = false;   // artStyle === 'PIXEL'
let sketch = false;      // artStyle === 'SKETCHBOOK'
function setArtStyle(s) { artStyle = s; pixelMode = s === 'PIXEL'; sketch = s === 'SKETCHBOOK'; }

// ---------------- Input ----------------
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
const held = (...codes) => codes.some(c => keys[c]);
const tapped = (...codes) => codes.some(c => pressed[c]);

// ---------------- Remappable controls: keyboard + Xbox controllers ----------------
// Every fighting action has a list of keys and a list of controller buttons. You can change them on the
// CONTROLS screen; they're saved in this browser so they stick between sessions.
const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'special', 'shield', 'grab', 'ult'];
const ACTION_LABEL = { left: 'MOVE LEFT', right: 'MOVE RIGHT', up: 'UP', down: 'DOWN', jump: 'JUMP', attack: 'PHYSICAL ATTACK',
  special: 'RANGED ATTACK', shield: 'BLOCK / DODGE', grab: 'GRAB', ult: 'TRANSFORM / ULT' };
const DEFAULT_BINDINGS = {
  keys: { left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
          jump: ['KeyW', 'ArrowUp', 'Space'], attack: ['KeyJ'], special: ['KeyK'], shield: ['ShiftLeft', 'ShiftRight', 'KeyL'],
          grab: ['KeyU'], ult: ['KeyI'] },
  // Xbox button numbers (standard gamepad layout). The left stick always moves too.
  //   A = physical, B = ranged, X/Y = jump, RT/LT = block/dodge, RB = grab, LB = transform/ultimate
  pad:  { left: [14], right: [15], up: [12], down: [13], jump: [2, 3], attack: [0], special: [1], shield: [7, 6],
          grab: [5], ult: [4] },
  tapJump: true,            // flicking the stick up also jumps (Smash's default)
  cStick: 'attack',         // RIGHT STICK ("C-stick"): a flick does that direction's move. 'attack' | 'special' | 'off'
};
// C-STICK (right stick) feel: flick = past `flick`, back to center = under `reset`. C-stick moves start up
// faster (startup x `speed`), stay buffered a little longer, and can CANCEL the end of an attack that hit.
const C_STICK = { flick: 0.5, reset: 0.3, speed: 0.75, buffer: 0.2 };
const PAD_BTN_NAMES =['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 'VIEW', 'MENU', 'L-STICK', 'R-STICK', 'D-UP', 'D-DOWN', 'D-LEFT', 'D-RIGHT', 'XBOX'];
let bindings = loadBindings();
function loadBindings() {
  const d = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
  try {
    const s = JSON.parse(localStorage.getItem('stickman-brawl-bindings') || 'null');
    if (s && s.keys && s.pad) return { keys: { ...d.keys, ...s.keys }, pad: { ...d.pad, ...s.pad }, tapJump: s.tapJump ?? d.tapJump, cStick: s.cStick ?? d.cStick };
  } catch (e) {}
  return d;
}
function saveBindings() { try { localStorage.setItem('stickman-brawl-bindings', JSON.stringify(bindings)); } catch (e) {} }
function keyName(code) {
  const special = { Space: 'SPACE', ShiftLeft: 'L-SHIFT', ShiftRight: 'R-SHIFT', ControlLeft: 'L-CTRL', ControlRight: 'R-CTRL',
    AltLeft: 'L-ALT', AltRight: 'R-ALT', ArrowUp: 'UP ARROW', ArrowDown: 'DOWN ARROW', ArrowLeft: 'LEFT ARROW', ArrowRight: 'RIGHT ARROW',
    Enter: 'ENTER', Tab: 'TAB', Backspace: 'BACKSPACE', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/',
    BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`', CapsLock: 'CAPS' };
  if (special[code]) return special[code];
  return code.replace(/^Key/, '').replace(/^Digit/, '').replace(/^Numpad/, 'NUM ').toUpperCase();
}
const padBtnName = n => PAD_BTN_NAMES[n] || 'BTN ' + n;
// Read one controller: which ACTIONS are held right now (null if that controller isn't plugged in)
function getPads() { try { return navigator.getGamepads ? [...navigator.getGamepads()] : []; } catch (e) { return []; } }
function padRaw(i) {
  const gp = getPads()[i];
  if (!gp || !gp.connected) return null;
  const B = gp.buttons.map(b => !!b && (b.pressed || b.value > 0.5));
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const P = bindings.pad, any = a => P[a].some(n => B[n]);
  return {
    left: any('left') || ax < -0.5, right: any('right') || ax > 0.5,
    up: any('up') || ay < -0.55, down: any('down') || ay > 0.55,
    jump: any('jump'), attack: any('attack'), special: any('special'), shield: any('shield'), grab: any('grab'), ult: any('ult'),
    buttons: B, ax, ay, rx: gp.axes[2] || 0, ry: gp.axes[3] || 0,
  };
}
const JUMP_KEYS  = ['KeyW', 'ArrowUp', 'Space'];
const BLOCK_KEYS = ['ShiftLeft', 'ShiftRight', 'KeyL'];
const ATK_KEYS   = ['KeyJ'];   // physical attack
const SPC_KEYS   = ['KeyK'];   // ranged attack
const GRAB_KEYS  = ['KeyU'];   // grab
const ULT_KEYS   = ['KeyI'];   // ultimate (when the meter is full)
const DIR_KEYS   = ['KeyA', 'KeyD', 'KeyS', 'KeyW', 'ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp'];

// ---------------- Tuning (tweak these to change the "feel") ----------------
const GRAVITY   = 3400;
const APEX_BAND = 140, APEX_GRAVITY = 0.6;   // gentler gravity near the top of a jump (consistent aerial timing)
const JUMP_SCALE = 0.95;                    // keeps jump heights the same as before the softer gravity
const SPIKE_HANG = 140;                      // max fall speed while a down-air spike is out (spike off-stage safely)
// Body proportions (all characters): long legs, short torso
const LEG_UP = 25, LEG_LOW = 24;             // thigh and shin length
const TORSO = 22, NECK = 13;                 // hip-to-shoulder, shoulder-to-head
const LEG_SCALE = (LEG_UP + LEG_LOW) / 39;   // poses were designed for 39-long legs; crouches scale with this

const RUN_SPEED = 640;
const AIR_SPEED = 540;
const DASH_START = 0.85;
const RUN_MULT = 1.4;       // RUNNING (double-tap a direction): this much faster than walking/dashing
const GROUND_ACCEL = 7500;
const AIR_ACCEL    = 3600;
const FRICTION     = 5500;
const AIR_DRAG     = 900;
const JUMP_VEL     = 1180;
const DOUBLE_JUMP_VEL = 1080;
const AIR_JUMPS = 2;        // jumps you get in the air (2 = a triple jump: ground jump + 2 more)
const JUMP_SQUAT   = 0.05;  // tiny crouch before a jump (lets you do up-attacks with W + J)
const MAX_FALL  = 1200;
const FLIP_TIME = 0.26;
const BUFFER    = 0.1;

// Dodges
const SPOT_DODGE = { dur: 0.21, iStart: 0.02, iEnd: 0.17 };
const ROLL       = { dur: 0.25, iStart: 0.035, iEnd: 0.19, speed: 1040 };
const AIR_DODGE  = { dur: 0.25, iStart: 0.02, iEnd: 0.18, speed: 2160, decay: 10, floatTime: 0.14 };
const DODGE_COOLDOWN = 0.05;
const AIR_DODGES = 2;      // (old limit, no longer used - air dodges now spend the blue dodge dots)
// Air dodge ("Z vanish") allowed while you have a blue dodge dot left: up to AIR_DODGE_MAX (5) in a row
const AIR_DODGE_MAX = 5;
function canAirDodge(f) { return f.dodgeCount < AIR_DODGE_MAX; }
const WAVEDASH_FRICTION = 0.3;

// Dodge fatigue
const DODGE_FREE = 4;        // ground dodges before fatigue kicks in (air dodges get AIR_DODGE_MAX)
const DODGE_RECOVER = 0.6;
const FATIGUE_MAX = 3;
const FATIGUE_SLOWER = 0.1;
const FATIGUE_SHORTER = 0.05;
const FATIGUE_LESS_SAFE = 0.1;

// Shield
const SHIELD_MAX   = 100;
const SHIELD_DRAIN = 6;
const SHIELD_REGEN = 22;
const SHIELD_DMG_MULT = 1.4;  // shield loses (attack damage x this)
const SHIELD_BREAK_STUN = 1.4;

// Attacks & knockback
const COMBO_GRACE  = 0.35;  // after a combo hit ends, pressing again this soon continues the combo
const PARRY_WINDOW = 0.15;  // block this close to a hit landing = PERFECT block + counter
const PARRY_STUN   = 0.5;   // how long the attacker staggers after being perfect-blocked
const CLASH_WINDOW = 0.15;  // both attacks (same button) started this close together = CLASH
// A clash is a string of MINI CLASHES: they trade a quick burst of blows at one spot, ZIP somewhere else on the
// map, trade blows there, zip again... and the last stop is back where it started.
const CLASH_STOPS  = 6;     // spots: the start + 4 random places around the map + back home
const CLASH_STOP   = 0.32;  // time spent at each spot
const CLASH_BLOWS  = 3;     // blows traded at each spot
const CLASH_BLOW   = 0.075; // time between those blows
const CLASH_FIRST  = 0.07;  // after arriving, the first blow (lets the Z vanish zip be heard first)
const CLASH_TIME   = CLASH_STOPS * CLASH_STOP + 0.06;   // how long the whole clash lasts before both jump back
const CLASH_BEAT   = 0.15;  // (grab clash: shove rhythm)
const CLASH_CHIP   = 0.25;  // damage BOTH fighters take on each exchanged blow (~4.5% each over a whole clash)
const MAX_CHARGE   = 1.0;   // seconds of holding for a full charge
const CHARGE_BONUS = 0.8;   // full charge = +80% damage and knockback
const OVERCHARGE_TIME = 1.2; // moves with "overcharge" (Lance's Kamehameha): this much MORE holding goes 100% -> 200%
const HITSTUN_BASE = 0.12;
const HITSTUN_PER_SPEED = 0.0003;
const LAUNCH_DECAY = 2.2;   // how fast launched fighters slow down (lower = fly further)
const HITSTUN_GRAVITY = 0.52;   // (x GRAVITY) launched fighters fall the same as before the gravity change, so KO power is unchanged

// ---------------- The map ----------------
// Bigger stage (1180 wide - was 1000, and 700 before that). The camera pulls out to fit it - see CAMERA below.
const STAGE = { x: 50, y: 500, w: 1180, h: 140 };
const PLATFORMS = [
  { x: 205, y: 385, w: 220 },
  { x: 855, y: 385, w: 220 },
  { x: 530, y: 265, w: 220 },
];
// STAGES (picked in GAME OPTIONS). Same size main stage; they differ in platforms and look.
//   RUINS    = the original: rocky mesa in a ruined wasteland, three floating platforms
//   HELLFIRE = completely FLAT (no platforms), a burning slab of obsidian floating over a sea of lava in hell
const STAGE_LIST = [
  { name: 'RUINS', platforms: PLATFORMS.map(p => ({ ...p })) },
  { name: 'HELLFIRE', platforms: [], hell: true },
];
let stageDef = STAGE_LIST[0];
function applyStage(i) {
  stageDef = STAGE_LIST[i] || STAGE_LIST[0];
  PLATFORMS.length = 0;
  for (const p of stageDef.platforms) PLATFORMS.push({ ...p });
}
const BLAST = { left: -520, right: W + 520, bottom: H + 340, top: -380 };
const SPAWN = { x: 640, y: 170 };

// ---------------- CAMERA ----------------
// Follows the fighters smoothly. Stays in CLOSE (fighters big on screen, like an animated fight) and
// only pulls back as far as it has to to keep both fighters in frame. Big hits PUNCH the camera in a little.
const CAM_ZOOM_MAX = 1.2, CAM_ZOOM_MIN = 0.7;   // (the ultimate pushes in closer than this)
const CAM_PAD = { x: 470, y: 360 };             // breathing room around the fighters (smaller = tighter framing)
const cam = { x: W / 2, y: 390, z: 1.0 };
let camPunch = 0;                               // 0..1, kicked up by big hits, fades fast
const camZ = () => cam.z * (1 + 0.09 * camPunch);
function updateCamera(dt) {
  camPunch = Math.max(0, camPunch - dt * 4.5);
  const alive = fighters.filter(f => f.respawnTimer <= 0 && !f.minion);
  let tx = STAGE.x + STAGE.w / 2, ty = STAGE.y - 110, tz = CAM_ZOOM_MAX;
  if (alive.length) {
    const xs = alive.map(f => clamp(f.x, BLAST.left + 200, BLAST.right - 200));
    const ys = alive.map(f => clamp(f.y - 45, BLAST.top + 150, BLAST.bottom - 150));
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    tx = lerp(STAGE.x + STAGE.w / 2, (minX + maxX) / 2, 0.8);        // follow the action (stage stays in view)
    ty = lerp(STAGE.y - 90, (minY + maxY) / 2, 0.6);
    tz = clamp(Math.min(W / (maxX - minX + CAM_PAD.x), H / (maxY - minY + CAM_PAD.y)), CAM_ZOOM_MIN, CAM_ZOOM_MAX);
  }
  let speed = 4;
  // CLASH teleports: pull out to the whole arena (floor to sky) so you can see them zip all over it
  if (alive.some(f => f.action && f.action.type === 'clash' && f.action.t > 0.06)) {
    tx = STAGE.x + STAGE.w / 2; ty = STAGE.y - 230;
    tz = clamp(Math.min(W / (STAGE.w + 160), H / 620), 0.5, CAM_ZOOM_MAX); speed = 7;
  }
  if (typeof xray !== 'undefined' && xray && xray.t > 0 && xray.v.respawnTimer <= 0) {   // X-RAY: zoom right in on the broken bones
    tx = xray.v.x; ty = xray.v.y - 48; tz = 2.4; speed = 16;
  }
  if (typeof ult !== 'undefined' && ult) {          // ultimate: push in close on the action
    const u = ult.user, v = ult.target;
    if (ult.def.wrestle && ult.cx !== undefined) { tx = ult.cx; ty = STAGE.y - 120; tz = 1.0; speed = 4; }   // the whole ring in view
    else if (ult.def.statue && ult.statue) {                // the whole statue AND the victim in view
      const S = ult.statue; tx = (S.x + v.x) / 2; ty = Math.min(S.y - 300, v.y - 140); tz = 0.62; speed = 3;
    }
    else if (ult.phase === 'cutscene') { tx = (u.x + v.x) / 2; ty = v.y - 70; tz = 1.45; speed = 2.2; }
    else { tx = v.x; ty = v.y - 55; tz = 1.2; speed = 5; }
  }
  const k = 1 - Math.exp(-dt * speed);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
}
function applyCamera(c) { const z = camZ(); c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cam.x, -cam.y); }
function toScreen(x, y) { const z = camZ(); return { x: (x - cam.x) * z + W / 2, y: (y - cam.y) * z + H / 2 }; }
function viewBounds() {
  const z = camZ();
  return { l: cam.x - W / 2 / z, r: cam.x + W / 2 / z, t: cam.y - H / 2 / z, b: cam.y + H / 2 / z };
}

// =====================================================================
//  MOVESET
//  Every character gets a table like this. Copy it and change the
//  numbers/poses to make each friend's character unique.
//
//  startup/active/endlag = seconds.  charge = can hold to power up.
//  hitboxes: x/y = offset from the feet (x is "forward"), r = size,
//  dmg = damage %, base/growth = knockback (growth scales with the
//  target's damage), angle = launch angle (0 = forward, 90 = up,
//  180 = backward, negative = down).
//  Poses: [angle, bend] for each limb. 0 = straight down,
//  1.57 = straight forward, 3.14 = straight up, negative = backward.
// =====================================================================
const NEUTRAL_POSE = { lean: 0.03, bob: 0, spin: 0, legA: [0.22, 0.08], legB: [-0.18, 0.05], armA: [0.35, -0.6], armB: [-0.25, -0.4] };
const pose = o => ({ ...NEUTRAL_POSE, ...o });

const STICKMAN_MOVES = {
  // ---------- COUNTER (fires automatically after a PERFECT block) ----------
  counter: { name: 'Palm Counter', startup: 0.03, active: 0.08, endlag: 0.2, lunge: 420, lungeFriction: 0.6,
    hitboxes: [{ x: 40, y: -62, r: 26, dmg: 10, base: 460, growth: 6, angle: 40 },
               { x: 16, y: -62, r: 22, dmg: 10, base: 460, growth: 6, angle: 40 }],
    wind: pose({ lean: -0.2, armA: [0.4, -2.0], armB: [0.2, -1.8], legA: [0.5, 0.5], legB: [-0.5, 0.2] }),
    strike: pose({ lean: 0.35, armA: [1.6, 0], armB: [-0.5, -1.0], legA: [0.8, 0.6], legB: [-0.7, 0.1] }) },

  // ---------- PHYSICAL (J) on the ground ----------
  jab: { name: 'Jab', startup: 0.05, active: 0.06, endlag: 0.12,
    hitboxes: [{ x: 34, y: -62, r: 14, dmg: 3, base: 200, growth: 1.5, angle: 40 }],
    wind: pose({ armA: [0.5, -2.0], armB: [0.2, -1.6], lean: -0.05 }),
    strike: pose({ armA: [1.57, 0], armB: [-0.4, -1.2], lean: 0.15 }) },

  sideGround: { name: 'Side Smash', startup: 0.12, active: 0.08, endlag: 0.25, charge: true, lunge: 180,
    hitboxes: [{ x: 44, y: -40, r: 18, dmg: 12, base: 380, growth: 6, angle: 38 }],
    wind: pose({ legA: [-0.7, 1.4], lean: -0.25, armA: [-1.2, -0.5], armB: [1.2, -0.5] }),
    strike: pose({ legA: [1.65, 0], legB: [-0.25, 0.1], lean: -0.35, armA: [-1.4, -0.3], armB: [1.0, -0.6] }) },

  upGround: { name: 'Up Smash', startup: 0.1, active: 0.1, endlag: 0.25, charge: true,
    hitboxes: [{ x: 10, y: -100, r: 22, dmg: 11, base: 360, growth: 5.5, angle: 88 }],
    wind: pose({ bob: -8, legA: [0.5, 1.0], legB: [-0.3, 0.6], armA: [0.3, -2.3], armB: [-0.2, -1.8], lean: 0.2 }),
    strike: pose({ bob: 2, armA: [3.05, 0], armB: [-0.6, -0.8], legA: [0.1, 0], legB: [-0.15, 0], lean: -0.05 }) },

  downGround: { name: 'Down Smash', startup: 0.1, active: 0.09, endlag: 0.25, charge: true,
    hitboxes: [{ x: 40, y: -12, r: 17, dmg: 10, base: 340, growth: 5, angle: 25 },
               { x: -40, y: -12, r: 17, dmg: 10, base: 340, growth: 5, angle: 155 }],
    wind: pose({ bob: -12, legA: [0.75, 1.5], legB: [0.55, 1.3], armA: [0.9, -1.9], armB: [0.5, -1.9], lean: 0.35 }),
    strike: pose({ bob: -20, legA: [1.5, 0], legB: [-1.5, 0], armA: [1.9, 0], armB: [-1.9, 0], lean: 0 }) },

  // ---------- PHYSICAL (J) in the air ----------

// ---------------- DESTRUCTO DISC (Lance, side K) ----------------
// hold: forms above his raised hand (lost if he's hit first) -> out: flies straight, then slows ->
// back: turns round and speeds back toward him (cutting everyone again on the return) -> past him: flies off.
const DISC = {
  hold: 0.24, speed: 1150, straight: 0.28, decel: 2900, maxSpeed: 1300, life: 2.6, r: 22,
  color: '#b04dff', glow: '#e2b8ff',                                  // PURPLE
  hit:  { dmg: 8, base: 300, growth: 4.5, angle: 38 },               // each pass (out and back)
  self: { dmg: 3, base: 170, growth: 1.0, angle: 70 },               // caught by his own disc coming back
};
function spawnDisc(f, mult) {
  if (projectiles.some(s => s.kind === 'disc' && s.owner === f)) {   // one at a time: a little fizzle
    burst(f.x + f.face * 6, f.y - 120, [DISC.color, '#ffffff'], 6, 0, Math.PI, 150, { grav: 0 });
    return;
  }
  projectiles.push({ owner: f, kind: 'disc', phase: 'hold', t: 0, x: f.x + f.face * 6, y: f.y - 122, vx: 0, vy: 0,
                     dir: f.face, r: DISC.r, size: 0.25, spin: 0, mult: mult * powerOf(f), color: DISC.color,
                     hit: new Set(), trail: [], life: DISC.life });
  sfx.beam(0.25);
}
function updateDisc(s, dt) {
  const o = s.owner;
  s.t += dt; s.spin += dt * 38;
  if (s.phase === 'hold') {
    const a = o && o.action;
    if (!o || o.respawnTimer > 0 || !a || a.type !== 'attack' || a.move !== o.moveset.sideRanged) {   // hit before he threw it
      burst(s.x, s.y, [DISC.color, '#ffffff'], 10, 0, Math.PI, 260, { grav: 0 });
      return true;
    }
    s.dir = o.face; s.x = o.x + o.face * 6; s.y = o.y - 122;
    s.size = Math.min(1, 0.25 + 0.75 * s.t / DISC.hold);
    if (Math.random() < dt * 40) {                                    // ki spiralling into it
      const ang = Math.random() * Math.PI * 2;
      particles.push({ x: s.x + Math.cos(ang) * 40, y: s.y + Math.sin(ang) * 16, vx: -Math.cos(ang) * 220, vy: -Math.sin(ang) * 90,
                       life: 0.16, max: 0.16, size: 1, color: Math.random() < 0.4 ? '#ffffff' : DISC.color, type: 'bit', grav: 0 });
    }
    if (s.t >= DISC.hold) {                                           // THROW
      s.phase = 'out'; s.t = 0; s.size = 1;
      s.x = o.x + s.dir * 34; s.y = o.y - 82; s.vx = s.dir * DISC.speed; s.vy = 0;
      s.ox = s.x; s.oy = s.y;                                         // where it was thrown from: it comes back HERE
      sfx.whoosh(true);
    }
    return false;
  }
  s.life -= dt;
  if (s.phase === 'out') {
    if (s.t > DISC.straight) s.vx -= s.dir * DISC.decel * dt;         // slows down...
    if (Math.sign(s.vx) === -s.dir) { s.phase = 'back'; s.hit = new Set(); }   // ...and turns round: can cut them again
  } else {
    s.vx = clamp(s.vx - s.dir * DISC.decel * dt, -DISC.maxSpeed, DISC.maxSpeed);   // speeds back the way it came
    if (!s.passed) {
      s.vy = clamp((s.oy - s.y) * 3.2, -650, 650);                    // back along its path, to the spot it was thrown from
      if (Math.sign(s.ox - s.x) === s.dir) s.passed = true;           // gone past that spot: flies on straight
    } else s.vy *= 0.95;
  }
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 8) s.trail.shift();
  const dirSign = Math.sign(s.vx) || s.dir;
  for (const t of fighters) {                                         // cuts straight through people
    if (t === o || (o && allies(o, t)) || s.hit.has(t) || t.respawnTimer > 0) continue;
    if (!circleHitsFighter(s.x, s.y, s.r * 0.9, t)) continue;
    if (applyHit(t, DISC.hit, dirSign, s.mult, s.x, s.y)) {
      s.hit.add(t);
      markKi(o, t);
      slashLine(s.x, s.y, s.vy * 0.001 + (dirSign > 0 ? 0 : Math.PI), 120, 0.14);
      burst(s.x, s.y, [DISC.color, DISC.glow, '#ffffff'], 12, dirSign > 0 ? 0 : Math.PI, 0.6, 420, { grav: 0 });
    }
  }
  // coming back into Lance himself (if he's still in its way): it nicks him (dodge it, jump it or shield it)
  if (s.phase === 'back' && o && o.respawnTimer <= 0 && circleHitsFighter(s.x, s.y, s.r * 0.8, o)) {
    if (applyHit(o, DISC.self, dirSign, 1, s.x, s.y)) {
      painTexts.push({ x: o.x, y: o.y - 130, t: 0.7, max: 0.7, text: 'OUCH!', big: false });
      burst(s.x, s.y, [DISC.color, '#ffffff'], 16, 0, Math.PI, 380, { grav: 0 });
      return true;
    }
  }
  return s.life <= 0 || s.x < BLAST.left || s.x > BLAST.right || s.y < BLAST.top || s.y > BLAST.bottom;
}
function drawDisc(s) {
  const k = s.size || 1, rx = s.r * 1.35 * k, ry = s.r * 0.42 * k;
  ctx.save();
  // motion trail
  s.trail.forEach((p, i) => {
    const u = (i + 1) / s.trail.length;
    ctx.globalAlpha = u * 0.35; ctx.fillStyle = DISC.color;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx * u, ry * u, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.translate(s.x, s.y);
  // glow
  ctx.fillStyle = 'rgba(176,77,255,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 1.5, ry * 2.1, 0, 0, Math.PI * 2); ctx.fill();
  // the disc, seen nearly edge-on, with a sawtooth rim that spins
  ctx.fillStyle = DISC.color;
  ctx.beginPath();
  const teeth = 16;
  for (let i = 0; i <= teeth * 2; i++) {
    const ang = s.spin + (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 ? 1 : 1.16;
    const x = Math.cos(ang) * rx * rr, y = Math.sin(ang) * ry * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = DISC.glow;
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.62, ry * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.28, ry * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------- KI MARK + INSTANT TRANSMISSION (Lance's passive) ----------------
// Hit someone with his ki (Destructo Disc or Kamehameha) = they're MARKED for a few seconds (purple target
// over them). While they're marked, his next Z vanish (air dodge) teleports him right BEHIND them, wherever
// they are on the map, ready to start a combo. Using it spends the mark.
const KI_MARK = { dur: 6, color: '#b04dff' };
function markKi(by, t) {
  if (!by || !by.look || !by.look.kiMark || !t || t === by) return;
  const fresh = !by.kiMark || by.kiMark.t !== t;
  by.kiMark = { t, time: KI_MARK.dur };
  if (fresh) painTexts.push({ x: t.x, y: t.y - 150, t: 0.6, max: 0.6, text: 'MARKED', big: false });
}
function kiMarkTarget(f) {
  const m = f.kiMark;
  if (!m) return null;
  const t = m.t;
  if (m.time <= 0 || !t || t.respawnTimer > 0 || !fighters.includes(t)) { f.kiMark = null; return null; }
  return t;
}
function kiTeleport(f, t) {
  f.kiMark = null;
  const from = { x: f.x, y: f.y - 45 };
  ghosts.push({ fig: figureOf(f), life: 0.35, max: 0.35, color: KI_MARK.color });
  burst(from.x, from.y, [KI_MARK.color, '#ffffff'], 12, 0, Math.PI, 360, { grav: 0 });
  const behind = -(t.face || 1);                                     // appears behind them
  f.x = t.x + behind * 54; f.y = t.y;
  f.ground = t.ground; f.onPlatform = t.ground ? t.onPlatform : null;
  f.vx = t.vx * 0.5; f.vy = t.ground ? 0 : Math.min(-120, t.vy * 0.5);
  f.face = Math.sign(t.x - f.x) || 1;
  f.action = null; f.invuln = Math.max(f.invuln, 0.12);
  if (!t.ground) { f.airDodges = Math.max(0, f.airDodges - 1); f.canCutJump = false; }
  const to = { x: f.x, y: f.y - 45 };
  for (let i = 0; i <= 10; i++) {                                     // streak across the map
    const u = i / 10;
    particles.push({ x: lerp(from.x, to.x, u), y: lerp(from.y, to.y, u), vx: 0, vy: 0, life: 0.1 + u * 0.08, max: 0.18,
                     size: 2, color: i % 2 ? '#ffffff' : KI_MARK.color, type: 'bit', grav: 0 });
  }
  burst(to.x, to.y, [KI_MARK.color, '#ffffff'], 18, 0, Math.PI, 420, { grav: 0 });
  ring(to.x, to.y);
  painTexts.push({ x: t.x, y: t.y - 150, t: 0.7, max: 0.7, text: 'INSTANT TRANSMISSION!', big: false });
  hitstop = Math.max(hitstop, 0.05); shake = Math.max(shake, 6);
  sfx.vanish(1.3);
}
// the purple target over a marked fighter
function drawKiMarks() {
  for (const f of fighters) {
    const t = f.kiMark && f.kiMark.t;
    if (!t || t.respawnTimer > 0 || f.kiMark.time <= 0) continue;
    const x = t.x, y = t.y - hurtH(t) - 26, fade = Math.min(1, f.kiMark.time / 0.8);
    const blink = f.kiMark.time < 1.5 && Math.floor(f.kiMark.time * 8) % 2;
    ctx.save();
    ctx.globalAlpha = (blink ? 0.35 : 0.9) * fade;
    ctx.strokeStyle = KI_MARK.color; ctx.lineWidth = 3;
    const r = 13, rot = time * 3;
    for (let k = 0; k < 4; k++) {                                     // four spinning brackets
      const a0 = rot + k * Math.PI / 2;
      ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + 0.9); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---------------- TENMA KIAI (Lance's perfect-block counter) ----------------
// He yells and his aura explodes outward in an expanding wave that blasts everything away from him.
const auraWaves = [];
function kiaiBlast(f) {
  const col = kiColor(f);
  auraWaves.push({ x: f.x, y: f.y - 48, t: 0, dur: 0.38, max: 175, color: col });
  auraWaves.push({ x: f.x, y: f.y - 48, t: -0.06, dur: 0.38, max: 120, color: '#ffffff' });   // bright inner wave right behind it
  painTexts.push({ x: f.x, y: f.y - 120, t: 0.7, max: 0.7, text: 'HAAAAA!', big: true });
  burst(f.x, f.y - 48, [col, '#ffffff'], 40, 0, Math.PI, 900, { grav: 0 });
  for (let k = 0; k < 6; k++) bolt(f.x, f.y - 50, Math.random() * Math.PI * 2, 90, 0.14, col);
  dust(f.x - 40, f.y, 12, 2.2); dust(f.x + 40, f.y, 12, 2.2);
  shake = Math.max(shake, 16);
  impactFrame = Math.max(impactFrame, 0.07); impactAt = { x: f.x, y: f.y - 48, ang: 0, all: false, focus: true };
  sfx.beam(0.8); sfx.clash(true);
}
function updateAuraWaves(dt) {
  for (let i = auraWaves.length - 1; i >= 0; i--) { auraWaves[i].t += dt; if (auraWaves[i].t >= auraWaves[i].dur) auraWaves.splice(i, 1); }
}
function drawAuraWaves() {
  for (const w of auraWaves) {
    if (w.t < 0) continue;
    const k = w.t / w.dur, r = lerp(24, w.max, easeOut(k));
    ctx.save();
    ctx.globalAlpha = 0.42 * (1 - k);
    ctx.fillStyle = w.color;
    ctx.beginPath();                                      // flame-shaped burst: taller than wide, flickering edge
    for (let j = 0; j <= 24; j++) {
      const ang = j / 24 * Math.PI * 2, wob = 1 + Math.sin(ang * 7 + time * 40) * 0.07;
      const px = w.x + Math.cos(ang) * r * 0.85 * wob, py = w.y + Math.sin(ang) * r * 1.05 * wob - (Math.sin(ang) < 0 ? r * 0.15 : 0);
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.8 * (1 - k); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
}

// ---------------- TIME STOP (Colby, down K while bare-handed) ----------------
// A purple aura bursts out of him. Anyone it touches is FROZEN IN TIME: they can't move, and hits on them
// do their damage right away but the knockback piles up and is released all at once when time resumes.
// How long they stay frozen depends on his TIME meter (filled by landing hits); using it empties the meter.
const TIME_STOP = { base: 0.6, perMeter: 0.024, radius: 165, gain: 6, cooldown: 2.5, color: '#b39dff' };
function startTimeStopAura(f, a) {
  if ((f.tsCD || 0) > 0) {                                   // still recharging: just a fizzle
    burst(f.x, f.y - 50, ['#6e6e78', TIME_STOP.color], 8, 0, Math.PI, 200, { grav: 0 }); a.tsDur = 0; return;
  }
  a.tsDur = TIME_STOP.base + (f.timeMeter || 0) * TIME_STOP.perMeter;
  a.tsHit = new Set();
  f.timeMeter = 0; f.tsCD = TIME_STOP.cooldown;
  auraWaves.push({ x: f.x, y: f.y - 50, t: 0, dur: 0.32, max: TIME_STOP.radius, color: TIME_STOP.color });
  auraWaves.push({ x: f.x, y: f.y - 50, t: -0.05, dur: 0.32, max: TIME_STOP.radius * 0.7, color: '#ffffff' });
  shake = Math.max(shake, 8); sfx.parry(); sfx.beam(0.4);
}
function freezeInTime(t, dur, label = 'TIME STOP!', hell = false) {
  stopKameCharge(t);
  t.action = { type: 'timeStop', t: 0, dur, svx: 0, svy: 0, hits: 0, pose: { ...(t.disp || getPose(t)) }, hell };
  t.vx = 0; t.vy = 0; t.shielding = false;
  painTexts.push({ x: t.x, y: t.y - 130, t: 0.8, max: 0.8, text: label, big: true });

function stepTimeStop(f, a, dt) {
  f.vx = 0; f.vy = 0;

// ---------------- COLBY TUNING ----------------
// KICKS (his moves that don't use the scythe): come out faster and reach further.
// SCYTHE STRIKES: come out faster, but do WAY less damage (they're for pressure and reach now, not damage).
// The scythe throw stays slow on purpose (it's meant to be telegraphed), and the counter is left alone.
// Kicks: about Lance's speed (a touch slower - he's the fast one) but with more reach than his.
const COLBY_KICK = { speed: 0.92, reach: 12, grow: 4 };         // startup/recovery x0.92, hitboxes +12px out, +4 radius
const COLBY_SCYTHE = { speed: 0.75, damage: 0.55 };             // startup/recovery x0.75, damage x0.55
for (const k in COLBY_MOVES) {
  const m = COLBY_MOVES[k];
  if (k === 'counter' || m.throwScythe) continue;
  const scythe = !!((m.strike && m.strike.sc) || (m.wind && m.wind.sc) || m.spinScythe);
  if (scythe) {
    m.startup *= COLBY_SCYTHE.speed; m.endlag *= COLBY_SCYTHE.speed;
    for (const h of m.hitboxes || []) h.dmg = Math.round(h.dmg * COLBY_SCYTHE.damage * 10) / 10;
  } else {
    m.startup *= COLBY_KICK.speed; m.endlag *= COLBY_KICK.speed;
    for (const h of m.hitboxes || []) {
      if (Math.abs(h.x) > 15) h.x += Math.sign(h.x) * COLBY_KICK.reach;
      h.r += COLBY_KICK.grow;
    }
  }
}

// The ANNIHILATOR (charged rush punch) belongs to his bare-handed PUNCH moveset on SIDE K (side ranged):
// after throwing the scythe, side K becomes the Annihilator (replacing the Lunging Straight).
// Side J is always his Dash Kick - with or without the scythe.
COLBY_PUNCHES.sideRanged = COLBY_MOVES.sideGround;
COLBY_MOVES.sideGround = COLBY_MOVES.dashKickMove;

// Lance is the speedster: his physical moves come out ~15% quicker than they're written above,
// but every hit does less damage and knockback than Colby's.
const LANCE_SPEED = 0.85, LANCE_POWER = 0.82;
// His physical (J) moves reach a bit farther than they're written above
const LANCE_PHYSICAL = ['jab', 'jab2', 'jab3', 'jab4', 'sideGround', 'upGround', 'downGround', 'dashAttack', 'nair', 'fair', 'bair', 'uair', 'dair'];
for (const k of LANCE_PHYSICAL) {
  for (const h of LANCE_MOVES[k].hitboxes || []) {
    if (Math.abs(h.x) > 20) h.x += Math.sign(h.x) * 8;     // pushed further out in front (or behind)
    h.r += 3;
  }
}
for (const k in LANCE_MOVES) {
  if (k === 'counter') continue;                  // shared with the base stickman, leave it alone
  const m = LANCE_MOVES[k];
  if (!m.beam && !m.rapid) { m.startup *= LANCE_SPEED; m.endlag *= LANCE_SPEED; }
  for (const h of m.hitboxes || []) {
    h.dmg = Math.round(h.dmg * LANCE_POWER * 10) / 10;
    h.base *= 0.9; h.growth *= LANCE_POWER;
  }
}

// ---------------- REVENGE ----------------
const REVENGE = { perHit: 0.25, perDmg: 0.025, max: 0.75, time: 12 };   // next hit: +25% (+2.5% per % absorbed), up to +75%
function triggerRevenge(f, h, dirSign, dmg, hx, hy) {
  f.revenge = Math.min(REVENGE.max, (f.revenge || 0) + REVENGE.perHit + dmg * REVENGE.perDmg);
  f.revengeT = REVENGE.time;
  f.hitFlash = 0.1;
  f.face = -dirSign || f.face;                          // turn to face whoever hit him

// ---------------- ALOLAN WHIP (side K) ----------------
// All four arms lunge out. Catch someone = he whips them across into the ROPES (a ring corner appears),
// they bounce off and come flying back, and he meets them with a LARIAT. Press K again just as they
// come back (the "NOW!" flash) for a CRITICAL lariat - much stronger. Whiff = long recovery.
// dash: the lunge forward while grabbing (speed x the move's active time ~ 580px = about half the stage)
const WHIP = { reach: 62, r: 34, out: 0.3, bounce: 0.1, back: 0.26, dist: 270, window: 0.16, dash: 1620,

    // grabbing: catch anyone in reach of the four arms during the active part
    if (a.phase !== 'active') return false;
    // THE DASH: charges forward, arms out, the whole active window
    f.vx = f.face * WHIP.dash;
    if (!f.ground) f.vy = Math.min(f.vy, 60);                 // (holds his height in the air)
    if (f.ground && !f.onPlatform) {                          // stops at the ledge instead of running off
      const edge = f.face > 0 ? STAGE.x + STAGE.w - 14 : STAGE.x + 14;
      if ((f.face > 0 && f.x + f.vx * dt > edge) || (f.face < 0 && f.x + f.vx * dt < edge)) { f.x = edge; f.vx = 0; }
    }

    if (Math.random() < dt * 40) burst(f.x - f.face * 20, f.y - 50, FIRE, 1, f.face > 0 ? Math.PI : 0, 0.4, 260, { grav: -100 });
    const gx = f.x + f.face * WHIP.reach * 0.7, gy = f.y - 55;
    for (const t of fighters) {
      if (t === f || allies(f, t) || t.respawnTimer > 0 || t.halo > 0 || isIntangible(t)) continue;
      const ta = t.action;
      if (ta && ['grabbed', 'holding', 'thrown', 'whipped', 'ultVictim', 'ultSeq'].includes(ta.type)) continue;
      if (!circleHitsFighter(gx, gy, WHIP.r, t)) continue;
      // CAUGHT (shields don't stop it - it's a grab)
      t.shielding = false; t.vx = t.vy = 0;

      let rope = f.x + f.face * WHIP.dist;

      a.whip = { t: 0, victim: t, rope, y: f.y, pressed: false, done: false };
      a.whipVictim = t;
      ropeFx.push({ x: rope + f.face * 18, y: f.y, dir: f.face, len: 170, stretch: 0, life: 1.3, max: 1.3 });
      a.whip.fx = ropeFx[ropeFx.length - 1];
      sfx.grab(); hitstop = Math.max(hitstop, 0.06); shake = Math.max(shake, 5);

  const T1 = WHIP.out, T2 = T1 + WHIP.bounce, T3 = T2 + WHIP.back;
  const near = f.x + f.face * 46;

    const k = easeOut(W.t / T1);
    v.x = lerp(near, W.rope, k); v.face = -f.face; v.action.spin = -f.face * 0.5;
    a.poseOverride = pose({ lean: 0.5, bob: -8, legA: [1.0, 0.7], legB: [-0.85, 0.1], armA: [1.7, 0], armB: [1.6, 0.05], armC: [1.5, 0.1], armD: [1.45, 0.1] });
  } else if (W.t < T2) {                                    // the ropes stretch and fling them back

  } else {                                                  // coming back... LARIAT!

    if ((inp.spcTap || f.spcBuf > 0) && !W.pressed) {      // timing press

    if (W.t >= T3) {
      // LARIAT

      knock(v, crit ? WHIP.crit : WHIP.hit, f.face, powerOf(f), v.x, v.y - 60);
      if (f.revenge > 0) consumeRevenge(f, v.x, v.y - 60);
      burst(v.x, v.y - 60, FIRE, crit ? 40 : 18, Math.PI / 2, 1.2, crit ? 700 : 450, { grav: -250 });
      painTexts.push({ x: v.x, y: v.y - 120, t: 0.7, max: 0.7, text: crit ? 'CRITICAL LARIAT!' : 'LARIAT!', big: crit });
      if (crit) {

        hitstop = Math.max(hitstop, 0.2); shake = Math.max(shake, 22);

// ---------------- CROSS CHOP (up K) ----------------

    if (Math.random() < dt * 60) burst(f.x, f.y - 40, FIRE, 1, Math.PI / 2 + f.face * 0.6, 0.4, 200, { grav: -150 });
    a.poseOverride = pose({ lean: 0.85, bob: 0, legA: [-0.4, 0.4], legB: [-0.7, 0.3], armA: [1.9, 0.5], armB: [1.4, -0.5], armC: [1.6, 0.3], armD: [1.2, -0.3] });

// ---------------- THROWS ----------------
// back = GIANT SWING: grabs their legs and spins round and round with them, then lets go behind him
// down = BODY SLAM + ELBOW DROP: slams them flat on the floor, hops up and drives an elbow into them
// up   = FOUR-ARM PRESS: hoists them overhead with all four arms, then heaves them straight up
// (their timings/power are added to THROW_ANIM / THROWS further down, next to the other throws)
const INF_FTHROW  = { dmg: 10, base: 460, growth: 7, angle: 35 };   // four-arm toss (stronger forward throw)

    const u = easeOut(a.t / 0.22);
    v.x = f.x + F * lerp(40, 14, u); v.y = f.y - lerp(0, 95, u); a.vspin = -F * lerp(0, 2.6, u);
    f.vx = 0;

  } else if (a.t < 0.34) {                                    // ...and SLAM them flat on their back
    const u = (a.t - 0.22) / 0.12;

    if (a.t < 0.44) { a.pose = pose({ lean: 0.3, bob: -18, legA: [0.9, 1.6], legB: [-0.4, 1.2], armA: [0.6, -1.6], armB: [0.4, -1.6] }); f.vx = 0; }
    else {
      if (!a.hopped) { a.hopped = true; f.vy = -900; f.ground = false; f.y -= 2; f.vx = F * Math.max(0, (a.vx0 - f.x) * F - 10) / 0.45; sfx.whoosh(true); }
      // in the air: body tips forward, elbow pointed down at them
      a.pose = pose({ lean: 1.25, bob: 0, legA: [-0.3, 0.5], legB: [-0.6, 0.4], armA: [0.1, -2.5], armB: [-0.4, -2.2], armC: [0.6, -1.4], armD: [0.3, -1.4] });
      if ((f.ground && a.t > 0.5) || a.t >= a.rel) {
        a.released = true; f.vx = 0;
        v.action = null; v.drawZ = 0; v.y = a.gy0; v.x = a.vx0;

        if (v.action && v.action.type === 'hitstun' && !v.action.crit) v.action.dur += THROW_HITSTUN_BONUS + 0.08;
        burst(v.x, f.y - 10, FIRE, 26, Math.PI / 2, 1.1, 500, { grav: -250 });
        if (f.revenge > 0) consumeRevenge(f, v.x, f.y - 30);

        a.pose = pose({ lean: 0.9, bob: -26, legA: [1.2, 2.0], legB: [0.3, 1.6], armA: [0.2, -2.2], armB: [-0.2, -2.0] });

}

// ---------------- SPINNING PILEDRIVER (homage to Zangief, Street Fighter) ----------------
// His up throw AND a COMMAND GRAB (spin the stick a full circle, then grab - see trySPD).
//  1. He hauls them upside down in front of him and locks their HEAD BETWEEN HIS KNEES, arms wrapped
//     round their waist.
//  2. He LEAPS high and CORKSCREWS: the two of them spin round a vertical axis together (turnX), side-on,
//     past each other, round again...
//  3. He comes down SITTING, driving their head into the floor between his legs. Huge crunch.
const SPD = { flip: 0.22, leap: 1350, turns: 2.6, holdY: 4, grabReach: 70, grabR: 40 };
function stepPiledriver(f, a, dt) {
  const v = a.victim, F = a.face0, T = a.t;
  if (a.released) { f.vx = approach(f.vx, 0, FRICTION * dt); return; }
  v.vx = v.vy = 0; v.face = F;                                // (upside down, facing the same way he does)
  const hold = (d) => { v.x = f.x + F * d; v.y = f.y - SPD.holdY; };
  const wrap = (turn) => ({ ...pose({ lean: 0.08, bob: -10, legA: [0.55, 0.8], legB: [-0.45, 0.8],          // knees round their head
                                      grip: [8, -66], lowFree: false }), turnX: turn, raw: true });          // all four arms round their waist
  if (T < SPD.flip) {                                         // 1. haul them up and over, head between his knees
    const u = easeOut(T / SPD.flip);
    v.x = f.x + F * lerp(40, 8, u); v.y = f.y - lerp(0, SPD.holdY, u) - Math.sin(u * Math.PI) * 50;
    a.vspin = F * Math.PI * u; a.turn = 1;
    a.pose = u < 0.6 ? pose({ lean: -0.25, bob: -14, legA: [0.85, 1.0], legB: [-0.6, 0.5], grip: gripOn(f, v) }) : wrap(1);
    f.vx = 0;
    return;
  }
  if (!a.jumped) {                                            // 2. LEAP...
    a.jumped = true; a.jT = T; f.vy = -SPD.leap; f.ground = false; f.y -= 2; f.vx = 0;
    dust(f.x, f.y, 16, 2.2); ring(f.x, f.y); sfx.whoosh(true);
  }
  f.vx = 0;
  // ...and CORKSCREW: both of them turn round a shared vertical axis
  const th = (T - a.jT) * Math.PI * 2 * SPD.turns, c = Math.cos(th);
  a.turn = c; a.vspin = F * Math.PI;
  hold(8 * c);
  v.drawZ = Math.sin(th) >= 0 ? 0.5 : -0.5;                    // passes in front of / behind his body as they turn
  a.pose = wrap(c);
  if (Math.random() < dt * 70) {                              // whirlwind streaks spiralling round them
    const ang = Math.random() * Math.PI * 2;
    particles.push({ x: f.x + Math.cos(ang) * 70, y: f.y - 60 + Math.sin(ang) * 30, vx: -Math.sin(ang) * 650, vy: Math.cos(ang) * 120,
                     life: 0.13, max: 0.13, size: 2, color: Math.random() < 0.6 ? '#ffffff' : '#cdb79a', type: 'bit', grav: 0 });
  }
  if ((f.ground && T > a.jT + 0.2) || T >= a.rel) {           // 3. comes down SITTING - their head driven into the floor
    a.released = true; a.turn = 1;
    v.drawZ = 0; v.x = f.x + F * 8; v.y = f.y;
    painfulSlam(v, v.x, f.y, 2, true);
    v.action = null;
    knock(v, THROWS.piledriver, F, f.revenge > 0 ? powerOf(f) : 1, v.x, f.y - 20);
    if (v.action && v.action.type === 'hitstun' && !v.action.crit) v.action.dur += THROW_HITSTUN_BONUS;
    burst(v.x, f.y - 10, FIRE, 28, Math.PI / 2, 1.1, 520, { grav: -250 });
    cracks.push({ x: v.x, y: f.y, life: 4, max: 4, seed: Math.random() * 1000, size: 1.6 });
    if (f.revenge > 0) consumeRevenge(f, v.x, f.y - 30);
    painTexts.push({ x: v.x, y: f.y - 160, t: 0.9, max: 0.9, text: 'SPINNING PILEDRIVER!', big: true });
    a.dur = a.t + 0.4;
    a.pose = pose({ lean: 0.15, bob: -40, legA: [1.5, 0.25], legB: [1.3, 0.35],                              // sat down hard, legs out
                    armA: [1.1, -1.2], armB: [0.9, -1.2], armC: [0.8, -0.9], armD: [0.6, -0.9] });

// COMMAND GRAB: the stick has gone all the way round (left, right, up and down all touched in the last

function noteStickCircle(f, inp) {
  const h = f.circle || (f.circle = { l: -9, r: -9, u: -9, d: -9 });

    if (t === f || allies(f, t) || t.respawnTimer > 0 || t.halo > 0 || isIntangible(t) || !t.ground) continue;
    const ta = t.action;
    if (ta && ['grabbed', 'holding', 'thrown', 'whipped', 'ultVictim', 'timeStop'].includes(ta.type)) continue;

    burst(gx, gy, ['#ffffff', '#ffd23f'], 12, 0, Math.PI, 360, { grav: 200 });

// ---------------- FORWARD THROW: RKO (Bryan Fury, Tekken 7/8) ----------------

  if (a.released) { f.vx = approach(f.vx, 0, FRICTION * dt); return; }
  v.vx = v.vy = 0;
  if (!a.vx0) { a.vx0 = f.x + F * 42; a.gy0 = f.y; }
  if (T < 0.1) {                                               // hooks the head
    v.x = a.vx0; v.y = a.gy0; a.vspin = 0;
    a.pose = pose({ lean: 0.3, bob: -8, legA: [0.9, 1.0], legB: [-0.7, 0.4], grip: gripOn(f, v, -6) });
    return;
  }
  if (!a.jumped) { a.jumped = true; f.vy = -560; f.vx = F * 70; f.ground = false; f.y -= 2; sfx.whoosh(true); }   // a quick, snappy spring
  // in the air: twisting back, arm locked round their neck - they're yanked down with him from the top of the jump
  const k = clamp((T - 0.16) / 0.24, 0, 1);
  v.x = a.vx0; a.vspin = -F * 1.5 * k * k; v.y = a.gy0 + 38 * k * k;
  a.pose = pose({ lean: lerp(0.2, -0.9, k), bob: -2, legA: [1.3, 0.6], legB: [0.9, 0.4], grip: [ (v.x - f.x) * F + 6, (a.gy0 - f.y) - 70 + 40 * k ] });
  if ((f.ground && T > 0.22) || T >= a.rel) {                 // FACE-FIRST into the mat
    a.released = true;
    v.action = null; v.drawZ = 0; v.x = a.vx0; v.y = a.gy0;
    painfulSlam(v, v.x, a.gy0, 1, true);
    knock(v, THROWS.rko, F, f.revenge > 0 ? powerOf(f) : 1, v.x, a.gy0 - 15);
    if (v.action && v.action.type === 'hitstun' && !v.action.crit) v.action.dur += THROW_HITSTUN_BONUS;
    burst(v.x, a.gy0 - 10, FIRE, 20, Math.PI / 2, 1.0, 460, { grav: -250 });
    if (f.revenge > 0) consumeRevenge(f, v.x, a.gy0 - 30);
    painTexts.push({ x: v.x, y: a.gy0 - 140, t: 0.8, max: 0.8, text: 'RKO!', big: true });
    a.dur = a.t + 0.32;
    a.pose = { ...pose({ lean: -0.2, bob: -34, legA: [1.5, 0.3], legB: [1.2, 0.5], armA: [1.6, -0.6], armB: [1.3, -0.6] }), spin: -F * 1.1 };   // sat back on the mat
  }
}

// ---------------- MAX MALICIOUS MOONSAULT (ultimate) ----------------
// A wrestling ring drops in around them. He IRISH-WHIPS them into the far ropes and bounces off the
// near ropes himself, they meet in the middle - LARIAT! - which flips them onto the mat. He leaps up onto
// the top turnbuckle, flexes all four arms... and comes down with a MOONSAULT (backflip body splash)
// that explodes in fire.
const MOON = { half: 290, post: 112 };
function updateWrestleUlt(U, dt) {
  const u = U.user, v = U.target;
  if (!U.ring) {
    const cx = clamp(U.baseX, STAGE.x + MOON.half + 40, STAGE.x + STAGE.w - MOON.half - 40);

    shake = Math.max(shake, 10); sfx.slam();
  }
  const R = U.ring, d = U.dir, cx = R.cx, gy = R.y, T = U.t;
  const once = k => !U.events.has(k) && U.events.add(k);

  const run = sp => pose({ lean: 0.55, bob: -4 + Math.abs(Math.sin(T * sp)) * 3, legA: [Math.sin(T * sp) * 1.0, 0.4 + Math.max(0, Math.cos(T * sp)) * 1.3],
                           legB: [-Math.sin(T * sp) * 1.0, 0.4 + Math.max(0, -Math.cos(T * sp)) * 1.3], armA: [-1.6, -0.4], armB: [-1.9, -0.3] });
  const limp = s => pose({ lean: -0.5, legA: [0.6, 0.6], legB: [-0.5, 0.4], armA: [-2.4, 0.3], armB: [2.3, -0.3], spin: s });
  u.vx = u.vy = v.vx = v.vy = 0;
  R.stretchL = R.stretchR = 0;
  u.anim += dt; v.anim += dt;
  u.hitFlash = Math.max(0, u.hitFlash - dt); v.hitFlash = Math.max(0, v.hitFlash - dt);
  U.jolt = Math.max(0, U.jolt - dt);
  const stretchAt = (side, amt) => { if (side === d) { if (d > 0) R.stretchR = amt; else R.stretchL = amt; } else { if (d > 0) R.stretchL = amt; else R.stretchR = amt; } };

  if (T < 0.15) {                                                  // grab
    u.x = cx - d * 30; u.y = gy; u.face = d;
    v.x = cx + d * 14; v.y = gy; v.face = -d;
    U.userPose = pose({ lean: 0.2, bob: -6, legA: [0.7, 0.5], legB: [-0.6, 0.2], grip: [44, -58] });
    U.victimPose = limp(0);
  } else if (T < 0.55) {                                           // Irish whip: them into the far ropes, him into the near ones
    const k = clamp((T - 0.15) / 0.3, 0, 1);
    v.x = lerp(cx + d * 14, far, easeOut(k)); v.face = -d; U.victimPose = limp(-d * 0.4);
    if (T >= 0.45) { const s = Math.sin(clamp((T - 0.45) / 0.1, 0, 1) * Math.PI) * 30; v.x = far + d * s; stretchAt(d, s); if (once('boingV')) sfx.whoosh(true); }
    const k2 = clamp((T - 0.2) / 0.28, 0, 1);
    if (T < 0.2) U.userPose = pose({ lean: 0.5, bob: -8, legA: [1.0, 0.7], legB: [-0.85, 0.1], armA: [1.7, 0], armB: [1.6, 0.05], armC: [1.5, 0.1], armD: [1.45, 0.1] });
    else { u.face = -d; u.x = lerp(cx - d * 30, nearRope, easeOut(k2)); U.userPose = run(22); }

    u.x = lerp(nearRope, cx - d * 22, k); u.face = d;
    U.userPose = k < 0.7 ? run(24) : pose({ lean: 0.2, bob: -8, legA: [0.9, 0.8], legB: [-0.7, 0.2], armA: [-1.7, -0.5], armB: [-1.6, -0.4], armC: [-1.2, -0.6], armD: [-1.1, -0.6] });
  } else if (T < 1.3) {                                            // ...LARIAT! flips them up and onto the mat

      v.hitFlash = 0.1; U.jolt = 0.1;
      impactFrame = 0.12; impactAt = { x: cx + d * 10, y: gy - 64, ang: 0, all: true, focus: true, invert: true };
      hitstop = Math.max(hitstop, 0.16); shake = 20;

      painTexts.push({ x: cx, y: gy - 150, t: 0.7, max: 0.7, text: 'LARIAT!', big: true });
      sfx.hit(1); sfx.clash(true);
    }
    const k = (T - 0.85) / 0.45;
    v.x = cx + d * lerp(22, 70, k); v.y = gy - Math.sin(k * Math.PI) * 170 + (k > 0.85 ? 38 * (k - 0.85) / 0.15 : 0);
    U.victimPose = limp(-d * (0.4 + k * Math.PI * 1.1));
    U.userPose = pose({ lean: 0.4, bob: -10, legA: [0.95, 0.7], legB: [-0.8, 0.1], armA: [1.6, 0], armB: [0.3, -1.4], armC: [1.4, 0.1], armD: [0.1, -1.3] });
    u.x = cx - d * 22; u.face = d;
  } else if (T < 1.75) {                                           // he climbs the top turnbuckle
    if (once('mat')) { painfulSlam(v, cx + d * 70, gy, 0, false); v.damage += 2 * AIDEN_POWER.dmg * U.power; }
    v.x = cx + d * 70; v.y = gy + 38; U.victimPose = { ...pose({ lean: 0, legA: [0.1, 0.1], legB: [-0.1, 0.1], armA: [-2.6, 0.2], armB: [2.6, -0.2] }), spin: -d * Math.PI / 2 };
    const k = clamp((T - 1.3) / 0.3, 0, 1);
    const postX = far - d * 6;
    u.x = lerp(cx - d * 22, postX, easeOut(k)); u.y = gy - MOON.post * easeOut(k) - Math.sin(k * Math.PI) * 90;
    u.face = k < 1 ? d : -d;
    U.userPose = k < 1 ? pose({ lean: 0.3, legA: [1.4, 2.2], legB: [1.0, 2.0], armA: [2.4, -0.5], armB: [2.0, -0.4] })
                       : pose({ lean: -0.1, bob: -4, legA: [0.35, 0.2], legB: [-0.3, 0.15], armA: [2.5, -1.7], armB: [2.2, -1.8], armC: [1.4, -2.0], armD: [1.1, -2.1] });  // FLEX
    if (k >= 1 && once('flex')) { burst(u.x, u.y - 60, FIRE, 30, Math.PI / 2, 1.0, 400, { grav: -300 }); ring(u.x, u.y - 50); sfx.parry(); }
  } else if (T < 2.25) {                                           // MOONSAULT: backflip off the top rope onto them

    u.face = -d;
    u.x = lerp(x0, x1, k); u.y = lerp(gy - MOON.post, gy + 30, k * k) - Math.sin(k * Math.PI) * 170;
    U.userPose = { ...pose({ lean: -0.3, legA: [1.2, 1.4], legB: [0.9, 1.2], armA: [2.6, 0.2], armB: [2.3, 0.2], armC: [2.0, 0.3], armD: [1.8, 0.3] }),

    if (Math.random() < dt * 60) ghosts.push({ fig: figureOf(u), life: 0.2, max: 0.2, color: '#ff8a3c' });

  } else {                                                         // KA-BOOM
    u.x = cx + d * 70; u.y = gy + 30; v.x = cx + d * 70; v.y = gy + 38;
    U.userPose = { ...pose({ lean: 0, bob: 0, legA: [0.1, 0.1], legB: [-0.1, 0.1], armA: [2.4, 0], armB: [-2.4, 0], armC: [1.8, 0], armD: [-1.8, 0] }), spin: d * Math.PI / 2 };
    if (once('splash')) {

      cracks.push({ x: v.x, y: gy, life: 5, max: 5, seed: Math.random() * 1000, size: 2 });
      painTexts.push({ x: v.x, y: gy - 150, t: 1.0, max: 1.0, text: 'MAX MALICIOUS MOONSAULT!', big: true });

      R.life = 0;
      U.baseX = v.x; U.baseY = gy;
      u.y = gy;

}
// Ropes in the world: the whip's ring corner, and the ultimate's whole ring
function drawRopes() {
  const ropeCol = sketch ? '#c0392b' : '#d8262b', postCol = sketch ? '#1b1b1b' : '#2c2c34', pad = sketch ? '#1f3a93' : '#2c63d6';
  const post = (x, y) => {
    ctx.fillStyle = postCol; ctx.fillRect(snap(x - 5), snap(y - MOON.post), 10, MOON.post);
    ctx.fillStyle = pad; for (const h of [40, 72, 104]) ctx.fillRect(snap(x - 7), snap(y - h - 6), 14, 10);
  };
  ctx.save(); ctx.lineCap = 'round';
  for (const r of ropeFx) {
    ctx.globalAlpha = clamp(r.life / r.max * 3, 0, 1);
    post(r.x, r.y);
    ctx.strokeStyle = ropeCol; ctx.lineWidth = 3;
    for (const h of [40, 72, 104]) {                           // ropes run from the post back toward the ring
      const x0 = r.x, x1 = r.x - r.dir * r.len, y = r.y - h;
      ctx.beginPath(); ctx.moveTo(x0 + r.dir * r.stretch, y); ctx.quadraticCurveTo(lerp(x0, x1, 0.4) + r.dir * r.stretch * 0.6, y + 2, x1, y); ctx.stroke();
    }
  }
  if (ult && ult.def.wrestle && ult.ring) {
    const R = ult.ring, xL = R.cx - MOON.half, xR = R.cx + MOON.half, y = R.y;
    ctx.globalAlpha = 1;
    ctx.fillStyle = sketch ? 'rgba(31,58,147,0.2)' : '#1d2a5e';      // apron along the mat
    ctx.fillRect(snap(xL - 8), snap(y), xR - xL + 16, 14);
    post(xL, y); post(xR, y);
    ctx.strokeStyle = ropeCol; ctx.lineWidth = 3;
    for (const h of [40, 72, 104]) {
      ctx.beginPath(); ctx.moveTo(xL - R.stretchL, y - h);
      ctx.quadraticCurveTo(R.cx, y - h + 4, xR + R.stretchR, y - h); ctx.stroke();
    }
  }
  ctx.restore();
}
function updateRopes(dt) {
  for (let i = ropeFx.length - 1; i >= 0; i--) {
    const r = ropeFx[i];
    const busy = fighters.some(f => f.action && f.action.whip && f.action.whip.fx === r);
    if (!busy) r.life -= dt;
    if (r.life <= 0) ropeFx.splice(i, 1);
  }
}

function makeFighter(o) {

              kos: 0, w: 26, h: 90, ult: 0 };   // ult meter lives here so it survives respawns

function setCharacter(f, charName) {

  f.transformed = false; f.baseStats = null; f.kaioken = false; f.noScythe = false;
}

const particles = [];

function dust(x, y, n, spread = 1) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 260 * spread, vy: -Math.random() * 120,
      life: 0.4 + Math.random() * 0.25, max: 0.6, r: 3 + Math.random() * 4, type: 'dust' });
  }
}
function ring(x, y) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0.3, max: 0.3, r: 8, type: 'ring' });
}
// Square pixel bits flying out in a direction (ang = radians, 0 = right, PI/2 = up)
function burst(x, y, colors, n, ang = 0, spread = Math.PI, speed = 400, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() - 0.5) * 2 * spread;
    const s = speed * (0.3 + Math.random() * 0.9);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: -Math.sin(a) * s,
      life: 0.4 + Math.random() * 0.6, max: 1, size: Math.random() < 0.3 ? 2 : 1,
      color: colors[(Math.random() * colors.length) | 0], type: 'bit',
      grav: opts.grav ?? 1400, stain: !!opts.stain });
  }
}
const BLOOD = ['#5e1414', '#7e1c1c', '#a8261e', '#3d0c0c'];
const SWEAT = ['#b4b4bb', '#ffffff', '#a8ecff'];

// A jagged lightning bolt that lasts a moment
function bolt(x, y, ang, len, life = 0.12, color = '#ffd23f') {
  const pts = [[x, y]];
  const segs = 5 + (Math.random() * 4 | 0);
  for (let i = 1; i <= segs; i++) {
    const d = len * i / segs, off = (Math.random() - 0.5) * len * 0.35;
    pts.push([x + Math.cos(ang) * d - Math.sin(ang) * off, y - Math.sin(ang) * d - Math.cos(ang) * off]);
  }
  particles.push({ x, y, vx: 0, vy: 0, pts, life, max: life, color, type: 'bolt' });
}

// Black & white "impact frame" on big hits (like the animation)
let impactFrame = 0, impactAt = null;

function hitBits(t, x, y, dirSign, ang, speed, dmg) {
  const launchAng = dirSign > 0 ? ang : Math.PI - ang;     // which way the hit sends them
  const power = 0.6 + Math.min(1.6, speed / 1200);
  // Clean, readable anime hit: a sharp white STARBURST at the point of impact, a couple of fast white
  // SPEED LINES shooting off the way they're launched, and a little spray (less clutter than before)
  const n = Math.min(40, 6 + dmg * 2);
  if (gore) burst(x, y, BLOOD, n, launchAng, 0.7, 520 * power, { stain: true });
  burst(x, y, SWEAT, Math.ceil(n * (gore ? 0.25 : 0.6)), launchAng, 0.9, 420 * power);
  particles.push({ x, y, vx: 0, vy: 0, life: 0.13, max: 0.13, r: 13 + dmg * 1.7, type: 'impact', rot: Math.random() * Math.PI });
  const nl = 2 + Math.min(3, dmg / 5 | 0);
  for (let i = 0; i < nl; i++) {
    const ang = launchAng + (Math.random() - 0.5) * 0.7;
    particles.push({ x: x + Math.cos(ang) * 10, y: y - Math.sin(ang) * 10, vx: Math.cos(ang) * 900 * power, vy: -Math.sin(ang) * 900 * power,
                     ang: -ang, len: 50 + dmg * 6 + Math.random() * 30, life: 0.12, max: 0.12, type: 'hitline' });
  }
  if (dmg >= 9) bolt(x, y, launchAng + (Math.random() - 0.5) * 1.2, 50 + dmg * 5, 0.08, '#ffffff');   // only big hits crackle
  camPunch = Math.max(camPunch, clamp((speed - 500) / 1200, 0, 1));                                 // big hits punch the camera in
  if (speed > 1000) hitstop = Math.max(hitstop, 0.13);            // strong hit: a heavy freeze...
  if (speed > 1650) {                                                // ...but the black & white IMPACT FRAME only for the
    impactFrame = Math.max(impactFrame, 0.06);                       // really huge ones (near-KO), so the screen isn't
    impactAt = { x, y, ang: launchAng };                             // flashing all the time
  }
}

// (crits are a rare surprise, not the way fights end - matches should be long and drawn out)
const CRIT = { from: 180, low: 0.004, high: 0.015, fullAt: 300, speed: 3800, angle: 18 };

const ULT_CRIT = { over: 250, chance: 0.7 };

  if (t.damage < CRIT.from) return 0;

}
function rollCrit(t, h) {

  if (h.koAt && t.damage >= h.koAt) return true;                  // a finisher with a GUARANTEED KO past this % (Colbalias's ult)
  if (h.ultFinal && t.damage > ULT_CRIT.over) return Math.random() < ULT_CRIT.chance;

// =====================================================================
