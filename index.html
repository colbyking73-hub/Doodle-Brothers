// =====================================================================
//  DOODLE BROTHERS
//  Move A/D, jump W/Space, down S. J = physical attack, K = ranged attack
//  (+ direction = different move, hold = charge). Shift/L = block
//  (+ direction = dodge). Full list is on screen (C hides it).

// ONLINE PLAY needs both players' games to run the EXACT same fight, so while the fight simulation runs
// online, Math.random comes from a shared seeded generator (simRng). Drawing, sounds and menus always
// use the real one (realRandom).
const realRandom = Math.random;
let simRng = null;
Math.random = () => simRng ? simRng() : realRandom();

const W = 1280, H = 720;
const PIX = 3;                                  // size of one "pixel" in screen pixels
const LW = Math.ceil(W / PIX), LH = Math.ceil(H / PIX);

const canvas = document.getElementById('game');
const sctx = canvas.getContext('2d');            // full-size screen (HUD + text go here)
const lo = document.createElement('canvas');     // low-res canvas (the game world goes here in pixel mode)
lo.width = LW; lo.height = LH;
const loCtx = lo.getContext('2d', { willReadFrequently: true });
let ctx = loCtx;                                 // whichever canvas the world is being drawn on

// The screen canvas is made as sharp as the window it's shown in: everything is still drawn in 1280x720 game units,
// just scaled up by RS (render scale) - so COMBAT GODS / SKETCHBOOK stay crisp at any size (fullscreen, big
// monitors). Only the PIXEL style is chunky, on purpose (it draws small and blows that up).
let RS = 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
  canvas.style.marginTop = (innerHeight - H * s) / 2 + 'px';
  canvas.style.marginLeft = 'auto';
  // (capped at 2x so huge screens stay fast; QUALITY: PERFORMANCE caps it at 1x - far fewer pixels to fill on slower PCs)
  const cap = window.__lowQuality ? 1 : 2;
  RS = Math.max(0.5, Math.min(cap, s * (window.devicePixelRatio || 1)));
  const cw = Math.round(W * RS), ch = Math.round(H * RS);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
}
addEventListener('resize', fit);
fit();

const FONT = '"Press Start 2P", monospace';

// ---------------- Palette: dusty "Combat Gods" wasteland ----------------
const PALETTE = [
  '0e0c0c','1a1716','26211f','332c29','433a35','56493f','6b5a4c','806b5a','978069','b39a7f','cdb79a', // earth
  '2a2a30','3b3b44','52525c','6e6e78','8f8f98','b4b4bb',                                             // stone/smoke
  '3d0c0c','5e1414','7e1c1c','a8261e','d63a2a',                                                       // crimson/blood

  '1f6fb5','45b6e8','a8ecff','ffffff','000000'];                                                      // fx

  let best = 0, bd = Infinity;
  for (let i = 0; i < PALETTE.length; i++) {

let sketch = false;      // artStyle === 'SKETCHBOOK'

const C_STICK = { flick: 0.5, reset: 0.3, speed: 0.75, buffer: 0.2 };

// ---------------- CONTROL PRESETS ----------------
// Named control presets ("COLBY", "LANCE PAD"...), each a full set of key + controller bindings. Every player
// slot (P1-P4, on the couch or online) picks its own preset, so everyone plays with their own layout.
// "DEFAULT" always exists (it's also what the menus use). Saved on this computer.
const fillBindings = s => {
  const d = JSON.parse(JSON.stringify(DEFAULT_BINDINGS));
  if (!s || !s.keys || !s.pad) return d;
  const out = { keys: { ...d.keys, ...s.keys }, pad: { ...d.pad, ...s.pad }, gcPad: { ...d.gcPad, ...(s.gcPad || {}) }, tapJump: s.tapJump ?? d.tapJump, cStick: s.cStick ?? d.cStick };

  for (const a of ['left', 'right', 'up', 'down']) { out.pad[a] = (out.pad[a] || []).filter(n => !DPAD.includes(n)); out.gcPad[a] = (out.gcPad[a] || []).filter(n => !DPAD.includes(n)); }
  delete out.keys.taunt;
  return out;
};
let profiles = loadProfiles();
function loadProfiles() {

  try { p = JSON.parse(localStorage.getItem('stickman-brawl-profiles') || 'null'); } catch (e) {}
  if (!p || typeof p !== 'object') {
    let old = null;                                       // (your old single set of controls becomes DEFAULT)
    try { old = JSON.parse(localStorage.getItem('stickman-brawl-bindings') || 'null'); } catch (e) {}
    p = { DEFAULT: old };
  }
  const out = {};
  for (const [name, b] of Object.entries(p)) out[name] = fillBindings(b);
  if (!out.DEFAULT) out.DEFAULT = fillBindings(null);
  return out;
}
const profileNames = () => ['DEFAULT', ...Object.keys(profiles).filter(n => n !== 'DEFAULT').sort()];
const profileOf = name => profiles[name] || profiles.DEFAULT;
let bindings = profiles.DEFAULT;                          // (menus + on-screen hints use DEFAULT)
function saveBindings() {
  try { localStorage.setItem('stickman-brawl-profiles', JSON.stringify(profiles)); } catch (e) {}
  bindings = profiles.DEFAULT;
}
function keyName(code) {
  const special = { Space: 'SPACE', ShiftLeft: 'L-SHIFT', ShiftRight: 'R-SHIFT', ControlLeft: 'L-CTRL', ControlRight: 'R-CTRL',
    AltLeft: 'L-ALT', AltRight: 'R-ALT', ArrowUp: 'UP ARROW', ArrowDown: 'DOWN ARROW', ArrowLeft: 'LEFT ARROW', ArrowRight: 'RIGHT ARROW',
    Enter: 'ENTER', Tab: 'TAB', Backspace: 'BACKSPACE', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/',
    BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`', CapsLock: 'CAPS' };

}
// GAMECUBE controllers: the same slots, with GameCube names (A B X Y, Z on the right shoulder, L / R triggers, START)
const GC_BTN_NAMES = ['A', 'B', 'X', 'Y', '-', 'Z', 'L', 'R', '-', 'START', '-', '-', 'D-UP', 'D-DOWN', 'D-LEFT', 'D-RIGHT', 'HOME'];

// ---------------- GAMECUBE CONTROLLER SUPPORT ----------------
// A GameCube controller can reach the game a few ways: through Steam / Dolphin-style drivers it already looks like an
// Xbox pad; through a MAYFLASH adapter in PC mode its buttons come in a different order (and the D-pad on a "hat");
// other adapters can be different again. So every GameCube controller is translated into the one standard layout

  mayflash: { btn: { X: 0, A: 1, B: 2, Y: 3, L: 4, R: 5, Z: 7, START: 9, DU: 12, DR: 13, DD: 14, DL: 15 }, lx: 0, ly: 1, cx: [5, 1], cy: [2, 1], hat: 9 },
};
let gcMaps = (() => { try { return JSON.parse(localStorage.getItem('stickman-brawl-gcmaps') || '{}') || {}; } catch (e) { return {}; } })();   // GAMECUBE SETUP results, per adapter

const hatIdx = v => (v >= -1.05 && v <= 1.05) ? ((Math.round((v + 1) * 3.5) % 8) + 8) % 8 : -1;

// Attacks & knockback

const CLASH_WINDOW = 0.06;  // both attacks (same button) started this close together = CLASH. Any earlier and
                            // whoever pressed first just hits (interrupts) the other - clashes happen, but not every time
// A clash is a string of MINI CLASHES: they trade a quick burst of blows at one spot, ZIP somewhere else on the
// map, trade blows there, zip again... and the last stop is back where it started.
const CLASH_STOPS  = 5;     // spots: the start + 3 random places around the map + back home
const CLASH_STOP   = 0.5;   // time spent at each spot (one POWER BAR duel each - see CLASH_BAR)
const CLASH_BLOWS  = 4;     // blows traded at each spot
const CLASH_BLOW   = 0.1;   // time between those blows
const CLASH_FIRST  = 0.07;  // after arriving, the first blow (lets the Z vanish zip be heard first)
const CLASH_TIME   = CLASH_STOPS * CLASH_STOP + 0.06;   // how long the whole clash lasts before both jump back
const CLASH_BEAT   = 0.15;  // (grab clash: shove rhythm)
const CLASH_CHIP   = 0.15;  // damage BOTH fighters take on each exchanged blow (~3% each over a whole clash)
// CLASH POWER BAR: at every spot each fighter has a bar that FILLS UP and SNAPS BACK TO ZERO over and over. Press
// attack (J or K) to lock it in - the HIGHER bar wins that exchange and hits the loser for extra damage. Wait for the
// top and you risk it resetting! Didn't press = only half of wherever it was. Whoever wins the LAST one breaks out of
// the clash first while the loser is left stunned right in front of them: a free combo.
const CLASH_BAR = { period: 0.34,                                 // (how long the bar takes to fill: a bit quicker than before) winDmg: 2.2, finalStun: 0.6, missMul: 0.5,
                    cpu: { EASY: [30, 75], NORMAL: [50, 88], HARD: [66, 95], MASTER: [80, 99] } };
const MAX_CHARGE   = 1.0;   // seconds of holding for a full charge
const CHARGE_BONUS = 0.8;   // full charge = +80% damage and knockback
const OVERCHARGE_TIME = 1.2; // moves with "overcharge" (Lance's Kamehameha): this much MORE holding goes 100% -> 200%
const HITSTUN_BASE = 0.12;
const HITSTUN_PER_SPEED = 0.0003;
const LAUNCH_DECAY = 2.2;   // how fast launched fighters slow down (lower = fly further)

// ---------------- The map ----------------
// Bigger stage (1180 wide - was 1000, and 700 before that). The camera pulls out to fit it - see CAMERA below.
const STAGE = { x: 50, y: 500, w: 1180, h: 140 };
const PLATFORMS = [
  { x: 205, y: 385, w: 220 },
  { x: 855, y: 385, w: 220 },
  { x: 530, y: 265, w: 220 },
];
// STAGES (picked in GAME OPTIONS). Same size main stage; they differ in platforms and look.
//   RUINS    = the original: rocky mesa in a ruined wasteland, three floating platforms
//   HELLFIRE = completely FLAT (no platforms), a burning slab of obsidian floating over a sea of lava in hell
const STAGE_LIST = [
  { name: 'RUINS', platforms: PLATFORMS.map(p => ({ ...p })) },
  { name: 'HELLFIRE', platforms: [], hell: true },
];
let stageDef = STAGE_LIST[0];
function applyStage(i) {
  stageDef = STAGE_LIST[i] || STAGE_LIST[0];
  PLATFORMS.length = 0;
  for (const p of stageDef.platforms) PLATFORMS.push({ ...p });
}
// The BOTTOM blast line is well below the stage (~780px under its underside), with room to Z-vanish all the way
// under the stage and still recover. The camera stops following at CAM_FLOOR, so you only die once you've dropped
// OUT OF VIEW below the stage - never while you're still on screen.
// The TOP line is a bit higher too (was -380), so your own upward Z vanishes don't KO you so easily.
const BLAST = { left: -520, right: W + 520, bottom: H + 700, top: -560 };
const CAM_FLOOR = STAGE.y + STAGE.h + 300;      // the lowest point the camera follows anyone down to
const CAM_CEIL = -230;                          // ...and the highest (where it was before the top line moved up)
const SPAWN = { x: 640, y: 170 };

// ---------------- CAMERA ----------------
// Follows the fighters smoothly. Stays in CLOSE (fighters big on screen, like an animated fight) and
// only pulls back as far as it has to to keep both fighters in frame. Big hits PUNCH the camera in a little.
const CAM_ZOOM_MAX = 1.2, CAM_ZOOM_MIN = 0.7;   // (the ultimate pushes in closer than this)
const CAM_PAD = { x: 470, y: 360 };             // breathing room around the fighters (smaller = tighter framing)
const cam = { x: W / 2, y: 390, z: 1.0 };
let camPunch = 0;                               // 0..1, kicked up by big hits, fades fast
const camZ = () => cam.z * (1 + 0.09 * camPunch);
function updateCamera(dt) {
  camPunch = Math.max(0, camPunch - dt * 4.5);
  const alive = fighters.filter(f => f.respawnTimer <= 0 && !f.minion);
  let tx = STAGE.x + STAGE.w / 2, ty = STAGE.y - 110, tz = CAM_ZOOM_MAX;
  if (alive.length) {
    const xs = alive.map(f => clamp(f.x, BLAST.left + 200, BLAST.right - 200));
    const ys = alive.map(f => clamp(f.y - 45, CAM_CEIL, CAM_FLOOR));
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    tx = lerp(STAGE.x + STAGE.w / 2, (minX + maxX) / 2, 0.8);        // follow the action (stage stays in view)
    ty = lerp(STAGE.y - 90, (minY + maxY) / 2, 0.6);
    tz = clamp(Math.min(W / (maxX - minX + CAM_PAD.x), H / (maxY - minY + CAM_PAD.y)), CAM_ZOOM_MIN, CAM_ZOOM_MAX);
  }
  let speed = 4;
  // CLASH teleports: pull out to the whole arena (floor to sky) so you can see them zip all over it
  if (alive.some(f => f.action && f.action.type === 'clash' && f.action.t > 0.06)) {
    tx = STAGE.x + STAGE.w / 2; ty = STAGE.y - 230;
    tz = clamp(Math.min(W / (STAGE.w + 160), H / 620), 0.5, CAM_ZOOM_MAX); speed = 7;
  }
  if (typeof xray !== 'undefined' && xray && xray.t > 0 && xray.v.respawnTimer <= 0) {   // X-RAY: zoom right in on the broken bones
    tx = xray.v.x; ty = xray.v.y - 48; tz = 2.4; speed = 16;
  }
  const shipF = alive.find(f => f.action && f.action.type === 'shipUlt');
  if (shipF) {                                       // Aiden's pirate ship: pull out to show the whole ship
    const a = shipF.action; tx = a.x + a.dir * (a.t < SHIP.holdEnd ? 0 : SHIP.L * 0.45); ty = a.gy - 210; tz = 0.72; speed = 3;
  }
  if (typeof ult !== 'undefined' && ult) {          // ultimate: push in close on the action
    const u = ult.user, v = ult.target;
    if (ult.def.deck && ult.cam) { tx = ult.cam.x; ty = ult.cam.y; tz = ult.cam.z; speed = ult.cam.fast ? 28 : ult.scene ? 6 : 4; }   // the pirate ship ring
    else if (ult.def.wrestle && ult.cx !== undefined) { tx = ult.cx; ty = STAGE.y - 120; tz = 1.0; speed = 4; }   // the whole ring in view
    else if (ult.def.rush) {                                 // Lance: close on the two of them for the line, wider for the beating
      const talk = ult.phase === 'talk';
      tx = (u.x + v.x) / 2; ty = Math.min(u.y, v.y) - (talk ? 60 : 90); tz = talk ? 1.55 : 1.0; speed = talk ? 2.5 : 5;
    }
    else if (ult.def.statue && ult.statue) {                // the whole statue AND the victim in view
      const S = ult.statue; tx = (S.x + v.x) / 2; ty = Math.min(S.y - 300, v.y - 140); tz = 0.62; speed = 3;
    }
    else if (ult.phase === 'cutscene') { tx = (u.x + v.x) / 2; ty = v.y - 70; tz = 1.45; speed = 2.2; }
    else { tx = v.x; ty = v.y - 55; tz = 1.2; speed = 5; }
  }
  const k = 1 - Math.exp(-dt * speed);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
}
function applyCamera(c) { const z = camZ(); c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cam.x, -cam.y); }
function toScreen(x, y) { const z = camZ(); return { x: (x - cam.x) * z + W / 2, y: (y - cam.y) * z + H / 2 }; }
function viewBounds() {
  const z = camZ();
  return { l: cam.x - W / 2 / z, r: cam.x + W / 2 / z, t: cam.y - H / 2 / z, b: cam.y + H / 2 / z };
}

// ---------------- KAIOKEN (Lance, down-K on the ground) ----------------
// A power-up he switches on and off. Stacks with his Super Saiyan transformation.

// Switching it on/off is instant, on the ground or in the air. Red aura. Ends if he's KO'd.
// KAIOKEN x2 / x3: down K again while it's on = the next level up (x3 -> off). Each level only hits a bit
// harder, but the strain on his body gets MUCH worse (damage he takes every second).
const KAIOKEN = { taken: 1, color: '#ff2a1f',
                  levels: [{ dealt: 1.05, drain: 1 },      // KAIOKEN     : +5%,  1% a second
                           { dealt: 1.1,  drain: 2 },      // KAIOKEN x2  : +10%, 2% a second
                           { dealt: 1.16, drain: 4 }] };   // KAIOKEN x3  : +16%, 4% a second
const kaiokenLv = f => KAIOKEN.levels[Math.min(3, f.kaioken | 0) - 1] || null;
function toggleKaioken(f) {

  if (f.kaioken) {
    if (SHOW_FIGHT_TEXT) ultBanner = { t: 0.9, title: 'POWER UP', name: f.kaioken > 1 ? 'KAIOKEN x' + f.kaioken + '!' : 'KAIOKEN!', color: KAIOKEN.color, who: f };
    ring(f.x, f.y - 45); ring(f.x, f.y - 20);
    burst(f.x, f.y - 45, [KAIOKEN.color, '#ff8a3c', '#ffffff'], 46, 0, Math.PI, 760, { grav: 0 });
    for (let k = 0; k < 5; k++) bolt(f.x, f.y - 50, Math.random() * Math.PI * 2, 80, 0.12, KAIOKEN.color);
    shake = Math.max(shake, 14); hitstop = Math.max(hitstop, 0.04);
    impactFrame = 0.06; impactAt = { x: f.x, y: f.y - 50, ang: 0, all: false, focus: true };
    sfx.parry(); sfx.beam(0.5);
  } else {
    burst(f.x, f.y - 45, ['#8f8f98', '#ffffff'], 14, 0, Math.PI, 300, { grav: 0 });
    sfx.block();
  }
}

// ---------------- DESTRUCTO DISC (Lance, side K) ----------------
// hold: forms above his raised hand (lost if he's hit first) -> out: flies straight, then slows ->
// back: turns round and speeds back toward him (cutting everyone again on the return) -> past him: flies off.
const DISC = {
  hold: 0.24, speed: 1150, straight: 0.28, decel: 2900, maxSpeed: 1300, life: 2.6, r: 22,
  color: '#b04dff', glow: '#e2b8ff',                                  // PURPLE
  hit:  { dmg: 8, base: 300, growth: 4.5, angle: 38 },               // each pass (out and back)
  self: { dmg: 3, base: 170, growth: 1.0, angle: 70 },               // caught by his own disc coming back
};
function spawnDisc(f, mult) {
  if (projectiles.some(s => s.kind === 'disc' && s.owner === f)) {   // one at a time: a little fizzle
    burst(f.x + f.face * 6, f.y - 120, [DISC.color, '#ffffff'], 6, 0, Math.PI, 150, { grav: 0 });
    return;
  }
  projectiles.push({ owner: f, kind: 'disc', phase: 'hold', t: 0, x: f.x + f.face * 6, y: f.y - 122, vx: 0, vy: 0,
                     dir: f.face, r: DISC.r, size: 0.25, spin: 0, mult: mult * powerOf(f), color: DISC.color,
                     hit: new Set(), trail: [], life: DISC.life });
  sfx.beam(0.25);
}
function updateDisc(s, dt) {
  const o = s.owner;
  s.t += dt; s.spin += dt * 38;
  if (s.phase === 'hold') {
    const a = o && o.action;
    if (!o || o.respawnTimer > 0 || !a || a.type !== 'attack' || a.move !== o.moveset.sideRanged) {   // hit before he threw it
      burst(s.x, s.y, [DISC.color, '#ffffff'], 10, 0, Math.PI, 260, { grav: 0 });
      return true;
    }
    s.dir = o.face; s.x = o.x + o.face * 6; s.y = o.y - 122;
    s.size = Math.min(1, 0.25 + 0.75 * s.t / DISC.hold);
    if (Math.random() < dt * 40) {                                    // ki spiralling into it
      const ang = Math.random() * Math.PI * 2;
      particles.push({ x: s.x + Math.cos(ang) * 40, y: s.y + Math.sin(ang) * 16, vx: -Math.cos(ang) * 220, vy: -Math.sin(ang) * 90,
                       life: 0.16, max: 0.16, size: 1, color: Math.random() < 0.4 ? '#ffffff' : DISC.color, type: 'bit', grav: 0 });
    }
    if (s.t >= DISC.hold) {                                           // THROW
      s.phase = 'out'; s.t = 0; s.size = 1;
      s.x = o.x + s.dir * 34; s.y = o.y - 82; s.vx = s.dir * DISC.speed; s.vy = 0;
      s.ox = s.x; s.oy = s.y;                                         // where it was thrown from: it comes back HERE
      sfx.whoosh(true);
    }
    return false;
  }
  s.life -= dt;
  if (s.phase === 'out') {
    if (s.t > DISC.straight) s.vx -= s.dir * DISC.decel * dt;         // slows down...
    if (Math.sign(s.vx) === -s.dir) { s.phase = 'back'; s.hit = new Set(); }   // ...and turns round: can cut them again
  } else {
    s.vx = clamp(s.vx - s.dir * DISC.decel * dt, -DISC.maxSpeed, DISC.maxSpeed);   // speeds back the way it came
    if (!s.passed) {
      s.vy = clamp((s.oy - s.y) * 3.2, -650, 650);                    // back along its path, to the spot it was thrown from
      if (Math.sign(s.ox - s.x) === s.dir) s.passed = true;           // gone past that spot: flies on straight
    } else s.vy *= 0.95;
  }
  s.x += s.vx * dt; s.y += s.vy * dt;
  s.trail.push({ x: s.x, y: s.y }); if (s.trail.length > 8) s.trail.shift();
  const dirSign = Math.sign(s.vx) || s.dir;
  for (const t of fighters) {                                         // cuts straight through people
    if (t === o || (o && allies(o, t)) || s.hit.has(t) || t.respawnTimer > 0 || projPhase(t)) continue;
    if (!circleHitsFighter(s.x, s.y, s.r * 0.9, t)) continue;
    if (applyHit(t, DISC.hit, dirSign, s.mult, s.x, s.y)) {
      s.hit.add(t);
      markKi(o, t);
      slashLine(s.x, s.y, s.vy * 0.001 + (dirSign > 0 ? 0 : Math.PI), 120, 0.14);
      burst(s.x, s.y, [DISC.color, DISC.glow, '#ffffff'], 12, dirSign > 0 ? 0 : Math.PI, 0.6, 420, { grav: 0 });
    }
  }
  // coming back into Lance himself (if he's still in its way): it nicks him (dodge it, jump it or shield it)
  if (s.phase === 'back' && o && o.respawnTimer <= 0 && circleHitsFighter(s.x, s.y, s.r * 0.8, o)) {
    if (applyHit(o, DISC.self, dirSign, 1, s.x, s.y)) {
      painTexts.push({ x: o.x, y: o.y - 130, t: 0.7, max: 0.7, text: 'OUCH!', big: false });
      burst(s.x, s.y, [DISC.color, '#ffffff'], 16, 0, Math.PI, 380, { grav: 0 });
      return true;
    }
  }
  return s.life <= 0 || s.x < BLAST.left || s.x > BLAST.right || s.y < BLAST.top || s.y > BLAST.bottom;
}
function drawDisc(s) {
  const k = s.size || 1, rx = s.r * 1.35 * k, ry = s.r * 0.42 * k;
  ctx.save();
  // motion trail
  s.trail.forEach((p, i) => {
    const u = (i + 1) / s.trail.length;
    ctx.globalAlpha = u * 0.35; ctx.fillStyle = DISC.color;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx * u, ry * u, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.translate(s.x, s.y);
  // glow
  ctx.fillStyle = 'rgba(176,77,255,0.28)';
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 1.5, ry * 2.1, 0, 0, Math.PI * 2); ctx.fill();
  // the disc, seen nearly edge-on, with a sawtooth rim that spins
  ctx.fillStyle = DISC.color;
  ctx.beginPath();
  const teeth = 16;
  for (let i = 0; i <= teeth * 2; i++) {
    const ang = s.spin + (i / (teeth * 2)) * Math.PI * 2;
    const rr = i % 2 ? 1 : 1.16;
    const x = Math.cos(ang) * rx * rr, y = Math.sin(ang) * ry * rr;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = DISC.glow;
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.62, ry * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.28, ry * 0.32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------- TAUNTS (everyone) ----------------

                armC: [0.8, 0.5], armD: [-0.8, -0.5] });

// ---------------- HYPE (Aiden's passive) ----------------
// Aiden's base level is WEAKER: at 0 hype his hits do 80% and he's 18% lighter (gets launched further).
// Taunting fills the HYPE meter; it slowly drains. At FULL hype he's back to his old full strength: full
// damage and full weight (hard to launch). In between it scales smoothly.
const HYPE = { perTaunt: 34, drain: 3.5, minPower: 0.8, minWeight: 0.82, color: '#ff8a1a' };
const hypeK = f => clamp((f.hype || 0) / 100, 0, 1);
const hypePower = f => (f.look && f.look.hype ? lerp(HYPE.minPower, 1, hypeK(f)) : 1);
const hypeWeight = f => (f.look && f.look.hype ? lerp(HYPE.minWeight, 1, hypeK(f)) : 1);

// ---------------- BLEED (Colby's scythe) ----------------
// Every scythe hit (any scythe move, and the thrown scythe) adds a stack of bleed. Each stack does 0.5% every
// 2 seconds and wears off 5 seconds after it was added. Up to 10 stacks (a new hit at 10 refreshes the oldest).
const BLEED = { max: 10, dur: 5, perSec: 0.25, color: '#c0141c' };
function addBleed(t) {
  if (!t.bleed) t.bleed = [];
  if (t.bleed.length >= BLEED.max) t.bleed.shift();
  t.bleed.push(BLEED.dur);
}
function updateBleed(f, dt) {
  if (!f.bleed || !f.bleed.length) return;
  f.damage += BLEED.perSec * f.bleed.length * dt;
  for (let i = 0; i < f.bleed.length; i++) f.bleed[i] -= dt;
  f.bleed = f.bleed.filter(s => s > 0);
  if (gore && Math.random() < dt * (2 + f.bleed.length)) {        // dripping
    burst(f.x + (Math.random() - 0.5) * 16, f.y - 30 - Math.random() * 40, BLOOD, 1, -Math.PI / 2, 0.5, 90, { stain: true });
  }
}
// red drop + stack count over a bleeding fighter
function drawBleed() {
  for (const f of fighters) {
    if (!f.bleed || !f.bleed.length || f.respawnTimer > 0) continue;
    const x = f.x - 18, y = f.y - hurtH(f) - 16;
    ctx.save();
    ctx.fillStyle = BLEED.color;
    ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.quadraticCurveTo(x + 6, y - 1, x, y + 3); ctx.quadraticCurveTo(x - 6, y - 1, x, y - 9); ctx.fill();
    ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#ff5a5a'; ctx.textAlign = 'left';
    ctx.fillText('x' + f.bleed.length, x + 6, y + 2);
    ctx.restore();
  }
}

// ---------------- KI MARK + INSTANT TRANSMISSION (Lance's passive) ----------------
// Hit someone with his ki (Destructo Disc or Kamehameha) = they're MARKED for a few seconds (purple target
// over them). While they're marked, his next Z vanish (air dodge) teleports him right BEHIND them, wherever
// they are on the map, ready to start a combo. Using it spends the mark.
const KI_MARK = { dur: 6, color: '#b04dff' };
function markKi(by, t) {
  if (!by || !by.look || !by.look.kiMark || !t || t === by) return;
  const fresh = !by.kiMark || by.kiMark.t !== t;
  by.kiMark = { t, time: KI_MARK.dur };
  if (fresh) painTexts.push({ x: t.x, y: t.y - 150, t: 0.6, max: 0.6, text: 'MARKED', big: false });
}
function kiMarkTarget(f) {
  const m = f.kiMark;
  if (!m) return null;
  const t = m.t;
  if (m.time <= 0 || !t || t.respawnTimer > 0 || !fighters.includes(t)) { f.kiMark = null; return null; }
  return t;
}
function kiTeleport(f, t) {
  f.kiMark = null;
  const from = { x: f.x, y: f.y - 45 };
  ghosts.push({ fig: figureOf(f), life: 0.35, max: 0.35, color: KI_MARK.color });
  burst(from.x, from.y, [KI_MARK.color, '#ffffff'], 12, 0, Math.PI, 360, { grav: 0 });
  const behind = -(t.face || 1);                                     // appears behind them
  f.x = t.x + behind * 54; f.y = t.y;
  f.ground = t.ground; f.onPlatform = t.ground ? t.onPlatform : null;
  f.vx = t.vx * 0.5; f.vy = t.ground ? 0 : Math.min(-120, t.vy * 0.5);
  f.face = Math.sign(t.x - f.x) || 1;
  f.action = null; f.invuln = Math.max(f.invuln, 0.12);
  if (!t.ground) { f.airDodges = Math.max(0, f.airDodges - 1); f.canCutJump = false; }
  const to = { x: f.x, y: f.y - 45 };
  for (let i = 0; i <= 10; i++) {                                     // streak across the map
    const u = i / 10;
    particles.push({ x: lerp(from.x, to.x, u), y: lerp(from.y, to.y, u), vx: 0, vy: 0, life: 0.1 + u * 0.08, max: 0.18,
                     size: 2, color: i % 2 ? '#ffffff' : KI_MARK.color, type: 'bit', grav: 0 });
  }
  burst(to.x, to.y, [KI_MARK.color, '#ffffff'], 18, 0, Math.PI, 420, { grav: 0 });
  ring(to.x, to.y);
  painTexts.push({ x: t.x, y: t.y - 150, t: 0.7, max: 0.7, text: 'INSTANT TRANSMISSION!', big: false });
  hitstop = Math.max(hitstop, 0.05); shake = Math.max(shake, 6);
  sfx.vanish(1.3);
}
// the purple target over a marked fighter
function drawKiMarks() {
  for (const f of fighters) {
    const t = f.kiMark && f.kiMark.t;
    if (!t || t.respawnTimer > 0 || f.kiMark.time <= 0) continue;
    const x = t.x, y = t.y - hurtH(t) - 26, fade = Math.min(1, f.kiMark.time / 0.8);
    const blink = f.kiMark.time < 1.5 && Math.floor(f.kiMark.time * 8) % 2;
    ctx.save();
    ctx.globalAlpha = (blink ? 0.35 : 0.9) * fade;
    ctx.strokeStyle = KI_MARK.color; ctx.lineWidth = 3;
    const r = 13, rot = time * 3;
    for (let k = 0; k < 4; k++) {                                     // four spinning brackets
      const a0 = rot + k * Math.PI / 2;
      ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + 0.9); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---------------- TENMA KIAI (Lance's perfect-block counter) ----------------
// He yells and his aura explodes outward in an expanding wave that blasts everything away from him.
const auraWaves = [];
function kiaiBlast(f) {
  const col = kiColor(f);
  auraWaves.push({ x: f.x, y: f.y - 48, t: 0, dur: 0.38, max: 175, color: col });
  auraWaves.push({ x: f.x, y: f.y - 48, t: -0.06, dur: 0.38, max: 120, color: '#ffffff' });   // bright inner wave right behind it
  painTexts.push({ x: f.x, y: f.y - 120, t: 0.7, max: 0.7, text: 'HAAAAA!', big: true });
  burst(f.x, f.y - 48, [col, '#ffffff'], 40, 0, Math.PI, 900, { grav: 0 });
  for (let k = 0; k < 6; k++) bolt(f.x, f.y - 50, Math.random() * Math.PI * 2, 90, 0.14, col);
  dust(f.x - 40, f.y, 12, 2.2); dust(f.x + 40, f.y, 12, 2.2);
  shake = Math.max(shake, 16);
  impactFrame = Math.max(impactFrame, 0.07); impactAt = { x: f.x, y: f.y - 48, ang: 0, all: false, focus: true };
  sfx.beam(0.8); sfx.clash(true);
}
function updateAuraWaves(dt) {
  for (let i = auraWaves.length - 1; i >= 0; i--) { auraWaves[i].t += dt; if (auraWaves[i].t >= auraWaves[i].dur) auraWaves.splice(i, 1); }
}
function drawAuraWaves() {
  for (const w of auraWaves) {
    if (w.t < 0) continue;
    const k = w.t / w.dur, r = lerp(24, w.max, easeOut(k));
    ctx.save();
    ctx.globalAlpha = 0.42 * (1 - k);
    ctx.fillStyle = w.color;
    ctx.beginPath();                                      // flame-shaped burst: taller than wide, flickering edge
    for (let j = 0; j <= 24; j++) {
      const ang = j / 24 * Math.PI * 2, wob = 1 + Math.sin(ang * 7 + time * 40) * 0.07;
      const px = w.x + Math.cos(ang) * r * 0.85 * wob, py = w.y + Math.sin(ang) * r * 1.05 * wob - (Math.sin(ang) < 0 ? r * 0.15 : 0);
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.8 * (1 - k); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
}

// ---------------- TIME STOP (Colby, down K while bare-handed) ----------------
// A purple aura bursts out of him. Anyone it touches is FROZEN IN TIME: they can't move, and hits on them
// do their damage right away but the knockback piles up and is released all at once when time resumes.
// How long they stay frozen depends on his TIME meter (filled by landing hits); using it empties the meter.
const TIME_STOP = { base: 0.6, perMeter: 0.024, radius: 165, gain: 6, cooldown: 2.5, color: '#b39dff' };
function startTimeStopAura(f, a) {
  if ((f.tsCD || 0) > 0) {                                   // still recharging: just a fizzle
    burst(f.x, f.y - 50, ['#6e6e78', TIME_STOP.color], 8, 0, Math.PI, 200, { grav: 0 }); a.tsDur = 0; return;
  }
  a.tsDur = TIME_STOP.base + (f.timeMeter || 0) * TIME_STOP.perMeter;
  a.tsHit = new Set();
  f.timeMeter = 0; f.tsCD = TIME_STOP.cooldown;
  auraWaves.push({ x: f.x, y: f.y - 50, t: 0, dur: 0.32, max: TIME_STOP.radius, color: TIME_STOP.color });
  auraWaves.push({ x: f.x, y: f.y - 50, t: -0.05, dur: 0.32, max: TIME_STOP.radius * 0.7, color: '#ffffff' });
  shake = Math.max(shake, 8); sfx.parry(); sfx.beam(0.4);
}
function freezeInTime(t, dur, label = 'TIME STOP!', hell = false) {
  stopKameCharge(t);
  t.action = { type: 'timeStop', t: 0, dur, svx: 0, svy: 0, hits: 0, pose: { ...(t.disp || getPose(t)) }, hell };
  t.vx = 0; t.vy = 0; t.shielding = false;
  painTexts.push({ x: t.x, y: t.y - 130, t: 0.8, max: 0.8, text: label, big: true });
  impactFrame = Math.max(impactFrame, 0.08); impactAt = { x: t.x, y: t.y - 50, ang: 0, all: true, focus: true, invert: true };
  hitstop = Math.max(hitstop, 0.12);
}
function stepTimeStop(f, a, dt) {
  f.vx = 0; f.vy = 0;
  if (a.t >= a.dur) {                                        // time resumes: all the stored knockback hits at once
    const sp = Math.hypot(a.svx, a.svy);
    burst(f.x, f.y - 50, [TIME_STOP.color, '#ffffff'], 16, 0, Math.PI, 500, { grav: 0 });
    if (sp > 1) {
      f.vx = a.svx; f.vy = a.svy;
      if (f.vy < 0) { f.ground = false; f.y -= 2; }
      f.action = { type: 'hitstun', t: 0, dur: HITSTUN_BASE + sp * HITSTUN_PER_SPEED };
      shake = Math.max(shake, Math.min(22, 6 + sp * 0.006)); sfx.hit(1);
      if (a.hits >= 2) painTexts.push({ x: f.x, y: f.y - 120, t: 0.6, max: 0.6, text: a.hits + ' HITS!', big: false });
    } else f.action = null;
  }
}
// The growing aura: freezes anyone it touches while the move is out
function stepTimeStopAura(f, a, m) {
  if (!a.tsDur) return;
  const r = lerp(30, TIME_STOP.radius, clamp(a.t / m.active, 0, 1));
  for (const t of fighters) {
    if (t === f || allies(f, t) || t.respawnTimer > 0 || a.tsHit.has(t) || isIntangible(t)) continue;
    if (circleHitsFighter(f.x, f.y - 50, r, t)) { a.tsHit.add(t); freezeInTime(t, a.tsDur); }
  }
}

// LIGHTNING STRIKE (Colby's 7-hit finisher): a huge bolt comes down out of the sky onto them

  for (const col of ['#7fd8ff', '#ffffff']) {
    let cx = x + (Math.random() - 0.5) * 40, cy = top;
    for (let k = 0; k < 6; k++) {
      const nx = k === 5 ? x : x + (Math.random() - 0.5) * 70, ny = cy + 150;
      bolt(cx, cy, Math.atan2(-(ny - cy), nx - cx), Math.hypot(nx - cx, ny - cy), 0.3, col);
      if (col === '#ffffff' && k > 0 && k < 5) bolt(cx, cy, -Math.PI / 2 + (Math.random() < 0.5 ? -0.9 : 0.9), 60 + Math.random() * 60, 0.22, '#bfeaff');   // branches
      cx = nx; cy = ny;

// KICKS (his moves that don't use the scythe): come out faster and reach further.
// SCYTHE STRIKES: come out faster, but do WAY less damage (they're for pressure and reach now, not damage).
// The scythe throw stays slow on purpose (it's meant to be telegraphed), and the counter is left alone.
// Kicks: about Lance's speed (a touch slower - he's the fast one) but with more reach than his.
const COLBY_KICK = { speed: 0.92, reach: 12, grow: 4 };         // startup/recovery x0.92, hitboxes +12px out, +4 radius

  if (scythe) {

    if (f.revenge > 0) consumeRevenge(f, v.x, a.gy0 - 30);
    painTexts.push({ x: v.x, y: a.gy0 - 140, t: 0.8, max: 0.8, text: 'YARKO!', big: true });

  if (T < NECK_RUN.lift) {                                      // 1. CHOKED UP by the neck, feet off the floor
    const u = easeOut(T / NECK_RUN.lift);
    v.x = f.x + D * 44; v.y = a.gy - 28 * u; v.face = -D; thrownSpin(a, 0);
    f.vx = 0;
    a.pose = pose({ lean: -0.12, bob: -6, legA: [0.65, 0.5], legB: [-0.55, 0.2], grip: neck(), sc: stowed(f) });
    if (!a.choked) { a.choked = true; sfx.grab(); shake = Math.max(shake, 5); }
    return;
  }
  const lyingNeck = () => [NECK_RUN.ahead + 30, -12];           // their neck when they're flat on the floor (head ahead)
  if (T < NECK_RUN.slam) {                                      // 2. SLAMMED down on their back in front of him
    const u = (T - NECK_RUN.lift) / (NECK_RUN.slam - NECK_RUN.lift);
    v.x = f.x + D * lerp(44, NECK_RUN.ahead, u); v.y = lerp(a.gy - 28, a.gy + 38, u * u);
    thrownSpin(a, D * (Math.PI / 2) * u);                       // falls over backwards: head away from him, feet toward him
    f.vx = 0;
    a.pose = pose({ lean: lerp(0, 0.95, u), bob: lerp(-6, -22, u), legA: [0.95, 1.2], legB: [-0.7, 0.5],
                    grip: u < 0.5 ? neck() : lyingNeck(), sc: stowed(f) });
    return;
  }
  if (!a.slammed) {
    a.slammed = true; a.runT = T;
    painfulSlam(v, f.x + D * 40, a.gy, 0, false);
    sfx.whoosh(true);
  }
  // 3. RUNS for the edge with them pinned on their back, scraping along the floor in front of him
  const atEdge = D > 0 ? f.x >= a.stopX - 1 : f.x <= a.stopX + 1;
  if (!atEdge && T - a.runT < NECK_RUN.maxRun) {
    const nx = f.x + D * NECK_RUN.speed * dt;
    f.x = D > 0 ? Math.min(nx, a.stopX) : Math.max(nx, a.stopX); f.vx = 0; f.y = a.gy;
    v.x = f.x + D * NECK_RUN.ahead; v.y = a.gy + 38; thrownSpin(a, D * Math.PI / 2);
    const s = Math.sin(T * 26), c = Math.cos(T * 26);           // legs churning, bent right down over them, arms out to their neck
    a.pose = pose({ lean: 0.95, bob: -22 + Math.abs(s) * 3, legA: [s * 1.1, 0.4 + Math.max(0, c) * 1.4], legB: [-s * 1.1, 0.4 + Math.max(0, -c) * 1.4],
                    grip: lyingNeck(), sc: stowed(f) });
    a.scrapeT = (a.scrapeT || 0) - dt;
    if (a.scrapeT <= 0) {                                       // dragged along the floor: it hurts, sparks and dust fly
      a.scrapeT = NECK_RUN.scrape;
      v.damage += 1; if (!v.transformed) v.ult = Math.min(ULT_MAX, (v.ult || 0) + 1);
      v.hitFlash = 0.05; sfx.hit(0.35);
    }
    if (Math.random() < dt * 60) burst(v.x + D * (Math.random() * 60 - 30), a.gy - 4, ['#ffd23f', '#ffffff', '#cdb79a'], 1, D > 0 ? Math.PI : 0, 0.4, 380, { grav: 600 });
    if (Math.random() < dt * 25) dust(v.x - D * 10, a.gy, 2, 1.2);
    if (Math.random() < dt * 40) ghosts.push({ fig: figureOf(f), life: 0.12, max: 0.12, color: '#ffffff' });
    return;
  }
  if (a.tossT === undefined) { a.tossT = T; f.vx = 0; shake = Math.max(shake, 6); dust(f.x, a.gy, 12, 2); }
  // 4. at the edge: hauls them up by the neck and HURLS them out over it
  const u = clamp((T - a.tossT) / NECK_RUN.toss, 0, 1);
  v.x = f.x + D * lerp(NECK_RUN.ahead, 70, u); v.y = lerp(a.gy + 38, a.gy - 40, easeOut(u));
  thrownSpin(a, D * lerp(Math.PI / 2, 0.6, u));
  a.pose = pose({ lean: lerp(0.7, -0.25, u), bob: lerp(-16, -4, u), legA: [0.95, 0.8], legB: [-0.9, 0.2],
                  armA: [lerp(0.6, 2.3, u), 0], armB: [lerp(0.4, 1.9, u), -0.2], sc: stowed(f) });
  if (u >= 1) {
    finishThrow(f, a, v, THROWS.neckRun, D, v.x, v.y - 40, 0.3);
    burst(v.x, v.y - 40, ['#ffffff', '#ffd23f'], 14, D > 0 ? 0 : Math.PI, 0.6, 520, { grav: 0 });
    shake = Math.max(shake, 12); sfx.whoosh(true); sfx.hit(0.9);
    a.pose = pose({ lean: 0.45, bob: -8, legA: [1.0, 0.7], legB: [-0.9, 0.1], armA: [1.8, 0], armB: [1.5, -0.2], sc: stowed(f) });
  }
}

// ---- REAPER'S HARVEST (up throw) ----
// Where the middle of the scythe blade is (world position) for a pose - worked out the same way drawFigure draws it
function scytheBladeAt(f, ps) {
  const F = f.face, LS = (f.look && f.look.scale) || 1;
  const hipY = -(LEG_UP + LEG_LOW - 1) - ps.bob * LEG_SCALE;
  const sh = { x: Math.sin(ps.lean) * TORSO * F, y: hipY - Math.cos(ps.lean) * TORSO };
  const S = scytheGeom(sh, ps.sc, F), top = S.at(72);
  return { x: f.x + (top.x + S.b[0] * F * 1.3 * 34 - S.d[0] * F * 6) * LS, y: f.y + (top.y + S.b[1] * 1.3 * 34 - S.d[1] * 6) * LS, z: S.depth };
}
const HARVEST = { wind: 0.09, slash: 0.2, swing: 0.72, flick: 0.86, catchK: 0.6 };
function stepHarvest(f, a, dt) {
  const v = a.victim, F = a.face0, T = a.t;
  if (a.released) { f.vx = approach(f.vx, 0, FRICTION * dt); return; }
  v.vx = v.vy = 0; f.vx = 0; f.face = F;
  const onBlade = ps => {                                       // their chest on the blade
    const B = scytheBladeAt(f, ps);
    v.x = B.x; v.y = B.y + 58; v.drawZ = B.z > 0 ? 0.5 : -0.5;
  };
  if (T < HARVEST.wind) {                                       // 1. the scythe drops low behind his front foot...
    const u = easeOut(T / HARVEST.wind);
    v.x = f.x + F * 52; v.y = f.y; v.face = -F; thrownSpin(a, 0);
    a.pose = pose({ lean: lerp(0, -0.25, u), bob: -12, legA: [0.8, 0.8], legB: [-0.6, 0.3],
                    sc: { gx: 4, gy: 16, pitch: lerp(-1.2, -2.3, u), yaw: 0.1, n: [0, 0, -1], hands: 2 } });
    return;
  }
  if (T < HARVEST.slash) {                                      // 2. ...and RIPS UP through their chest
    const u = (T - HARVEST.wind) / (HARVEST.slash - HARVEST.wind);
    const ps = pose({ lean: lerp(-0.25, 0.3, u), bob: lerp(-12, -6, u), legA: [0.9, 0.7], legB: [-0.8, 0.2],
                      sc: { gx: 12, gy: lerp(16, 4, u), pitch: lerp(-2.3, 0.15, easeOut(u)), yaw: 0.1, n: [0, 0, -1], hands: 2 } });
    a.pose = ps;
    if (u >= HARVEST.catchK) {
      if (!a.caught) {                                          // CAUGHT on the blade
        a.caught = true;
        v.damage += 4; if (!v.transformed) v.ult = Math.min(ULT_MAX, (v.ult || 0) + 4);
        if (v.look) addBleed(v);
        v.hitFlash = 0.1; hitstop = Math.max(hitstop, 0.12); shake = Math.max(shake, 12);
        impactFrame = Math.max(impactFrame, 0.06); impactAt = { x: v.x, y: v.y - 58, ang: -Math.PI / 2, all: false, focus: true };
        burst(v.x, v.y - 58, gore ? BLOOD : SWEAT, 22, -Math.PI / 2, 1.2, 520, { stain: gore });
        particles.push({ x: v.x, y: v.y - 58, vx: 0, vy: 0, life: 0.16, max: 0.16, ang: -Math.PI / 2 + 0.5 * F, len: 120, type: 'slash' });
        sfx.slash(); sfx.hit(1);
      }
      onBlade(ps); thrownSpin(a, F * 0.5);                      // folded over the blade
    } else { v.x = f.x + F * 52; v.y = f.y; }
    return;
  }
  if (T < HARVEST.swing) {                                      // 3. swings them ROUND him once on the blade
    const u = (T - HARVEST.slash) / (HARVEST.swing - HARVEST.slash), yaw = Math.PI * 2 * (u * u * (3 - 2 * u));
    const ps = { ...pose({ lean: -0.2, bob: -10, legA: [0.75, 0.6], legB: [-0.7, 0.35],
                           sc: { gx: 10, gy: 2, pitch: 0.12, yaw, n: [0, -1, 0], hands: 2 } }), turn: true };
    a.pose = ps;
    onBlade(ps);
    thrownSpin(a, F * (0.5 + 0.9 * Math.abs(Math.sin(yaw / 2))));   // flung out wide by the swing
    if (Math.floor(yaw / Math.PI) !== (a.half || 0)) { a.half = Math.floor(yaw / Math.PI); sfx.whoosh(true); }
    if (Math.random() < dt * 28) ghosts.push({ fig: figureOf(v), life: 0.1, max: 0.1, color: '#ff4a3a' });
    if (gore && Math.random() < dt * 30) burst(v.x, v.y - 58, BLOOD, 1, -Math.PI / 2, 0.8, 200, { stain: true });
    return;
  }
  // 4. FLICKS them up off the blade, high into the air
  const u = clamp((T - HARVEST.swing) / (HARVEST.flick - HARVEST.swing), 0, 1);
  const ps = pose({ lean: lerp(-0.2, -0.35, u), bob: lerp(-10, 2, u), legA: [0.4, 0.3], legB: [-0.4, 0.3],
                    sc: { gx: 8, gy: lerp(2, -18, u), pitch: lerp(0.12, 1.55, easeOut(u)), yaw: 0.05, n: [0, 0, -1], hands: 2 } });
  a.pose = ps;
  onBlade(ps); thrownSpin(a, F * lerp(0.5, 0, u));
  if (u >= 1) {
    finishThrow(f, a, v, THROWS.harvest, F, v.x, v.y - 58, 0.28);
    burst(v.x, v.y - 58, gore ? BLOOD : SWEAT, 18, -Math.PI / 2, 0.9, 600, { stain: gore });
    ring(v.x, v.y - 40); sfx.slash(); shake = Math.max(shake, 10);
  }
}

// ---- THUNDER KNEE (down throw) ----
// rise / hang / dive = seconds; back / high = where he flips to (behind them, above them); tilt = how far he's
// tipped forward in the dive (knees leading)
const THUNDER = { lift: 0.14, slam: 0.26, pause: 0.32, rise: 0.34, hang: 0.07, dive: 0.2, back: 160, high: 300, tilt: 0.9 };
function stepThunderKnee(f, a, dt) {
  const v = a.victim, F = a.face0, T = a.t;
  if (a.released) { f.vx = approach(f.vx, 0, FRICTION * dt); return; }
  v.vx = v.vy = 0;
  if (a.gy === undefined) a.gy = f.y;
  if (T < THUNDER.lift) {                                       // 1. lifts them up...
    const u = easeOut(T / THUNDER.lift);
    v.x = f.x + F * lerp(42, 26, u); v.y = a.gy - 70 * u; thrownSpin(a, -F * 2.4 * u);
    f.vx = 0;
    a.pose = pose({ lean: -0.3, bob: -6, legA: [0.5, 0.4], legB: [-0.5, 0.3], grip: gripOn(f, v), sc: stowed(f) });
    return;
  }
  if (T < THUNDER.slam) {                                       // 2. ...and THROWS them flat on their back
    const u = (T - THUNDER.lift) / (THUNDER.slam - THUNDER.lift);
    v.x = f.x + F * lerp(26, 62, u); v.y = lerp(a.gy - 70, a.gy + 38, u * u); thrownSpin(a, -F * lerp(2.4, Math.PI / 2 + Math.PI, u));
    a.pose = pose({ lean: 0.75, bob: -16, legA: [0.95, 1.3], legB: [-0.7, 0.6], grip: gripOn(f, v), sc: stowed(f) });
    a.vx0 = v.x;
    return;
  }
  if (!a.slammed) { a.slammed = true; v.x = a.vx0; painfulSlam(v, v.x, a.gy, 0, false); }
  v.x = a.vx0; v.y = a.gy + 38; thrownSpin(a, -F * Math.PI / 2);   // lying flat on their back
  if (T < THUNDER.pause) {
    f.vx = 0;
    a.pose = pose({ lean: 0.4, bob: -22, legA: [1.2, 2.0], legB: [0.4, 1.6], armA: [0.5, -1.4], armB: [0.3, -1.4], sc: stowed(f) });   // crouched, ready to spring
    return;
  }
  // 3. LEAPS up and back, high above them, flipping over backwards...
  // 4. ...then DIVES down at them on a slant - body tipped forward, knees tucked and leading, arms locked round
  //    his ankles - like a meteor coming down knees-first
  if (!a.jumped) {
    a.jumped = true; a.jT = T; a.x0 = f.x;
    a.apex = { x: a.vx0 - F * THUNDER.back, y: a.gy - THUNDER.high };
    dust(f.x, a.gy, 16, 2.2); ring(f.x, a.gy); sfx.whoosh(true);
  }
  f.vx = 0; f.vy = 0; f.ground = false;                         // (flies a set path - no gravity)
  const t1 = T - a.jT, tuck = { legA: [1.7, 2.75], legB: [1.55, 2.7], armA: [0.55, -0.15], armB: [0.4, -0.2] };   // knees tucked hard, arms round his ankles
  const dive = { lean: -0.35, bob: -6, legA: [1.4, 2.6], legB: [1.2, 2.5], armA: [0.55, -0.15], armB: [0.4, -0.2] };   // upright, knees driven down in front
  const diveTilt = F * THUNDER.tilt;
  let landed = false;
  if (t1 < THUNDER.rise) {                                      // up and back, one backflip
    const k = easeOut(t1 / THUNDER.rise);
    f.x = lerp(a.x0, a.apex.x, k); f.y = lerp(a.gy, a.apex.y, k);
    a.pose = pose({ lean: 0.1, bob: -6, spin: -F * Math.PI * 2 * k, ...tuck, sc: stowed(f) });
  } else if (t1 < THUNDER.rise + THUNDER.hang) {                // a split second at the top, tipping forward into the dive
    const k = (t1 - THUNDER.rise) / THUNDER.hang;
    f.x = a.apex.x; f.y = a.apex.y;
    a.pose = lerpPose(pose({ lean: 0.1, ...tuck }), pose({ ...dive, spin: diveTilt }), easeOut(k));
    a.pose.sc = stowed(f);
  } else {                                                      // THE DIVE
    const k = clamp((t1 - THUNDER.rise - THUNDER.hang) / THUNDER.dive, 0, 1);
    f.x = lerp(a.apex.x, a.vx0 - F * 10, k); f.y = lerp(a.apex.y, a.gy, k * k);
    a.pose = pose({ ...dive, spin: diveTilt, sc: stowed(f) });
    if (!a.dove) { a.dove = true; sfx.whoosh(true); }
    if (Math.random() < dt * 90) bolt(f.x + (Math.random() - 0.5) * 30, f.y - 40, Math.random() * Math.PI * 2, 24 + Math.random() * 30, 0.07, '#bfeaff');   // crackling as he comes down
    landed = k >= 1;
  }
  a.ghostT = (a.ghostT || 0) - dt;
  if (a.ghostT <= 0) { a.ghostT = 0.035; ghosts.push({ fig: figureOf(f), life: 0.12, max: 0.12, color: '#7fd8ff' }); }
  if (landed) {
    // 4. KNEES INTO THE GUT - LIGHTNING STRIKES
    f.y = a.gy; f.ground = true; f.vx = 0; f.vy = 0; f.x = a.vx0 - F * 14;
    lightningStrike(v);
    painfulSlam(v, v.x, a.gy, 2, true);
    impactFrame = Math.max(impactFrame, 0.16); impactAt = { x: v.x, y: a.gy - 20, ang: Math.PI / 2, all: true, focus: true, invert: true };
    hitstop = Math.max(hitstop, 0.24); shake = Math.max(shake, 30); camPunch = 1;
    v.y = a.gy;
    finishThrow(f, a, v, THROWS.thunderKnee, F, v.x, a.gy - 20, 0.42);
    cracks.push({ x: a.vx0, y: a.gy, life: 4, max: 4, seed: Math.random() * 1000, size: 1.8 });
    a.pose = pose({ lean: 0.55, bob: -34, legA: [1.55, 2.6], legB: [1.35, 2.5], armA: [0.5, -0.4], armB: [0.3, -0.4], sc: stowed(f) });   // kneeling on them
  }
}

// ---------------- MAX MALICIOUS MOONSAULT (ultimate) ----------------
// A wrestling ring drops in around them. He IRISH-WHIPS them into the far ropes and bounces off the
// near ropes himself, they meet in the middle - LARIAT! - which flips them onto the mat. He leaps up onto
// the top turnbuckle, flexes all four arms... and comes down with a MOONSAULT (backflip body splash)
// that explodes in fire.
const MOON = { half: 290, post: 112 };
function updateWrestleUlt(U, dt) {
  const u = U.user, v = U.target;
  if (!U.ring) {
    const cx = clamp(U.baseX, STAGE.x + MOON.half + 40, STAGE.x + STAGE.w - MOON.half - 40);
    U.ring = { cx, y: STAGE.y, stretchL: 0, stretchR: 0, life: 1 };
    U.cx = cx;
    u.ground = v.ground = true;
    dust(cx - MOON.half, STAGE.y, 10, 2); dust(cx + MOON.half, STAGE.y, 10, 2);
    shake = Math.max(shake, 10); sfx.slam();
  }
  const R = U.ring, d = U.dir, cx = R.cx, gy = R.y, T = U.t;
  const once = k => !U.events.has(k) && U.events.add(k);
  const far = cx + d * MOON.half, nearRope = cx - d * MOON.half;
  const run = sp => pose({ lean: 0.55, bob: -4 + Math.abs(Math.sin(T * sp)) * 3, legA: [Math.sin(T * sp) * 1.0, 0.4 + Math.max(0, Math.cos(T * sp)) * 1.3],
                           legB: [-Math.sin(T * sp) * 1.0, 0.4 + Math.max(0, -Math.cos(T * sp)) * 1.3], armA: [-1.6, -0.4], armB: [-1.9, -0.3] });
  const limp = s => pose({ lean: -0.5, legA: [0.6, 0.6], legB: [-0.5, 0.4], armA: [-2.4, 0.3], armB: [2.3, -0.3], spin: s });
  u.vx = u.vy = v.vx = v.vy = 0;
  R.stretchL = R.stretchR = 0;
  u.anim += dt; v.anim += dt;
  u.hitFlash = Math.max(0, u.hitFlash - dt); v.hitFlash = Math.max(0, v.hitFlash - dt);
  U.jolt = Math.max(0, U.jolt - dt);
  const stretchAt = (side, amt) => { if (side === d) { if (d > 0) R.stretchR = amt; else R.stretchL = amt; } else { if (d > 0) R.stretchL = amt; else R.stretchR = amt; } };

  if (T < 0.15) {                                                  // grab
    u.x = cx - d * 30; u.y = gy; u.face = d;
    v.x = cx + d * 14; v.y = gy; v.face = -d;
    U.userPose = pose({ lean: 0.2, bob: -6, legA: [0.7, 0.5], legB: [-0.6, 0.2], grip: [44, -58] });
    U.victimPose = limp(0);
  } else if (T < 0.55) {                                           // Irish whip: them into the far ropes, him into the near ones
    const k = clamp((T - 0.15) / 0.3, 0, 1);
    v.x = lerp(cx + d * 14, far, easeOut(k)); v.face = -d; U.victimPose = limp(-d * 0.4);
    if (T >= 0.45) { const s = Math.sin(clamp((T - 0.45) / 0.1, 0, 1) * Math.PI) * 30; v.x = far + d * s; stretchAt(d, s); if (once('boingV')) sfx.whoosh(true); }
    const k2 = clamp((T - 0.2) / 0.28, 0, 1);
    if (T < 0.2) U.userPose = pose({ lean: 0.5, bob: -8, legA: [1.0, 0.7], legB: [-0.85, 0.1], armA: [1.7, 0], armB: [1.6, 0.05], armC: [1.5, 0.1], armD: [1.45, 0.1] });
    else { u.face = -d; u.x = lerp(cx - d * 30, nearRope, easeOut(k2)); U.userPose = run(22); }
    if (T >= 0.48) { const s = Math.sin(clamp((T - 0.48) / 0.07, 0, 1) * Math.PI) * 24; u.x = nearRope - d * s; stretchAt(-d, s); }
  } else if (T < 0.85) {                                           // both come off the ropes...
    const k = (T - 0.55) / 0.3;
    v.x = lerp(far, cx + d * 22, k); v.face = -d; U.victimPose = limp(d * 0.3);
    u.x = lerp(nearRope, cx - d * 22, k); u.face = d;
    U.userPose = k < 0.7 ? run(24) : pose({ lean: 0.2, bob: -8, legA: [0.9, 0.8], legB: [-0.7, 0.2], armA: [-1.7, -0.5], armB: [-1.6, -0.4], armC: [-1.2, -0.6], armD: [-1.1, -0.6] });
  } else if (T < 1.3) {                                            // ...LARIAT! flips them up and onto the mat
    if (once('lariat')) {
      v.damage += 6 * AIDEN_POWER.dmg * U.power; if (!v.transformed) v.ult = Math.min(ULT_MAX, (v.ult || 0) + 6);
      v.hitFlash = 0.1; U.jolt = 0.1;
      impactFrame = 0.12; impactAt = { x: cx + d * 10, y: gy - 64, ang: 0, all: true, focus: true, invert: true };
      hitstop = Math.max(hitstop, 0.16); shake = 20;
      burst(cx + d * 10, gy - 64, FIRE, 36, Math.PI / 2, 1.3, 650, { grav: -250 });
      painTexts.push({ x: cx, y: gy - 150, t: 0.7, max: 0.7, text: 'LARIAT!', big: true });
      sfx.hit(1); sfx.clash(true);
    }
    const k = (T - 0.85) / 0.45;
    v.x = cx + d * lerp(22, 70, k); v.y = gy - Math.sin(k * Math.PI) * 170 + (k > 0.85 ? 38 * (k - 0.85) / 0.15 : 0);
    U.victimPose = limp(-d * (0.4 + k * Math.PI * 1.1));
    U.userPose = pose({ lean: 0.4, bob: -10, legA: [0.95, 0.7], legB: [-0.8, 0.1], armA: [1.6, 0], armB: [0.3, -1.4], armC: [1.4, 0.1], armD: [0.1, -1.3] });
    u.x = cx - d * 22; u.face = d;
  } else if (T < 1.75) {                                           // he climbs the top turnbuckle
    if (once('mat')) { painfulSlam(v, cx + d * 70, gy, 0, false); v.damage += 2 * AIDEN_POWER.dmg * U.power; }
    v.x = cx + d * 70; v.y = gy + 38; U.victimPose = { ...pose({ lean: 0, legA: [0.1, 0.1], legB: [-0.1, 0.1], armA: [-2.6, 0.2], armB: [2.6, -0.2] }), spin: -d * Math.PI / 2 };

  h.base *= AIDEN_POWER.kb; h.growth *= AIDEN_POWER.kb;
}

  for (const h of AIDEN_MOVES[k].hitboxes || []) truckHit(h);
}

// ---------------- COLTEN = COLBY'S ECHO FIGHTER ----------------
// Same moveset as Colby (taekwondo kicks on J, weapon moves on K, side K throws the weapon, bare-handed
// punch/kick string while it's thrown) - but every WEAPON move is done with his GREATSWORD: more reach,
// more damage, slower. His kicks hit a little harder and are a touch slower (he's the heavier rival).
const COLTEN_ECHO = { reach: 1.15, dmg: 1.25, slow: 1.15, kickDmg: 1.1, kickSlow: 1.08 };
// a scythe pose -> the same pose with the greatsword: the front hand goes where the scythe grip was, and the
// blade points where the scythe shaft pointed (pitch: 0 = forward, PI/2 = up; yaw: turned round his body)
function scToSword(p) {
  if (!p || !p.sc) return p;
  const s = p.sc, q = { ...p };
  q.armA = [Math.atan2(s.gx || 0, s.gy || 1), 0.15];
  q.sw = Math.atan2(Math.cos(s.pitch || 0) * Math.cos(s.yaw || 0), -Math.sin(s.pitch || 0));
  delete q.sc;
  return q;
}
function buildEcho(src) {
  const usesWeapon = m => !!m && !!((m.strike && m.strike.sc) || (m.wind && m.wind.sc) || m.spinScythe || m.throwScythe);
  const out = {};
  for (const [k, m] of Object.entries(src)) {
    if (!m || typeof m !== 'object') { out[k] = m; continue; }
    const w = usesWeapon(m);
    const R = w ? COLTEN_ECHO.reach : 1, D = w ? COLTEN_ECHO.dmg : COLTEN_ECHO.kickDmg, S = w ? COLTEN_ECHO.slow : COLTEN_ECHO.kickSlow;
    const e = { ...m, startup: m.startup * S, endlag: m.endlag * S, spinScythe: false };
    if (m.hitboxes) e.hitboxes = m.hitboxes.map(h => ({ ...h, x: h.x * R, r: h.r * (w ? 1.05 : 1), dmg: Math.round(h.dmg * D * 10) / 10, base: h.base * (w ? 1.06 : 1) }));
    if (w) for (const pk of ['wind', 'strike', 'strike2', 'strike3']) if (m[pk]) e[pk] = scToSword(m[pk]);
    out[k] = e;
  }
  return out;
}

// ---------------- CHARGEABLE FIRST JAB (everyone - Falcon Punch style) ----------------
// Hold the first hit of your neutral J (or Colby's bare-handed first punch). Let go quickly = the normal
// fast jab that starts your combo. Hold it past `min` seconds = it becomes a huge power hit: you
// explode forward and it hits HARD (still multiplied by how long you charged). Ends the combo.
function addPowerJab(m, dmg) {
  m.charge = true;
  m.chargedHit = { min: 0.25, lunge: 560,
    hitboxes: m.hitboxes.map(h => ({ ...h, x: h.x + 8, r: h.r + 8, dmg, base: 470, growth: 7, angle: 38, xray: undefined })) };
}

// ---------------- Fighters ----------------
function makeFighter(o) {
  const f = { name: o.name, color: o.color, energy: o.energy, startX: o.x, controller: o.controller,
              kos: 0, w: 26, h: 90, ult: 0 };   // ult meter lives here so it survives respawns
  setCharacter(f, o.char);
  resetFighter(f, false);
  return f;
}
function setCharacter(f, charName) {
  const c = CHARACTERS[charName];
  f.char = charName;
  f.moveset = c.moves;
  f.stats = { ...DEFAULT_STATS, ...c.stats };
  f.look = c.look || {};
  f.w = 26 * (f.look.scale || 1); f.h = 90 * (f.look.scale || 1);   // bigger characters = bigger hurtbox
  f.transformed = false; f.baseStats = null; f.kaioken = false; f.noScythe = false;
  f.weapon = (c.look && c.look.weapon) || null;                // Colby / Colten start with their own weapon
}
function resetFighter(f, atSpawn) {
  Object.assign(f, {
    x: atSpawn ? SPAWN.x + (f.startX < W / 2 ? -40 : 40) : f.startX,
    y: atSpawn ? SPAWN.y : STAGE.y,
    vx: 0, vy: 0, face: f.startX < W / 2 ? 1 : -1,
    ground: !atSpawn, onPlatform: null,
    airJumps: AIR_JUMPS, airDodges: AIR_DODGES, upSpecialUsed: false,
    action: null, dodgeCool: 0, dodgeCount: 0, dodgeRecover: 0,
    shieldHP: SHIELD_MAX, shielding: false,
    slide: 0, squat: 0, jumpBuf: 0, dodgeBuf: 0, dirBuf: 0, atkBuf: 0, spcBuf: 0, grabBuf: 0, fastFall: false,
    dropTimer: 0, canCutJump: false, flip: 0, anim: 0, runPhase: 0, squash: 0,
    halo: atSpawn ? 2 : 0, invuln: atSpawn ? 2 : 0, trailT: 0,
    damage: 0, respawnTimer: 0, dodgedFlash: 0, blockedFlash: 0, hitFlash: 0,
    shieldAge: 99, prevShield: false, parryFlash: 0, running: false,
    comboTimer: 0, chainStep: 0, comboKey: null, revenge: 0, revengeT: 0, bleed: null, hype: 0,

}

const particles = [];
const MAX_PARTICLES = 900;
const ghosts = [];
const stains = [];
const projectiles = [];
const koFlashes = [];

let hitstop = 0;
let gore = true;

function dust(x, y, n, spread = 1) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 260 * spread, vy: -Math.random() * 120,
      life: 0.4 + Math.random() * 0.25, max: 0.6, r: 3 + Math.random() * 4, type: 'dust' });
  }
}
function ring(x, y) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0.3, max: 0.3, r: 8, type: 'ring' });
}
// Square pixel bits flying out in a direction (ang = radians, 0 = right, PI/2 = up)
function burst(x, y, colors, n, ang = 0, spread = Math.PI, speed = 400, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() - 0.5) * 2 * spread;
    const s = speed * (0.3 + Math.random() * 0.9);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: -Math.sin(a) * s,
      life: 0.4 + Math.random() * 0.6, max: 1, size: Math.random() < 0.3 ? 2 : 1,
      color: colors[(Math.random() * colors.length) | 0], type: 'bit',
      grav: opts.grav ?? 1400, stain: !!opts.stain });
  }
}
const BLOOD = ['#5e1414', '#7e1c1c', '#a8261e', '#3d0c0c'];
const SWEAT = ['#b4b4bb', '#ffffff', '#a8ecff'];

// A jagged lightning bolt that lasts a moment
function bolt(x, y, ang, len, life = 0.12, color = '#ffd23f') {
  const pts = [[x, y]];
  const segs = 5 + (Math.random() * 4 | 0);
  for (let i = 1; i <= segs; i++) {
    const d = len * i / segs, off = (Math.random() - 0.5) * len * 0.35;
    pts.push([x + Math.cos(ang) * d - Math.sin(ang) * off, y - Math.sin(ang) * d - Math.cos(ang) * off]);
  }
  particles.push({ x, y, vx: 0, vy: 0, pts, life, max: life, color, type: 'bolt' });
}

// Black & white "impact frame" on big hits (like the animation)
let impactFrame = 0, impactAt = null;

function hitBits(t, x, y, dirSign, ang, speed, dmg) {
  const launchAng = dirSign > 0 ? ang : Math.PI - ang;     // which way the hit sends them
  const power = 0.6 + Math.min(1.6, speed / 1200);
  // Clean, readable anime hit: a sharp white STARBURST at the point of impact, a couple of fast white
  // SPEED LINES shooting off the way they're launched, and a little spray (less clutter than before)
  const n = Math.min(40, 6 + dmg * 2);
  if (gore) burst(x, y, BLOOD, n, launchAng, 0.7, 520 * power, { stain: true });
  burst(x, y, SWEAT, Math.ceil(n * (gore ? 0.25 : 0.6)), launchAng, 0.9, 420 * power);
  particles.push({ x, y, vx: 0, vy: 0, life: 0.13, max: 0.13, r: 13 + dmg * 1.7, type: 'impact', rot: Math.random() * Math.PI });
  const nl = 2 + Math.min(3, dmg / 5 | 0);
  for (let i = 0; i < nl; i++) {
    const ang = launchAng + (Math.random() - 0.5) * 0.7;
    particles.push({ x: x + Math.cos(ang) * 10, y: y - Math.sin(ang) * 10, vx: Math.cos(ang) * 900 * power, vy: -Math.sin(ang) * 900 * power,
                     ang: -ang, len: 50 + dmg * 6 + Math.random() * 30, life: 0.12, max: 0.12, type: 'hitline' });
  }
  if (dmg >= 9) bolt(x, y, launchAng + (Math.random() - 0.5) * 1.2, 50 + dmg * 5, 0.08, '#ffffff');   // only big hits crackle
  camPunch = Math.max(camPunch, clamp((speed - 500) / 1200, 0, 1));                                 // big hits punch the camera in
  if (speed > 1000) hitstop = Math.max(hitstop, 0.13);            // strong hit: a heavy freeze...
  if (speed > 1650) {                                                // ...but the black & white IMPACT FRAME only for the
    impactFrame = Math.max(impactFrame, 0.06);                       // really huge ones (near-KO), so the screen isn't
    impactAt = { x, y, ang: launchAng };                             // flashing all the time
  }
}

// Where the victim's feet are during the throw, relative to the thrower's feet

function throwPath(kind, k) {

    const th = giantSwingAngle(k);
    return [52 * Math.cos(th), -16 + 6 * Math.sin(th * 2), Math.sin(th)];
  }
  if (kind === 'quadPress') {                     // hoisted straight up overhead and held at arm's length...
    if (k < 0.6) { const u = easeOut(k / 0.6); return [lerp(40, 4, u), lerp(0, -92, u), 0]; }
    return [4 + Math.sin(k * 60) * 2, -92 - (k - 0.6) * 20, 0];      // ...shaking with effort
  }

    const u = easeOut((k - 0.45) / 0.55); return [lerp(20, 74, u), lerp(-8, -50, u), 0];

  if (kind === 'back') {
    const th = Math.PI * easeOut(k);

function stepThrow(f, a, dt) {

  if (a.kind === 'piledriver') return stepPiledriver(f, a, dt);
  if (a.kind === 'rko') return stepRKO(f, a, dt);
  if (a.kind === 'neckRun' || a.kind === 'neckRunBack') return stepNeckRun(f, a, dt);   // Colby's throws
  if (a.kind === 'harvest') return stepHarvest(f, a, dt);

// =====================================================================

// =====================================================================

// Both fighters vanish (after-images + a streak) and reappear together at a new spot: somewhere else on the

function clashTeleport(f, a, home) {

  for (const g of [f, o]) ghosts.push({ fig: figureOf(g), life: 0.22, max: 0.22, color: '#ffffff' });

  if (home) { cx = null; }

    // goes to a DIFFERENT column and makes a BIG height change (at least two levels: floor -> high, sky -> low...),
    // so they're always flying up and down across the screen, faster than you can follow.
    const last = a.zone || oa.zone || [1, 3];             // the clash starts roughly middle, floor
    const opts = [];                                      // (bigger height changes are much more likely)

  auraWaves.push({ x: to.x, y: to.y, t: -0.04, dur: 0.3, max: 115, color: '#ffffff' });
  auraWaves.push({ x: from.x, y: from.y, t: 0, dur: 0.2, max: 80, color: '#ffffff' });
